/** Сохранить курсы. ЕДИНСТВЕННОЕ место, где раздел пишет settings.rates —
 *  и шестое в файле вообще. Каждое изменение записывается в историю ДО
 *  присваивания: «каким было» перестаёт быть таким в момент присваивания
 *  (хрупкое место 55). Курс, который не сдвинулся, в историю не пишется —
 *  запись о том, чего не было, приучает не читать историю. */
function saveRatePair(){
  var bad = ratePairBad();
  if (bad.length){
    ui.err = tr('rp.errRate', { anchor: RATE_ANCHOR, cur: bad.join(', ') });
    render(); return;
  }
  var want = ratePairWant(ratePairVals());
  if (!want){
    ui.err = tr('rp.errAnchor', { anchor: RATE_ANCHOR, base: state.settings.baseCurrency });
    render(); return;
  }
  var b = state.settings.baseCurrency, moved = [], c;
  for (c in want){
    if (!own(want, c) || c === b) continue;
    var had = own(state.settings.rates, c) ? state.settings.rates[c] : null;
    if (!rateMoved(had, want[c])) continue;      /* не сдвинулось — не трогаем */
    if (had === null) rateLogAdd(c, want[c]); else rateLogEdit(c, had, want[c]);
    moved.push(c);
  }
  for (var i = 0; i < moved.length; i++){ c = moved[i]; state.settings.rates[c] = want[c]; }
  ui.form.rate = ratePairDraft();
  ui.err = '';
  toast(tr(moved.length ? 'rp.saved' : 'rp.savedSame'), 'ok');
  commit();
}

/* =================================================== ВКЛАДКА «ЕЩЁ» == */
/* ============================================== ++++++ EXPENSES ++++++ ==
 * ЭКРАН «РАСХОДЫ»: список и форма — ровно теми же примитивами, что у
 * «Оплат». Ни одного нового способа что-либо показать: .card/.row/.seg/.f,
 * лист записи через dialog(), удаление через confirmBox(), сообщение через
 * toast(), пустое состояние через listCard() без строк.
 *
 * ДЕНЬГИ ЧИТАЮТСЯ В ВАЛЮТЕ «СВОДКИ», а не в своей: расход и строка
 * «Прочие расходы» — одно и то же число, и читать их в разных валютах
 * значило бы заставлять владельца пересчитывать в уме. Отсюда dcCents()/
 * dcFmt() и плитка выбора валюты в углу «героя» — те же, что на «Сводке».
 * ================================================================== */
function viewExp(){
  var sec = 'expenses';
  var h = head(tr('tab.expenses'), tr('sum.inCur', {note: dcStoreNote()}));
  h += segbar('exp', [['list', tr('seg.list')],
    ['new', ui.form.exp.editId ? tr('seg.editing') : tr('seg.newExp')]]);
  h += warnNote(sec);
  if (ui.seg.exp === 'list'){
    /* Итог — та же expSumD(), которой считает строку «Сводки» dcStats():
       функция одна, разойтись им негде. За всё время: период живёт на
       «Сводке», и переносить его сюда значило бы завести второй фильтр. */
    h += hero({ cls:'pick', aside: dcPickHTML(), k: tr('exp.total'),
      v: dcHero(expSumD(actExp())),
      s: tr('exp.totalSub', {n: nq(actExp().length, 'expense')}) });
    h += expListHTML();
  } else {
    h += formExp();
  }
  return h;
}
/** Список: новые сверху. Курс записи — ВТОРОЙ подписью (`sub2`): она одна
 *  в строке переносится, а не обрезается, поэтому длинное описание сверху
 *  ужимается многоточием и курс из-за него не пропадает. */
function expListHTML(){
  var hits = expHits(), rows = '';
  hits.forEach(function(x){
    var sub = fmtDateLong(x.date) + (x.note ? ' · ' + esc(x.note) : '');
    if (hasEntry(x)) sub += ' · ' + entryInline(x);
    /* ++++++ EXPENSE LOT ++++++ на что отнесена запись — краткой пометкой
       рядом с курсом, ВТОРОЙ подписью: она переносится, а не обрезается,
       и длинное описание сверху её не съедает. */
    rows += row({ k: esc(tr('exp.cat.' + x.cat)), sub: sub,
      sub2: [expRateText(x), expPickText(x)].filter(function(t){ return !!t; }).join(' · '),
      v: dcMoney(dcCents(x.amountCents, x.rateSnap)), act:'exp-open', arg:x.id });
  });
  return listCard(tr('tab.expenses'), rows);
}
function formExp(){
  var f = ui.form.exp, items = [];
  EXP_CATS.forEach(function(c){ items.push([c, tr('exp.cat.' + c)]); });
  var h = '<form id="fExp" novalidate>' + errNote();
  h += field({ label: tr('exp.cat'),
    control: select({ f:'exp.cat', value:f.cat, items:items, ph: tr('exp.pickCat') }) });
  h += field({ label: tr('exp.desc'),
    control: input({ f:'exp.note', value:f.note, ph: tr('ph.expDesc') }) });
  h += field({ label: tr('w.amount'),
    control: money2('exp.amount', f.amount, 'exp.cur', f.cur, expEntryCodes()),
    hintId:'expHint', hint: expHintText() });
  h += '<div class="f"><label class="f" style="margin:0"><span>' + tr('w.date') + '</span>' +
    input({ f:'exp.date', value:f.date, type:'date' }) + '</label></div>';
  /* ++++++ EXPENSE LOT ++++++ на какие товары отнести расход. Это НЕ
     выпадающий список: выбрать нужно несколько позиций, в том числе из
     разных приходов, и у каждой владелец хочет видеть количество и цену.
     Всё это — окно, а на форме стоит строка, показывающая, что выбрано.
     По умолчанию не выбрано ничего, и расход остаётся общим — так он и
     вёл себя до сих пор, и так ведёт себя дальше, если строку не
     трогать. */
  h += expFieldHTML(f);
  h += expSplitHTML();
  h += '<div class="btns">' + saveBtn(tr(f.editId ? 'w.saveChanges' : 'exp.record')) +
    (f.editId ? btn(tr('w.cancelEdit'), 'exp-cancel', 'ghost') : '') + '</div>';
  h += '<div class="note calc">' + tr('exp.hint') + '</div>';
  return h + '</form>';
}
/** Подсказка под суммой. Пересчитывается через live(), поэтому курсор в
 *  поле остаётся на месте (хрупкое место 12). */
function expHintText(){
  var f = ui.form.exp, out = [], x = f.editId ? expById(f.editId) : null;
  var m = parseMoneyToCents(f.amount);
  if (m !== null && m > 0){
    var cents = expToBase(m, f.cur, x ? x.rateSnap : null);
    if (cents === null) out.push(tr('conv.noRate', {cur: esc(f.cur)}));
    else out.push(tr('pay.willStore', {v: fmtMinor(m), cur: esc(f.cur),
      sum: money(cents, state.settings.baseCurrency), base: esc(state.settings.baseCurrency)}));
  }
  /* Про курс записи говорится только там, где он что-то меняет: в базовой
     валюте пересчёта нет вовсе, и фраза была бы про ничто (область 43). */
  if (x && f.cur !== state.settings.baseCurrency) out.push(tr('exp.editRate'));
  return out.join(' · ');
}

/* ---- ++++++ EXPENSE LOT ++++++ ВЫБОР ТОВАРОВ --------------------------
 *
 * Выбор живёт в ui.form.exp.items — списке КЛЮЧЕЙ позиций, а не номеров:
 * позиция прежней сборки номера ещё не несёт, и он выдаётся ровно в тот
 * момент, когда расход сохраняют (batEnsureId). Ключ вида «товар#индекс»
 * до документа не доходит никогда — та же пара «ключ / настоящий номер»,
 * что уже есть у партии.
 *
 * Черновик окна — expPickDraft, МОДУЛЬНАЯ переменная, а не поле state:
 * незакрытое окно не имеет никакого отношения к документу и не должно
 * попадать в резервную копию (то же правило, что у moneyAnchor и
 * prodEditAnchor, хрупкие места 33 и 41). «Отмена» ничего не отменяет —
 * ей просто нечего переносить.
 */
var expPickDraft = null;

/** Позиции, выбранные В ФОРМЕ (не в окне). Ключ, за которым позиции уже
 *  нет — товар удалили, пока форма открыта, — молча выпадает: строка
 *  покажет то, что действительно есть. */
function expFormItems(){
  var all = batAll(), out = [], i, j;
  var keys = ui.form.exp.items || [];
  for (i = 0; i < keys.length; i++){
    for (j = 0; j < all.length; j++) if (all[j].key === keys[i]){ out.push(all[j]); break; }
  }
  return out;
}
/** Строка-кнопка на форме: что выбрано сейчас. */
function expFieldHTML(f){
  var picked = expFormItems();
  var k = picked.length ? tr('lot.pickN', {n: nq(picked.length, 'product')}) : tr('lot.none');
  var sub = picked.length ? itemsWhat(picked) : tr('lot.pickNoneSub');
  return '<div class="f"><span>' + tr('lot.field') + '</span>' +
    '<section class="card">' + row({ k: esc(k), sub: sub, act:'exp-pick' }) + '</section>' +
    '<small class="hint">' + tr('lot.fieldHint') + '</small></div>';
}
/* ---- ПЕРЕСЧЁТ БЛОКА В ДРУГИЕ ВАЛЮТЫ ---------------------------------
 *
 * ТОЛЬКО ПОКАЗ: в записи по-прежнему одна сумма, в базовой валюте, и ни
 * одна из этих цифр никуда не сохраняется.
 *
 * Курс — тот же `dcRateOf()`, которым посчитан весь блок: у правки из
 * снимка записи, у новой записи сегодняшний. Брать здесь `money()` значило
 * бы читать СЕГОДНЯШНИЙ курс и показывать при правке не то, чем расход
 * посчитан. Курса нет — прочерк, а не выдуманное число (правило §3.3:
 * неизвестный курс никогда не 1:1).
 */
/** Какие валюты назвать: все, кроме базовой, — и те, что настроены
 *  сейчас, И те, что записаны в снимке этой записи. Второе не педантизм:
 *  курс, которым расход посчитан, могли потом удалить из настроек, и
 *  тогда честный ответ — прочерк, а не молчаливое исчезновение валюты со
 *  строки. Порядок алфавитный, поэтому TJS всегда стоит перед USD. */
function expConvCodes(snap){
  var b = state.settings.baseCurrency, seen = {}, out = [];
  function add(c){ if (c !== b && !own(seen, c)){ seen[c] = 1; out.push(c); } }
  currencyCodes().forEach(add);
  if (snap && snap.rates) Object.keys(snap.rates).forEach(add);
  return out.sort();
}
function expConvPlan(cents, w, snap, fixCode, fixMinor){
  var codes = expConvCodes(snap), tot = {}, sh = {};
  codes.forEach(function(c){
    var t;
    if (fixCode && c === fixCode && isInt(fixMinor)) t = fixMinor;
    else {
      var r = dcRateOf(snap, c);
      t = (r === null || !(r > 0)) ? null : Math.round(cents / r);
    }
    tot[c] = t;
    sh[c] = (t === null) ? null : allocShares(t, w);
  });
  return { codes: codes, tot: tot, sh: sh };
}
/** Мелкая серая строка «346.89 TJS | 37.30 USD». `i` — номер позиции или
 *  null для «Итого». Класс `.conv` — тот же, которым печатает вторые
 *  валюты `convLines()` на вкладке «Люди». */
function expConvHTML(plan, i){
  var parts = [];
  plan.codes.forEach(function(c){
    var v = (i === null) ? plan.tot[c] : (plan.sh[c] ? plan.sh[c][i] : null);
    parts.push((v === null || v === undefined ? '—' : fmtMinor(v)) + ' ' + esc(c));
  });
  return parts.length ? '<div class="conv">' + parts.join(' | ') + '</div>' : '';
}
/** КАРТОЧКА «РАСПРЕДЕЛЕНИЕ РАСХОДА» — ЕДИНСТВЕННАЯ разметка блока.
 *
 *  Её печатают ОБА места: форма — по тому, что набрано, лист записи — по
 *  тому, что сохранено. Двух копий разметки быть не должно, и это не
 *  предосторожность: лист печатал свою, сжатую, одной строкой — и уже
 *  расходился с формой на копейку.
 *
 *  Деньги — в БАЗОВОЙ валюте, потому что в ней расход и хранится; доли
 *  обязаны складываться в него до копейки. «На 1 шт» и «с расходом за
 *  штуку» округляются ТОЛЬКО при показе: доля позиции целая, и делить её
 *  внутри счёта незачем.
 *
 *  `cls:'wrap'` — единственное место в файле, где название строки
 *  переносится, а не обрывается многоточием: здесь владелец сверяет доли
 *  по именам товаров. */
function expSplitCard(items, cents, snap, fixCode, fixMinor){
  if (!items.length || cents === null) return '';
  var w = itemWeights(items), sh = allocShares(cents, w), buy = 0, i;
  for (i = 0; i < w.length; i++) buy += w[i];
  var plan = expConvPlan(cents, w, snap, fixCode, fixMinor), rows = '';
  items.forEach(function(it, k){
    var q = it.batch.qty;
    var per = q > 0 ? Math.round(sh[k] / q) : null;
    var unit = q > 0 ? Math.round((it.batch.totalCostCents + sh[k]) / q) : null;
    rows += row({ cls:'wrap', lead: avsq(units(q)), k: esc(it.product.name),
      sub: tr('exp.splitBuy', { sum: baseOne(it.batch.totalCostCents) }),
      sub2: per === null ? '' : tr('exp.splitPer',
        { per: baseOne(per), unit: baseOne(unit) }),
      v: baseOne(sh[k]) + expConvHTML(plan, k) +
         '<small>' + lotPctText(pctOfSum(sh, k)) + '</small>' });
  });
  /* «Итого» — сумма ровно тех целых, что напечатаны выше, и в каждой
     валюте столбик тоже сходится: доли там посчитаны тем же делением. */
  rows += row({ k: tr('exp.splitTotal'),
    sub: tr('exp.splitTotalSub', { sum: baseOne(buy) }),
    v: baseOne(cents) + expConvHTML(plan, null) });
  return listCard(tr('exp.split'), rows);
}
function expSplitHTML(){ return '<div id="expSplit">' + expSplitBody() + '</div>'; }
/** Блок ПОД ФОРМОЙ: то же самое, но по тому, что владелец набирает
 *  сейчас. Курс — тот, каким расход будет сохранён: у правки записанный в
 *  её снимке, у новой записи сегодняшний. Иначе блок обещал бы одно, а
 *  сохранение писало другое. */
function expSplitBody(){
  var f = ui.form.exp, items = expFormItems();
  if (!items.length) return '';                    /* «Без партии» — делить нечего */
  var m = parseMoneyToCents(f.amount);
  if (m === null || m <= 0){
    return listCard(tr('exp.split'), '<div class="empty">' + tr('exp.splitWait') + '</div>');
  }
  var x = f.editId ? expById(f.editId) : null;
  var snap = x ? x.rateSnap : null;
  var cents = expToBase(m, f.cur, snap);
  /* курса нет — про это уже сказала подсказка под суммой, и повторять её
     второй формулировкой значило бы завести две (область 43) */
  if (cents === null) return '';
  return expSplitCard(items, cents, snap, f.cur, m);
}
/** Флажок. Ни одного нового класса: выбранное — тот же акцентный квадрат
 *  `.av`, что носит буква человека, невыбранное — его нейтральный
 *  двойник `.av.sq`. Галочкой отмечает выбор и лист фильтра статусов —
 *  знак в этом файле уже занят этим смыслом. */
function expPickBox(on){
  return on ? '<span class="av">✓</span>' : '<span class="av sq"></span>';
}
/** Выбраны ли ВСЕ позиции этой партии — состояние общего флажка. */
function expPickLotOn(lot){
  var all = lot.items.length > 0;
  lot.items.forEach(function(it){ if (!own(expPickDraft, it.key)) all = false; });
  return all;
}
/** Выбранные позиции в порядке документа — порядок обязан быть
 *  устойчивым, иначе сохранённый список переставлялся бы сам собой. */
function expPickItems(){
  var out = [];
  batAll().forEach(function(it){ if (own(expPickDraft, it.key)) out.push(it); });
  return out;
}
/** Тело окна: партии, внутри — их позиции. Заголовок партии печатается
 *  только там, где позиций больше одной: у прихода из одного товара он
 *  повторял бы строку под собой (область 43), поэтому дата уходит в
 *  подпись самой позиции. */
function expPickRowsHTML(){
  var lots = lotList(), h = '';
  if (!lots.length) return '<div class="body">' + tr('lot.pickNothing') + '</div>';
  lots.forEach(function(lot){
    var rows = '', many = lot.items.length > 1;
    if (many) rows += row({ lead: expPickBox(expPickLotOn(lot)),
      k: esc(fmtDateLong(lot.date)),
      sub: tr('lot.pickAll', {n: nq(lot.items.length, 'line')}),
      v: secOne('products', lotTotalCents(lot)),
      act:'exp-pick-lot', arg: lot.key, noChev: true });
    lot.items.forEach(function(it){
      var sub = tr('lot.pickItem', { q: units(it.batch.qty) + ' ' + tr('w.pcs'),
        unit: secBare('products', it.batch.costCents) });
      if (!many) sub = esc(fmtDateLong(it.batch.date)) + ' · ' + sub;
      rows += row({ lead: expPickBox(own(expPickDraft, it.key)),
        k: esc(it.product.name), sub: sub,
        v: secOne('products', it.batch.totalCostCents),
        act:'exp-pick-one', arg: it.key, noChev: true });
    });
    h += '<div class="rows">' + rows + '</div>';
  });
  return h;
}
/** Подвал окна: сколько выбрано и на какую сумму закуплено. */
function expPickFootHTML(){
  var items = expPickItems();
  if (!items.length) return tr('lot.pickFootNone');
  return tr('lot.pickFoot', { n: nq(items.length, 'product'),
    sum: secOne('products', itemsTotalCents(items)) });
}
function expPickHTML(){
  return '<div id="pickBody">' + expPickRowsHTML() + '</div>' +
    '<div class="note calc" id="pickFoot" style="margin:14px 0 0">' + expPickFootHTML() + '</div>';
}
/** Перерисовка ОДНОГО окна, без render(): лист не часть render() вовсе
 *  (область 14), а полная отрисовка вдобавок сняла бы фокус с кнопки и
 *  прокрутила бы длинный список к началу. Восьмой частичный
 *  перерисовщик файла — после live(), liveSearch(), dcPaint(),
 *  remPaint(), bakBarPaint(), xtabPaint() и rateLogToggle(). */
function expPickPaint(){
  var b = $('pickBody'), f = $('pickFoot');
  if (b) b.innerHTML = expPickRowsHTML();
  if (f) f.innerHTML = expPickFootHTML();
}
function expPickToggle(key){
  if (!expPickDraft) return;
  if (own(expPickDraft, key)) delete expPickDraft[key];
  else expPickDraft[key] = true;
  expPickPaint();
}
/** Общий флажок партии: выбрать все её позиции или снять все. */
function expPickLot(key){
  if (!expPickDraft) return;
  var lot = lotByKey(key);
  if (!lot) return;
  var on = expPickLotOn(lot);
  lot.items.forEach(function(it){
    if (on) delete expPickDraft[it.key]; else expPickDraft[it.key] = true;
  });
  expPickPaint();
}
/** Окно выбора. Тот же dialog(), что у всех листов, — значит Escape,
 *  клик по фону и «Отмена» закрывают его одинаково и БЕЗ изменений:
 *  все три отдают null, и переносить в форму нечего. */
function expPickSheet(){
  expPickDraft = {};
  (ui.form.exp.items || []).forEach(function(k){ expPickDraft[k] = true; });
  dialog({ title: tr('lot.pickTitle'), html: expPickHTML(), cancelLabel: tr('w.cancel'),
    buttons: [{key:'clear', label: tr('lot.pickClear')},
              {key:'ok', label: tr('lot.pickDone'), variant:'primary'}] })
    .then(function(k){
      if (k === 'ok') ui.form.exp.items = expPickItems().map(function(it){ return it.key; });
      else if (k === 'clear') ui.form.exp.items = [];
      expPickDraft = null;
      if (k === 'ok' || k === 'clear') render();
    });
}
/** Краткая пометка «на что отнесено» — в списке и в листе записи.
 *  Печатается ВСЕГДА, в том числе «Без партии»: у записи о деньгах это
 *  такое же полноправное состояние, как и остальные два. */
function expPickText(x){
  var items = expItemsOf(x);
  if (!items.length) return tr('lot.none');
  if (items.length === 1) return esc(shortName(items[0].product.name));
  return tr('lot.pickN', {n: nq(items.length, 'product')});
}
function resetExpForm(){
  ui.form.exp = { cat:'', note:'', amount:'', cur:expDefaultCur(), date:todayISO(),
                  items:[], editId:'' };
  ui.edit.exp = null;
  expPickDraft = null;
}
function saveExp(){
  var f = ui.form.exp;
  ui.err = '';
  if (EXP_CATS.indexOf(f.cat) < 0){ ui.err = tr('err.expCat'); render(); return; }
  var m = parseMoneyToCents(f.amount);
  /* Ноль отвергается наравне с пустым и нечисловым: расход на ноль — это
     не расход. parseMoneyToCents() знака не принимает, поэтому
     отрицательного здесь не бывает по построению. */
  if (m === null || m <= 0){ ui.err = tr('err.expAmount'); render(); return; }
  if (!f.date){ ui.err = tr('err.expDate'); render(); return; }
  /* ++++++ EXPENSE LOT ++++++ выбранные позиции получают НАСТОЯЩИЕ
     номера, если их ещё не было: позиция прежней сборки номера не несёт,
     и ссылаться на неё иначе не на что. Ключ вида «товар#индекс» живёт
     ровно до этого места и в документ не попадает никогда. */
  var picked = [];
  expFormItems().forEach(function(it){ picked.push(batEnsureId(it)); });
  if (f.editId){
    var x = expById(f.editId);
    if (!x){ ui.err = tr('err.expGone'); render(); return; }
    /* Правка считается курсом ЭТОЙ записи, и снимок при этом не двигается:
       он записан один раз, при создании (тот же контракт, что у выдачи). */
    var cents = expToBase(m, f.cur, x.rateSnap);
    if (cents === null){ ui.err = noRateText(f.cur); render(); return; }
    x.cat = f.cat; x.note = String(f.note).trim(); x.amountCents = cents;
    x.date = f.date; x.entryCur = f.cur; x.entryMinor = m; x.items = picked;
    /* Привязка «ко всей партии» — прежний вид записи. Форма открывалась
       с её позициями и сохраняет их поимённо, поэтому старый ключ
       снимается: два источника одного и того же ответа разошлись бы при
       первом же изменении состава партии. */
    if (x.lotId) delete x.lotId;
    touch(x.id);
    resetExpForm(); ui.seg.exp = 'list';
    toast(tr('msg.expUpdated'), 'ok');
    commit(); return;
  }
  /* Создание: сегодняшний курс — буквально toBaseCents(), — и снимок
     снимается ЗДЕСЬ, в момент сохранения, а не в момент открытия формы. */
  var made = expToBase(m, f.cur, null);
  if (made === null){ ui.err = noRateText(f.cur); render(); return; }
  var expId = uid('exp');
  state.expenses.push({ id: expId, cat:f.cat, note: String(f.note).trim(),
    amountCents:made, date:f.date, entryCur:f.cur, entryMinor:m, items: picked,
    rateSnap: rateSnapshot(), createdAt: new Date().toISOString() });
  touch(expId);
  var keepCur = f.cur, keepDate = f.date;
  resetExpForm();
  ui.form.exp.cur = keepCur; ui.form.exp.date = keepDate;
  /* выбор запоминается вместе с валютой и датой: расходов на один приход
     обычно несколько подряд — доставка, растаможка, комиссия */
  ui.form.exp.items = picked;
  ui.seg.exp = 'list';
  toast(tr('msg.expAdded'), 'ok');
  commit();
}
/** Правка открывается в валюте ЗАПИСИ и с той суммой, которую владелец
 *  набрал: пересчитывать нечего — значит и потерять на пересчёте нечего.
 *  Запись без провенанса (набрана в базовой валюте, или копия старее v5)
 *  открывается в базовой: сумма в ней и хранится. */
function startExpEdit(id){
  var x = expById(id);
  if (!x) return;
  var b = state.settings.baseCurrency;
  var cur = (x.entryCur && rateOf(x.entryCur) !== null) ? x.entryCur : b;
  var minor = (cur === x.entryCur && x.entryMinor !== null && x.entryMinor !== undefined)
    ? x.entryMinor : x.amountCents;
  /* ++++++ EXPENSE LOT ++++++ окно открывается с сохранённым выбором —
     через expItemKeys(), то есть тем же путём, которым выбор печатается
     в списке. У записи, привязанной ко всей партии, это её позиции. */
  ui.form.exp = { cat:x.cat, note:x.note || '', amount:(minor/100).toFixed(2), cur:cur,
                  date:x.date, items: expItemKeys(x), editId:x.id };
  ui.edit.exp = x.id;
  ui.tab = 'exp'; ui.seg.exp = 'new'; ui.detail = null; ui.err = '';
  render(); window.scrollTo(0,0);
}
/** Лист записи — тот же dialog(), что у оплаты. Здесь описание печатается
 *  целиком: в строке списка оно ужато многоточием, и это единственное
 *  место, где его видно полностью. */
function expSheet(x){
  var body = '<div class="body">' +
    tr('exp.sheetLine', { cat: esc(tr('exp.cat.' + x.cat)),
      sum: dcMoney(dcCents(x.amountCents, x.rateSnap)), date: fmtDateLong(x.date) }) +
    (x.note ? '<br>' + esc(x.note) : '') +
    (hasEntry(x) ? '<br>' + entryInline(x) : '') +
    (expRateText(x) ? '<br>' + expRateText(x) : '') +
    '<br>' + tr('lot.ofExp', {what: expPickText(x)}) + '</div>';
  /* ++++++ EXPENSE LOT ++++++ распределение печатается ТОЙ ЖЕ карточкой,
     что и под формой: одна разметка на оба места. Здесь она берёт то, что
     СОХРАНЕНО, — сумму записи, её снимок курсов и набранную сумму, — и
     поэтому цифры листа и формы совпадают до копейки. Расход без выбора
     карточки не получает: делить нечего. */
  var split = expSplitCard(expItemsOf(x), x.amountCents, x.rateSnap,
                           x.entryCur, x.entryMinor);
  dialog({ title: tr('tab.expenses'), html: body + split, cancelLabel: tr('w.close'),
    buttons: [{key:'edit', label: tr('w.edit')}, {key:'del', label: tr('w.delete'), variant:'danger'}] })
    .then(function(k){
      if (k === 'edit') startExpEdit(x.id);
      if (k === 'del') deleteExp(x.id);
    });
}
function deleteExp(id){
  var x = expById(id);
  if (!x) return;
  confirmBox(tr('dlg.delExpTitle'),
    tr('dlg.delExpBody', { cat: esc(tr('exp.cat.' + x.cat)),
      sum: dcMoney(dcCents(x.amountCents, x.rateSnap)), date: fmtDateLong(x.date) }) +
      trashNoteHTML(),
    tr('dlg.trashOk'), true).then(function(okd){
      if (!okd) return;
      trashMark(state, 'expenses', id, nowISO(), touch);
      if (ui.form.exp.editId === id) resetExpForm();
      toast(tr('msg.trashed'), 'ok');
      commit();
    });
}
/* ============================================ ++++++ EXPENSE LOT ++++++ ==
 * ЭКРАН ПАРТИИ и всё, что деление показывает.
 *
 * Ни одного нового способа что-либо нарисовать: те же .card/.row/.hero,
 * тот же dialog() для листов, то же confirmBox() для подтверждений.
 * Деньги закупочной стороны печатаются через sec*-семейство — партия и
 * есть закупка, — а деление каждого расхода печатается в ТОЙ валюте, в
 * которой расход набрали: 970 TJS делятся на 538.89 и 431.11 TJS, а не на
 * их пересчёт, потому что вопрос владельца был про эти 970.
 * ================================================================== */

/** «55.56%» — два знака, потому что доли бывают близкими, и один знак их
 *  сливает. Своя функция, а не pctOf(): та округляет до десятых и служит
 *  марже, где второй знак не нужен. */
function lotPctText(v){ return (Math.round(v * 100) / 100).toFixed(2) + '%'; }

/** Как поделился ОДИН расход — в валюте, в которой его набрали, между
 *  ЕГО позициями, какой бы партии те ни принадлежали. Пусто, когда
 *  позиция одна: делить не с чем, и строка сказала бы «Духи 970.00», то
 *  есть ничего (область 43). */
function expSplitText(x){
  var items = expItemsOf(x);
  if (items.length < 2) return '';
  var hasEntry2 = x.entryCur && x.entryMinor !== null && x.entryMinor !== undefined;
  var cur = hasEntry2 ? x.entryCur : state.settings.baseCurrency;
  var amt = hasEntry2 ? x.entryMinor : x.amountCents;
  var sh = allocShares(amt, itemWeights(items)), parts = [];
  items.forEach(function(it, i){
    parts.push(esc(shortName(it.product.name)) + ' ' + fmtMinor(sh[i]));
  });
  return tr('lot.split', { list: parts.join(' &middot; '), cur: esc(cur) });
}

function viewLotCard(){
  var lot = lotByKey(ui.detail.id);
  if (!lot){ ui.detail = null; return viewProducts(); }
  var sec = 'products';
  var sh = lotShareCents(lot), expCents = lotExpCents(lot), buy = lotTotalCents(lot);
  var h = backHead(tr('lot.title', {date: fmtDateLong(lot.date)}),
    tr('lot.sub', {n: nq(lot.items.length, 'line'), sum: secOne(sec, buy)}));
  h += warnNote(sec);
  h += hero({ k: tr('lot.expTotal'), v: heroMoney(sec, expCents),
    s: expCents ? tr('lot.expOf', {n: nq(lotExpenses(lot).length, 'expense'),
                                   sum: secOne(sec, buy)})
                : tr('lot.expNone') });

  /* позиции: закупка, доля расхода в деньгах и процентах, себестоимость
     единицы с учётом расходов. Процент считается ОТ ДОЛЕЙ, а не от весов:
     расход мог быть отнесён не на всю партию, и тогда вес позиции и
     доставшаяся ей доля — разные вещи (pctOfSum). */
  var rows = '';
  lot.items.forEach(function(it, i){
    var unit = lotUnitCents(lot, i);
    var sub2 = sh[i]
      ? tr('lot.itemShare', { sum: secBare(sec, sh[i]), pct: lotPctText(pctOfSum(sh, i)),
            unit: unit === null ? '—' : secBare(sec, Math.round(unit)) })
      : tr('lot.itemPct', { pct: lotPctText(lotPct(lot, i)) });
    rows += row({ lead: avsq(units(it.batch.qty)), k: esc(it.product.name),
      sub: tr('lot.itemBuy', { unit: secBare(sec, it.batch.costCents) }),
      sub2: sub2, v: secV(sec, it.batch.totalCostCents),
      act:'lot-item', arg: lot.key + '|' + i });
  });
  /* «Итого» — сумма ровно тех целых, которые напечатаны в строках */
  var tot = 0; sh.forEach(function(v){ tot += v; });
  /* Ни одного нового класса: строка обычная, отличает её подпись. Класс,
     которого нет в таблице стилей, — молчаливый дефект (R33). */
  if (expCents) rows += row({ k: tr('lot.itemsTotal'),
    sub: tr('lot.itemsTotalHint'), v: secV(sec, tot) });
  h += listCard(tr('lot.items'), rows);

  /* Расходы, задевшие эту партию. У расхода, поделённого между товарами
     из разных приходов, здесь печатается всё его деление целиком — иначе
     сумма долей на экране не сошлась бы с суммой самого расхода. */
  var er = '';
  lotExpenses(lot).forEach(function(x){
    er += row({ k: esc(tr('exp.cat.' + x.cat)),
      sub: fmtDateLong(x.date) + (x.note ? ' · ' + esc(x.note) : '') +
           (hasEntry(x) ? ' · ' + entryInline(x) : ''),
      sub2: expSplitText(x),
      v: secV(sec, x.amountCents), act:'exp-open', arg:x.id });
  });
  h += listCard(tr('lot.expenses'), er);

  h += '<div class="btns">' + btn(tr('lot.join'), 'lot-join', 'ghost') + '</div>';
  h += '<div class="note calc">' + tr('lot.hint') + '</div>';
  return h;
}

/** Лист позиции: открыть товар или отделить позицию от партии. */
function lotItemSheet(key, i){
  var lot = lotByKey(key);
  if (!lot || !lot.items[i]) return;
  var it = lot.items[i], alone = lot.items.length < 2;
  var body = '<div class="body">' + esc(it.product.name) + ' · ' +
    units(it.batch.qty) + ' · ' + secOne('products', it.batch.totalCostCents) + '</div>';
  var buttons = [{key:'open', label: tr('lot.openProduct')}];
  /* Отделять нечего, когда позиция в партии одна: партия из одной позиции
     и так одиночная. Кнопка, которая ничего не делает, — не кнопка. */
  if (!alone) buttons.push({key:'split', label: tr('lot.split1'), variant:'danger'});
  dialog({ title: tr('lot.itemTitle'), html: body, cancelLabel: tr('w.close'), buttons: buttons })
    .then(function(k){
      if (k === 'open'){ ui.detail = { type:'product', id: it.product.id }; render(); window.scrollTo(0,0); return; }
      if (k === 'split') lotSplit(key, i);
    });
}
/** Отделить позицию: она теряет номер ПАРТИИ и снова становится своей
 *  партией. Собственный номер позиции (`batch.id`) при этом не трогается:
 *  на него ссылаются расходы, и снять его значило бы порвать ссылку,
 *  которую владелец не отменял. */
function lotSplit(key, i){
  var lot = lotByKey(key);
  if (!lot || !lot.items[i] || lot.items.length < 2) return;
  var it = lot.items[i];
  delete it.batch.lotId;
  toast(tr('msg.lotSplit', {name: esc(it.product.name)}), 'ok');
  commit();
}
/** Лист присоединения: партии, которые в эту не входят. Одно нажатие —
 *  одна присоединённая позиция; список открывается снова, если нужно
 *  присоединить ещё. */
function lotJoinSheet(){
  var lot = lotByKey(ui.detail.id);
  if (!lot) return;
  var rows = '', n = 0;
  lotList().forEach(function(o){
    if (o.key === lot.key) return;
    o.items.forEach(function(it, i){
      n++;
      rows += row({ lead: avsq(units(it.batch.qty)),
        k: esc(it.product.name),
        sub: fmtDateLong(it.batch.date) + ' · ' + secOne('products', it.batch.totalCostCents),
        act:'lot-add', arg: o.key + '|' + i });
    });
  });
  dialog({ title: tr('lot.joinTitle'),
    html: n ? '<div class="rows">' + rows + '</div>'
            : '<div class="body">' + tr('lot.joinNone') + '</div>',
    cancelLabel: tr('w.close'), buttons: [] });
}
/** Присоединить позицию к открытой партии. Номер выдаётся обеим сторонам,
 *  если его ещё не было: partия без номера — это партия, к которой пока
 *  нечем привязаться. Переносится РОВНО одна позиция, а не весь приход
 *  донора: так предсказуемее, и обратный шаг — «Отделить» — ровно один. */
function lotAdd(arg){
  var lot = lotByKey(ui.detail && ui.detail.id);
  if (!lot) return;
  var p = String(arg).split('|'), src = lotByKey(p[0]), i = parseInt(p[1], 10);
  if (!src || !src.items[i]) return;
  var id = lotEnsureId(lot);
  src.items[i].batch.lotId = id;
  ui.detail = { type:'lot', id: id };
  var back = document.querySelector('.modal-back');
  if (back) back.remove();                 /* лист не часть render() — область 14 */
  toast(tr('msg.lotJoined', {name: esc(src.items[i].product.name)}), 'ok');
  commit();
}

/* ---- строки о расходах на карточке товара ---------------------------- */

/** Две справочные строки: сколько расходов пришлось на этот товар и во
 *  сколько он обошёлся с ними. Печатаются ТОЛЬКО когда расходы есть:
 *  строка «расходов 0.00» — не сведение (область 43). Ни та, ни другая
 *  величина не участвует ни в прибыли, ни в складе, ни в отчёте. */
function prodExpRowsHTML(p, st){
  var share = prodShareCents(p);
  if (!share) return '';
  var withExp = st.initial > 0 ? (st.spentCents + share) / st.initial : null;
  return row({ k: tr('lot.prodShare'), sub: tr('lot.prodShareHint'),
               v: secV('products', share) }) +
         row({ k: tr('lot.prodUnit'), sub: tr('lot.prodUnitHint'),
               v: withExp === null ? '—' : secV('products', Math.round(withExp)) });
}
/** Подпись под позицией на карточке товара: в какую партию она входит и
 *  сколько расходов на неё пришлось. Про партию говорится только когда
 *  она не одиночная — иначе это повторение того, что уже написано в
 *  строке; про расходы — только когда они есть. */
function batchLotSub(p, i){
  var out = [], lot = lotOfBatch(p, i);
  if (lot && lot.items.length > 1) out.push(tr('lot.inLot', { what: lotWhat(lot) }));
  var share = batShareCents(batKeyOf(p, p.batches[i], i));
  if (share) out.push(tr('lot.batShare', { sum: secBare('products', share) }));
  return out.join(' · ');
}

/* =============================================== ++++++ TRASH ++++++ ==
 * ЭКРАН КОРЗИНЫ — единственный читатель удалённых записей.
 *
 * Ни одного нового примитива и ни одного правила в таблице стилей: строка
 * это row() без действия, а кнопки рядом с ней — тот же приём
 * .rmdrow/.rmdact, которым напечатана кнопка «Скопировать напоминание».
 * Вкладывать кнопку в кнопку нельзя (хрупкое место 25), а здесь сама
 * строка ничего не открывает: записи нет ни в одном списке, открывать
 * нечего.
 *
 * СТРОКА ОБЯЗАНА ГОВОРИТЬ, ЧТО ИМЕННО ВЕРНЁТСЯ. Замечание владельца
 * 2026-08-28 по стенду: «Выдача · Азиз · 660.00 AED · вместе с ним: 1
 * запись» не отвечает ни на «сколько штук», ни на «что за связанная
 * запись». Перед восстановлением видеть состав важнее, чем экономить
 * строку: поэтому у записи печатаются её количество и товар, у группы —
 * состав словами, а полный список раскрывается нажатием.
 * ================================================================== */

/** Как запись подписана в корзине. Имя человека и товара берутся по всему
 *  документу (trashFind), а не через productById: родитель может лежать в
 *  корзине рядом, и «—» вместо имени был бы честен только формально. */
/** Хвост, который каждое подтверждение удаления добавляет к своему телу.
 *  Прежние тела не переписаны ни в одном из шести мест: они говорят, ЧТО
 *  удаляется, а эта строка — куда оно денется. */
function trashNoteHTML(){
  return tr('dlg.trashNote', { n: nq(TRASH_DAYS, 'day') });
}
function trashRowTitle(col, r){
  var f;
  if (col === 'products' || col === 'people') return esc(r.name);
  if (col === 'transactions'){
    f = trashFind(state, r.personId);
    return esc(f ? f.rec.name : '—');
  }
  if (col === 'payments'){
    f = trashFind(state, r.personId);
    return tr('trash.payOf', { name: esc(f ? f.rec.name : '—') });
  }
  if (col === 'returns'){
    f = trashFind(state, r.txId);
    var per = f ? trashFind(state, f.rec.personId) : null;
    return esc(per ? per.rec.name : '—');
  }
  return esc(tr('exp.cat.' + expCatOf(r.cat)) + (r.note ? ' · ' + r.note : ''));
}

/** Имя товара, к которому относится запись (у платежа и расхода его нет). */
function trashProdName(col, r){
  var f;
  if (col === 'products') return esc(r.name);
  if (col === 'transactions') f = trashFind(state, r.productId);
  if (col === 'returns'){
    var t = trashFind(state, r.txId);
    f = t ? trashFind(state, t.rec.productId) : null;
  }
  return f ? esc(f.rec.name) : '';
}

/** Сколько штук в записи — 0 там, где штук нет (платёж, расход, человек). */
function trashQtyOf(col, r){
  if (col === 'transactions' || col === 'returns') return r.qty;
  if (col === 'products') return r.qty;
  return 0;
}

/** Сумма записи — в базовой валюте, одной цифрой: строка и так несёт тип,
 *  имя, штуки и дату, а вторая валюта здесь ничего не решает (тот же
 *  довод, что у ленты человека — baseOne, хрупкое место 7). */
function trashRowAmount(col, r){
  var f;
  if (col === 'products'){
    var spent = 0;
    (Array.isArray(r.batches) ? r.batches : []).forEach(function(b){ spent += (b.totalCostCents || 0); });
    return baseOne(spent);
  }
  if (col === 'transactions') return baseOne(r.qty * r.unitPriceCents);
  if (col === 'payments' || col === 'expenses') return baseOne(r.amountCents);
  if (col === 'returns'){
    f = trashFind(state, r.txId);
    return f ? baseOne(r.qty * f.rec.unitPriceCents) : '';
  }
  return '';
}

/* Названия типов собираются приставкой — идиома файла (`tr('status.' + s)`,
   `tr('mon.' + i)`): ключ, собранный из частей, наборы узнают по приставке и
   не считают мёртвым (хрупкое место 28). */
var TRASH_TYPE_KEY = {
  products: 'tProduct', people: 'tPerson', transactions: 'tTx',
  payments: 'tPay', returns: 'tRet', expenses: 'tExp'
};
function trashTypeName(col){ return tr('trash.' + TRASH_TYPE_KEY[col]); }

/** Вторая строка записи: что в ней лежит. У выдачи и возврата — штуки и
 *  товар, у товара — сколько куплено и сколько оставалось на складе, у
 *  платежа и расхода — их дата. */
function trashRowSub(col, r, g){
  var parts = [], q = trashQtyOf(col, r), name = trashProdName(col, r);
  if (col === 'products'){
    parts.push(tr('trash.bought', { q: units(r.qty), left: units(trashStockWas(g, r)) }));
  } else if (col === 'transactions' || col === 'returns'){
    if (q) parts.push(units(q) + ' ' + tr('w.pcs'));
    if (name) parts.push(name);
  }
  /* у человека своей даты нет — печатать «от —» значит показать пустоту
     там, где владелец ждёт сведений (найдено живой проверкой) */
  if (col !== 'products' && col !== 'people'){
    parts.push(tr('trash.dated', { d: fmtDateLong(r.date) }));
  }
  return parts.join(' · ');
}

/** Сколько единиц товара лежало на складе В МОМЕНТ удаления: его
 *  количество минус выдачи, ушедшие этой же группой, плюс их возвраты.
 *  Считается по группе, а не по документу: активных выдач у корзинного
 *  товара нет — они ушли вместе с ним. */
function trashStockWas(g, p){
  var left = p.qty, i, it;
  if (!g) return left;
  for (i = 0; i < g.items.length; i++){
    it = g.items[i];
    if (it.col === 'transactions' && it.rec.productId === p.id) left -= it.rec.qty;
    if (it.col === 'returns'){
      var t = trashFind(state, it.rec.txId);
      if (t && t.rec.productId === p.id) left += it.rec.qty;
    }
  }
  return left < 0 ? 0 : left;
}

/** Состав группы словами — по типам, со штуками и суммами. Голова в счёт
 *  не идёт: про неё уже сказано в самой строке. */
function trashParts(items, headId){
  var n = { products:0, people:0, transactions:0, payments:0, returns:0, expenses:0 };
  var qTx = 0, qRet = 0, mPay = 0, mExp = 0, i, it, out = [];
  for (i = 0; i < items.length; i++){
    it = items[i];
    if (it.rec.id === headId) continue;
    n[it.col]++;
    if (it.col === 'transactions') qTx += it.rec.qty;
    if (it.col === 'returns') qRet += it.rec.qty;
    if (it.col === 'payments') mPay += it.rec.amountCents;
    if (it.col === 'expenses') mExp += it.rec.amountCents;
  }
  if (n.products) out.push(nq(n.products, 'product'));
  if (n.people) out.push(nq(n.people, 'person'));
  if (n.transactions) out.push(tr('trash.pWithQty', { n: nq(n.transactions, 'transaction'), q: units(qTx) }));
  if (n.returns) out.push(tr('trash.pWithQty', { n: nq(n.returns, 'return'), q: units(qRet) }));
  if (n.payments) out.push(tr('trash.pWithSum', { n: nq(n.payments, 'payment'), sum: baseOne(mPay) }));
  if (n.expenses) out.push(tr('trash.pWithSum', { n: nq(n.expenses, 'expense'), sum: baseOne(mExp) }));
  return out.join(', ');
}

/** Одна строка списка: тип, имя, что внутри, когда удалили и что уйдёт
 *  или вернётся вместе. Кнопки — СОСЕДИ строки, не её дети. */
function trashRowHTML(g){
  var col = g.head.col, r = g.head.rec, age = trashAge(g.at);
  var when = tr('trash.deleted', { when: bakStamp(g.at) }) + ' · ' +
             (age === 0 ? tr('trash.today') : tr('trash.ago', { n: nq(age, 'day') }));
  var withText = g.n > 1 ? tr('trash.withN', { what: trashParts(g.items, r.id) }) : '';
  var one = row({
    k: trashTypeName(col) + ' · ' + trashRowTitle(col, r),
    sub: trashRowSub(col, r, g),
    sub2: when + (withText ? ' · ' + withText : ''),
    v: trashRowAmount(col, r)
  });
  /* ++++++ TRASH ++++++ разделитель между кнопками — ТЕКСТ, а не правило в
     таблице стилей: .rmdact писался под одну кнопку («Скопировать
     напоминание»), и две подряд слипаются в «ВосстановитьУдалить
     навсегда». Найдено живой проверкой на установленном приложении. */
  var sep = '<span class="sub"> · </span>';
  var acts = '<div class="rmdact">' +
    '<button type="button" class="lnk" data-act="trash-restore" data-arg="' + esc(g.group) + '">' +
      tr('trash.restore') + '</button>' + sep +
    '<button type="button" class="lnk" data-act="trash-forever" data-arg="' + esc(g.group) + '">' +
      tr('trash.forever') + '</button>' +
    (g.n > 1 ? sep + '<button type="button" class="lnk" data-act="trash-open" data-arg="' + esc(g.group) + '">' +
      (ui.trashOpen === g.group ? tr('trash.hide') : tr('trash.show', { n: g.n })) + '</button>' : '') +
    '</div>';
  return '<div class="rmdrow">' + one + acts + '</div>' +
    (ui.trashOpen === g.group ? trashGroupListHTML(g) : '');
}

/** Раскрытый состав: по строке на запись, включая голову — владелец
 *  смотрит на то, что вернётся, целиком. */
function trashGroupListHTML(g){
  var h = '', i, it;
  for (i = 0; i < g.items.length; i++){
    it = g.items[i];
    h += row({ k: trashTypeName(it.col) + ' · ' + trashRowTitle(it.col, it.rec),
      sub: trashRowSub(it.col, it.rec, g), v: trashRowAmount(it.col, it.rec) });
  }
  return h;
}

/** Раздел «Ещё → Корзина». Пусто — так и сказано, и очистки тогда нет:
 *  кнопка, которой нечего делать, обещает работу, которой нет. */
function trashSectionHTML(){
  var groups = trashGroups(state), n = trashCount(state), h = '', i;
  var days = nq(TRASH_DAYS, 'day');
  if (!n){
    return listCard(tr('trash.title'),
      '<div class="empty">' + tr('trash.empty') + '</div>') +
      '<div class="note calc">' + tr('trash.emptyHint', { n: days }) + '</div>';
  }
  for (i = 0; i < groups.length; i++) h += trashRowHTML(groups[i]);
  return listCard(tr('trash.title') + ' · ' + n, h) +
    '<div class="note calc">' + tr('trash.note30', { n: days }) + '</div>' +
    listCard('', row({ k: tr('trash.clear'), act: 'trash-clear' }));
}

/* --------------------------------------------- ++++++ TRASH ++++++ --
 * ЧЕТЫРЕ ДЕЙСТВИЯ. Пометка живёт в шести функциях удаления (там же, где
 * жила и раньше), остальные три — здесь, и все три ведут в ОДНО место:
 * trashDropIds(), то есть в существующий dropFrom() с надгробием и в
 * commitThenDrop() с файлами. Второго пути к окончательному удалению в
 * этом файле нет и быть не должно.
 * ------------------------------------------------------------------ */

/** Снять записи навсегда: надгробие на каждую (dropFrom), потом файлы —
 *  и именно в этом порядке, потому что ссылка обязана лечь на диск
 *  раньше, чем гибнут байты (хрупкое место 12). */
function trashDropIds(ids){
  var att = trashAttIds(state, ids), k;
  for (k in ids) if (own(ids, k)) trashDropOne(k, ids[k]);
  if (ui.report.productId && !productById(ui.report.productId)) ui.report.productId = '';
  ui.detail = null;
  attForget(att);
  commitThenDrop(att);
}
/* отдельной функцией, чтобы замыкание цикла не держало переменную k */
function trashDropOne(col, dead){
  dropFrom(col, function(x){ return dead.indexOf(x.id) === -1; });
}

/** Кого вернуло восстановление, кроме самой записи — в словах владельца. */
function trashParentNames(list){
  var out = [], i;
  for (i = 0; i < list.length; i++){
    out.push(trashTypeName(list[i].col).toLowerCase() + ' «' +
             trashRowTitle(list[i].col, list[i].rec) + '»');
  }
  return out.join(', ');
}

/** Отказ восстановления — один заголовок, три причины, и в каждой цифры
 *  или имена. Кнопка одна: решать тут нечего, надо знать. */
function trashNoDialog(html){
  dialog({ title: tr('trash.noTitle'), html: html, buttons: [],
           cancelLabel: tr('w.close') });
}

/** Восстановить группу. Целиком или никак — решает ядро, здесь только
 *  слова. */
function trashRestoreAct(group){
  var res = trashRestore(state, group, true, remainingFor, touch);
  if (res.ok){
    toast(res.parents.length
      ? tr('msg.restoredWith', { what: trashParentNames(res.parents) })
      : tr('msg.restored'), 'ok');
    commit();
    return;
  }
  if (res.reason === 'stock'){
    trashNoDialog(tr('trash.noStock', { name: esc(res.product),
      need: units(res.need), have: units(res.have) }));
  } else if (res.reason === 'name'){
    trashNoDialog(tr('trash.noName', { name: esc(res.name) }));
  } else if (res.reason === 'phone'){
    trashNoDialog(tr('trash.noPhone', { phone: esc(res.phone), other: esc(res.other) }));
  } else {
    toast(tr('trash.gone'), 'warn');
    render();
  }
}

/** Удалить группу навсегда. Файлы называются ДО удаления: после него
 *  спрашивать фотографию будет не у кого. */
function trashForeverAct(group){
  var g = trashGroupOf(state, group), ids = {}, i, it;
  if (!g) return;
  for (i = 0; i < g.items.length; i++){
    it = g.items[i];
    if (!own(ids, it.col)) ids[it.col] = [];
    ids[it.col].push(it.rec.id);
  }
  trashForeverConfirm(tr('dlg.foreverTitle'), ids, g.n);
}

/** Общее подтверждение окончательного удаления — и для одной группы, и
 *  для второго шага очистки. */
function trashForeverConfirm(title, ids, n){
  var att = trashAttIds(state, ids);
  confirmBox(title,
    tr('dlg.foreverBody', { n: nq(n, 'record') }) +
    (att.length ? tr('dlg.foreverFiles', { n: nq(att.length, 'file') }) : '') +
    tr('dlg.foreverNoUndo'),
    tr('dlg.foreverOk'), true).then(function(okd){
      if (!okd) return;
      trashDropIds(ids);
      toast(tr('msg.purged', { n: nq(n, 'record') }), 'ok');
    });
}

/** Очистить корзину — два подтверждения подряд, и второе то же самое,
 *  что у одной группы: путь к удалению навсегда ОДИН. */
function trashClearAct(){
  var all = trashAllIds(state);
  if (!all.n) return;
  confirmBox(tr('dlg.clearTitle'), tr('dlg.clearBody', { n: nq(all.n, 'record') }),
    tr('dlg.clearOk'), true).then(function(okd){
      if (!okd) return;
      trashForeverConfirm(tr('dlg.clearTitle2'), all.ids, all.n);
    });
}

/** Уборка по сроку. Зовётся из boot() один раз, молча: владелец про эти
 *  записи уже решил — он их удалил, а срок назван и на экране корзины, и
 *  в каждом подтверждении удаления. */
function trashPurgeBoot(loaded){
  if (!loaded) return 0;
  var plan = trashPurgeIds(state);
  if (!plan.n) return 0;
  trashDropIds(plan.ids);
  return plan.n;
}

function viewMore(){
  var h = head(tr('tab.more'), tr('more.sub'));
  h += segbar('more', [['cur', tr('seg.cur')], ['data', tr('seg.data')],
                       ['trash', tr('seg.trash')], ['sync', tr('seg.sync')],
                       ['look', tr('seg.look')]]);
  if (ui.seg.more === 'cur'){
    h += '<section class="card"><div class="t">' + tr('hdr.base') + '</div><div class="b">' +
      field({ label: tr('cur.baseIs'), control: select({ f:'', id:'baseCurrencySel',
        value: state.settings.baseCurrency,
        items: currencyCodes().map(function(c){ return [c, c]; }) }),
        hint: tr('cur.baseHint') }) +
      field({ label: tr('hdr.peopleExtra'), control: select({ f:'', id:'displayCurrencySel',
        value: state.settings.displayCurrency,
        items: [['*', tr('sel.allCurrencies')]].concat(currencyCodes().map(function(c){ return [c, c]; })) }),
        hint: tr('cur.peopleHint') }) +
      '</div></section>';
    /* ++++++ BASE UNDO ++++++ строка есть только пока возврат точен */
    h += baseUndoHTML();
    /* ++++++ RATELOG FOLD ++++++ история курсов стояла здесь и занимала
       экран постоянно, хотя нужна редко. Она ушла в самый низ раздела —
       см. конец этой ветки. */
    /* ++++++ RATE PAIR ++++++ два поля от доллара и шесть направлений.
       Строки USD и TJS с их листом правки отсюда ушли: два способа править
       одно и то же число на одном экране расходятся при первой же правке
       (та же причина, по которой у напоминаний нет своего списка). */
    h += ratePairCardHTML();
    h += ratePairTableCardHTML();
    /* Прочие валюты правятся как и правились, и строка базовой валюты
       остаётся с ними — она и стояла в этой карточке. Карточка печатается
       ТОЛЬКО когда прочие валюты есть: одна строка «1 AED = 1 AED» рядом с
       таблицей из шести — рассказ о пустоте (область 44), а базу и без неё
       называет карточка выше. */
    var rows = '', others = 0;
    currencyCodes().forEach(function(c){
      if (c === state.settings.baseCurrency){
        rows += row({ k: '1 ' + esc(c), sub: tr('cur.isBase'), v: '= 1 ' + esc(c) });
        return;
      }
      if (ratePairOwns(c)) return;
      others++;
      rows += row({ k: '1 ' + esc(c), sub: tr('cur.manual'),
        v: '= ' + esc(trimNum(state.settings.rates[c])) + ' ' + esc(state.settings.baseCurrency),
        act:'cur-edit', arg:c });
    });
    if (others){
      h += listCard(tr('cur.rates'), rows);
      /* Названо прямо: правка полей двигает и их отношение к доллару,
         потому что их курс задан к БАЗЕ, а не к доллару. Промолчать об
         этом значило бы дать разделу тихо переоценивать то, чего он не
         показывает. */
      h += '<div class="note calc">' + tr('rp.others') + '</div>';
    }
    h += '<form id="fCur" novalidate>' + errNote() + '<div class="f"><div class="two">' +
      '<label class="f" style="margin:0"><span>' + tr('cur.code') + '</span>' +
        input({ f:'cur.code', value:ui.form.cur.code, ph:'EUR' }) + '</label>' +
      '<label class="f" style="margin:0"><span>' +
        tr('cur.rateNew', {base: esc(state.settings.baseCurrency)}) + '</span>' +
        input({ f:'cur.rate', value:ui.form.cur.rate, mode:'decimal', ph:'4.00' }) + '</label>' +
      '</div></div>' + saveBtn(tr('cur.add')) + '</form>';
    /* ++++++ REPORT SAYS ++++++ R16. Что хранимые суммы от правки курса
       не меняются, сказано выше. Что показанные — меняются, сказано не
       было; и «Сводка» здесь исключение, потому что читает курсы,
       записанные вместе с записью (схема 10). */
    h += '<div class="note calc">' + tr('cur.sectionNote', {
      summary: esc(secWanted('summary').join(', ')),
      tx: esc(secWanted('transactions').join(', ')) }) +
      '<br>' + tr('cur.rateShows') + '</div>';
    /* ++++++ RATELOG FOLD ++++++ последней в разделе и свёрнутой. Карточка
       по-прежнему есть только когда есть что показать — rateLogHTML()
       возвращает '' на пустой истории, и её проверка не тронута. */
    h += rateLogHTML();
  }
  if (ui.seg.more === 'data'){
    /* ++++++ BACKUP REMINDER ++++++ раздел не удваивается: строка о
       последней копии встаёт первой в ту же карточку, а «Скачать копию» и
       «Импорт копии» — те же две строки с теми же действиями. */
    h += listCard(tr('bak.title'),
      bakStatusHTML() +
      row({ k: tr('bak.export'), sub: tr('bak.exportHint'), act:'export' }) +
      row({ k: tr('bak.import'), sub: tr('bak.importHint'), act:'import-click' }));
    if (bakDirty()) h += '<div class="note warn">' + tr('bk.changed') + '</div>';
    /* ++++++ RESCUE ++++++ пустой запас — обычное состояние, и строки о
       нём нет вовсе: раздел не должен рассказывать о том, чего не было. */
    var rescRow = rescStatusHTML();
    if (rescRow){
      h += listCard(tr('resc.title'), rescRow);
      h += '<div class="note warn">' + tr('resc.storeLine', {key: RESC_KEY}) + '</div>';
    }
    h += listCard(tr('bak.dangerTitle'),
      row({ k: tr('bak.erase'), sub: tr('bak.eraseHint'), act:'reset' }));
    h += '<div class="note calc">' + tr('store.where', {key: STORAGE_KEY}) + '<br>' +
      tr('store.state', {state: lastSaveOk ? tr('store.working') : tr('store.writeFail')}) + '<br>' +
      /* ++++++ ATTACHMENTS ++++++ where the pictures are, in the same words */
      (attOn() ? tr('att.storeLine', {db: esc(ATT_DB), n: attCount(), size: fmtBytes(attBytes())})
               : tr('att.storeOff')) + '</div>';
    /* Honest, and measured: file:// cannot ask for persistent storage, so the
       browser may clear these files under disk pressure, and copying the HTML
       to another machine carries none of them. The backup is the only copy
       that travels and the only one that is durable. */
    if (attOn() && attCount()) h += '<div class="note warn">' + tr('att.storeWarn') + '</div>';

    h += '<div class="note warn">' + tr('store.phoneWarn') + '</div>';
    /* ++++++ SELF UPDATE ++++++ версия и обновление */
    h += updCardHTML();
  }
  /* ++++++ TRASH ++++++ единственный экран, который читает удалённые
     записи. Всё остальное приложение их не видит вовсе. */
  if (ui.seg.more === 'trash'){
    h += trashSectionHTML();
  }
  /* ++++++ SYNC ++++++ раздел обмена: показывает состояние и даёт три
     действия — подключить, отключить, обменяться сейчас. */
  if (ui.seg.more === 'sync'){
    h += syncCardHTML();
  }
  if (ui.seg.more === 'look'){
    h += '<section class="card"><div class="t">' + tr('hdr.lang') + '</div><div class="b">' +
      field({ label: tr('look.language'), control: select({ f:'', id:'langSel', value:getLang(),
        items:[['en', LANG_LABEL.en], ['ru', LANG_LABEL.ru]] }) }) + '</div></section>';
    h += '<div class="seg">' +
      '<button type="button" data-act="theme-set" data-arg="light"' +
        (ui.theme === 'light' ? ' class="on"' : '') + '>' + tr('look.themeLight') + '</button>' +
      '<button type="button" data-act="theme-set" data-arg="dark"' +
        (ui.theme === 'dark' ? ' class="on"' : '') + '>' + tr('look.themeDark') + '</button></div>';
    h += '<div class="note calc">' + tr('look.themeNote') + '</div>';
  }
  return h;
}

/* ====================================================== ОТРИСОВКА == */
function render(){
  document.documentElement.setAttribute('data-theme', ui.theme);
  document.documentElement.setAttribute('lang', getLang());
  document.title = tr(modeTitlePlainKey());
  setStorageBadge();
  renderNav();
  var h;
  if (ui.tab === 'products') h = viewProducts();
  else if (ui.tab === 'people') h = viewPeople();
  else if (ui.tab === 'tx') h = viewTx();
  else if (ui.tab === 'pay') h = viewPay();
  else if (ui.tab === 'exp') h = viewExp();          /* ++++++ EXPENSES ++++++ */
  else if (ui.tab === 'more') h = viewMore();
  else h = viewSummary();
  $('app').innerHTML = h;
  /* ++++++ ATTACHMENTS ++++++ the screen is complete without a single
     blob: the thumbnails come from metadata. This only upgrades the card's
     picture to the real one, asynchronously, and never blocks a render. */
  attPaint();
  /* ++++++ BACKUP REMINDER ++++++ полоса живёт в #alerts, а не в #app, и
     переставляется одним узлом. Никаких таймеров: «сколько дней прошло»
     считается здесь же, из отметки, на каждой отрисовке. */
  bakBarPaint();
}
/** живые подсказки — без полной перерисовки, чтобы не терять курсор */
function live(){
  var n;
  if (ui.tab === 'products' && ui.seg.products === 'add'){
    ui.form.product.lines.forEach(function(l, i){
      var c = $('pCalc' + i); if (c) c.innerHTML = lineNoteHTML(i);
      var m = $('pMerge' + i); if (m) m.innerHTML = mergeNoteText(i);
    });
    n = $('pTotal'); if (n) n.innerHTML = totalNoteHTML();
  }
  /* ++++++ NAME TWINS ++++++ один узел, не форма: курсор в имени остаётся
     на месте, пока подсказка пересчитывается на каждую букву. */
  if (ui.tab === 'people'){ n = $('personTwin'); if (n) n.innerHTML = personTwinText(); }
  if (ui.tab === 'tx'){ n = $('txHint'); if (n) n.innerHTML = txHintText(); }
  /* ++++++ EXPENSES ++++++ два узла, не форма: курсор в поле суммы
     остаётся на месте, пока подсказка и предварительное деление
     пересчитываются на каждую букву. Ни один из них не предок поля. */
  if (ui.tab === 'exp'){
    n = $('expHint'); if (n) n.innerHTML = expHintText();
    n = $('expSplit'); if (n) n.innerHTML = expSplitBody();
  }
  /* ++++++ RATE PAIR ++++++ таблица курсов пересчитывается на каждую
     набранную букву. Переписываются ДВА узла, и ни один из них не предок
     полей, — поэтому курсор остаётся на месте (хрупкое место 12). */
  if (ui.tab === 'more' && ui.seg.more === 'cur'){
    n = $('rateTable'); if (n) n.innerHTML = ratePairTableHTML();
    n = $('rateNote');  if (n) n.innerHTML = ratePairNoteText();
  }
  if (ui.tab === 'pay'){
    n = $('payHint'); if (n) n.innerHTML = payHintText();
    /* ++++++ PAY LIVE ++++++ и активность кнопки — она зависит от того же
       остатка. Один узел, не форма: курсор в поле остаётся на месте. */
    n = $('payFillBtn'); if (n) n.disabled = !payFillCan();
  }
}
function showTab(name){
  /* ++++++ RATELOG FOLD ++++++ история курсов складывается при входе на
     любую вкладку, поэтому настройки открываются со свёрнутой историей
     каждый раз. В документ это не попадает: ui не сериализуется. */
  ui.tab = name; ui.detail = null; ui.err = ''; ui.rateLogOpen = false;
  render(); window.scrollTo(0,0);
}

/* ======================================================= ВВОД ФОРМ == */
function parentOf(path){
  var parts = path.split('.'), o, i;
  if (parts[0] === 'report') return { obj: ui.report, key: parts[1] };
  o = ui.form;
  for (i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  return { obj:o, key: parts[parts.length - 1] };
}
function setF(path, val){ var t = parentOf(path); t.obj[t.key] = val; }
/* ==================================================================
 * ++++++ PRODUCT EDIT ++++++   НЕСДЕЛАННАЯ ПРАВКА НИЧЕГО НЕ МЕНЯЕТ
 *
 * R2. `startProductEdit()` подставляет в поле себестоимости
 * `st.avgCostCents` — СРЕДНЮЮ по всему товару. Сохранение отдаёт это
 * число в `reconcileBatches()`, а тот сравнивает его с `last.costCents` —
 * ценой ПОСЛЕДНЕЙ партии — и, если они разошлись, переписывает партию:
 *
 *     if (costCents !== null && … && costCents !== last.costCents){
 *       last.costCents = costCents;
 *       last.totalCostCents = Math.round(costCents * last.qty);
 *       last.inv = null;                    // и разбивка накладной с ней
 *     }
 *
 * У товара с двумя и более партиями средняя почти никогда не равна цене
 * последней. Значит, правка ОДНОГО ТОЛЬКО НАЗВАНИЯ переписывала
 * закупочную цену последней поставки, её сумму и её накладную — а вместе
 * с ними `spentCents`, себестоимость и прибыль по этому товару.
 *
 * Это противоречит намерению, записанному в самом коде двумя строками
 * выше подстановки: форма открывается в базовой валюте, «чтобы
 * сохранение без правок вернуло ровно те же целые числа». Не возвращало.
 *
 * ПРАВИЛО:
 *
 *   ПОЛЕ, КОТОРОГО НЕ КАСАЛИСЬ, — НЕ ПРАВКА.
 *
 * Приём тот же, что уже стоит в этом файле у денежных полей формы (R14,
 * `moneyAnchor`): помним, ЧТО подставили, и отличаем это от того, что
 * ввёл человек. Якорь — переменная модуля, не поле документа: наполовину
 * заполненной форме нечего делать в резервной копии.
 *
 * ВТОРАЯ ПОЛОВИНА ДЕФЕКТА — СЛОВА. Сообщение после сохранения гласило
 * «Товар обновлён — изменена последняя партия» ВСЕГДА. Сегодня это правда
 * и она пугает при простом переименовании; после этой правки оно стало бы
 * ложью. Поэтому теперь говорится то, что произошло на самом деле, и
 * решается это не догадкой: партии сравниваются до и после.
 * ================================================================== */

var prodEditAnchor = null;   /* {editId, cents, date} — что подставили в поля */

/** Запомнить подставленное. Зовётся из startProductEdit() и больше ниоткуда.
 *  ++++++ QTY DOWN ++++++ R3: якорь помнит и ДАТУ. Имя сменилось с
 *  `prodCostAnchor`, потому что «cost» в нём стало неправдой. */
function prodEditAnchorSet(id, cents, date){
  prodEditAnchor = { editId:id, cents:cents, date:date };
}
/** Забыть. Зовётся из resetProductForm(), то есть и после сохранения, и
 *  после отмены, и при открытии другой правки. */
function prodEditAnchorDrop(){ prodEditAnchor = null; }

/** Касались ли этого поля. Якорь сравнивается по РЕЗУЛЬТАТУ, а не по тексту:
 *  между открытием и сохранением владелец мог переключить валюту, и тогда
 *  текст другой, а введено по-прежнему ничего. */
function prodUntouched(p, key, value){
  return !!prodEditAnchor && prodEditAnchor.editId === p.id && prodEditAnchor[key] === value;
}

/** Какую себестоимость отдать в reconcileBatches().
 *
 *  ++++++ QTY DOWN ++++++ R3. Раньше здесь возвращалась цена ПОСЛЕДНЕЙ
 *  партии — чтобы reconcileBatches() увидела равенство и ничего не тронула.
 *  После списания последняя партия ДРУГАЯ, и равенства больше нет: цена
 *  уцелевшей поставки была бы переписана ценой убранной. `null` означает
 *  «о цене сказать нечего», и reconcileBatches() понимает это так с самого
 *  начала — это и проще, и верно во всех случаях сразу.
 *
 *  Ни при каком другом исходе поведение не меняется: набранное число уходит
 *  туда же, куда уходило всегда. */
function prodKeepCost(p, cents){
  return prodUntouched(p, 'cents', cents) ? null : cents;
}

/** Какую дату отдать в reconcileBatches().
 *
 *  ++++++ QTY DOWN ++++++ R3. Ровно тот же дефект, что чинил R2, только про
 *  дату, и открывается он этой правкой. Форма подставляет дату ПОСЛЕДНЕЙ
 *  партии, а `reconcileBatches()` заканчивается строкой `if (date)
 *  last.date = date;`. Пока последняя партия та же самая, это ничего не
 *  меняет. После списания последняя — ДРУГАЯ, и уцелевшая поставка молча
 *  получала бы дату убранной: дату, которую владелец не набирал.
 *
 *  Поля не касались — значит о дате сказать нечего. */
function prodKeepDate(p, date){
  return prodUntouched(p, 'date', date) ? null : date;
}

/** Что сказать после сохранения. Не догадка: партии сравниваются до и
 *  после, целиком. Сдвинулась хоть одна — прежняя фраза; не сдвинулось
 *  ничего — короткая, без обещания того, чего не было. */
function prodEditMsg(name, batchesWas, batchesNow){
  return batchesWas === batchesNow
    ? tr('msg.prodUpdatedOnly', {name: name})
    : tr('msg.prodUpdated', {name: name});
}
/* ++++++ /PRODUCT EDIT ++++++ */

/* ++++++ R14 ++++++ ЯКОРЬ ВВЕДЁННОЙ СУММЫ.
 *
 * Раньше переключение валюты пересчитывало то, что СТОИТ В ПОЛЕ, и печатало
 * результат через .toFixed(2). USD → TJS → USD возвращало не то, что
 * напечатали: каждый переход терял до половины копейки, и потери
 * накапливались. Ввели 50.00 USD, тронули переключатель дважды — сохранили
 * 49.99.
 *
 * Теперь помним, ЧТО и В КАКОЙ валюте ввели руками, и каждый пересчёт идёт
 * от этого якоря, а не от предыдущего показа. Сколько бы раз валюту ни
 * переключали, возврат в исходную даёт ровно исходную строку.
 *
 * Якорь живёт в модуле, а не в `state`, и не сохраняется никуда: правится
 * только то, что стоит в поле ДО нажатия «Сохранить». Ни одно сохранённое
 * значение этим не затрагивается.
 *
 * Якорь есть только у тех четырёх полей, у которых рядом стоит свой
 * переключатель валюты. Для всего остального его заводить незачем.
 */
var moneyAnchor = {};                       /* путь поля -> {text, cur} */
/** какой путь хранит валюту этого денежного поля, или null */
function moneyCurPath(path){
  if (path === 'tx.price')   return 'tx.cur';
  if (path === 'pay.amount') return 'pay.cur';
  var m = String(path).match(/^product\.lines\.(\d+)\.sell$/);
  if (m) return 'product.lines.' + m[1] + '.sellCur';
  m = String(path).match(/^product\.lines\.(\d+)\.(boxPrice|cost)$/);
  if (m) return 'product.cur';
  return null;
}
/** сумму ввели руками — значит она и есть якорь, в той валюте, что стоит сейчас */
function moneyAnchorSet(path, text){
  var cp = moneyCurPath(path);
  if (!cp) return;
  var t = parentOf(cp);
  moneyAnchor[path] = { text: text, cur: t.obj[t.key] };
}
/** форму открыли заново — прежние якоря к ней отношения не имеют */
function moneyAnchorDrop(){ moneyAnchor = {}; }

/** перевод уже введённого числа в другую валюту (не переосмысление) */
function convText(raw, from, to, path){
  if (from === to) return raw;
  var a = path ? moneyAnchor[path] : null;
  /* поля ещё не касались в этой форме — якорем становится то, что в нём */
  if (!a){
    a = { text: raw, cur: from };
    if (path) moneyAnchor[path] = a;
  }
  /* вернулись в ту валюту, в которой вводили — отдаём ровно введённое */
  if (a.cur === to) return a.text;
  var m = parseMoneyToCents(a.text);
  if (m === null) return raw;
  var cents = toBaseCents(m, a.cur);
  var v = cents === null ? null : convertFor(cents, to);
  return v === null ? raw : v.toFixed(2);
}

var AMOUNT_OF = { 'tx.cur':'tx.price', 'pay.cur':'pay.amount' };

document.addEventListener('input', function(e){
  var el = e.target;
  /* ++++++ PAY FILL ++++++ <select> ОТВЕЧАЕТ ЧЕРЕЗ change, А НЕ ЧЕРЕЗ input.
     Браузер шлёт списку оба события, и input первым. Здесь стояло
     setF(key, el.value) без разбора тега — то есть новая валюта попадала в
     ui.form ДО того, как обработчик change успевал прочитать прежнюю:

         var t2 = parentOf(key), old = t2.obj[t2.key];   // уже НОВАЯ

     дальше convText() видел from === to, возвращал текст как есть, и сумма
     не переводилась, а ПЕРЕОСМЫСЛИВАЛАСЬ: 40.84 USD становились 40.84 TJS.
     Так тихо умерла починка R14 — переводить-то было нечего. Её набор
     посылал списку один change, без input, и потому проверял путь, которым
     браузер не ходит.

     Список ничего не теряет: обработчик change делает для него setF() и
     полный render(), то есть строго больше, чем делал этот. */
  if (el.tagName === 'SELECT') return;
  /* Поле поиска помечено data-s, а не data-f: оно пишет не в форму, а в ui,
     и перерисовывает только свой список — иначе курсор уезжал бы на каждой
     набранной букве. */
  var sk = el.getAttribute && el.getAttribute('data-s');
  if (sk){ ui[sk] = el.value; liveSearch(sk); return; }
  var key = el.getAttribute && el.getAttribute('data-f');
  if (!key) return;
  setF(key, el.value);
  /* ++++++ R14 ++++++ ввели руками — значит это и есть якорь: дальше
     любые переключения валюты считаются от него, а не от того, что
     последний раз оказалось в поле. */
  moneyAnchorSet(key, el.value);
  var nm = key.match(/^product\.lines\.(\d+)\.name$/);
  if (nm){
    var idx = parseInt(nm[1], 10);
    ui.ac = String(el.value).length > 0 ? idx : null;
    var wrap = el.parentNode, old = wrap.querySelector('.ac');
    if (old) wrap.removeChild(old);
    if (ui.ac === idx){
      var tmp = document.createElement('div');
      tmp.innerHTML = acHTMLFor(String(el.value), idx);
      if (tmp.firstChild) wrap.appendChild(tmp.firstChild);
    }
  }
  if (key.indexOf('report.') === 0){ render(); return; }
  live();
});
document.addEventListener('change', function(e){
  var el = e.target;
  /* ++++++ REMAINDER REPORT ++++++ выбор товара в окне отчёта помечен
     data-r, а не data-f: он пишет не в форму, а в ui, и перерисовывает
     ровно два узла внутри листа. Сам <select> при этом не пересоздаётся —
     тот же приём, что у liveSearch() с полем поиска. */
  var rk = el.getAttribute && el.getAttribute('data-r');
  if (rk){ ui[rk] = el.value; remPaint(); return; }
  var key = el.getAttribute && el.getAttribute('data-f');
  if (!key) return;
  if (key === 'product.cur'){ reexpressInvoice(el.value); render(); return; }
  if (/\.sellCur$/.test(key)){
    var t = parentOf(key), o = t.obj;
    o.sell = convText(o.sell, o.sellCur, el.value, key.replace(/sellCur$/, 'sell'));
    o.sellCur = el.value;
    if (!ui.form.product.editId){ state.settings.lastSellCur = el.value; save(); }
    render(); return;
  }
  if (AMOUNT_OF[key]){
    var t2 = parentOf(key), old = t2.obj[t2.key];
    var a = parentOf(AMOUNT_OF[key]);
    /* ++++++ PAY FILL ++++++ в поле стоит не набранное число, а «весь
       остаток». Переводить ЕГО нельзя: перевод округляет ещё раз и снова
       промахивается мимо долга. Остаток пересчитывается в новой валюте
       заново — тогда кнопка держит своё обещание и после смены валюты.
       Спрашивать надо ДО того, как валюта в форме сменится: payFillHeld()
       сверяет её с той, в которой подставляли. */
    var refill = (key === 'pay.cur' && payFillHeld());
    if (refill){
      t2.obj[t2.key] = el.value;
      a.obj[a.key] = payFillText(el.value);
      payFillMark();
    } else {
      a.obj[a.key] = convText(a.obj[a.key], old, el.value, AMOUNT_OF[key]);
      t2.obj[t2.key] = el.value;
    }
    if (key === 'tx.cur'){ state.settings.lastTxCur = el.value; save(); }
    if (key === 'pay.cur'){ state.settings.lastPayCur = el.value; ui.payPrefillCur = el.value; save(); }
    render(); return;
  }
  setF(key, el.value);
  if (key.indexOf('report.') === 0){ render(); return; }
  if (el.tagName === 'SELECT'){ render(); return; }
  live();
});
function reexpressInvoice(newCur){
  var f = ui.form.product, oldCur = f.cur;
  f.lines.forEach(function(l, i){
    l.boxPrice = convText(l.boxPrice, oldCur, newCur, 'product.lines.' + i + '.boxPrice');
    l.cost     = convText(l.cost,     oldCur, newCur, 'product.lines.' + i + '.cost');
  });
  f.cur = newCur;
}
document.addEventListener('submit', function(e){
  e.preventDefault();
  var id = e.target.id;
  if (id === 'fProduct') saveProduct();
  else if (id === 'fPerson') savePerson();
  else if (id === 'fTx') saveTx();
  else if (id === 'fPay') savePay();
  else if (id === 'fRet') saveRet();
  else if (id === 'fExp') saveExp();         /* ++++++ EXPENSES ++++++ */
  else if (id === 'fCur') addCurrency();
  else if (id === 'fRate') saveRatePair();   /* ++++++ RATE PAIR ++++++ */
});

/* ==================================================== СОХРАНЕНИЕ == */
/* Инвойс целиком: сначала проверяем ВСЕ позиции, потом пишем. Половина
   инвойса в базе хуже понятной ошибки. */
/* ++++++ SELL PRICE ++++++ что сказали о ценах в последний раз. Только
   для отладочного хука: ни в state, ни на экран это не идёт. */
var lastPriceNotes = [];
function saveProduct(){
  /* ++++++ ATTACHMENTS ++++++ one submit at a time — see attSaving */
  if (attSaving) return;
  var f = ui.form.product, date = f.date || todayISO(), i, prepared = [], seen = {};
  ui.err = '';
  /* A picture still being decoded is not "no picture": saving now would store
     the product without it and say nothing. Ask for the two seconds instead. */
  for (i = 0; i < f.lines.length; i++){
    if (f.lines[i].photo && f.lines[i].photo.busy){
      ui.err = tr('att.errPhotoBusy'); render(); return;
    }
  }

  for (i = 0; i < f.lines.length; i++){
    var l = f.lines[i], nm = String(l.name).trim();
    var tag = function(msg){ return tr('err.linePrefix', {n: i + 1, msg: msg}); };
    if (!nm){ ui.err = tag(tr('err.prodName')); render(); return; }
    var key = nm.toLowerCase();
    if (seen[key] !== undefined){
      ui.err = tr('err.lineDup', {a: seen[key] + 1, b: i + 1}); render(); return;
    }
    seen[key] = i;
    var r = readLine(i);
    if (r.err){ ui.err = tag(r.err); render(); return; }
    var sellRaw = String(l.sell).trim(), sellCents;
    if (!sellRaw) sellCents = r.unitCostCents;
    else {
      var sm = parseMoneyToCents(sellRaw);
      if (sm === null){ ui.err = tag(tr('err.prodSell')); render(); return; }
      sellCents = toBaseCents(sm, l.sellCur);
      if (sellCents === null){ ui.err = tag(noRateText(l.sellCur)); render(); return; }
    }
    var inv = f.mode === 'inv'
      ? { boxes: parseIntStrict(l.boxes), unitsPerBox: parseIntStrict(l.perBox),
          pricePerBoxCents: parseMoneyToCents(l.boxPrice),
          vatPct: f.vatOn ? state.settings.vatPct : 0, cur: f.cur, totalEnteredMinor: r.total }
      : null;
    /* ++++++ ATTACHMENTS ++++++ the description and the staged picture travel
       with the item, so a three-item invoice gives each product its own.
       The length limit is the form's job: this is the only new text that ends
       up in localStorage, and localStorage is the small store. */
    var dsc = String(l.desc || '').trim();
    if (dsc.length > DESC_MAX){ ui.err = tag(tr('att.errDescLong', {max: DESC_MAX})); render(); return; }
    prepared.push({ name:nm, qty:r.qty, costCents:r.unitCostCents,
      totalCostCents:r.totalCostCents, sellCents:sellCents, inv:inv,
      /* ++++++ SELL PRICE ++++++ R4. Пустое поле цены не значит
         «продавать по себестоимости» — оно не значит ничего, и на
         приходе партии прежняя цена обязана уцелеть. Значение
         sellCents при этом не трогается: НОВОМУ товару оно нужно. */
      sellGiven: !!sellRaw,
      desc: dsc, photo: l.photo || null });
  }


  if (f.editId){
    var one = prepared[0], p = productById(f.editId);
    if (!p){ ui.err = tr('err.prodGone'); render(); return; }
    var taken = p.qty - productStats()[p.id].remaining;
    if (one.qty < taken){ ui.err = tr('err.prodQtyLow', {n: taken}); render(); return; }
    var other = findProductByName(one.name, p.id);
    if (other){ ui.err = tr('err.prodDup', {name: one.name}); render(); return; }
    p.name = one.name;
    /* ++++++ PRODUCT EDIT ++++++ R2. prodKeepCost() отдаёт цену
       ПОСЛЕДНЕЙ партии вместо средней ровно тогда, когда поля не
       касались; во всех прочих случаях — введённое число, как всегда.
       Партии снимаются до и после, чтобы сказать правду о том, что
       произошло, а не одну и ту же фразу на оба исхода. */
    var batchesWas = JSON.stringify(p.batches);
    reconcileBatches(p, one.qty, prodKeepDate(p, date), prodKeepCost(p, one.costCents));
    var batchesNow = JSON.stringify(p.batches);
    p.qty = one.qty;
    p.unitPriceCents = one.sellCents;
    /* ++++++ ATTACHMENTS ++++++ the owner's own text is replaced by whatever
       is in the box, empty included — clearing it is a legitimate edit. */
    p.description = one.desc;
    touch(p.id);
    attSaving = true;
    attCommitStaged(p, one.photo, function(dropId){
      attSaving = false;
      resetProductForm(); ui.seg.products = 'list'; ui.detail = null;
      toast(prodEditMsg(one.name, batchesWas, batchesNow), 'ok');
      attForget(dropId ? [dropId] : []);
      commitThenDrop(dropId ? [dropId] : []);
    });
    return;

  }

  /* ++++++ EXPENSE LOT ++++++ v15. ОДИН номер партии на всю отправку.
     Инвойс из трёх товаров даёт три партии, и до сих пор ничто не
     говорило, что они пришли вместе, — а расход на доставку относится
     именно к приходу целиком. Номер снимается ЗДЕСЬ, один раз, и
     достаётся каждой позиции: снять его внутри цикла значило бы выдать
     каждой позиции свой номер и не связать ничего.

     Путь ПРАВКИ товара выше не тронут: там партия не заводится, а
     меняется существующая, и номер она сохраняет свой. */
  var lotId = uid('lot');
  var added = 0, merged = 0, touched = [];
  /* ++++++ SELL PRICE ++++++ по одной фразе на каждую сдвинувшуюся цену */
  var priceNotes = [];
  prepared.forEach(function(o){
    /* ++++++ PRODUCT SNAPS ++++++ v14. Курсы того дня — у ПАРТИИ, потому
       что партия и есть закупка. Приход в существующий товар получает
       свой снимок, а снимок товара не трогается: новый курс относится к
       тому, что заведено после его смены, и только (требования 6 и 7).
       Снимается ЗДЕСЬ, при сохранении, — не при открытии формы. */
    var batch = { qty:o.qty, costCents:o.costCents, totalCostCents:o.totalCostCents,
      date:date, inv:o.inv, rateSnap: rateSnapshot(), lotId: lotId };
    var exist = findProductByName(o.name, null);
    if (exist){
      exist.batches.push(batch);
      exist.qty += o.qty;
      /* ++++++ SELL PRICE ++++++ R4. Решение владельца: приход по другой
         цене от поставщика — повод сменить цену продажи, и владелец её
         набирает. Пустое поле прежнюю цену не трогает. Уже проданное не
         трогается в любом случае: у каждой выдачи своя unitPriceCents. */
      if (o.sellGiven){
        if (o.sellCents !== exist.unitPriceCents){
          priceNotes.push(exist.name + tr('msg.shipPrice', {
            old: secBare('products', exist.unitPriceCents),
            'new': secBare('products', o.sellCents) }));
        }
        exist.unitPriceCents = o.sellCents;
      }
      /* ++++++ ATTACHMENTS ++++++ a shipment added to a product the owner
         already has: a description typed now replaces the old one, an empty
         box keeps what is there. The photo, when one was picked, replaces the
         old picture — same rule as the selling price on this path. */
      if (o.desc) exist.description = o.desc;
      merged++;
      touched.push({ p:exist, photo:o.photo });
    } else {
      /* ++++++ PRODUCT SNAPS ++++++ v14. Курсы того же дня — у ТОВАРА, ими
         читается его цена продажи. Внутри одной отправки формы это те же
         числа, что у партии выше: настройки за это время не менялись — код
         синхронный. */
      var np = { id: uid('prod'), name:o.name, qty:o.qty,
        unitPriceCents:o.sellCents, createdAt: new Date().toISOString(), batches:[batch],
        description:o.desc, photoId:null, invoiceIds:[], rateSnap: rateSnapshot() };
      state.products.push(np);
      touch(np.id);
      added++;
      touched.push({ p:np, photo:o.photo });
    }
  });
  var parts = [];
  if (added) parts.push(tr('msg.invAdded', {n: nq(added, 'product')}));
  if (merged) parts.push(tr('msg.invMerged', {n: nq(merged, 'shipment')}));
  /* ++++++ SELL PRICE ++++++ смена цены продажи — не мелочь, о которой
     молчат; строка для неё была написана и не печаталась нигде. */
  parts = parts.concat(priceNotes);
  lastPriceNotes = priceNotes;
  attSaving = true;
  attCommitEach(touched, function(replaced){
    attSaving = false;
    resetProductForm(); ui.seg.products = 'list';
    toast(parts.join(' · '), 'ok');
    /* a shipment merged into a product that already had a photo replaces it;
       the old picture is dropped only after the new reference is on disk */
    attForget(replaced);
    commitThenDrop(replaced);
  });
}

function saveTx(){
  var f = ui.form.tx;
  ui.err = '';
  if (!f.personId){ ui.err = tr('err.txPerson'); render(); return; }
  if (!f.productId){ ui.err = tr('err.txProduct'); render(); return; }
  var qty = parseIntStrict(f.qty);
  if (!qty || qty < 1){ ui.err = tr('err.txQty'); render(); return; }
  var m = parseMoneyToCents(f.price);
  if (m === null){ ui.err = tr('err.txPrice'); render(); return; }
  var cents = toBaseCents(m, f.cur);
  if (cents === null){ ui.err = noRateText(f.cur); render(); return; }
  var rem = remainingFor(f.productId, f.editId || null);
  if (qty > rem){
    var pr = productById(f.productId);
    ui.err = tr('err.txStock', {n: rem, name: pr ? pr.name : '', q: qty});
    render(); return;
  }
  if (f.editId){
    var t = txById(f.editId);
    if (!t){ ui.err = tr('err.txGone'); render(); return; }
    /* ++++++ GOODS RETURN ++++++ ниже возвращённого выдачу не урезать:
       возвраты ссылаются на неё, и Σ возвратов ≤ количества — инвариант
       валидатора. Сообщение называет возвращённое. */
    var retQ = retQtyOf(t.id);
    if (retQ > 0 && qty < retQ){ ui.err = tr('err.retTxQty', {n: units(retQ)}); render(); return; }
    t.personId = f.personId; t.productId = f.productId; t.qty = qty;
    t.unitPriceCents = cents; t.date = f.date;
    t.entryCur = f.cur; t.entryMinor = m;
    touch(t.id);
    resetTxForm(); ui.seg.tx = 'list';
    toast(tr('msg.txUpdated'), 'ok');
    commit(); return;
  }
  /* ++++++ DISPLAY CURRENCY ++++++ курсы на день записи. Пишутся только
     здесь и только при создании: правка курса в настройках не должна
     двигать то, что уже выдано. */
  var txId = uid('tx');
  state.transactions.push({ id: txId, personId:f.personId, productId:f.productId,
    qty:qty, unitPriceCents:cents, entryCur:f.cur, entryMinor:m, rateSnap: rateSnapshot(),
    date:f.date, createdAt: new Date().toISOString() });
  touch(txId);
  var keepPerson = f.personId, keepDate = f.date;
  resetTxForm(keepPerson);
  ui.form.tx.date = keepDate;
  ui.seg.tx = 'list';
  toast(tr('msg.txSaved', {n: qty,
    entry: (f.cur !== state.settings.baseCurrency)
      ? tr('entry.inline', {v: fmtMinor(m), cur: f.cur}) : ''}), 'ok');
  commit();
}
