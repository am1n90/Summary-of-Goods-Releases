/* ++++++ TWO WINDOWS ++++++ R28: два окна затирают работу друг друга.
 *
 * `file://` — ОДИН источник, поэтому две копии `goods-tracker.html` где угодно
 * на машине делят `goods-tracker/v1`. Открыть программу дважды — обычное дело
 * (вкладка на телефоне и вкладка на ноутбуке одного профиля, забытое окно со
 * вчера), и до сих пор это кончалось так: окно A сохраняет, окно B держит
 * документ, прочитанный при своей загрузке, и первый же `commit()` в B пишет
 * поверх — без единого признака, что чужая работа исчезла.
 *
 * ИЗМЕРЕНО перед тем, как что-либо писать: событие `storage` МЕЖДУ ДВУМЯ
 * `file://`-окнами доходит и несёт ключ и новое значение, а `state` во втором
 * окне действительно остаётся прежним. Проверка на догадке здесь была бы
 * особенно дорога: если бы событие не доходило, вся эта семья молчала бы и
 * выглядела рабочей.
 *
 * ПОЧЕМУ ПРЕДУПРЕЖДЕНИЕ, А НЕ ЗАПРЕТ. Запретить запись во втором окне значит
 * решить за владельца, какое из двух окон настоящее, — а он этого не говорил.
 * Забытая вчерашняя вкладка и вкладка, в которой он работает прямо сейчас,
 * для программы неразличимы. Слот спасения (R6) запрещает запись потому, что
 * там альтернатива — уничтожить единственный нечитаемый документ; здесь обе
 * стороны живы, и выбирать должен человек.
 *
 * ЧТО ЗАКРЫТО — СЛОВО «ТИХО». Окно, чей документ устарел, говорит об этом и
 * даёт выход: перезагрузить и увидеть чужую запись. Не перезагрузишь —
 * сохранение перезапишет, и это тоже сказано прямо, до того как оно случится.
 *
 * СЕМЬЯ НИЧЕГО НЕ ПИШЕТ. Ни в документ, ни в схему, ни в третий ключ. Она
 * слушает и рисует один узел в `#alerts` — как напоминание о копии и как
 * загрузочная полоса, и по той же причине: `render()` перерисовывает `#app`
 * целиком, а в поле может стоять курсор.
 */

/* Документ изменён другим окном после того, как это окно его прочитало. */
var xtabStale = false;

/* Слушатель. Единственное место, где `xtabStale` становится true. */
function xtabOn(e){
  if (!e || e.key !== STORAGE_KEY) return;
  /* Значение не изменилось — другое окно записало то же самое. */
  if (e.newValue === e.oldValue) return;
  if (xtabStale) return;               /* уже сказано; второй раз незачем */
  xtabStale = true;
  xtabPaint();
}

/* Один узел в `#alerts`. Никогда не зовёт render(). */
function xtabPaint(){
  if (!xtabStale){ removeBanner('xtab'); return; }
  banner('xtab', 'warn', tr('xtab.body') +
    '<span class="rb"><button type="button" class="go" data-act="xtab-reload">' +
    tr('xtab.reload') + '</button></span>');
}

/* Подписка. Зовётся из boot() ПОСЛЕ первой отрисовки — `banner()` кладёт узел
   в `#alerts`, и до первой отрисовки ему не над чем стоять. */
function xtabWatch(){
  if (!storageUsable) return;          /* нечему меняться */
  window.addEventListener('storage', xtabOn);
}
function removeBanner(id){
  var el = document.querySelector('[data-banner="' + id + '"]');
  if (el) el.remove();
}
var toastN = 0;
function toast(msg, kind){
  toastN++;
  var id = 'toast-' + toastN;
  banner(id, kind || 'ok', esc(msg));
  setTimeout(function(){ removeBanner(id); }, 6000);
}
/** dialog({title, html, buttons:[{key,label,variant}]}) -> Promise<key|null> */
function dialog(opts){
  return new Promise(function(resolve){
    var root = $('modalRoot');
    var back = document.createElement('div');
    back.className = 'modal-back';
    var btns = (opts.buttons || [{key:'ok',label:tr('w.ok'),variant:'primary'}]).map(function(b){
      return '<button type="button" data-key="' + esc(b.key) + '" class="' + (b.variant||'') + '">' + esc(b.label) + '</button>';
    }).join('');
    back.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<h3>' + esc(opts.title || '') + '</h3>' +
        '<div class="body">' + (opts.html || '') + '</div>' +
        '<div class="btns"><button type="button" data-key="" class="">' + esc(opts.cancelLabel || tr('w.cancel')) + '</button>' + btns + '</div>' +
      '</div>';
    /* ================================== ++++++ RATE EDIT ++++++ ==
     * Здесь стояло `back.remove()` ПЕРЕД `resolve(key)`, и из-за этого
     * правка курса не сохранялась НИКОГДА.
     *
     * `rateSheet()` читает своё поле на закрытии:
     *
     *     .then(function(k){ … var n = $('rateIn'); … })
     *
     * — а узла к этому моменту уже не было в документе. `$('rateIn')`
     * возвращал null, `parseRate(null)` — null, и обработчик показывал
     * «курс должен быть числом больше нуля» и выходил. Курс оставался
     * прежним. Проверено на приложении: 3.6725 → 3.7 не доезжало.
     *
     * ПРАВИЛО:
     *
     *   ЛИСТ СНИМАЕТСЯ ПОСЛЕ ТОГО, КАК ОТРАБОТАЛ ЕГО ОБРАБОТЧИК.
     *
     * `resolve()` ставит `.then()` вызывающего в очередь МИКРОЗАДАЧ;
     * снятие ставится туда же следом. Очередь FIFO, поэтому `.then()`
     * отрабатывает первым и ещё видит свои поля.
     *
     * Просто поменять две строки местами НЕ ПОМОГЛО БЫ: `.then()` не
     * синхронный, и `back.remove()` всё равно успел бы раньше. Именно
     * поэтому здесь микрозадача, а не перестановка.
     *
     * Остальным девяти листам это ничего не меняет: они читают только
     * ключ. Два места снимают `.modal-back` сами (`set-product` и
     * `fltset`) — но они на пути `data-act`, а не в `.then()`, и оба
     * проверяют узел на существование. */
    function done(key){
      document.removeEventListener('keydown', onKey);
      resolve(key);
      Promise.resolve().then(function(){ back.remove(); });
    }
    function onKey(e){ if (e.key === 'Escape') done(null); }
    back.addEventListener('click', function(e){
      var b = e.target.closest('button[data-key]');
      if (b) { done(b.dataset.key || null); return; }
      if (e.target === back) done(null);
    });
    document.addEventListener('keydown', onKey);
    root.appendChild(back);
    var first = back.querySelector('.btns button:last-child');
    if (first) first.focus();
  });
}
function confirmBox(title, html, okLabel, danger){
  return dialog({ title:title, html:html,
    buttons:[{key:'ok', label:okLabel || tr('w.confirm'), variant: danger ? 'danger' : 'primary'}]
  }).then(function(k){ return k === 'ok'; });
}

/* ---- products ---- */
function findProductByName(name, exceptId){
  var s = String(name == null ? '' : name).trim().toLowerCase();
  if (!s) return null;
  var list = actProducts();
  for (var i=0;i<list.length;i++){
    var p = list[i];
    if (exceptId && p.id === exceptId) continue;
    if (p.name.trim().toLowerCase() === s) return p;
  }
  return null;
}
/** keep product.batches consistent: their quantities always add up to product.qty */
/* ==================================================================
 * ++++++ QTY DOWN ++++++     УМЕНЬШЕНИЕ КОЛИЧЕСТВА НЕ СТИРАЕТ ИСТОРИЮ
 *
 * R3. `reconcileBatches()` держит правило `Σ batches[].qty === product.qty`.
 * Когда количество уменьшают, она списывает недостачу с ПОСЛЕДНЕЙ партии:
 *
 *     if (last.qty + delta > 0){ last.qty += delta; … }
 *
 * Но если уменьшение больше последней партии — или ровно равно ей — она
 * сдаётся и заменяет ВЕСЬ список одной выдуманной партией:
 *
 *     } else {
 *       p.batches = [{ qty:newQty, costCents:costCents, … }];
 *     }
 *
 * Товар с партиями [10, 5], уменьшенный до 3, терял ОБЕ поставки и все
 * записанные по ним цены; на их место вставала одна партия по цене, взятой
 * из формы. Уменьшение ровно до 10 — тоже: `last.qty + delta` даёт ноль, а
 * условие требует строго больше нуля.
 *
 * ЗДЕСЬ НЕТ ВЫБОРА МЕЖДУ FIFO И LIFO, и это главное, что стоит понять.
 * Функция УЖЕ списывает с конца — строкой `last.qty += delta`, во всех
 * случаях, которые работают. Дефект не в том, что направление выбрано
 * неверно, а в том, что списание останавливается на первой же партии,
 * которой не хватило. Починка — довести списание до конца, тем же
 * направлением, каким оно шло всегда.
 *
 * ПРАВИЛО:
 *
 *   СПИСЫВАЕТСЯ РОВНО СТОЛЬКО, СКОЛЬКО УБРАЛИ, И С КОНЦА —
 *   ОСТАЛЬНЫЕ ПОСТАВКИ ОСТАЮТСЯ СО СВОИМИ ЦЕНАМИ.
 *
 * ЧТО ЭТО МЕНЯЕТ В ДЕНЬГАХ. Меняет — и только там, где прежний код историю
 * уничтожал. Раньше `spentCents` становился `цена_из_формы × новое
 * количество`; теперь это сумма уцелевших поставок. Прежний ответ описывал
 * закупку, которой не было; новый описывает ту, что была, за вычетом
 * убранных единиц.
 *
 * ЧЕГО ЗДЕСЬ НЕТ. Вопроса «а что значит уменьшить количество» — списать
 * недостачу или признать опечатку. Прежний код отвечал на него «опечатка»
 * (уменьшая партию, он пересчитывал и её сумму), и этот ответ сохранён
 * дословно: убранные единицы уходят вместе со своей долей денег.
 * ================================================================== */

/** Убрать `want` единиц с КОНЦА списка партий.
 *
 *  Возвращает, сколько убрать не удалось (0, если удалось всё). Партии,
 *  которых уменьшение не коснулось, не трогаются вовсе — ни их цена, ни их
 *  сумма, ни разбивка накладной.
 *
 *  Последняя затронутая партия теряет разбивку накладной и получает
 *  пересчитанную сумму — ровно так же, как это делала прежняя ветка
 *  `last.qty += delta`: накладная больше не описывает то, что в партии
 *  осталось.
 *
 *  Один список НИКОГДА не пустеет до конца: при `want`, равном всему
 *  количеству, остаётся последняя партия на ноль единиц. Так требует
 *  правило «список партий непуст после validate()», на которое опирается
 *  чужой код, и так же поступала прежняя ветка, подставляя `{qty:newQty}`
 *  при `newQty === 0`. */
function batchTrim(batches, want){
  while (want > 0 && batches.length){
    var last = batches[batches.length - 1];
    if (last.qty > want || batches.length === 1){
      last.qty -= want;
      want = 0;
      last.inv = null;
      last.totalCostCents = Math.round(last.costCents * last.qty);
      break;
    }
    /* партии не хватило (или хватило ровно) — она уходит целиком */
    want -= last.qty;
    batches.pop();
  }
  return want;
}
/* ++++++ /QTY DOWN ++++++ */

function reconcileBatches(p, newQty, date, costCents){
  if (!Array.isArray(p.batches) || !p.batches.length){
    p.batches = [{ qty:p.qty, costCents:costCents || 0, totalCostCents:(costCents || 0) * p.qty,
                   date: date || todayISO(), inv:null }];
  }
  var last = p.batches[p.batches.length - 1];
  var sum = p.batches.reduce(function(a,b){ return a + b.qty; }, 0);
  var delta = newQty - sum;
  if (delta > 0){
    /* прибавка ложится на последнюю партию — как и была: при delta > 0
       прежнее условие `last.qty + delta > 0` истинно всегда */
    last.qty += delta;
    last.inv = null;                                     // invoice breakdown no longer matches
    last.totalCostCents = Math.round(last.costCents * last.qty);
  } else if (delta < 0){
    /* ++++++ QTY DOWN ++++++ R3. Списывается с конца — тем же
       направлением, каким шло списание всегда, — но до конца, а не до
       первой партии, которой не хватило. Раньше здесь весь список
       заменялся одной выдуманной партией, и все записанные цены
       пропадали. Уцелевшие поставки не трогаются вовсе. */
    batchTrim(p.batches, -delta);
    last = p.batches[p.batches.length - 1];
  }
  if (date) last.date = date;
  if (costCents !== null && costCents !== undefined && costCents !== last.costCents){
    last.costCents = costCents;
    last.totalCostCents = Math.round(costCents * last.qty);
    last.inv = null;
  }
}
/* ==================================================================
 * ++++++ DIALOGS SAY ++++++   ПОДТВЕРЖДЕНИЕ ГОВОРИТ, ЧТО СДЕЛАЕТ
 *
 * Два подтверждения обещали меньше, чем делали.
 *
 * R25. «Стереть все данные» перечисляло товары, людей, выдачи, платежи,
 * фотографии и накладные — а `state = defaultState()` возвращает к
 * исходным ещё и базовую валюту, курсы обмена, НДС, валюту «Сводки» и три
 * запомненных валюты ввода. Владелец, у которого свои курсы набраны
 * руками, узнавал об этом после.
 *
 * R32. Смена базовой валюты обесценивает КАЖДЫЙ исторический курс:
 * `rateSnap` записан вместе с базой, при которой снят, и `dcRateOf()`
 * перестаёт доверять снимку, база которого больше не совпадает. Вся
 * «Сводка» тихо переоценивается по сегодняшним курсам — ровно то
 * свойство, ради которого схема 10 и появилась. Плюс `settings.sumCur`
 * за базой не следует и остаётся на прежней валюте.
 *
 * ПРАВИЛО:
 *
 *   ЕСЛИ ДЕЙСТВИЕ СПРАШИВАЕТ РАЗРЕШЕНИЯ, ОНО НАЗЫВАЕТ ВСЁ, ЧТО СДЕЛАЕТ.
 *
 * ЧЕГО ЗДЕСЬ НЕТ. Ни одна из двух вещей не начинает вести себя иначе:
 * стирание по-прежнему возвращает настройки к исходным, смена базы
 * по-прежнему обесценивает снимки. Оставить настройки при стирании и
 * переносить `sumCur` вместе с базой — это решения о поведении, и они за
 * владельцем. Здесь закрыто ровно то, о чём МОЛЧАЛИ.
 * ================================================================== */

/** Сколько записей несут собственный снимок курсов. Считается только для
 *  того, чтобы не говорить о них там, где их нет: документ, пришедший из
 *  схемы 9, снимков не имеет вовсе, и фраза была бы шумом. */
function baseSnapCount(){
  var n = 0;
  /* ++++++ PRODUCT SNAPS ++++++ товары и партии — тоже записи со снимком */
  snapEach(function(r){ if (r.rateSnap) n++; });
  return n;
}

/** Хвост подтверждения смены базовой валюты: что именно перестанет
 *  действовать. Обе фразы печатаются только когда им есть о чём говорить —
 *  предупреждение о том, чего не случится, хуже молчания. */
function baseWarnHTML(target){
  var h = '', n = baseSnapCount();
  /* число нужно только чтобы решить, печатать ли фразу: в самой фразе
     оно ни к чему, а нового существительного в NOUN ради него не завести. */
  /* ++++++ BASE CHANGE ++++++ R9. Пересчёт округляет каждую сохранённую
     сумму, а цена хранится ЗА ЕДИНИЦУ — на выдаче из многих единиц
     ошибка умножается на количество. Обратно не отыграть. Печатается
     всегда: этот диалог и показывается только когда деньги есть. */
  h += '<p>' + tr('dlg.baseLossy') + '</p>';
  /* ++++++ BASE SNAPS ++++++ R32. Первая фраза — что снимки переедут; вторая
     печатается ТОЛЬКО когда есть чему не переехать (область 44), и говорит
     прямо, в каком режиме: при пересчёте переезжают все. */
  /* ++++++ AED SNAPS ++++++ одна фраза вместо двух, и она называет оба
     режима: при «пересчитать» снимки переезжают, при «переименовать»
     перестают применяться. Второй фразы — «столько-то не переедут» — больше
     нет: не переехать теперь не может ни один, потому что переезд бывает
     ровно в одном режиме и делитель там один на всех. */
  if (n) h += '<p>' + tr('dlg.baseSnaps') + '</p>';
  if (dcCur() !== target) h += '<p>' + tr('dlg.baseSumCur', {cur: esc(dcCur())}) + '</p>';
  return h;
}
/* ++++++ /DIALOGS SAY ++++++ */

/* ============================================= ++++++ BASE UNDO ++++++ ==
 * R9, вторая половина: пересчёт при смене базовой валюты обратим — один шаг.
 *
 * Пересчёт умножает каждую хранимую сумму на 1/r и округляет. Цена хранится
 * ЗА ЕДИНИЦУ, поэтому выдача из многих единиц умножает ошибку на количество,
 * и обратная смена базы прежних чисел НЕ ВЕРНЁТ. Об этом с 2026-08-23
 * предупреждает подтверждение; вернуть числа можно было только одним
 * способом — сохранив их.
 *
 * РЕШЕНИЕ ВЛАДЕЛЬЦА, 2026-08-24: один шаг «вернуть как было». Перед
 * пересчётом запоминаются суммы, которых он касается, прежняя база и
 * прежние курсы; на «Ещё → Валюты» появляется кнопка.
 *
 * ПРАВИЛО:
 *
 *   ВОЗВРАТ ПРЕДЛАГАЕТСЯ ТОЛЬКО ПОКА ОН ТОЧЕН.
 *
 * Снимок описывает документ, каким тот был СРАЗУ ПОСЛЕ пересчёта. Стоит
 * владельцу что-нибудь изменить — добавить выдачу, поправить цену, — и
 * возврат перестал бы быть возвратом: он записал бы старые суммы поверх
 * новых записей. Поэтому рядом со снимком лежит подпись records-signature
 * (та же bakSig(), что у напоминания о копии), и кнопка предлагается,
 * только пока подпись сходится. Разошлась — кнопки нет, и врать не о чем.
 *
 * ЧТО ИМЕННО ЗАПОМИНАЕТСЯ: только то, что пересчёт трогает — цена товара,
 * цена и итог каждой партии, цена выдачи, сумма платежа. Не весь документ:
 * localStorage держит около 4.9 М символов на всё, и удваивать документ ради
 * отката было бы плохой сделкой.
 *
 * ЧЕГО ЗДЕСЬ НЕТ. Режим «переименовать» снимка не пишет: он не меняет ни
 * одной суммы, и возвращать нечего — база меняется обратно тем же
 * переключателем. Многошаговой истории тоже нет: это был бы журнал правок
 * (R16), а не откат.
 * ================================================================== */

/** Снимок сумм, которых касается пересчёт. Только чтение state. */
function baseUndoSnap(from, rates){
  return {
    at: new Date().toISOString(),
    from: from,
    rates: JSON.parse(JSON.stringify(rates)),
    sig: '',                                   /* ставится после пересчёта */
    /* ++++++ PRODUCT SNAPS ++++++ v14: снимок товара и снимок каждой партии
       возвращаются из ЗАПИСАННОГО — по той же причине, по которой R32
       записала снимки выдач и оплат. */
    products: state.products.map(function(p){
      return { id: p.id, unitPriceCents: p.unitPriceCents,
               snap: p.rateSnap ? JSON.parse(JSON.stringify(p.rateSnap)) : null,
               batches: (p.batches || []).map(function(bt){
                 return { costCents: bt.costCents, totalCostCents: bt.totalCostCents,
                          snap: bt.rateSnap ? JSON.parse(JSON.stringify(bt.rateSnap)) : null };
               }) };
    }),
    /* ++++++ BASE SNAPS ++++++ R32. Снимок курсов записи тоже возвращается:
       перевод в новую базу и обратно — деление и умножение на одно и то же
       число, и в двоичной дроби это не всегда та же величина. R9 обещает
       ТОЧНЫЙ возврат, а точный — значит из записанного, а не из вычисленного. */
    transactions: state.transactions.map(function(t){
      return { id: t.id, unitPriceCents: t.unitPriceCents,
               snap: t.rateSnap ? JSON.parse(JSON.stringify(t.rateSnap)) : null };
    }),
    payments: state.payments.map(function(y){
      return { id: y.id, amountCents: y.amountCents,
               snap: y.rateSnap ? JSON.parse(JSON.stringify(y.rateSnap)) : null };
    }),
    /* ++++++ EXPENSES ++++++ пересчёт трогает и расходы — значит откат
       обязан их вернуть, и вернуть ИЗ ЗАПИСАННОГО: деление и умножение на
       одно и то же число в двоичной дроби не всегда дают ту же величину, а
       R9 обещает ТОЧНЫЙ возврат. Снимок курсов возвращается вместе с
       суммой, по той же причине. */
    expenses: state.expenses.map(function(x){
      return { id: x.id, amountCents: x.amountCents,
               snap: x.rateSnap ? JSON.parse(JSON.stringify(x.rateSnap)) : null };
    })
  };
}
/** Есть ли что возвращать И точен ли ещё возврат. */
function baseUndoCan(){
  var u = state.settings.baseUndo;
  return !!(u && u.sig && u.sig === bakSig());
}
/** Вернуть суммы, базу и курсы. Читает снимок по id: запись, которой уже
 *  нет, просто пропускается — но подпись это и так не пропустила бы. */
function baseUndoApply(){
  var u = state.settings.baseUndo;
  if (!baseUndoCan()) return false;
  var byId = {};
  u.products.forEach(function(s){ byId[s.id] = s; });
  state.products.forEach(function(p){
    var s = own(byId, p.id) ? byId[p.id] : null;
    if (!s) return;
    p.unitPriceCents = s.unitPriceCents;
    /* ++++++ PRODUCT SNAPS ++++++ ключ «snap» появился вместе с v14, поэтому
       читается через own(): снимок, снятый прежней сборкой, его не несёт —
       и тогда трогать нечего. То же, что делают ветки выдач и оплат ниже.
       Отсутствие снимка возвращается УДАЛЕНИЕМ ключа, а не записью null:
       ключ со значением null сдвинул бы подпись документа (bakSig). */
    if (own(s, 'snap')){ if (s.snap) p.rateSnap = s.snap; else delete p.rateSnap; }
    (p.batches || []).forEach(function(bt, i){
      if (!s.batches[i]) return;
      bt.costCents = s.batches[i].costCents;
      bt.totalCostCents = s.batches[i].totalCostCents;
      if (own(s.batches[i], 'snap')){
        if (s.batches[i].snap) bt.rateSnap = s.batches[i].snap; else delete bt.rateSnap;
      }
    });
  });
  var txId = {};
  u.transactions.forEach(function(s){ txId[s.id] = s; });
  /* ++++++ BASE SNAPS ++++++ R32. Снимок курсов возвращается из ЗАПИСАННОГО.
     Ключ `snap` появился вместе с этой задачей, поэтому читается через own():
     снимок, снятый прежней сборкой, его не несёт — и тогда трогать нечего. */
  state.transactions.forEach(function(t){
    if (!own(txId, t.id)) return;
    t.unitPriceCents = txId[t.id].unitPriceCents;
    if (own(txId[t.id], 'snap')) t.rateSnap = txId[t.id].snap;
  });
  var payId = {};
  u.payments.forEach(function(s){ payId[s.id] = s; });
  state.payments.forEach(function(y){
    if (!own(payId, y.id)) return;
    y.amountCents = payId[y.id].amountCents;
    if (own(payId[y.id], 'snap')) y.rateSnap = payId[y.id].snap;
  });
  /* ++++++ EXPENSES ++++++ ключ `expenses` появился вместе с v15: снимок,
     снятый прежней сборкой, его не несёт — и тогда возвращать нечего,
     потому что расходов в том документе не было. own() — идиома R20. */
  var expId = {};
  (u.expenses || []).forEach(function(s){ expId[s.id] = s; });
  state.expenses.forEach(function(x){
    if (!own(expId, x.id)) return;
    x.amountCents = expId[x.id].amountCents;
    if (own(expId[x.id], 'snap')) x.rateSnap = expId[x.id].snap;
  });
  /* ++++++ UNDO LOGGED ++++++ B4. Пятый писатель курса, который историю не
     звал. Он меняет и базовую валюту, и ВСЮ таблицу курсов разом, а история
     после него утверждала, что база переехала туда, где документа больше
     нет: прямой пересчёт свою запись оставил, возврат своей не добавил.

     Запись стоит ДО присваивания — область 55, и это не мелочь исполнения:
     «каким было» перестаёт быть таким в момент присваивания, и строка,
     съехавшая ниже, компилируется, рисует те же пиксели и врёт. Тот же
     порядок, что у applyBaseChange(). */
  rateLogBase(state.settings.baseCurrency, u.from, 'undo');
  state.settings.baseCurrency = u.from;
  state.settings.rates = JSON.parse(JSON.stringify(u.rates));
  state.settings.baseUndo = null;
  toast(tr('msg.baseUndone', { cur: u.from }), 'ok');
  commit();
  return true;
}
/** Строка на «Ещё → Валюты». Печатается ТОЛЬКО когда возврат ещё точен. */
function baseUndoHTML(){
  if (!baseUndoCan()) return '';
  var u = state.settings.baseUndo;
  /* Строка того же вида, что у спасённого документа: `row()` с действием.
     Ни одного нового класса — таблица стилей этой задачей не тронута. */
  return '<section class="card"><div class="t">' + tr('hdr.baseUndo') + '</div>' +
    row({ k: tr('cur.undoFrom', { cur: esc(u.from) }),
          sub: tr('cur.undoWhen', { stamp: esc(bakStamp(u.at)) }),
          sub2: tr('cur.undoOnce'),
          v: tr('cur.undoDo'), act:'base-undo' }) +
    '</section>';
}

/** Прочитать снимок из входящего документа. Кривой — ОТБРАСЫВАЕТСЯ, а не
 *  роняет документ: политика rateSnap, чтобы из-за отката резервная копия
 *  не перестала открываться (R23 не должна становиться хуже). */
/* ++++++ PRODUCT SNAPS ++++++ снимок курсов ВНУТРИ записи возврата.
 *
 * Найдено при этой задаче и починено в ней, потому что иначе она не
 * работает: baseUndoOf() пересобирала запись по именованным полям, и
 * ключа snap среди них не было. Пересчитать базу, перезагрузить страницу,
 * нажать «Вернуть суммы» — суммы возвращались, а снимки оставались в
 * покинутой базе; dcRateOf() переставала верить им всем разом, и «Сводка»
 * тихо переоценивалась по сегодняшним курсам. То самое, что закрывала R32.
 *
 * Кривой снимок ОТБРАСЫВАЕТСЯ (возвращается null), а не роняет запись
 * возврата и тем более документ — политика rateSnap, та же, что у snapOf()
 * в validate(). Ключ пишется всегда: он живёт внутри settings.baseUndo, а
 * не в записи, и в подпись документа (bakSig) не входит.
 *
 * ЧИТАЕТСЯ КЛЮЧ «snap», А НЕ «rateSnap»: внутри settings.baseUndo снимок
 * лежит под тем именем, под которым его туда положила baseUndoSnap(). */
function undoSnapOf(o){
  var s = o && o.snap;
  if (!s || typeof s !== 'object' || Array.isArray(s)) return null;
  if (typeof s.base !== 'string' || !/^[A-Za-z0-9]{1,6}$/.test(s.base)) return null;
  if (!s.rates || typeof s.rates !== 'object' || Array.isArray(s.rates)) return null;
  var out = {}, n = 0, c;
  for (c in s.rates){
    if (!own(s.rates, c)) continue;
    if (!/^[A-Za-z0-9]{1,6}$/.test(c)) continue;
    var r = s.rates[c];
    if (typeof r !== 'number' || !isFinite(r) || r <= 0) continue;
    out[c.toUpperCase()] = r; n++;
  }
  return n ? { base: s.base.toUpperCase(), rates: out } : null;
}

function baseUndoOf(v){
  if (!v || typeof v !== 'object' || Array.isArray(v)) return null;
  if (typeof v.at !== 'string' || typeof v.sig !== 'string' || !v.sig) return null;
  if (typeof v.from !== 'string' || !/^[A-Za-z0-9]{1,6}$/.test(v.from)) return null;
  if (!v.rates || typeof v.rates !== 'object' || Array.isArray(v.rates)) return null;
  var rates = {};
  var badRate = false;
  Object.keys(v.rates).forEach(function(c){
    if (!own(v.rates, c)) return;
    var r = v.rates[c];
    if (!/^[A-Za-z0-9]{1,6}$/.test(c) || typeof r !== 'number' || !isFinite(r) || r <= 0){
      badRate = true; return;
    }
    rates[c.toUpperCase()] = r;
  });
  if (badRate) return null;
  var lists = { products: [], transactions: [], payments: [] };
  var bad = false;
  ['products', 'transactions', 'payments'].forEach(function(kind){
    if (!Array.isArray(v[kind])){ bad = true; return; }
    v[kind].forEach(function(o){
      if (bad || !o || typeof o !== 'object' || typeof o.id !== 'string'){ bad = true; return; }
      if (kind === 'payments'){
        if (!isInt(o.amountCents) || o.amountCents < 0){ bad = true; return; }
        lists[kind].push({ id: o.id, amountCents: o.amountCents, snap: undoSnapOf(o) });
        return;
      }
      if (!isInt(o.unitPriceCents) || o.unitPriceCents < 0){ bad = true; return; }
      if (kind === 'transactions'){
        lists[kind].push({ id: o.id, unitPriceCents: o.unitPriceCents, snap: undoSnapOf(o) });
        return;
      }
      if (!Array.isArray(o.batches)){ bad = true; return; }
      var bs = [];
      o.batches.forEach(function(b){
        if (bad || !b || typeof b !== 'object' ||
            !isInt(b.costCents) || b.costCents < 0 ||
            !isInt(b.totalCostCents) || b.totalCostCents < 0){ bad = true; return; }
        bs.push({ costCents: b.costCents, totalCostCents: b.totalCostCents, snap: undoSnapOf(b) });
      });
      lists[kind].push({ id: o.id, unitPriceCents: o.unitPriceCents, snap: undoSnapOf(o), batches: bs });
    });
  });
  /* ++++++ EXPENSES ++++++ читается ОТДЕЛЬНО и мягко. Снимок, записанный
     сборкой до v15, ключа не несёт — и это не порча документа, а документ,
     в котором расходов не было: отбросить из-за этого весь снимок значило
     бы отнять «Вернуть суммы» у каждого, кто просто обновил программу.
     Кривой ключ — другое дело: снимок осмыслен только целиком (тем он и
     отличается от истории курсов), и тогда отбрасывается весь. */
  var exps = [];
  if (v.expenses !== undefined){
    if (!Array.isArray(v.expenses)) bad = true;
    else v.expenses.forEach(function(o){
      if (bad || !o || typeof o !== 'object' || typeof o.id !== 'string'){ bad = true; return; }
      if (!isInt(o.amountCents) || o.amountCents < 0){ bad = true; return; }
      exps.push({ id: o.id, amountCents: o.amountCents, snap: undoSnapOf(o) });
    });
  }
  if (bad) return null;
  return { at: v.at, from: v.from.toUpperCase(), rates: rates, sig: v.sig,
           products: lists.products, transactions: lists.transactions,
           payments: lists.payments, expenses: exps };
}
/* ============================================== ++++++ RATE LOG ++++++ ==
 * R16, вторая половина: у правки курса появляется след.
 *
 * ЧТО БЫЛО. Правка курса не трогает ни одной хранимой суммы — и меняет
 * КАЖДУЮ пересчитанную величину на экране, кроме «Сводки», которая читает
 * курсы, записанные вместе с записью (v10). С 2026-08-23 обе половины этого
 * сказаны словами на «Ещё → Валюты». Чего не было — следа: каким курс был.
 *
 * РЕШЕНИЯ ВЛАДЕЛЬЦА, 2026-08-24:
 *   1. записывать ВСЁ, что меняет курс, — правку, добавление, удаление и
 *      смену базовой валюты (она пересчитывает все курсы разом);
 *   2. хранить БЕЗ ПРЕДЕЛА.
 *
 * ПРАВИЛО:
 *
 *   ЗАПИСЬ ДЕЛАЕТСЯ ТАМ ЖЕ, ГДЕ МЕНЯЕТСЯ КУРС, И ПРЕЖНЕЕ ЗНАЧЕНИЕ
 *   ПЕРЕДАЁТСЯ В НЕЁ, А НЕ ЧИТАЕТСЯ ПОТОМ.
 *
 * Четыре места пишут курсы, и ровно четыре зовут `rateLogPush()` — каждое
 * передаёт то, что было, само, до присваивания. Читать «прежнее» после
 * записи было бы порядком, который компилируется и врёт (та же порода
 * дефекта, что «сохрани, ПОТОМ скажи» у R6).
 *
 * КАЖДАЯ ЗАПИСЬ НЕСЁТ СВОЮ БАЗУ. Курс — это «1 USD = 3.6725 AED», и без
 * `base` строка «USD 3.6725 → 3.70» после смены базовой валюты стала бы
 * читаться как другая величина. База пишется в запись и печатается рядом.
 *
 * ПРЕДЕЛА НЕТ У ХРАНЕНИЯ, НО ЕСТЬ У ПОКАЗА. Владелец выбрал хранить всё;
 * пятьсот строк на экране — вопрос не хранения, а чтения, и решается он тем
 * же приёмом, что у `COST_NAMES_SHOWN`: список — это «куда смотреть», а не
 * отчёт. Показываются последние `RATE_LOG_SHOWN`, и сказано, сколько всего.
 * ================================================================== */

/** Сколько записей показывать. Хранятся ВСЕ — это про экран. */
var RATE_LOG_SHOWN = 20;

/** Дописать событие. Единственный писатель истории. */
function rateLogPush(e){
  if (!Array.isArray(state.settings.rateLog)) state.settings.rateLog = [];
  e.at = new Date().toISOString();
  e.base = state.settings.baseCurrency;
  state.settings.rateLog.push(e);
}
/** Четыре вида события. Мест, где курс меняется, ПЯТЬ: четыре прямых —
 *  правка, добавление, удаление, смена базы — и пятое, возврат сумм
 *  (baseUndoApply), который меняет базу и всю таблицу разом и до 2026-08-24
 *  историю не звал вовсе (находка B4). Он записывается как смена базы в
 *  режиме 'undo'. */
function rateLogEdit(cur, was, now){ rateLogPush({ k:'edit', cur:cur, was:was, now:now }); }
function rateLogAdd(cur, now){ rateLogPush({ k:'add', cur:cur, now:now }); }
function rateLogDel(cur, was){ rateLogPush({ k:'del', cur:cur, was:was }); }
/** Смена базовой: `cur` — новая база, `from` — прежняя. Пишется ДО того,
 *  как база сменится, поэтому `base` в записи — ещё прежняя, и это верно:
 *  курсы, о которых идёт речь, были выражены именно в ней. */
function rateLogBase(from, to, mode){ rateLogPush({ k:'base', cur:to, from:from, mode:mode }); }

/** Одна строка истории, готовым текстом. */
function rateLogLine(e){
  var v = { cur: esc(e.cur), base: esc(e.base || '') };
  if (e.k === 'edit'){ v.was = esc(trimNum(e.was)); v.now = esc(trimNum(e.now));
                       return tr('cur.logEdit', v); }
  if (e.k === 'add'){ v.now = esc(trimNum(e.now)); return tr('cur.logAdd', v); }
  if (e.k === 'del'){ v.was = esc(trimNum(e.was)); return tr('cur.logDel', v); }
  v.from = esc(e.from || '');
  /* ++++++ UNDO LOGGED ++++++ B4. Ветка стоит ПЕРЕД двучленом: без неё
     'undo' попадал бы в 'relabel' и история говорила бы «переименовано» о
     возврате сумм. */
  if (e.mode === 'undo') return tr('cur.logBaseUndo', v);
  return tr(e.mode === 'convert' ? 'cur.logBaseConv' : 'cur.logBaseRelab', v);
}
/** Карточка на «Ещё → Валюты». Печатается только когда есть что показать. */
function rateLogHTML(){
  var log = Array.isArray(state.settings.rateLog) ? state.settings.rateLog : [];
  if (!log.length) return '';
  var shown = log.slice(-RATE_LOG_SHOWN).reverse();   /* новые сверху */
  var rows = '';
  shown.forEach(function(e){
    rows += row({ k: rateLogLine(e), sub: esc(bakStamp(e.at)) });
  });
  var more = log.length > shown.length
    ? '<div class="body">' + tr('cur.logMore', { n: nq(log.length, 'record'),
        shown: String(shown.length) }) + '</div>' : '';
  /* ++++++ RATELOG FOLD ++++++ строка-заголовок вместо `.t`: она нажимается,
     и `row()` сам печатает стрелку, когда у строки есть действие. Счёт
     записей стоит в её правой части — тем же `nq()`, которым склоняется
     подпись под списком: двух способов сказать «8 записей» не заводится.
     Строки внутри — те же, слово в слово. */
  return '<section class="card fold' + (ui.rateLogOpen ? ' on' : '') + '" id="rateLogCard">' +
         row({ k: tr('hdr.rateLog'), v: nq(log.length, 'record'), act:'ratelog' }) +
         '<div class="foldbody">' + rows + more + '</div></section>';
}
/** Раскрыть или свернуть историю курсов.
 *
 *  Трогает ОДИН узел и ОДИН его атрибут — не `render()`. На этом экране
 *  стоят два поля ввода курсов, и полная перерисовка вырвала бы из них
 *  курсор (хрупкое место 12, то же правило, что у live(), liveSearch(),
 *  dcPaint() и remPaint()). Высоту и поворот стрелки везёт таблица стилей,
 *  поэтому ни таймера, ни снятия узла здесь нет. */
function rateLogToggle(){
  ui.rateLogOpen = !ui.rateLogOpen;
  var n = $('rateLogCard');
  if (n) n.className = 'card fold' + (ui.rateLogOpen ? ' on' : '');
}
/** Прочитать историю из входящего документа. Кривая ЗАПИСЬ отбрасывается,
 *  а не вся история: это список независимых фактов, и терять их все из-за
 *  одного испорченного было бы хуже, чем потерять один. Тем и отличается от
 *  `baseUndo`, который снимок целиком и осмыслен только целиком. */
function rateLogOf(v){
  if (!Array.isArray(v)) return [];
  var out = [];
  var num = function(x){ return typeof x === 'number' && isFinite(x) && x > 0; };
  var code = function(x){ return typeof x === 'string' && /^[A-Za-z0-9]{1,6}$/.test(x); };
  v.forEach(function(e){
    if (!e || typeof e !== 'object' || Array.isArray(e)) return;
    if (typeof e.at !== 'string' || !e.at) return;
    if (!code(e.cur)) return;
    var o = { at: e.at, k: e.k, cur: e.cur.toUpperCase() };
    if (code(e.base)) o.base = e.base.toUpperCase();
    if (e.k === 'edit'){ if (!num(e.was) || !num(e.now)) return; o.was = e.was; o.now = e.now; }
    else if (e.k === 'add'){ if (!num(e.now)) return; o.now = e.now; }
    else if (e.k === 'del'){ if (!num(e.was)) return; o.was = e.was; }
    /* ++++++ UNDO LOGGED ++++++ B4. Третий режим читается наравне с двумя.
       Без этой строки запись пережила бы сохранение, а при следующем чтении
       документа её режим нормализовался бы в 'relabel' — и та же история
       начала бы врать по-другому. Политика прежняя: НЕИЗВЕСТНЫЙ режим
       по-прежнему читается как 'relabel', а не роняет запись. */
    else if (e.k === 'base'){ if (!code(e.from)) return; o.from = e.from.toUpperCase();
                              o.mode = (e.mode === 'convert' || e.mode === 'undo')
                                       ? e.mode : 'relabel'; }
    else return;
    out.push(o);
  });
  return out;
}
function applyBaseChange(target, convertAmounts){
  var old = state.settings.baseCurrency;
  var r = rateOf(target);
  if (!r) return;
  /* rates mean "1 c = rates[c] base". Re-express them in the new base: 1 c = rates[c]/r target. */
  var newRates = {};
  Object.keys(state.settings.rates).forEach(function(c){
    if (c === target) return;
    newRates[c] = state.settings.rates[c] / r;
  });
  newRates[old] = 1 / r;                 // old base expressed in the new base
  /* ++++++ BASE UNDO ++++++ R9. Снимок СНИМАЕТСЯ ДО пересчёта — после него
     прежних чисел уже нет нигде. Только в режиме «пересчитать»:
     «переименовать» не меняет ни одной суммы, и возвращать там нечего. */
  var undo = convertAmounts ? baseUndoSnap(old, state.settings.rates) : null;
  if (convertAmounts){
    var k = 1 / r;                       // 1 old base = 1/r new base
    state.products.forEach(function(p){
      p.unitPriceCents = Math.round(p.unitPriceCents * k);
      (p.batches || []).forEach(function(bt){
        bt.costCents = Math.round(bt.costCents * k);
        bt.totalCostCents = Math.round(bt.totalCostCents * k);
        /* ++++++ BASE CHANGE ++++++ R8. Здесь стояло `bt.inv = null` с
           пояснением «the invoice breakdown was in the old base» — и оно
           неверно: разбивка накладной хранит СВОЮ валюту (`inv.cur`) и
           печатает её рядом с числом. Это запись о том, что выставил
           поставщик: 190.00 AED за коробку остаются 190.00 AED, как ни
           переименовывай базу и как ни пересчитывай суммы.

           Причём уничтожалась она именно в том режиме, где реальная
           величина СОХРАНЯЕТСЯ и накладная по-прежнему её объясняет, —
           а в «переименовать», где связь как раз рвётся, оставалась.
           Теперь режимы одинаковы: ни один не трогает эту запись.
           В деньгах не меняется ничего — inv не участвует ни в одном
           вычислении, это провенанс, как entryCur/entryMinor. */
      });
    });
    state.transactions.forEach(function(t){ t.unitPriceCents = Math.round(t.unitPriceCents * k); });
    state.payments.forEach(function(p){ p.amountCents = Math.round(p.amountCents * k); });
    /* ++++++ EXPENSES ++++++ сумма расхода хранится в базовой валюте, как
       сумма платежа, — и «пересчитать» обязано её пересчитать тем же
       множителем. Не сделать этого значило бы оставить 367.00 AED числом
       367.00, которое назавтра читается как 367.00 USD. Провенанс
       (entryCur/entryMinor) не трогается: он записывает, что владелец
       набрал 100 USD, и смена базы этого не отменяет — правило R8. */
    state.expenses.forEach(function(x){ x.amountCents = Math.round(x.amountCents * k); });
  }
  /* ++++++ RATE LOG ++++++ пишется ДО смены базы: `base` в записи — ещё
     прежняя, и это верно, ведь курсы, о которых идёт речь, были выражены
     именно в ней. */
  rateLogBase(old, target, convertAmounts ? 'convert' : 'relabel');
  state.settings.baseCurrency = target;
  state.settings.rates = newRates;
  /* ++++++ AED SNAPS ++++++ Снимки переезжают ТОЛЬКО при «пересчитать».
     R32 переводил их в обоих режимах, и для «переименовать» это было
     ошибкой: там меняется не единица хранения, а то, ЧЕМ объявлены сами
     числа, — исторический вопрос «сколько это стоило тогда» теряет предмет
     вместе с прежним смыслом суммы. Снимки остаются как есть, их база
     перестаёт совпадать с нынешней, и dcRateOf() честно берёт текущий курс. */
  if (convertAmounts) snapMoveAll(target, old, r);
  /* ++++++ BASE UNDO ++++++ подпись берётся ПОСЛЕ пересчёта: она описывает
     записи, какими они стали, и расходится с первым же изменением — тогда
     кнопка исчезает, потому что возврат перестал бы быть возвратом. */
  if (undo){ undo.sig = bakSig(); state.settings.baseUndo = undo; }
  if (state.settings.displayCurrency !== '*' && !rateOf(state.settings.displayCurrency))
    state.settings.displayCurrency = target;
  toast(tr('msg.baseChanged', {cur: target,
    how: convertAmounts ? tr('msg.baseConv') : tr('msg.baseRelab')}),'ok');
  commit();
}
/* ++++++ ATTACHMENTS ++++++ one backup still restores the whole app (A4),
   so the files travel inside it, base64-encoded — which costs a third more
   bytes than the files themselves. Reading them is asynchronous, so the
   function splits in two: exportBackup() gathers, exportWrite() writes.
   A big backup asks first, because "nothing happened for eight seconds" is
   indistinguishable from a broken button. */
function exportBackup(){
  /* no files: the old, synchronous path, unchanged and instant */
  if (!attOn() || !attCount()){ exportWrite(null); return; }
  attExportList(function(err, list){
    if (err){ banner('export','err', tr('att.expFail', {err: esc(String(err))})); return; }
    if (!list.length){ exportWrite(list); return; }
    var bytes = 0;
    list.forEach(function(a){ bytes += a.data.length; });
    if (bytes < ATT_WARN){ exportWrite(list); return; }
    confirmBox(tr('att.expTitle'),
      tr('att.expBody', {n: list.length, size: fmtBytes(bytes)}),
      tr('att.expOk'), false).then(function(ok){ if (ok) exportWrite(list); });
  });
}
/* The file is assembled from Blob PARTS, never from one JavaScript string.
   A string in this engine tops out around 512 M characters, and forty 15 MB
   invoices are 800 M characters of base64: JSON.stringify() would throw
   RangeError before a Blob ever existed, on the user's real data. Each record
   is stringified on its own and the punctuation is written by hand, so the
   result is the same JSON and nothing is ever held whole in memory. */
/* ++++++ RESCUE ++++++ ЕДИНСТВЕННОЕ место в приложении, где файл отдают
 * браузеру. Раньше эти шесть строк стояли внутри exportWrite(); теперь их
 * зовут двое — выгрузка копии и выгрузка нечитаемого документа, — и место
 * по-прежнему одно. Это не косметика: правило «один путь выгрузки» держит
 * честность даты последней копии (bakMark() ставится только на своём пути,
 * и только после того, как ссылка нажалась без исключения).
 *
 * Как определяется успех, и почему иначе нельзя. Страница на file:// не
 * узнаёт, чем кончилось системное окно сохранения: у <a download> нет ни
 * события успеха, ни события ошибки. Самый сильный доступный признак —
 * «приложение собрало Blob, отдало ссылку браузеру и нажатие прошло без
 * исключения». Всё, что может отказать (Blob не собрался — RangeError на
 * очень большой копии; createObjectURL отказал; click() бросил), означает
 * одно: файла нет.
 */
function downloadFile(name, parts, mime){
  var blob, url, a;
  try {
    blob = new Blob(parts, {type: mime || 'application/json'});
    url = URL.createObjectURL(blob);
    a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch(e){
    if (a && a.parentNode) a.parentNode.removeChild(a);
    if (url){ try { URL.revokeObjectURL(url); } catch(e2){} }
    return { ok:false, err: (e && e.name ? e.name : String(e)) };
  }
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  return { ok:true };
}

function exportWrite(list){
  /* Every key of `state`, whatever they are today: naming the six by hand
     would silently drop the seventh the day one is added. Only the two markers
     are written explicitly, exactly as the old one-string version wrote them. */
  var parts = ['{\n"app": "goods-tracker",\n"exportedAt": ' +
    JSON.stringify(new Date().toISOString())];
  var i, chars = 0;
  Object.keys(state).forEach(function(k){
    parts.push(',\n' + JSON.stringify(k) + ': ' + JSON.stringify(state[k]));
  });
  if (list && list.length){
    parts.push(',\n"attachments": [\n');
    for (i = 0; i < list.length; i++){
      if (i) parts.push(',\n');
      parts.push(JSON.stringify(list[i]));
    }
    parts.push('\n]');
  }
  parts.push('\n}\n');
  for (i = 0; i < parts.length; i++) chars += parts[i].length;
  /* ++++++ BACKUP REMINDER ++++++ отсюда и до a.remove() — единственное
     место в приложении, где файл действительно отдают браузеру. Всё, что
     здесь может отказать (Blob не собрался — RangeError на очень большой
     копии; createObjectURL отказал; click() бросил), означает одно: файла
     нет. Двигать дату последней копии в этом случае нельзя, поэтому
     bakMark() стоит ПОСЛЕ click(), а не перед ним.

     Как определяется успех, и почему иначе нельзя. Страница на file://
     не узнаёт, чем кончилось системное окно сохранения: у <a download>
     нет ни события успеха, ни события ошибки. Самый сильный доступный
     здесь признак — «приложение собрало Blob, отдало ссылку браузеру и
     нажатие прошло без исключения». Это ровно тот же признак, на котором
     уже держится сообщение «Копия выгружена» строкой ниже: новой
     неточности не появляется, появляется запись о ней. */
  /* ++++++ RESCUE ++++++ передача файла браузеру уехала в downloadFile():
     её зовут двое — эта выгрузка и выгрузка нечитаемого документа, — а
     место, где создаётся <a download>, по-прежнему одно. Порядок здесь не
     изменился ни на строку: сначала файл, и только потом отметка. */
  var res = downloadFile('goods-tracker-backup-' + todayISO() + '.json', parts, 'application/json');
  if (!res.ok){
    banner('export','err', tr('bk.failed', {err: esc(res.err)}));
    return;                     /* дата и состав последней копии не тронуты */
  }
  /* файл ушёл — только теперь отметка о копии, и полоса снимается сама */
  bakMark();
  toast(list && list.length
    ? tr('att.expDone', {n: list.length, size: fmtBytes(chars)})
    : tr('msg.exported'), 'ok');
}

/* ++++++ ATTACHMENTS ++++++ the order matters, and it is this one:
       validate -> confirm -> PUT the files -> swap the document -> save ->
       sweep what nothing references any more

   The files are written first and nothing is cleared. Clearing first is atomic
   inside IndexedDB but the wrong atom: save() can still fail afterwards, and
   localStorage would then keep the OLD document while the store held only the
   NEW files — every reference in it dangling, with no way back. Writing first
   and sweeping last makes the worst case "a few unreferenced blobs", which the
   sweep collects. Nothing is ever deleted before the document that stopped
   naming it is safely on disk. */
function finishImport(d, atts, res){
  /* ++++++ RESCUE ++++++ владелец сам подал документ — это и есть
     решение о судьбе прежнего, и запись больше не нужно держать. */
  rescAllow();
  var write = [];
  if (attOn() && atts){
    atts.forEach(function(a){
      var blob;
      try { blob = b64ToBlob(a.data, a.mime); }
      catch(e){ res.attDropped++; return; }        /* unreadable base64: skip it */
      write.push({ meta: { id:a.id, kind:a.kind, productId:a.productId, name:a.name,
        mime:a.mime, size:a.size || blob.size, addedAt:a.addedAt, thumb:a.thumb },
        blob: blob });
    });
  }
  function apply(){
    d.settings.lang = getLang();          // keep the language you are looking at
    state = d;
    ui.edit = { product:null, person:null, tx:null, pay:null };
    ui.txQuery = ui.payQuery = ui.peopleQuery = ui.sumPeopleQuery = ui.sumStockQuery = '';
    ui.peopleStatus = ui.sumStatus = '';
    ui.detail = null; ui.report = { productId:'', from:'', to:'' }; ui.reportPreset = 'all';
    ui.attErr = '';
    stagedFreeAll();
    resetForms();
    removeBanner('import');
    /* ++++++ BACKUP REMINDER ++++++ документ пришёл из файла, и был ли
       ИМЕННО ЭТОТ файл его копией — неизвестно: validate() мог поднять
       схему, поправить даты и пересобрать партии, а сам файл мог быть
       годовалым. Единственное честное состояние здесь — «копии этих
       данных ещё не делали» (краевой случай 9). */
    bakForget();
    ui.bakHidden = false;
    var saved = save();
    render();
    toast(tr('msg.impDone'),'ok');
    /* what was silently dropped is said out loud, never swallowed */
    var lost = [];
    /* ++++++ PARTIAL IMPORT ++++++ то же, что сказало подтверждение ДО
       выбора: диалог исчез, а полоса остаётся на экране. */
    if (res.dropped && res.dropped.length) lost.push(dropLine(res.dropped));
    if (res.attDropped) lost.push(tr('att.impDropped', {n: res.attDropped}));
    if (res.refDropped) lost.push(tr('att.impRefDropped', {n: res.refDropped}));
    /* ++++++ COST HISTORY ++++++ R5. Ровно то, о чём импорт молчал. */
    if (res.costGone && res.costGone.length) lost.push(costLine(res.costGone));
    /* ++++++ COST RESCUE ++++++ то же и в отчёт импорта */
    if (res.costFilled && res.costFilled.length) lost.push(costFixLine(res.costFilled, 'fixed'));
    if (res.costCut && res.costCut.length) lost.push(costFixLine(res.costCut, 'cut'));
    /* ++++++ VALIDATE READS ++++++ B1. Та же фраза; файл обратно не
       предлагается — он и так лежит у владельца нетронутым (область 40). */
    if (res.costDropped && res.costDropped.length) lost.push(costDropLine(res.costDropped));
    /* ++++++ DATES SAID ++++++ R10. Ровно то, о чём импорт молчал. */
    if (res.dateGuessed) lost.push(dateLine(res.dateGuessed));
    if (lost.length) banner('import-lost','warn', lost.join('<br>'));
    /* only now: the previous owner's files, if the new document is on disk */
    if (saved) attSweep(true, function(){ render(); });
  }
  if (!attOn()){ apply(); return; }
  attImportPut(write, function(err){
    if (err){ banner('import','err', tr('att.impFail', {err: esc(String(err))})); return; }
    apply();
  });
}

/* ++++++ IMPORT SAYS ++++++ R24: маркеры экспорта пишутся и не читаются.
 *
 * `exportBackup()` кладёт в файл два поля — `app: 'goods-tracker'` и
 * `exportedAt` — и `validate()` их выбрасывает. Находка записана как «любой
 * JSON с правдоподобным schemaVersion принимается за копию».
 *
 * ОТКАЗЫВАТЬ БЫЛО БЫ ХУЖЕ. Копии, сделанные до того, как маркеры появились,
 * их не несут; документ, собранный руками для переноса, тоже. Отказ превратил
 * бы честный файл в непринимаемый ради опознавательного знака, который ничего
 * не гарантирует: подделать `app: 'goods-tracker'` — одна строка.
 *
 * ЗАТО МОЛЧАНИЕ СТОИЛО ДОРОГО, И НЕ ТАМ, ГДЕ ОПИСАНО. `exportedAt` знает,
 * КОГДА файл сделан, — и это единственное, что отличает вчерашнюю копию от
 * прошлогодней. Импорт заменяет всё и отменить его нельзя; владелец
 * подтверждал замену, не зная возраста того, чем заменяет. Восстановить
 * позапрошлую копию поверх сегодняшней работы — потеря, которую этот файл
 * закрывает целиком: цифры в диалоге были о СОДЕРЖИМОМ, а не о ВОЗРАСТЕ.
 *
 * ПОЭТОМУ: диалог называет возраст копии — и говорит, когда файл не назвался
 * копией вовсе. Ни отказа, ни нового экрана: одна строка в подтверждении,
 * которое уже есть.
 *
 * НИЧЕГО НЕ ВХОДИТ В ДОКУМЕНТ. Маркеры читаются из `parsed` прямо в
 * `importBackup()` — `validate()` не тронут и по-прежнему их выбрасывает.
 * Возраст считается `bakDays()`, а дата печатается `bakStamp()` — теми же
 * двумя функциями, что напоминание о копии, и по той же причине: второй
 * способ сказать «12 дней назад» разошёлся бы с первым.
 */

/* Маркеры, как они лежат в файле. Ничего не додумывает. */
function impMarkOf(v){
  if (!v || typeof v !== 'object' || Array.isArray(v)) return null;
  return { app: typeof v.app === 'string' ? v.app : '',
           at:  typeof v.exportedAt === 'string' ? v.exportedAt : '' };
}

/* Одна строка о происхождении файла. Всегда что-то говорит. */
function impStampText(v){
  var m = impMarkOf(v);
  if (!m || m.app !== 'goods-tracker') return tr('imp.noMark');
  if (!m.at || bakStamp(m.at) === '—') return tr('imp.markNoDate');
  var d = bakDays(m.at);
  return tr('imp.mark', { when: bakStamp(m.at),
    ago: d === 0 ? tr('imp.today') : tr('imp.ago', {n: nq(d, 'day')}) });
}

/* Абзац для подтверждения. Отдельная функция, потому что `dlg.impBody`
   остаётся байт в байт прежним: новая фраза стоит РЯДОМ, а не вместо.
   Класса нет нарочно: класс, которого не определяет таблица стилей, — это
   R33 в миниатюре. Абзац берёт оформление диалога, как соседние. */
function impStampHTML(v){
  return '<p>' + esc(impStampText(v)) + '</p>';
}
function importBackup(file){
  var reader = new FileReader();
  reader.onerror = function(){ banner('import','err', tr('imp.readFail')); };
  reader.onload = function(){
    var parsed;
    try{ parsed = JSON.parse(String(reader.result)); }
    catch(e){
      banner('import','err', tr('imp.badJson'));
      return;
    }
    var res = validate(parsed);
    if (!res.ok){
      banner('import','err', tr('imp.failed', {err: esc(res.error)}));
      return;
    }
    /* ++++++ ATTACHMENTS ++++++ the dialog says how many files are coming, and
       says plainly when this browser cannot take them. */
    var d = res.data, atts = res.attachments;
    var extra = '';
    if (atts && atts.length){
      extra = attOn() ? tr('att.impFiles', {n: atts.length})
                      : tr('att.impNoStore', {n: atts.length});
    }
    /* ++++++ IMPORT SAYS ++++++ возраст копии — ПЕРЕД цифрами о содержимом:
       импорт заменяет всё и отменить его нельзя, а вчерашняя копия и
       прошлогодняя выглядят в диалоге одинаково. Читается из `parsed`,
       а не из `d`: validate() маркеры выбрасывает и остаётся нетронут. */
    /* ++++++ PARTIAL IMPORT ++++++ цена выбора называется ДО выбора: импорт
       заменяет всё и отменить его нельзя, а сколько записей не доедет —
       известно уже сейчас. */
    confirmBox(tr('dlg.impTitle'),
      impStampHTML(parsed) +
      (res.dropped && res.dropped.length ? '<p>' + dropLine(res.dropped) + '</p>' : '') +
      tr('dlg.impBody', {prod: d.products.length, ppl: d.people.length,
                         tx: d.transactions.length, pay: d.payments.length}) +
      (d.returns.length ? tr('dlg.impRet', {n: d.returns.length}) : '') +
      /* ++++++ EXPENSES ++++++ говорится только когда есть о чём: копия без
         расходов печатает диалог байт в байт прежний. */
      (d.expenses.length ? tr('dlg.impExp', {n: d.expenses.length}) : '') + extra,
      tr('dlg.impOk'), true).then(function(ok){
        if (!ok){ toast(tr('msg.impCancelled'),'info'); return; }
        finishImport(d, atts, res);
      });

  };
  reader.readAsText(file);
}

/* ==================================================================
 * Интерфейс «Сегменты» — один язык оформления на все шесть вкладок.
 *
 * Что здесь есть и чего здесь нет:
 *   • здесь только ОТОБРАЖЕНИЕ и формы. Ни одной строки арифметики:
 *     productStats(), personStats(), statusOf(), remainingFor(),
 *     computeReport(), grandTotals(), reconcileBatches() выше по файлу

/** та же память по человеку, что была в форме выдачи: его последняя валюта */
function lastTxCurFor(personId){
  var best = null;
  actTx().forEach(function(t){
    if (t.personId !== personId || !t.entryCur || rateOf(t.entryCur) === null) return;
    if (!best || (t.createdAt || '') > (best.createdAt || '')) best = t;
  });
  if (best) return best.entryCur;
  var last = state.settings.lastTxCur;
  if (last && rateOf(last) !== null) return last;
  return state.settings.baseCurrency;
}

/** один вид номера: +992 92 773 3331. Девять цифр — местный номер. */
function normPhone(raw){
  var d = String(raw || '').replace(/\D/g,'');
  if (!d) return '';
  if (d.length === 9) d = '992' + d;
  if (d.length === 12 && d.slice(0,3) === '992'){
    return '+992 ' + d.slice(3,5) + ' ' + d.slice(5,8) + ' ' + d.slice(8);
  }

}

/* ++++++ NAME TWINS ++++++ R29: у людей нет проверки на тёзок.
 *
 * У ТОВАРОВ имя уникально, и это правильно: два товара с одним названием —
 * это один товар, введённый дважды, и `findProductByName()` сливает их в одну
 * поставку. У ЛЮДЕЙ такого правила быть НЕ МОЖЕТ: два покупателя по имени
 * «Азиз» — совершенно обычное дело, и отказать второму значило бы заставить
 * владельца врать в имени. Поэтому здесь предупреждение, а не отказ.
 *
 * НО ВРЕД БЫЛ НЕ В ОТСУТСТВИИ ЗАПРЕТА, а в том, что тёзок негде отличить.
 * Списки печатают под именем контакты (`personSub`), а два `<select>` — в
 * форме выдачи и в форме оплаты — печатали ГОЛОЕ ИМЯ:
 *
 *     state.people.forEach(function(p){ hItems.push([p.id, p.name]); });
 *
 * Два «Азиза» там неразличимы, и товар уходит не тому — с деньгами, долгом и
 * статусом. Это и есть настоящий R29, и он больше, чем пропущенный запрет.
 *
 * ДВЕ ПОЛОВИНЫ, И ВТОРАЯ ВАЖНЕЕ:
 *   1. при вводе — сказать, что такое имя уже есть, и не мешать сохранить;
 *   2. при выборе — дать тёзкам примету, и ТОЛЬКО тёзкам.
 *
 * ИМЯ СРАВНИВАЕТСЯ ЧЕРЕЗ `normQ()` — единственный нормализатор в файле:
 * регистр, «ё → е», схлопнутые пробелы. «азиз» и «Азиз » — один человек по
 * написанию, и предупредить надо в обоих случаях. Заводить второй
 * нормализатор было бы ошибкой того же рода, что второе округление.
 *
 * ПРИМЕТА — это `personSub()`, та же строка, что списки печатают под именем.
 * Своей строки у выбора нет нарочно: два способа сказать «это тот самый Азиз»
 * разошлись бы при первой же правке.
 */
var TWIN_SHOWN = 3;   /* сколько тёзок назвать; остальные — «и ещё N» */

/* Ключ имени. Пустое имя тёзкой никому не приходится. */
function twinKey(name){ return normQ(name); }

/* Люди с тем же именем, кроме редактируемого. */
function personTwins(name, exceptId){
  var k = twinKey(name), out = [];
  if (!k) return out;
  actPeople().forEach(function(p){
    if (exceptId && p.id === exceptId) return;
    if (twinKey(p.name) === k) out.push(p);
  });
  return out;
}

/* Какие имена в документе принадлежат больше чем одному человеку.
   Считается один раз на построение формы, а не на каждого человека. */
function twinKeys(){
  var seen = {}, dup = {};
  actPeople().forEach(function(p){
    var k = twinKey(p.name);
    if (!k) return;
    if (own(seen, k)) dup[k] = true; else seen[k] = true;
  });
  return dup;
}

/* Подпись человека в списке выбора. У НЕ-тёзки — голое имя, байт в байт как
   было: приметы у всех подряд превратили бы список в стену текста. */
function personPick(p, dup){
  if (!own(dup, twinKey(p.name))) return p.name;
  var mark = personSub(p);
  return mark ? tr('ppl.twinPick', {name: p.name, mark: mark}) : p.name;
}

/* Пары [id, подпись] для обоих `<select>`. Одно место на две формы. */
function personItems(){
  var dup = twinKeys(), out = [];
  actPeople().forEach(function(p){ out.push([p.id, personPick(p, dup)]); });
  return out;
}

/* Подсказка под полем имени. Пустая строка — значит тёзок нет. */
function personTwinText(){
  var f = ui.form.person;
  var t = personTwins(f.name, f.editId || null);
  if (!t.length) return '';
  var marks = [], i;
  for (i = 0; i < t.length && i < TWIN_SHOWN; i++){
    marks.push(personSub(t[i]) || tr('ppl.twinNoMark'));
  }
  var list = marks.join(', ');
  if (t.length > TWIN_SHOWN) list += tr('ppl.twinMore', {n: String(t.length - TWIN_SHOWN)});
  return esc(tr('ppl.twin', {n: nq(t.length, 'person'), list: list}));
}

function splitBar(sec, gotCents, owedCents, gotLabel, owedLabel, gotD, owedD){

/* ===== NEW ===== ОТЧЁТ ПО ОСТАТКАМ                                  */
/*
 * «Сколько ещё можно заработать на том, что лежит на складе».
 *
 * Второго слоя расчётов здесь НЕТ. Штуки остатка, средняя цена закупки и
 * сумма выданного берутся из productStats() — той же карты, которую читает
 * вся «Сводка». Новых величин ровно три: средняя цена продажи, выручка с
 * остатка и прибыль с остатка.
 *
 * Отчёт только читает: ни commit(), ни save(), ни одного поля state. Он
 * трогает единственное поле ui.remProduct, а ui не сохраняется и не
 * экспортируется. Фильтр периода «Сводки» на него не влияет и не должен:
 * остаток — это состояние склада сейчас, а средняя продажа считается за всё
 * время, иначе цена товара, который в этом месяце не продавали, исчезла бы.
 * Поэтому здесь вызывается productStats(), а не computeReport().
 */

/* ++++++ DISPLAY CURRENCY ++++++ своей валюты у отчёта нет и не должно
   быть: он открывается в той, что выбрана переключателем «Сводки», и читает
   её в момент открытия. Три слота — три обёртки одной dcFmt(). */
/** валюта отчёта — та же, что у всей «Сводки» */
/** голое число в валюте отчёта (код напечатан один раз, в шапке окна) */
function remBare(dm){ return dcBare(dm); }
/** число с кодом валюты — для трёх карточек наверху */
function remBig(dm){ return dcHero(dm); }
/** знак суммы -> класс. null (нечем пересчитать) знака не имеет. */
function remSign(dm){ return (dm !== null && dm < 0) ? 'neg' : 'pos'; }

/** ОДИН строитель отчёта. Карточки, строки и «Итого» читают его результат,
 *  поэтому разойтись между собой не могут.
 *
 *  productId: '' — все товары, иначе один товар.
 *
 *  Округление одно на строку, и «Итого» — сумма ровно тех целых, которые
 *  напечатаны в строках. avgCost в productStats() сознательно не округлён;
 *  округлять его здесь значило бы завести вторую себестоимость. */
function remainderReport(productId){
  /* ++++++ DISPLAY CURRENCY ++++++ dd — та же карта, что читает «Сводка»:
     выручка в ней уже пересчитана покурсово, по курсу КАЖДОЙ продажи.
     Округление по-прежнему одно на строку, но теперь сразу в валюте показа —
     поэтому «Итого» равно сумме ровно тех чисел, которые напечатаны в
     строках, в любой валюте, а не только в базовой. */
  var ps = productStats(), dd = dcStats(ps), rows = [];
  var t = { leftUnits:0, stockD:0, revD:0, profD:0, priced:0, unpriced:0 };
  actProducts().forEach(function(p){
    if (productId && p.id !== productId) return;
    var s = ps[p.id];
    if (!s) return;
    var x = dd.prod[p.id];
    var left  = s.remaining;
    /* ++++++ MOVING AVG ++++++ R12. Здесь стояло `left * s.avgCost` —
       остаток по ПОЖИЗНЕННОЙ средней. При бегущем балансе стоимость
       того, что лежит, — это `spentCents − cogsCents`, и она
       единственная: иначе отчёт и «Склад по себестоимости» в Сводке
       расходились бы на настоящие деньги, а не на копейку. */
    /* ++++++ PRODUCT SNAPS ++++++ ровно та величина, которую печатает
       «Сводка»: сумма пересчитанных записей, а не пересчёт суммы.
       В базовой валюте это то же число до копейки — dcCents() там
       тождественна, — а в любой другой это единственное честное. */
    var stock = x.stockCostD;
    /* Средняя цена продажи. Делить можно, только когда есть и штуки, и
       деньги: иначе это не средняя цена, а деление на ноль — или ноль,
       выданный за цену. В обоих случаях падаем на цену из прайса и помечаем
       строку, чтобы владелец видел, откуда взялась цифра. */
    var sold  = s.taken > 0 && s.valueCents > 0;
    /* средняя цена продажи берётся из УЖЕ ПЕРЕСЧИТАННОЙ выручки, то есть с
       учётом курса каждой продажи на свою дату */
    var exact = sold ? (x.valueD === null ? null : x.valueD / s.taken)
                     /* ++++++ PRODUCT SNAPS ++++++ цена из прайса — сумма
                        ТОВАРА, значит и курс товара */
                     : dcCents(p.unitPriceCents, prodSnapOf(p));
    var src   = sold ? 'sales' : (p.unitPriceCents > 0 ? 'list' : 'none');
    var rev   = (src === 'none' || exact === null) ? null : dcRound(left * exact);
    var prof  = dcSub(rev, stock);
    rows.push({ id:p.id, name:p.name, left:left, taken:s.taken,
      /* ++++++ MOVING AVG ++++++ цена единицы ТОГО, ЧТО ОСТАЛОСЬ, а не
         пожизненная средняя: иначе подпись говорила бы о закупках вообще,
         а стоит она под остатком. Когда не осталось ничего, обе части нули,
         и печатается пожизненная средняя — она всё ещё верное утверждение
         о закупках.

         ++++++ DEAD WEIGHT ++++++ B8. Здесь стояло обещание, что
         `left * costD` равно stockD. Арифметически этого быть не может:
         costD — ОКРУГЛЁННАЯ величина, и при остатке 4 и складе 40.02
         выходит 4 × 10.01 = 40.04. Расхождение не больше `left / 2`
         копеек и на итоги не влияет — они суммируют именно напечатанные
         stockD, а не произведения. Обещание убрано, потому что следующий
         читатель, поверив ему, «починил» бы строку и сломал итог. */
      /* ++++++ PRODUCT SNAPS ++++++ делится УЖЕ ПЕРЕСЧИТАННОЕ, поэтому
         цена единицы стоит на тех же курсах, что и число над ней.
         В базовой валюте оба выражения дают прежнее число: stock там
         равен s.stockCostCents, а x.spentD — s.spentCents, и
         s.spentCents / p.qty есть s.avgCost по определению. */
      costD: dcRound(left > 0 ? (stock === null ? null : stock / left)
                              : (p.qty > 0 ? (x.spentD === null ? null : x.spentD / p.qty) : 0)),
      stockD:stock,
      priceD: (src === 'none' || exact === null) ? null : dcRound(exact),
      src:src, revD:rev, profD:prof });
    t.leftUnits += left;
    t.stockD = dcAdd(t.stockD, stock);
    /* товар без цены не попадает в выручку и прибыль, но его штуки и его
       себестоимость на складе считаются: он лежит, деньги в нём есть */
    /* «нет цены» и «нечем пересчитать» — разные вещи: первое исключает
       товар из выручки и прибыли и считается в сноске, второе делает итог
       неизвестным целиком и печатается прочерком. */
    if (src === 'none') t.unpriced++;
    else { t.priced++; t.revD = dcAdd(t.revD, rev); t.profD = dcAdd(t.profD, prof); }
  });
  return { rows:rows, tot:t };
}

     видимую часть и заголовок уезжает наверх. Фокус переносим на список

}

/* ==================================================================
 * ++++++ REMINDER LIST ++++++            КОМУ НАПОМНИТЬ
 *
 * Кто должен, сколько и КАК ДАВНО — и готовый текст напоминания. До этого
 * долг был виден только в карточке человека, и «кому напомнить первым»
 * приходилось держать в голове.
 *
 * СВОЕГО СПИСКА У НАПОМИНАНИЙ НЕТ. Всё живёт в единственном списке
 * вкладки «Сводка → Люди» — «Кто сколько должен»: там же имя, там же
 * «взял … оплатил …», там же остаток и статус. Отдельный блок наверху был
 * бы вторым списком тех же людей на одном экране, и человек с долгом
 * занимал бы две карточки сразу.
 *
 * Здесь НИЧЕГО НЕ СЧИТАЕТСЯ ЗАНОВО. Долг, оплачено и статус приходят из
 * personStats(), суммы в валюте показа — из dcStats(), то есть из тех же
 * двух карт, что читает вся «Сводка». Своего ровно три производные
 * величины: возраст долга в сутках, признак просрочки и готовый текст.
 * Записи не трогаются вовсе: ни commit(), ни save(), ни одного поля state.
 *
 * Порог просрочки задан здесь и нигде больше — 30 суток включительно.
 * ================================================================== */

var RMD_OVERDUE_DAYS = 30;      /* 30 — уже просрочено, 29 — ещё нет */

/* Язык ГОТОВОГО ТЕКСТА, а не интерфейса. Текст уходит не владельцу, а
   должнику, и его язык от того, на каком владелец читает программу, не
   зависит. Обе колонки словаря заполнены по-настоящему: смена этой
   константы на 'en' переводит сообщение целиком, не трогая ни одной
   другой строки. */
var RMD_LANG = 'ru';

/** Целых КАЛЕНДАРНЫХ суток прошло с даты записи, по местному времени.
 *
 *  Считается разностью двух локальных полуночей, а не миллисекундами от
 *  Date.parse('2026-08-22'): такую строку браузер читает как полночь UTC,
 *  и в поясе западнее Гринвича вечерняя запись «сегодня» показала бы 1 день.
 *
 *  null — дата нечитаема или её не бывает (2026-02-31); ОТРИЦАТЕЛЬНОГО не
 *  бывает никогда: дата из будущего и переведённые назад часы читаются
 *  как 0 суток (краевой случай 7). */
function rmdDays(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso == null ? '' : iso));
  if (!m) return null;
  var y = +m[1], mo = +m[2] - 1, dd = +m[3];
  var then = new Date(y, mo, dd);
  /* new Date(2026,1,31) молча становится 3 марта — такая дата не читается */
  if (then.getFullYear() !== y || then.getMonth() !== mo || then.getDate() !== dd) return null;
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var n = Math.floor((today.getTime() - then.getTime()) / 86400000);
  return n < 0 ? 0 : n;
}

/** ЕДИНСТВЕННЫЙ источник данных о должниках. Список, блок, сортировка и
 *  генератор текста читают только его, поэтому разойтись им негде.
 *
 *  d  — уже посчитанная карта dcStats(), если она у вызывающего есть
 *  hs — уже посчитанная карта personStats(), то же самое
 *
 *  Одна запись:
 *    person   человек целиком
 *    st       его строка personStats() — долг в БАЗОВЫХ копейках
 *    dueD/paidD/outD  начислено / оплачено / остаток в валюте показа
 *    days     возраст долга в сутках, или null
 *    unknown  срок неизвестен: ни одной читаемой даты
 *    fromPay  отсчёт идёт от оплаты (иначе — от первой выдачи)
 *    overdue  30 суток и больше
 *    items    [{name, qty, amtD}] — что взято, по товарам
 */
function rmdList(d, hs){
  hs = hs || personStats();
  d  = d  || dcStats();
  /* по одному проходу на список записей, а не поиск по всем записям на
     каждого человека: на 30 должниках это разница в два порядка */
  var takes = {}, lastPay = {}, first = {};
  actTx().forEach(function(t){
    if (!own(takes, t.personId)) takes[t.personId] = [];
    takes[t.personId].push(t);
    if (rmdDays(t.date) === null) return;
    if (!own(first, t.personId) || t.date < first[t.personId]) first[t.personId] = t.date;
  });
  actPay().forEach(function(y){
    if (rmdDays(y.date) === null) return;             /* нечитаемая дата не решает ничего */
    if (!own(lastPay, y.personId) || y.date > lastPay[y.personId]) lastPay[y.personId] = y.date;
  });
  /* ++++++ GOODS RETURN ++++++ сколько возвращено по каждой выдаче: строки
     сообщения обязаны быть ЧИСТЫМИ, иначе напоминание требует вернуть то,
     что уже вернули. */
  var retBy = {};
  actRet().forEach(function(r){
    retBy[r.txId] = (own(retBy, r.txId) ? retBy[r.txId] : 0) + r.qty;
  });

  var out = [];
  actPeople().forEach(function(p){
    var st = hs[p.id];
    /* Долг — это выданного больше, чем оплачено, и ничего кроме. Переплата
       (credit) и «товар не брал» (none) сюда не попадают ПО ОПРЕДЕЛЕНИЮ:
       у обоих outstandingCents === 0 (краевой случай 5). Смотрим на базовые
       копейки, а не на пересчитанные: долг есть или нет — это факт о
       записях, а не о том, в какой валюте на них смотрят. */
    if (!st || st.outstandingCents <= 0) return;
    var x = own(d.per, p.id) ? d.per[p.id] : { dueD:null, paidD:null, outD:null };

    /* От какой даты считать. Была оплата — от последней: человек на связи,
       и «сколько он молчит» отсчитывается с неё. Оплат не было — от самой
       ранней выдачи, то есть от начала долга (A1). Поле в обоих случаях
       одно и то же: date записи, YYYY-MM-DD, местная календарная дата. */
    var fromPay = own(lastPay, p.id);
    var basis = fromPay ? lastPay[p.id] : (own(first, p.id) ? first[p.id] : null);
    var days = rmdDays(basis);

    /* Что взято — по товарам, в порядке первой выдачи. Тот же источник и то
       же имя товара, что в ленте карточки человека (A3): несколько выдач
       одного товара складываются в одну строку, иначе у постоянного
       покупателя сообщение вырастает на экран. */
    var seen = {}, items = [], mine = own(takes, p.id) ? takes[p.id] : [];
    /* Сравнение ПОЛНОЕ: при равных дате и createdAt решает порядок самих
       записей. Компаратор, который на равных ключах возвращает -1, не
       транзитивен, и порядок строк тогда зависит от движка (это R17, и
       повторять её в новом коде незачем). */
    mine = mine.map(function(t, i){ return { t:t, i:i }; }).sort(function(a, b){
      if (a.t.date !== b.t.date) return a.t.date < b.t.date ? -1 : 1;
      var ca = a.t.createdAt || '', cb = b.t.createdAt || '';
      if (ca !== cb) return ca < cb ? -1 : 1;
      return a.i - b.i;
    }).map(function(o){ return o.t; });
    mine.forEach(function(t){
      /* ++++++ GOODS RETURN ++++++ выдача за вычетом её возвратов; выдача,
         возвращённая целиком, в сообщение не попадает вовсе. */
      var q = t.qty - (own(retBy, t.id) ? retBy[t.id] : 0);
      if (q <= 0) return;
      var pr = productById(t.productId);
      var it;
      if (own(seen, t.productId)) { it = seen[t.productId]; }
      else { it = seen[t.productId] = { name: pr ? pr.name : '—', qty:0, amtD:0 }; items.push(it); }
      it.qty += q;
      /* Курс ТОЙ ЖЕ продажи — dcCents() и снимок записи, как во всей
         «Сводке». Поэтому сумма строк равна начисленному до копейки. */
      it.amtD = dcAdd(it.amtD, dcCents(q * t.unitPriceCents, t.rateSnap));
    });

    out.push({ person:p, st:st, dueD:x.dueD, paidD:x.paidD, outD:x.outD,
               days:days, unknown: days === null, fromPay:fromPay,
               overdue: days !== null && days >= RMD_OVERDUE_DAYS,
               items:items });
  });

  /* Сначала самые давние. Дальше — по убыванию долга, потом по имени и, в
     самом конце, по id: порядок обязан быть одинаковым от отрисовки к
     отрисовке, а имена и суммы совпадают чаще, чем кажется.
     «Срок неизвестен» уходит в конец и просрочкой не считается никогда
     (краевой случай 4). */
  out.sort(function(a, b){
    if (a.unknown !== b.unknown) return a.unknown ? 1 : -1;
    if (!a.unknown && a.days !== b.days) return b.days - a.days;
    if (a.st.outstandingCents !== b.st.outstandingCents) return b.st.outstandingCents - a.st.outstandingCents;
    if (a.person.name !== b.person.name) return a.person.name < b.person.name ? -1 : 1;
    return a.person.id < b.person.id ? -1 : 1;
  });
  return out;
}

/* ---- готовый текст ------------------------------------------------
 * Одна функция на всё сообщение. Собирать его по кускам в двух местах —
 * значит однажды получить два разных напоминания об одном долге. */

/** Сумма для ПЛОСКОГО текста. Форматирует та же dcBare(), что печатает
 *  ячейки отчёта, — второго форматтера у «Сводки» нет и не будет
 *  (хрупкое место 19). Код валюты дописывается словом, как требует
 *  сообщение: получатель не видит, что выбрано в программе. */
function rmdPlain(dm){
  var n = dcBare(dm);
  return (dm === null || dm === undefined) ? n : n + ' ' + dcCur();
}
function rmdCompose(rec){
  var L = [], i;
  L.push(tr('rmd.t.hello', { name: rec.person.name }));
  L.push('');
  L.push(tr('rmd.t.intro'));
  if (rec.items.length){
    L.push('');
    L.push(tr('rmd.t.itemsHead'));
    for (i = 0; i < rec.items.length; i++){
      L.push(tr('rmd.t.item', { name: rec.items[i].name, qty: units(rec.items[i].qty),
                                sum: rmdPlain(rec.items[i].amtD) }));
    }
  }
  L.push('');
  L.push(tr('rmd.t.due',  { sum: rmdPlain(rec.dueD) }));
  L.push(tr('rmd.t.paid', { sum: rmdPlain(rec.paidD) }));
  L.push(tr('rmd.t.left', { sum: rmdPlain(rec.outD) }));
  L.push('');
  L.push(tr('rmd.t.bye'));
  return L.join('\n');
}
/** ЕДИНСТВЕННЫЙ генератор текста. На входе запись rmdList(), на выходе
 *  готовая строка — ни разметки, ни экранирования: это то, что вставят в
 *  мессенджер.
 *
 *  Язык переключается на время сборки и возвращается обратно, поэтому
 *  внутри работают обычные tr(), plur() и units() — своей копии словаря и
 *  своих склонений у сообщения нет. Переключение синхронное: между setLang
 *  и восстановлением не может произойти ни отрисовки, ни события. */
function rmdText(rec){
  var prev = getLang();
  setLang(RMD_LANG);
  try { return rmdCompose(rec); }
  finally { setLang(prev); }
}

/* ---- разметка блока ---------------------------------------------- */

/** Индекс должников по id. Своего СПИСКА у напоминаний нет: строка живёт
 *  в «Кто сколько должен», единственном списке вкладки. Два места, которым
 *  нужны дни и просрочка, — сортировка и разметка той строки — читают этот
 *  индекс, то есть ту же самую rmdList(). */
function rmdIndex(d, hs){
  var m = {}, L = rmdList(d, hs), i;
  for (i = 0; i < L.length; i++) m[L[i].person.id] = L[i];
  return m;
}
/** Вторая строка подписи: сколько человек молчит.
 *  Отдельным <small>, а не через «·» к первой: .row .k small обрезается
 *  многоточием, и возраст долга пропал бы из неё первым. */
function rmdAgeHTML(rec){
  return rec.unknown
    ? tr('rmd.unknown')
    : tr(rec.fromPay ? 'rmd.sincePay' : 'rmd.sinceTake', { n: nq(rec.days, 'day') });
}
/** Кнопка копирования — СОСЕД строки, а не её потомок.
 *  <button> внутри <button> недопустима: браузер разбирает такую разметку
 *  по-своему и выносит вложенную наружу. Поэтому строка и кнопка лежат
 *  рядом внутри .rmdrow, и closest('[data-act]') физически не может
 *  подняться от кнопки к строке — карточка человека не откроется. */
function rmdCopyHTML(personId){
  return '<div class="rmdact"><button type="button" class="lnk" data-act="rmd-copy" data-arg="' +
    esc(personId) + '">' + tr('rmd.copy') + '</button></div>';
}
/** Пометка просрочки — И цветом, И словом; цветом одним во всём файле не
 *  помечается ничего. Стоит ПЕРЕД суммой, в той же ячейке .v: эта ячейка не
 *  сжимается ни на какой ширине, а подпись под именем обрезается, и на
 *  телефоне 320 px слово пропало бы из неё первым. */
function rmdLateHTML(rec){
  return rec.overdue ? '<span class="odue">' + tr('rmd.overdue') + '</span>' : '';
}

/* ---- копирование -------------------------------------------------- */

/** Запасное окно: тот же dialog(), что у всех листов, поэтому Escape,
 *  щелчок по фону и «Закрыть» не требуют ни строки нового кода. Текст
 *  ЭКРАНИРУЕТСЯ: в буфер он уходит как есть, но здесь он попадает в
 *  innerHTML, а имя человека и название товара пишет владелец. */
function rmdManual(text){
  dialog({ title: tr('rmd.manualTitle'),
    html: '<p class="remcap">' + tr('rmd.manualHint') + '</p>' +
          '<textarea id="rmdText" class="rmdta" readonly rows="12">' + esc(text) + '</textarea>',
    cancelLabel: tr('w.close'), buttons: [] });
  /* dialog() ставит фокус на «Закрыть»; здесь нужнее сам текст — он уже
     выделен, остаётся нажать Ctrl+C. */
  var ta = $('rmdText');
  if (ta){ ta.focus(); if (ta.select) ta.select(); }
}
/** Скопировать напоминание одному человеку.
 *
 *  Асинхронный Clipboard API — единственный способ, разрешённый заданием;
 *  ЛЮБОЙ отказ ведёт в запасное окно и никуда больше: и отсутствие самого
 *  API (небезопасный контекст), и отклонённое обещание (нет разрешения,
 *  документ не в фокусе), и синхронное исключение. В консоль при этом не
 *  попадает ничего: у обещания есть обработчик отказа. */
function rmdCopy(personId){
  var list = rmdList(), rec = null, i;
  for (i = 0; i < list.length; i++) if (list[i].person.id === personId) rec = list[i];
  /* Долг мог закрыться между отрисовкой и нажатием — напоминать не о чем. */
  if (!rec) return;
  var text = rmdText(rec);
  var c = navigator.clipboard;
  if (!c || !c.writeText){ rmdManual(text); return; }
  try {
    c.writeText(text).then(function(){ toast(tr('rmd.copied')); },
                           function(){ rmdManual(text); });
  } catch(e){ rmdManual(text); }
}
/* ++++++ /REMINDER LIST ++++++ */

function viewSummary(){
  /* ++++++ DISPLAY CURRENCY ++++++ d — та же «Сводка», пересчитанная в
     выбранную валюту: каждая продажа и каждая оплата своим курсом. Ни одна
     цифра ниже не считается в разметке, все берутся отсюда.

     В шапке — только валюта ХРАНЕНИЯ, одна короткая строка. Что показано
     сейчас, написано на кнопке в углу «героя», то есть там же, где это
     меняют: переключатель наверху занимал три строки самого дорогого места
     экрана ради действия, которое делают раз в неделю. */
  /* ++++++ MOVING AVG ++++++ карта товаров нужна здесь ради предупреждения
     о датах — и передаётся в dcStats(), которая иначе считала бы её ещё
     раз. Вызовов productStats() на этом экране стало меньше, не больше. */
  var ps = productStats();
  var r = computeReport(), g = grandTotals(), d = dcStats(ps), sec = 'summary';
  var h = head(tr('tab.summary'), tr('sum.inCur', {note: dcStoreNote()}));
  h += segbar('summary', [['money', tr('seg.money')], ['stock', tr('seg.stock')], ['people', tr('seg.people')]]);
  h += filterBar();
  h += warnNote(sec);
  if (r.swapped) h += '<div class="note warn">' + tr('rep.swapped') + '</div>';

  if (ui.seg.summary === 'money'){
    h += hero({ cls:'accent pick', k: tr('sum.profitFor', {period: periodLabel()}),
      aside: dcPickHTML(),
      v: dcHero(d.rep.profitD),
      s: r.revenueCents > 0
        /* процент — доля, а не деньги: считается по базовым копейкам и от
           валюты показа не зависит */
        ? tr('sum.marginRevenue', {pct: pctOf(r.profitCents, r.revenueCents), sum: dcMoney(d.rep.revenueD)})
        : tr('sum.nothingOut') });

    /* три числа, из которых получилась прибыль. Саму прибыль здесь не
       повторяем — это и был главный источник лишних цифр в старом виде */
    h += listCard(tr('sum.breakdown'),
      row({ k: tr('sum.bought'), sub: tr('sum.byBatchDate'), v: dcMoney(d.rep.spentD) }) +
      /* ++++++ REPORT SAYS ++++++ R11. Строка выше говорит «по датам
         партий»; эта молчала, и фильтр читался как общий. */
      row({ k: tr('sum.handedOutFor'),
            sub: nq(r.units, 'unit') + ' \u00b7 ' + tr('sum.byTxDate'),
            v: dcMoney(d.rep.revenueD) }) +
      row({ k: tr('sum.costOfHandedOut'), sub: tr('sum.atAvgCost'), v: dcMoney(d.rep.costD) }) +
      /* ++++++ EXPENSES ++++++ две НОВЫЕ строки. Три строки выше не
         тронуты ни на байт, «герой» прибыли, маржа и выручка — тоже: это
         прибавление, а не поправка. «Чистая прибыль» — разность двух
         напечатанных рядом чисел, поэтому арифметика на экране всегда
