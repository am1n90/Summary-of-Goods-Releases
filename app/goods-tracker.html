         `.row .v.neg` — ни одной новой строки в таблице стилей. */
      row({ k: tr('sum.otherExp'), sub: tr('sum.byExpDate'), v: dcMoney(d.rep.expenseD) }) +
      row({ k: tr('sum.netProfit'), sub: tr('sum.netProfitHint'),
            v: dcMoney(d.rep.netProfitD),
            vcls: (d.rep.netProfitD !== null && d.rep.netProfitD < 0) ? 'neg' : '' }));

    var owing = [], hs = personStats();
    actPeople().forEach(function(p){ if (hs[p.id].outstandingCents > 0) owing.push(p.name); });
    var owingLine = '';
    if (owing.length){
      var shown = owing.slice(0,3).map(esc).join(', ');
      if (owing.length > 3) shown += ' ' + tr('w.andMore', {n: owing.length - 3});
      owingLine = '<div class="small muted" style="margin-top:10px">' +
        tr('sum.owingList', {names: shown}) + '</div>';
    }
    h += '<section class="card"><div class="t">' + tr('sum.settlements') + '</div><div class="b">' +
      splitBar(sec, g.receivedCents, g.outstandingCents, tr('sum.received'), tr('sum.owedToMe'),
               d.tot.receivedD, d.tot.outD) +
      owingLine + '</div>' +
      (g.creditCents > 0 ? row({ k: tr('w.credit'), sub: tr('sum.creditHint'),
                                 v: dcMoney(d.tot.credD) }) : '') + '</section>';
    /* «Полный отчёт» — последнее действие вкладки, сразу за расчётами с
       людьми. Печатается всегда, в том числе когда товаров нет: тогда в

       модель уже объясняется словами. */
    /* ++++++ MOVING AVG ++++++ R12. Основание переменилось — переменилась и
       фраза: раньше здесь стояла `sum.avgAllTime`, которая честно

       датах печатается ТОЛЬКО когда есть повод: без повода оно приучает

    var early = earlyUnits(ps);

  if (ui.seg.summary === 'stock'){

       это была не новая переменная, а перезапись прежней, — и в этой ветви
       `ps` не читается ни разу: цифры берутся из `r` и `d`, а список

    var stockNote = (!r.swapped && (ui.report.from || ui.report.to))

    h += searchBar('sumStockQuery', tr('srch.phProduct'));

  if (ui.seg.summary === 'people'){

    h += searchBar('sumPeopleQuery', tr('srch.phPerson'));

function stockHits(){

function stockListHTML(){
  var ps = productStats(), d = dcStats(ps), hits = stockHits(), rows = '';

                                   sum: dcMoney(d.prod[p.id].profitD)}),

  });

function sumPeopleHits(){
  var hs = personStats(), list = [];
  /* ++++++ REMINDER LIST ++++++ дни и просрочку берём из той же
     rmdList(), из которой их печатает строка: два разных ответа на
     «когда он платил в последний раз» на одном экране невозможны. */
  var rx = rmdIndex(null, hs);
  actPeople().forEach(function(p){
    if (!qMatch(ui.sumPeopleQuery, personFields(p))) return;
    /* Статус сравнивается по КЛЮЧУ, никогда по подписи. */
    if (ui.sumStatus && hs[p.id].status !== ui.sumStatus) return;
    list.push(hs[p.id]);
  });
  /* Сначала просроченные, затем остальные долги по давности, и только
     потом те, у кого долга нет. Внутри группы — по возрасту, затем по
     сумме, имени и id: порядок обязан быть одинаковым от отрисовки к
     отрисовке, а имена и суммы совпадают чаще, чем кажется.
     «Срок неизвестен» уходит в конец своей группы и просрочкой не
     считается никогда. */
  list.sort(function(a,b){
    var ra = own(rx, a.person.id) ? rx[a.person.id] : null;
    var rb = own(rx, b.person.id) ? rx[b.person.id] : null;
    var ga = ra ? (ra.overdue ? 0 : 1) : 2, gb = rb ? (rb.overdue ? 0 : 1) : 2;
    if (ga !== gb) return ga - gb;
    if (ra && rb){
      if (ra.unknown !== rb.unknown) return ra.unknown ? 1 : -1;
      if (!ra.unknown && ra.days !== rb.days) return rb.days - ra.days;
    }
    if (a.outstandingCents !== b.outstandingCents) return b.outstandingCents - a.outstandingCents;
    if (a.person.name !== b.person.name) return a.person.name < b.person.name ? -1 : 1;
    return a.person.id < b.person.id ? -1 : 1;
  });
  return list;
}
function sumPeopleListHTML(){
  var d = dcStats(), hits = sumPeopleHits(), rows = '';
  if (!hits.length) return noHits('sumPeopleQuery');
  /* ++++++ REMINDER LIST ++++++ тот же индекс, что и у сортировки */
  var rx = rmdIndex(d);
  hits.forEach(function(st){

    var rec = own(rx, st.person.id) ? rx[st.person.id] : null;

      sub2: rec ? rmdAgeHTML(rec) : '',

/* ++++++ PRODUCT SNAPS ++++++ каким курсом читается ЭТА запись.
 *
 * Строится через dcRateOf() — ту самую функцию, которая и пересчитывает, —
 * поэтому строка не может назвать курс, отличный от применённого: снимок
 * из другой базы и валюта, курс которой удалили, отпадают здесь там же,
 * где отпадают при счёте. Вид строки — «1 USD = 3.67 AED», тот же, что у
 * rateText(): двух способов назвать курс в этом файле нет.
 *
 * ГДЕ ЭТОТ КУРС ДЕЙСТВУЕТ — СКАЗАНО В ПОДПИСИ, и это не украшение.
 * Вкладка «Товары» читает деньги через sec* по SECTION_CUR.products, то
 * есть по ТЕКУЩЕМУ курсу настроек: снимок туда не заходит и заходить не
 * должен — своя вкладка выдач и своя вкладка оплат читают ровно так же, и
 * трогать их эта задача не должна. Снимок решает, каким курсом товар
 * читается в «Сводке» и в «Полном отчёте». Подпись, умолчавшая об этом,
 * называла бы курс рядом с числом, посчитанным другим, — а подпись,
 * называющая не тот курс, хуже, чем её отсутствие (области 43 и 44).
 */
function ratesLine(snap){
  var base = state.settings.baseCurrency, out = [];
  currencyCodes().forEach(function(c){
    if (c === base) return;
    var r = dcRateOf(snap, c);
    if (r === null) return;
    out.push('1 ' + esc(c) + ' = ' + esc(trimNum(r)) + ' ' + esc(base));
  });
  return out;
}
/** Строка «курс на дату» в карточке товара, или '' — когда пересчитывать
 *  не во что и говорить не о чем. */
function prodRateRowHTML(p){
  var live = snapLive(prodSnapOf(p)), parts = ratesLine(live);
  if (!parts.length) return '';
  return row({ k: tr(live ? 'prod.rateAt' : 'prod.rateNow'),
    sub: tr(live ? 'prod.rateAtHint' : 'prod.rateNowHint'),
    v: parts[0] + parts.slice(1).map(function(s){
         return '<div class="conv">' + s + '</div>';
       }).join('') });
}
/** Вторая подпись партии — только когда её курс отличается от курса товара. */
function batchRateSub(p, b){
  var mine = ratesLine(snapLive(batchSnapOf(p, b)));
  if (!mine.length || mine.join(' ') === ratesLine(snapLive(prodSnapOf(p))).join(' ')) return '';
  return tr('prod.rateBatch', { rates: mine.join(' &middot; ') });
}

/* Одна позиция. Арифметика — слово в слово из прежнего readInvoice():
   всё считается в валюте инвойса и переводится в базу ОДНИМ округлением. */
function readLine(i){
  var f = ui.form.product, l = f.lines[i], cur = f.cur, rate = rateOf(cur);
  if (rate === null) return { err: noRateText(cur) };
  if (f.mode === 'man'){
    var q = parseIntStrict(l.qty), c = parseMoneyToCents(l.cost);
    if (!q || q < 1) return { err: tr('err.prodQty') };
    if (c === null) return { err: tr('err.prodCost') };
    var unitCents = toBaseCents(c, cur);
    return { qty:q, subtotal:c * q, vat:0, total:c * q, cur:cur, unitExact:c,
      unitCostCents:unitCents, totalCostCents: Math.round(unitCents * q) };
  }
  var boxes = parseIntStrict(l.boxes), per = parseIntStrict(l.perBox);
  var priceMinor = parseMoneyToCents(l.boxPrice);
  if (!boxes || boxes < 1) return { err: tr('err.invBoxes') };
  if (!per || per < 1) return { err: tr('err.invPerBox') };
  if (priceMinor === null) return { err: tr('err.invPrice') };
  var qty = boxes * per;
  var subtotalMinor = boxes * priceMinor;
  var vatMinor = f.vatOn ? Math.round(subtotalMinor * state.settings.vatPct / 100) : 0;
  var totalMinor = subtotalMinor + vatMinor;
  var unitExactMinor = totalMinor / qty;
  return { qty:qty, subtotal:subtotalMinor, vat:vatMinor, total:totalMinor, cur:cur,
    unitExact:unitExactMinor,
    unitCostCents: Math.round(unitExactMinor * rate),
    totalCostCents: Math.round(totalMinor * rate) };
}
function lineNoteHTML(i){
  var f = ui.form.product, r = readLine(i);
  if (r.err) return '<div class="note calc">' + esc(r.err) + '</div>';
  var c = esc(r.cur), s;
  if (f.mode === 'inv'){
    s = tr('inv.calcLine', {
      sub: fmtMinor(r.subtotal),
      vat: r.vat ? tr('inv.calcVat', {v: fmtMinor(r.vat)}) : '',
      total: fmtMinor(r.total), cur: c, qty: units(r.qty), unit: fmtMinor(r.unitExact) });
  } else {
    s = tr('inv.calcManual', {qty: units(r.qty), unit: fmtMinor(r.unitExact),
      total: fmtMinor(r.total), cur: c });
  }
  if (r.cur !== state.settings.baseCurrency){
    s += '<br>' + tr('inv.inBase', {unit: fmtMinor(r.unitCostCents),
      total: fmtMinor(r.totalCostCents), base: esc(state.settings.baseCurrency)});
  }
  return '<div class="note calc">' + s + '</div>';
}
function invoiceTotals(){
  var f = ui.form.product, t = { n:0, filled:0, qty:0, sub:0, vat:0, tot:0, totCents:0 };
  f.lines.forEach(function(l, i){
    t.n++;
    var r = readLine(i);
    if (r.err) return;
    t.filled++; t.qty += r.qty; t.sub += r.subtotal; t.vat += r.vat;
    t.tot += r.total; t.totCents += r.totalCostCents;
  });
  return t;
}
function totalNoteHTML(){
  var f = ui.form.product, t = invoiceTotals();
  if (f.lines.length < 2 || t.filled === 0) return '';
  var s = '<b>' + tr('inv.total', {sum: fmtMinor(t.tot) + ' ' + esc(f.cur)}) + '</b>' +
    (t.vat ? ' ' + tr('inv.totalVat', {sum: fmtMinor(t.vat)}) : '') + '<br>' +
    tr('inv.linesQty', {n: t.filled, lines: plur(t.filled, 'line'), q: units(t.qty)});
  if (f.cur !== state.settings.baseCurrency){
    s += ' · ' + fmtMinor(t.totCents) + ' ' + esc(state.settings.baseCurrency);
  }
  if (t.filled < t.n) s += '<br>' + tr('inv.notFilled', {n: t.n - t.filled});
  return '<div class="note calc">' + s + '</div>';
}

/* ================================================================== *
 * ++++++ ATTACHMENTS ++++++  everything the owner sees and touches
 * ------------------------------------------------------------------
 * Four data-act strings carry the whole feature:
 *
 *   att-pick   photo:l:<i> | photo:p:<id> | inv:p:<id> | inv:r:<attId>
 *              open the file picker with that intent
 *   att-open   a:<attId> | l:<i>      show a photo or an invoice
 *   att-clear  l:<i>                  drop what is staged in the form
 *   att-drop   <productId>            delete that product's photo (confirms)
 *
 * The picker itself is ONE hidden <input type="file"> in the shell,
 * next to #importInput. It is deliberately not rendered into #app:
 * render() rebuilds #app wholesale, and a file input that is re-created
 * loses its FileList. Nothing here reads the input's value — the picked
 * File is handed straight to the router below.
 * ================================================================== */

/* ---- one more form primitive ---- */
function textarea(o){
  return '<textarea data-f="' + o.f + '" rows="' + (o.rows || 3) + '"' +
    (o.max ? ' maxlength="' + o.max + '"' : '') +
    (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') +
    (o.id ? ' id="' + o.id + '"' : '') + ' autocomplete="off">' +
    esc(o.value === null || o.value === undefined ? '' : o.value) + '</textarea>';
}
/* neutral placeholder — drawn here, never fetched */
function noPhotoIcon(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/>' +
    '<circle cx="8.5" cy="10" r="1.6"/><path d="M21 16.5l-5-4.5-4.5 4-2-1.8L3 18.5"/></svg>';
}
function fileIcon(pdf){
  return pdf
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>' +
      '<path d="M8.5 16.5v-4h1.3a1.2 1.2 0 0 1 0 2.4H8.5"/><path d="M13 16.5v-4h1.1c1 0 1.6.8 1.6 2s-.6 2-1.6 2z"/></svg>'
    : noPhotoIcon();
}
/** the small square in a product row: the photo if there is one, else a mark */
function thumbHTML(p){
  var m = attById(p.photoId);
  if (m && m.thumb){
    return '<span class="thumb"><img src="' + esc(m.thumb) + '" alt="' +
      esc(tr('att.photoAlt', {name: p.name})) + '"></span>';
  }
  return '<span class="thumb empty" aria-hidden="true">' + noPhotoIcon() + '</span>';
}

/* ---- the picker ---------------------------------------------------- */
var attIntent = null;          /* what the next picked file is for */
var ACC_IMG = 'image/jpeg,image/png,image/webp';
var ACC_INV = 'application/pdf,image/jpeg,image/png,image/webp';

function attPick(intent){
  if (!attOn()) return;
  var el = $('attInput');
  if (!el) return;
  attIntent = intent;
  el.value = '';                     /* so the same file picked twice still fires */
  el.accept = intent.kind === 'photo' ? ACC_IMG : ACC_INV;
  el.click();
}
/** the picker was closed without choosing: change never fires, nothing happens */
function attFilePicked(file){
  var it = attIntent;
  attIntent = null;
  if (!file || !it) return;
  /* the store can go away between opening the picker and choosing a file */
  if (!attOn()){ attFail(it, tr('att.offShort')); return; }
  var msg = attCheck(file, it.kind);
  if (msg){ attFail(it, msg); return; }
  if (it.kind === 'photo') photoPicked(it, file);
  else invoicePicked(it, file);
}
/* an error shown where the owner is looking: in the form, or on the card */
function attFail(it, msg){
  if (it && it.line !== undefined && it.line !== null) ui.err = msg;
  else ui.attErr = msg;
  render();
}

/* ---- photos -------------------------------------------------------- */
function photoPicked(it, file){
  if (it.line !== undefined && it.line !== null){
    /* staged in the form: nothing is stored until the product is saved */
    var l = ui.form.product.lines[it.line];
    if (!l) return;
    stagedFree(l);
    var mySeq = ++attSeq;
    l.photo = { busy:true, seq:mySeq };
    ui.err = '';
    render();
    shrinkPhoto(file, function(err, res){
      /* Two reasons to walk away with the result: the owner cancelled the form
         or saved while the picture was decoding, so this line is not in the
         form any more; or a second picture was picked after this one and is
         the one they meant. Either way the result belongs nowhere, and
         dropping it here is what keeps the object URL from outliving it.
         The line is found by IDENTITY, never by index: removing an earlier
         item shifts every index below it, and an index test would strand this
         line on "reading the picture" with no way out. */
      if (ui.form.product.lines.indexOf(l) === -1) return;
      if (!l.photo || l.photo.seq !== mySeq) return;
      if (err){ l.photo = null; ui.err = err; render(); return; }
      l.photo = { blob:res.blob, thumb:res.thumb, name:String(file.name || ''),
                  size:res.blob.size, url:URL.createObjectURL(res.blob), seq:mySeq };
      render();
    });
    return;
  }
  /* straight onto a product that already exists (the card, or an edit) */
  var p = productById(it.productId);
  if (!p){ attFail(it, tr('err.prodGone')); return; }
  ui.attErr = '';
  var pSeq = ++attSeq;
  attPhotoSeq[p.id] = pSeq;
  shrinkPhoto(file, function(err, res){
    /* a later pick on the same product has already taken over */
    if (attPhotoSeq[p.id] !== pSeq) return;
    if (err){ ui.attErr = err; render(); return; }
    var old = p.photoId;
    var meta = { id: uid('att'), kind:'photo', productId:p.id,
      name:String(file.name || ''), mime:'image/jpeg', size:res.blob.size,
      addedAt: todayISO(), thumb:res.thumb };
    attPut(meta, res.blob, function(e2){
      if (e2){ ui.attErr = tr('att.errSave', {err:String(e2)}); render(); return; }
      p.photoId = meta.id;
      toast(tr('att.msgPhotoSet'), 'ok');
      /* the replaced picture goes only once the new reference is on disk */
      attForget(old ? [old] : []);
      commitThenDrop(old ? [old] : []);
    });
  });
}
function photoDrop(pid){
  var p = productById(pid);
  if (!p || !p.photoId) return;
  confirmBox(tr('att.photoDelTitle'), tr('att.photoDelBody', {prod: esc(p.name)}),
    tr('att.photoDelOk'), true).then(function(ok){
      if (!ok) return;
      var id = p.photoId;
      p.photoId = null;
      attForget([id]);
      toast(tr('att.msgPhotoGone'), 'ok');
      commitThenDrop([id]);
    });
}
/** an object URL made for a staged preview must not outlive the staging */
function stagedFree(l){
  if (l && l.photo && l.photo.url){
    try { URL.revokeObjectURL(l.photo.url); } catch(e){}
  }
}
function stagedFreeAll(){
  if (ui.form && ui.form.product && ui.form.product.lines) ui.form.product.lines.forEach(stagedFree);
}

/* ---- invoices ------------------------------------------------------ */
/* Stored byte for byte, on purpose (A2): an invoice is a document, and a
   re-encoded document is not the same document. Only its thumbnail is made
   here, and only when it is a picture. */
function invoicePicked(it, file){
  var p = productById(it.productId || (attById(it.replaceId) || {}).productId);
  if (!p){ attFail(it, tr('err.prodGone')); return; }
  ui.attErr = '';
  invoiceThumb(file, function(thumb){
    var meta = { id: uid('att'), kind:'invoice', productId:p.id,
      name:String(file.name || ''), mime: mimeOf(file) || 'application/octet-stream',
      size:file.size, addedAt: todayISO(), thumb:thumb || '' };
    attPut(meta, file, function(err){
      if (err){ ui.attErr = tr('att.errSave', {err:String(err)}); render(); return; }
      if (it.replaceId){
        var at = p.invoiceIds.indexOf(it.replaceId);
        if (at === -1) p.invoiceIds.push(meta.id); else p.invoiceIds[at] = meta.id;
        toast(tr('att.msgInvSwapped'), 'ok');
        attForget([it.replaceId]);
        commitThenDrop([it.replaceId]);
        return;
      }
      p.invoiceIds.push(meta.id);
      toast(tr('att.msgInvAdded'), 'ok');
      commit();
    });
  });
}
function invoiceDrop(attId){
  var m = attById(attId);
  if (!m) return;
  var p = productById(m.productId);
  confirmBox(tr('att.delTitle'),
    tr('att.delBody', {name: esc(m.name || '—'), prod: esc(p ? p.name : '—')}),
    tr('att.delOk'), true).then(function(ok){
      if (!ok) return;
      if (p) p.invoiceIds = p.invoiceIds.filter(function(x){ return x !== attId; });
      attForget([attId]);
      toast(tr('att.msgInvGone'), 'ok');
      commitThenDrop([attId]);
    });
}

/* ---- viewing (offline, from a local blob) --------------------------- */
/* An image is painted by the page itself. A PDF is handed to the browser's
   own viewer through a blob: URL — which is a local address, not a request:
   the bytes never leave the machine and no library is loaded. The two links
   are real <a> elements, so the browser treats them as a navigation the
   owner asked for and no popup blocker is involved. */
function attOpenSheet(id){
  var m = attById(id);
  if (!m){ toast(tr('att.missing'), 'warn'); return; }
  /* reading the file is asynchronous; if the owner has walked to another
     screen by the time it arrives, the sheet is no longer what they asked for */
  var where = ui.tab + '|' + (ui.detail ? ui.detail.id : '') + '|' + ui.seg.products;
  attGetBlob(id, function(err, blob){
    if (where !== ui.tab + '|' + (ui.detail ? ui.detail.id : '') + '|' + ui.seg.products) return;
    if (err || !blob){
      dialog({ title: m.name || tr('att.invoices'),
        html: '<div class="body">' + tr('att.missing') + '</div>',
        cancelLabel: tr('w.close'), buttons: [] });
      return;
    }
    var url = URL.createObjectURL(blob), pdf = m.mime === 'application/pdf';
    var body = pdf
      ? '<div class="attview"><iframe src="' + url + '" title="' + esc(m.name || '') + '"></iframe></div>' +
        '<div class="note calc">' + tr('att.pdfNote') + '</div>'
      : '<div class="attview img"><img src="' + url + '" alt="' + esc(m.name || '') + '"></div>';
    /* The two links get their address in JS, not in the markup. A blob: URL is
       local, but gluing an address into a link attribute inside a string
       literal puts a literal link into the file, and the offline check reads
       the SOURCE: it would report an external link that does not exist, and
       it would be right to be suspicious. Real <a> elements are also
       what keeps a popup blocker out of it: the browser sees a navigation the
       owner asked for, not one the script started. */
    var links = '<div class="stack">' +
      '<a class="btn ghost" data-attlink="tab" target="_blank" rel="noopener noreferrer">' +
        tr('att.openTab') + '</a>' +
      '<a class="btn ghost" data-attlink="save">' + tr('att.saveCopy') + '</a></div>';
    var buttons = m.kind === 'invoice'
      ? [{key:'replace', label: tr('att.replace')}, {key:'del', label: tr('w.delete'), variant:'danger'}]
      : [{key:'replace', label: tr('att.photoChange')}, {key:'del', label: tr('att.photoRemove'), variant:'danger'}];
    var done = dialog({ title: m.name || tr('att.photo'),
      html: '<div class="body small muted">' + esc(fmtBytes(m.size)) + ' · ' +
            esc(fmtDateLong(m.addedAt)) + '</div>' + body + links,
      cancelLabel: tr('w.close'), buttons: buttons });
    /* dialog() appends the sheet before it returns, so the addresses can be
       filled in right here, on real elements. The LAST match is the sheet that
       was just appended: two quick taps put two blobs in flight and would
       otherwise cross-wire the older sheet's links to the newer file. */
    var tabs = document.querySelectorAll('[data-attlink="tab"]');
    var savs = document.querySelectorAll('[data-attlink="save"]');
    var tab = tabs.length ? tabs[tabs.length - 1] : null;
    var sav = savs.length ? savs[savs.length - 1] : null;
    if (tab) tab.href = url;
    if (sav){ sav.href = url; sav.download = m.name || 'file'; }
    done.then(function(k){
        /* the tab or the download may still be reading: let go a moment later */
        setTimeout(function(){ try { URL.revokeObjectURL(url); } catch(e){} }, 4000);
        if (k === 'replace'){
          if (m.kind === 'invoice') attPick({kind:'invoice', replaceId:id});
          else attPick({kind:'photo', productId:m.productId});
          return;
        }
        if (k === 'del'){
          if (m.kind === 'invoice') invoiceDrop(id);
          else photoDrop(m.productId);
        }
      });
  });
}
/** the staged, not-yet-saved picture from the form */
function attOpenStaged(i){
  var l = ui.form.product.lines[i];
  if (!l || !l.photo || !l.photo.url) return;
  dialog({ title: l.photo.name || tr('att.photo'),
    html: '<div class="body small muted">' + esc(fmtBytes(l.photo.size)) + '</div>' +
          '<div class="attview img"><img src="' + l.photo.url + '" alt=""></div>',
    cancelLabel: tr('w.close'), buttons: [] });
}

/* ---- full-size pictures, painted after the render -------------------
   The list gets by on the thumbnail kept in metadata, but the card should
   show the picture itself, and decoding a blob is asynchronous while
   render() is not. So the card prints the thumbnail immediately — never an
   empty box, never a broken image — and attPaint() swaps the real picture in
   as soon as IndexedDB hands it over. The object URLs are kept in a small
   cache, so opening the same card again costs nothing and no URL is created
   twice. */
var attUrlCache = {}, attUrlOrder = [], ATT_URL_MAX = 12;

function attCacheUrl(id, blob){
  if (own(attUrlCache, id)) return attUrlCache[id];
  var u = URL.createObjectURL(blob);
  attUrlCache[id] = u;
  attUrlOrder.push(id);
  while (attUrlOrder.length > ATT_URL_MAX){
    var drop = attUrlOrder.shift();
    if (own(attUrlCache, drop)){
      try { URL.revokeObjectURL(attUrlCache[drop]); } catch(e){}
      delete attUrlCache[drop];
    }
  }
  return u;
}
function attForget(ids){
  (ids || []).forEach(function(id){
    if (!own(attUrlCache, id)) return;
    try { URL.revokeObjectURL(attUrlCache[id]); } catch(e){}
    delete attUrlCache[id];
    var at = attUrlOrder.indexOf(id);
    if (at > -1) attUrlOrder.splice(at, 1);
  });
}
function attPaint(){
  if (!attOn()) return;
  var list = document.querySelectorAll('img[data-attimg]'), i;
  for (i = 0; i < list.length; i++){
    (function(img){
      var id = img.getAttribute('data-attimg');
      if (!id) return;
      if (own(attUrlCache, id)){ img.src = attUrlCache[id]; return; }
      attGetBlob(id, function(err, blob){
        /* no blob: the thumbnail stays on screen and the card says so */
        if (err || !blob) return;
        img.src = attCacheUrl(id, blob);
      });
    })(list[i]);
  }
}

/* ---- the photo field inside the product form ------------------------ */
function photoField(i){
  var f = ui.form.product, l = f.lines[i];
  var cur = f.editId ? productById(f.editId) : null;
  var curMeta = cur ? attById(cur.photoId) : null;
  var head = '<span>' + tr('att.photo') + '</span>';
  if (!attOn()){
    return '<div class="f">' + head + '<div class="note warn">' + tr('att.offShort') + '</div></div>';
  }
  var body;
  if (l.photo && l.photo.busy){
    body = '<div class="photobox"><div class="ph wait">' + noPhotoIcon() + '</div>' +
      '<div class="meta"><b>' + tr('att.photoWait') + '</b></div></div>';
  } else if (l.photo && l.photo.url){
    body = '<div class="photobox">' +
      '<button type="button" class="ph" data-act="att-open" data-arg="l:' + i + '">' +
        '<img src="' + l.photo.url + '" alt=""></button>' +
      '<div class="meta"><b>' + esc(l.photo.name || '—') + '</b>' +
      '<small>' + esc(fmtBytes(l.photo.size)) + ' · ' + tr('att.photoPending') + '</small>' +
      '<button type="button" class="lnk" data-act="att-clear" data-arg="l:' + i + '">' +
        tr('att.photoRemove') + '</button></div></div>';
  } else if (curMeta){
    body = '<div class="photobox">' +
      '<button type="button" class="ph" data-act="att-open" data-arg="a:' + esc(curMeta.id) + '">' +
        (curMeta.thumb ? '<img src="' + esc(curMeta.thumb) + '" alt="">' : noPhotoIcon()) + '</button>' +
      '<div class="meta"><b>' + esc(curMeta.name || '—') + '</b>' +
      '<small>' + tr('att.photoStored', {size: esc(fmtBytes(curMeta.size)),
        date: esc(fmtDateLong(curMeta.addedAt))}) + '</small>' +
      '<span class="two-lnk">' +
      '<button type="button" class="lnk" data-act="att-pick" data-arg="photo:p:' + esc(cur.id) + '">' +
        tr('att.photoChange') + '</button>' +
      '<button type="button" class="lnk danger" data-act="att-drop" data-arg="' + esc(cur.id) + '">' +
        tr('att.photoRemove') + '</button></span></div></div>';
  } else {
    body = '<button type="button" class="photopick" data-act="att-pick" data-arg="photo:l:' + i + '">' +
      noPhotoIcon() + '<span>' + tr('att.photoAdd') + '</span></button>';
  }
  return '<div class="f">' + head + body +
    '<small class="hint">' + tr('att.photoHint', {max: fmtBytes(ATT_MAX), side: PHOTO_SIDE}) + '</small></div>';
}

/* ---- the product card: photo, description, invoices ----------------- */
/* ---- the picture in the page header ---------------------------------
   The photo used to be a card of its own, with a caption and two buttons
   under it. It is a header thumbnail now: the name on the left, the picture
   on the right, and the figures start one screen higher. Replacing and
   removing live in the enlarge sheet, which is where the owner is already
   looking at the picture full size — one place, not two. */
function cardShotHTML(p){
  if (!attOn()) return '';
  var m = attById(p.photoId);
  if (m){
    return '<button type="button" class="hshot" data-act="att-open" data-arg="a:' + esc(m.id) + '" ' +
      'title="' + esc(tr('att.enlarge')) + '">' +
      '<img data-attimg="' + esc(m.id) + '" src="' + esc(m.thumb) + '" alt="' +
        esc(tr('att.photoAlt', {name: p.name})) + '"></button>';
  }
  /* no photo, or a reference whose file is gone: the square is the picker */
  return '<button type="button" class="hshot empty" data-act="att-pick" ' +
    'data-arg="photo:p:' + esc(p.id) + '" title="' + esc(tr('att.photoAdd')) + '">' +
    noPhotoIcon() + '</button>';
}
/* Printed only when something is actually wrong: the store is unavailable, or
   the product names a file this browser does not have. A working card shows
   neither. */
function cardPhotoNoteHTML(p){
  if (!attOn()){
    return '<div class="note warn">' + tr('att.offShort') + '</div>';
  }
  if (p.photoId && !attById(p.photoId)){
    return '<div class="note warn">' + tr('att.missing') + '</div>';
  }
  return '';
}
function cardDescHTML(p){
  var t = String(p.description || '').trim();
  return '<section class="card"><div class="t">' + tr('att.descTitle') + '</div>' +
    /* pre-wrap in the stylesheet keeps the owner's own line breaks AND his
       runs of spaces; substituting <br> would keep only the breaks */
    '<div class="b desc">' + (t ? esc(t) :
      '<span class="muted">' + tr('att.descEmpty') + '</span>') + '</div></section>';
}
function cardInvoicesHTML(p){
  if (!attOn()){
    return '<section class="card"><div class="t">' + tr('att.invoices') + '</div>' +
      '<div class="b"><div class="note warn">' + tr('att.offShort') + '</div></div></section>';
  }
  var rows = '', missing = 0;
  (p.invoiceIds || []).forEach(function(id){
    var m = attById(id);
    if (!m){ missing++; return; }

/* ---- writing what the form staged ---------------------------------- */
/* Called once per product a submit created or merged into. The product is
   already in `state`; this only moves the picture into IndexedDB and points
   product.photoId at it. A failure here leaves the product saved and says so
   — losing a whole invoice because one photo would not write would be worse. */
function attCommitStaged(p, photo, cb){
  if (!p || !photo || photo.busy || !attOn()){ cb(null); return; }
  if (!photo.blob){ cb(null); return; }
  var old = p.photoId;
  var meta = { id: uid('att'), kind:'photo', productId:p.id,
    name:String(photo.name || ''), mime:'image/jpeg', size:photo.size,
    addedAt: todayISO(), thumb:photo.thumb || '' };
  attPut(meta, photo.blob, function(err){
    if (err){ ui.attErr = tr('att.errSave', {err:String(err)}); cb(null); return; }
    p.photoId = meta.id;
    /* the picture it replaces is NOT deleted here: the caller commits first
       and drops afterwards, so a failed save() can never orphan a reference */
    cb(old || null);
  });
}
/** one after another, never all at once: a ten-item invoice would otherwise
    hold ten decoded pictures in memory at the same moment */
function attCommitEach(list, done){
  var i = 0, replaced = [];
  (function step(dropId){
    if (dropId) replaced.push(dropId);
    if (i >= list.length){ done(replaced); return; }
    var one = list[i++];
    attCommitStaged(one.p, one.photo, step);
  })(null);
}

function ledgerEvents(personId){
  var evts = [];
  actTx().forEach(function(t){
    if (t.personId !== personId) return;
    var p = productById(t.productId);
    evts.push({ date:t.date, createdAt:t.createdAt, kind:'take', txId:t.id,
      retN: retQtyOf(t.id), retLeft: retLeftOf(t),
      text: units(t.qty) + ' × ' + esc(p ? p.name : '—'),
      sub: tr('led.perUnit', {v: baseOne(t.unitPriceCents)}),
      delta: t.qty * t.unitPriceCents });
  });
  actPay().forEach(function(y){
    if (y.personId !== personId) return;
    evts.push({ date:y.date, createdAt:y.createdAt, kind:'pay',
      text: tr('led.payment'), sub: y.note ? esc(y.note) : '', delta: -y.amountCents });
  });
  /* ++++++ GOODS RETURN ++++++ возврат — своя строка ленты: минус на цену
     своей выдачи. txId на строке выдачи и retId на строке возврата несут
     кнопки «Возврат» и «Удалить»; retN — сколько по выдаче уже вернулось. */
  actRet().forEach(function(x){
    var t = txById(x.txId);
    if (!t || t.personId !== personId) return;
    var p2 = productById(t.productId);
    evts.push({ date:x.date, createdAt:x.createdAt, kind:'ret', retId:x.id,
      text: units(x.qty) + ' × ' + esc(p2 ? p2.name : '—'),
      sub: tr('led.perUnit', {v: baseOne(t.unitPriceCents)}),
      delta: -(x.qty * t.unitPriceCents) });
  });
  /* ++++++ R17 ++++++ Сравнение доведено до ПОЛНОГО. Раньше последняя
     строка возвращала -1 и на равных ключах — то есть компаратор говорил
     «a раньше b» и «b раньше a» одновременно. Это нарушение контракта
     Array.prototype.sort, и порядок таких записей оставался на усмотрение
     движка; здесь от него зависит ещё и накопленный остаток, который
     считается по ходу этого же порядка.
     Последний ключ — положение записи в исходном массиве. Своего id у
     события ленты нет, а индекс уникален всегда, так что одинаковых ключей
     не остаётся вовсе и порядок один и тот же от отрисовки к отрисовке. */
  evts = evts.map(function(e, i){ e.seq = i; return e; });
  evts.sort(function(a,b){
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    /* ++++++ GOODS RETURN ++++++ три рода вместо двух; порядок прежних
       двух не двигается: take < ret < pay. Сравнение по-прежнему тотальное. */
    if (a.kind !== b.kind){
      var ka = a.kind === 'take' ? 0 : (a.kind === 'ret' ? 1 : 2);
      var kb = b.kind === 'take' ? 0 : (b.kind === 'ret' ? 1 : 2);
      return ka - kb;
    }
    var ca = a.createdAt || '', cb = b.createdAt || '';
    if (ca !== cb) return ca < cb ? -1 : 1;
    return a.seq - b.seq;
  });

  var run = 0;
  return evts.map(function(e){ run += e.delta; e.run = run; return e; });
}
/* ++++++ GOODS RETURN ++++++ форма живёт в ленте карточки человека, под

/** Удаление возврата: штуки снова уходят со склада, долг возвращается.

}

/* =============================================== ВКЛАДКА «ВЫДАЧИ» == */
/* ++++++ R17 ++++++ Тоже доведено до полного: раньше при равных датах
   возвращалось -1, то есть «a позже b» и «b позже a» разом. Списки
   «Выдачи» и «Оплаты» сортируются этим сравнителем, и записи одного дня
   переставлялись между отрисовками. Порядок теперь один и тот же всегда. */
function cmpDateDesc(a,b){
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  var ca = a.createdAt || '', cb = b.createdAt || '';
  if (ca !== cb) return ca < cb ? 1 : -1;
  if (a.id === b.id) return 0;
  return a.id < b.id ? 1 : -1;
}

/* ---- поиск по списку -------------------------------------------------
 * Пришёл на место peopleChips(), который печатал кнопку на каждого человека:
 * лента росла вместе со списком людей и на телефоне уезжала за край.
 *
 * SEARCH — единственное место, где заводится новое поле поиска. Ключ записи
 * он же имя поля в `ui` и приставка к четырём id: <key>Input, <key>Field,
 * <key>Note, <key>Box.
 *   noun   — ключ NOUN для склонения в подписи («2 выдачи», но «5 выдач»)
 *   status — какой ключ `ui` держит фильтр по статусу, или null           */
var SEARCH = {
  txQuery:        { noun:'transaction', status:null,
                    title:function(){ return ''; },
                    hits:function(){ return txHits(); },
                    total:function(){ return actTx().length; },
                    list:function(){ return txListHTML(); } },
  payQuery:       { noun:'payment', status:null,
                    title:function(){ return ''; },
                    hits:function(){ return payHits(); },
                    total:function(){ return actPay().length; },
                    list:function(){ return payListHTML(); } },
  peopleQuery:    { noun:'person', status:'peopleStatus',
                    title:function(){ return ''; },
                    hits:function(){ return peopleHits(); },
                    total:function(){ return actPeople().length; },
                    list:function(){ return peopleListHTML(); } },
  sumPeopleQuery: { noun:'person', status:'sumStatus',
                    title:function(){ return tr('sum.whoOwes'); },
                    hits:function(){ return sumPeopleHits(); },
                    total:function(){ return actPeople().length; },
                    list:function(){ return sumPeopleListHTML(); } },
  sumStockQuery:  { noun:'product', status:null,
                    title:function(){ return tr('tab.products'); },
                    hits:function(){ return stockHits(); },
                    total:function(){ return actProducts().length; },
                    list:function(){ return stockListHTML(); } }
};

/* Три статуса из пяти. credit («Переплата») и none («Товар не брали») сюда не
   входят намеренно: они про людей без долга вовсе и видны при «Все». */
var FLT_ST = ['unpaid', 'partial', 'paid'];

/* Приведение к виду, по которому сравниваем: регистр, ё→е, лишние пробелы.
   ё→е потому, что «Фёдор» и «Федор» — один человек. */
function normQ(v){
  return String(v === null || v === undefined ? '' : v)
    .toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
}
/* Совпадение по словам: все слова запроса должны найтись где-то в строке,
   порядок не важен. «абд wadi» и «wadi абд» находят одно и то же. */
function qMatch(query, fields){
  var q = normQ(query), hay, words, i;
  if (!q) return true;
  hay = normQ(fields.join(' '));
  words = q.split(' ');
  for (i = 0; i < words.length; i++) if (hay.indexOf(words[i]) < 0) return false;
  return true;
}
/* Поля, по которым ищется человек. Телефон, город и магазин тоже: «худжанд»
   находит всех оттуда. note — потому что у записей до схемы 8 город и родня
   лежат именно в ней. */
function personFields(p){
  return [p.name, p.phone || '', p.city || '', p.shop || '', p.note || ''];
}
/* Строка под полем: сколько нашлось из скольких. Пока ничего не задано —
   просто общее число, чтобы место под подписью не прыгало. */
function searchNote(key){
  var cfg = SEARCH[key], total = cfg.total(), stKey = cfg.status;
  var active = normQ(ui[key]) || (stKey && ui[stKey]);
  if (!active) return total ? tr('srch.total', {n: nq(total, cfg.noun)}) : '';
  var found = cfg.hits().length;
  return tr('srch.found', {n: nq(found, cfg.noun), total: total});
}
function searchBar(key, ph){
  var q = ui[key], cfg = SEARCH[key], stKey = cfg.status, cur;
  var h = '<div class="sbox"><div class="srow">' +
    '<div class="sfield' + (q ? ' has' : '') + '" id="' + key + 'Field">' +
      '<span class="sic">' + ico('search') + '</span>' +
      '<input type="text" id="' + key + 'Input" data-s="' + key + '" value="' + esc(q) + '"' +
        ' placeholder="' + esc(ph) + '" autocomplete="off" spellcheck="false">' +
      '<button type="button" class="sclr" data-act="qclear" data-arg="' + key + '"' +
        ' title="' + esc(tr('srch.clear')) + '" aria-label="' + esc(tr('srch.clear')) + '">×</button>' +
    '</div>';
  if (stKey){

/* Пустой результат — не то же самое, что «пока ничего не было»: данные есть,
   просто запрос или фильтр их не поймал. Текст называет ровно ту причину. */
function noHits(key){
  var cfg = SEARCH[key], stKey = cfg.status;
  var q = normQ(ui[key]), st = stKey ? ui[stKey] : '', what;
  /* ++++++ EMPTY STATE ++++++ Ни запроса, ни фильтра — значит, список пуст
     САМ ПО СЕБЕ, а не потому, что что-то отсеяли. Это первый экран новой
     установки, и раньше на нём печаталось «Под «status.» никто не подходит»:
     tr('status.' + '') не находит ключа и возвращает сам ключ (R34).

     пустая карточка, что у любого другого пустого списка в файле. */
  if (!q && !st) return listCard(cfg.title(), '');

  else if (q)  what = tr('srch.none',   {q: esc(ui[key])});

/* ================================================ ++++++ PAY FILL ++++++ ==
 * R30. «Внести весь остаток» обязано остаток ЗАКРЫТЬ.
 *
 * Сумма хранится в базовых копейках, а вводится в валюте платежа, и переход
 * между ними один: toBaseCents(m, cur) = round(m * rate). При курсе больше
 * единицы шаг этой сетки КРУПНЕЕ копейки — 1 цент USD при 3.6725 это 3.67
 * филса, — и ровного m может не существовать вовсе. Остаток 150.00 AED не
 * выражается никаким целым числом центов: 40.84 USD дают 149.98, 40.85 дают
 * 150.02. Измерено на курсах по умолчанию: в USD не закрывается 72.8%
 * остатков, и в половине этих случаев остаётся ДОЛГ в одну-две копейки.
 * В TJS (курс 0.336, сетка мельче копейки) не промахивается никогда — вот
 * почему это «иногда».
 *
 * Убрать это округлением нельзя: round(cents / rate) и так выбирает лучшее
 * из возможных — если ровное m существует, оно его и находит. Дело не в
 * счёте, а в том, что сетка крупнее.
 *
 * ПРАВИЛО:
 *
 *   БЕРЁМ НАИМЕНЬШУЮ СУММУ, КОТОРОЙ ОСТАТКА ХВАТАЕТ.
 *
 * Наименьшее m с round(m * rate) >= cents. Когда ровное m есть — а в TJS
 * оно есть всегда — это ровно оно, и не меняется ничего. Когда его нет,
 * долг ЗАКРЫВАЕТСЯ, с переплатой в один шаг сетки (до 0.03 AED при курсе
 * USD), и переплата называется в подсказке. Человек уходит из должников,
 * статус становится «Оплачено» — а не висит копейками, как было.
 *
 * Округлять вниз было бы честнее арифметически и лживее по существу:
 * кнопка называется «весь остаток», и остаток после неё обязан быть нулём.
 */
function payFillMinor(cents, code){
  var r = rateOf(code);
  if (r === null) return null;
  if (cents <= 0) return 0;
  var m = Math.ceil((cents - 0.5) / r);
  if (m < 0) m = 0;
  /* Ceil на числах с плавающей точкой мог промахнуться на шаг в любую
     сторону. Доводим той же арифметикой, какой платёж будет сохранён.

     ++++++ DEAD WEIGHT ++++++ B9. И доводим ЕЮ САМОЙ: здесь стояло
     `Math.round(m * r)` — вторая текстовая копия правила из
     toBaseCents(), при том что комментарий обещал сверку «с самой
     toBaseCents(), а не с формулой, которая её приближает». Сегодня это
     то же число до копейки; разойдутся они молча, если правило округления
     когда-нибудь изменится, и кнопка «Внести весь остаток» перестанет
     закрывать долг — ровно дефект R30, который уже чинили. Жёсткое
     ограничение 4: второго перевода на входе не заводить.

     Оба цикла по-прежнему ограничены: toBaseCents(m, code) не убывает по m. */
  while (m > 0 && toBaseCents(m - 1, code) >= cents) m--;
  while (toBaseCents(m, code) < cents) m++;
  return m;
}
/** та же сумма готовым текстом поля, в валюте `code` */
function payFillText(code){
  /* ++++++ PAY LIVE ++++++ долг БЕЗ редактируемой оплаты: её собственная
     сумма не считается дважды. Читалось `st.outstandingCents`. */
  var m = payFillMinor(payDueCents(), code);
  return m === null ? '' : (m / 100).toFixed(2);
}
/* Что именно подставила кнопка: кому, в какой валюте, каким текстом и под
   какой остаток. Модульная переменная, не `state`: наполовину заполненной
   форме нечего делать в резервной копии — то же правило, что у moneyAnchor
   (область 33) и prodEditAnchor (область 41). */
var payFillAnchor = null;
function payFillMark(){
  var f = ui.form.pay, st = personStats()[f.personId];
  payFillAnchor = st ? { personId: f.personId, cur: f.cur, text: f.amount,
                         dueCents: st.outstandingCents } : null;
}
function payFillDrop(){ payFillAnchor = null; }
/** в поле всё ещё стоит ровно то, что подставила кнопка, и под тот же долг */
function payFillHeld(){
  var a = payFillAnchor, f = ui.form.pay;
  if (!a || a.personId !== f.personId || a.cur !== f.cur || a.text !== f.amount) return false;
  var st = personStats()[f.personId];
  return !!st && st.outstandingCents === a.dueCents;
}
/** на сколько базовых копеек то, что в поле, разойдётся с долгом */
function payFillOverCents(){
  /* ++++++ PAY LIVE ++++++ тот же долг, что и везде в этой форме */
  var gap = payGapCents();
  return gap < 0 ? -gap : 0;
}
/* ============================================= ++++++ PAY LIVE ++++++ ==
 * Остаток под полем суммы — живой, и кнопка ПРИБАВЛЯЕТ, а не заменяет.
 *
 * ЧТО БЫЛО. Подсказка печатала «Долг X» из `personStats()`, то есть долг
 * человека вообще: она не знала ни о том, что стоит в поле, ни о том, что
 * редактируется эта же оплата. Отсюда три вещи разом:
 *
 *   · в поле 39.97, под ним «Долг 0.03» — и «Внести весь остаток» СТИРАЛА
 *     39.97 и ставила 0.03. Сумма оплаты уменьшалась вместо того, чтобы
 *     стать полной;
 *   · сотрёшь 39.97 — под полем всё те же 0.03, хотя должен быть весь долг;
 *   · при правке оплаты её собственная сумма считалась дважды.
 *
 * ПРАВИЛО:
 *
 *   ПОД ПОЛЕМ СТОИТ ТО, ЧТО ОСТАНЕТСЯ, ЕСЛИ СОХРАНИТЬ ТО, ЧТО В ПОЛЕ.
 *
 * Отсюда всё остальное следует само. Кнопка добавляет ровно этот остаток —
 * значит, прибавляет, а не заменяет. Остаток нулевой — добавлять нечего, и
 * кнопка неактивна. Остаток отрицательный — это переплата, и она названа.
 *
 * СЧЁТ ИДЁТ В ЦЕЛЫХ МИНИМАЛЬНЫХ ЕДИНИЦАХ. Кнопка складывает `minor + add`
 * целыми числами в валюте формы, поэтому 39.97 + 0.03 — ровно 40.00, без
 * копеечных потерь. В базовые копейки это переводится один раз, там же, где
 * и всегда, — в `toBaseCents()` при сохранении.
 *
 * КУРСОР НЕ СБИВАЕТСЯ. Пересчёт идёт через `live()`, который переписывает
 * `#payHint` и переключает `disabled` у кнопки. Ни то, ни другое не предок
 * поля ввода — та же причина, по которой `liveSearch()` не трогает `input`
 * (область 12).
 * ================================================================== */

/** Долг этого человека БЕЗ учёта редактируемой оплаты: её собственная
 *  сумма не должна считаться дважды. Считается из тех же двух чисел, что
 *  и `personStats()`, — своей арифметики здесь нет. */
function payDueCents(){
  var f = ui.form.pay;
  if (!f.personId) return 0;
  var st = personStats()[f.personId];
  if (!st) return 0;
  var paid = st.paidCents;
  if (f.editId){
    var y = payById(f.editId);
    if (y) paid -= y.amountCents;
  }
  return Math.max(0, st.dueCents - paid);
}
/** Сколько базовых копеек ОСТАНЕТСЯ, если сохранить то, что в поле.
 *  Отрицательное — переплата. Валюта без курса читается как «ничего не
 *  внесено»: сумму всё равно не сохранить, и об этом говорит своя фраза. */
function payGapCents(){
  var f = ui.form.pay;
  var m = parseMoneyToCents(f.amount);
  var c = m === null ? 0 : toBaseCents(m, f.cur);
  return payDueCents() - (c === null ? 0 : c);
}
/** Есть ли что добавлять кнопкой. */
function payFillCan(){
  return payGapCents() > 0 && rateOf(ui.form.pay.cur) !== null;
}
/** Одна фраза об остатке — та самая, что стоит под полем. */
function payGapText(){
  var gap = payGapCents();
  if (gap >= 0) return tr('pay.left', { sum: secOne('payments', gap) });
  return tr('pay.overBy', { sum: secOne('payments', -gap) });
}
function payHintText(){
  var f = ui.form.pay, out = [];
  /* ++++++ PAY LIVE ++++++ здесь стоял долг человека вообще — величина, не
     зависящая ни от того, что набрано в поле, ни от того, что редактируется
     эта же оплата. Теперь стоит ОСТАТОК: сколько останется, если сохранить
     то, что в поле. Пересчитывается на каждый ввод через live(). */
  if (f.personId) out.push(payGapText());
  var m = parseMoneyToCents(f.amount);
  if (m !== null){
    var cents = toBaseCents(m, f.cur);
    if (cents === null) out.push(tr('conv.noRate', {cur: esc(f.cur)}));
    else out.push(tr('pay.willStore', {v: fmtMinor(m), cur: esc(f.cur),
      sum: money(cents, state.settings.baseCurrency), base: esc(state.settings.baseCurrency)}));
  }
  /* ++++++ PAY FILL ++++++ переплата называется — и только там, где она
     есть и где её сделала кнопка. Сообщение, печатающееся при любом
     исходе, перестаёт быть сведением (область 43). */
  /* Число переплаты называет строка остатка выше; здесь остаётся только
     ПРИЧИНА — и только там, где переплату сделала кнопка. */
  if (payFillHeld() && payFillOverCents() > 0) out.push(tr('pay.fillOver'));
  return out.join(' · ');
}

/* ++++++ RATE PAIR ++++++ раздел «Курсы»: разметка и сохранение.
 *
 * ТАБЛИЦА — СИБЛИНГ ПОЛЕЙ, А НЕ ИХ ПРЕДОК, и это то же правило, по
 * которому список поиска обязан быть соседом своего поля (хрупкое место
 * 12): live() переписывает узел таблицы на каждую набранную букву, и
 * попади поле внутрь него — курсор уезжал бы каждый раз.
 *
 * СООБЩЕНИЕ ОБ ОШИБКЕ ИДЁТ ТУДА ЖЕ, а не через ui.err. ui.err показывается
 * только полным render()'ом, а он перестраивает #app целиком — то есть
 * убивает курсор, ради сохранения которого всё и делается. Тот же приём,
 * что у подсказки формы оплаты.
 */
/** Шесть строк таблицы. Считает по НАБРАННОМУ: до сохранения тоже. */
function ratePairTableHTML(){
  var vals = ratePairVals(), all = ratePairAll(), h = '', i, j;
  for (i = 0; i < all.length; i++){
    for (j = 0; j < all.length; j++){
      if (i === j) continue;
      var from = all[i], to = all[j], v = ratePairFmt(ratePairOf(vals, from, to), from);
      h += row({ k: '1 ' + esc(from) + ' &rarr; ' + esc(to),
        sub: tr(from === RATE_ANCHOR ? 'rp.entered' : 'rp.derived'),
        v: v === null ? '&mdash;' : esc(v) + ' ' + esc(to) });
    }
  }
  return h;
}
/** Подпись под полями: либо что не читается, либо к чему курсы применятся.
 *  Один узел, два состояния — как подсказка формы оплаты. */
function ratePairNoteText(){
  var bad = ratePairBad();
  if (bad.length) return tr('rp.errRate', { anchor: esc(RATE_ANCHOR), cur: esc(bad.join(', ')) });
  return tr('rp.hint');
}
/** Карточка с двумя полями. Свой заголовок, потому что прежний — «Курсы» —
 *  остаётся у карточки, где живут базовая валюта и прочие курсы. */
function ratePairCardHTML(){
  var h = '<section class="card"><div class="t">' + tr('rp.title') + '</div><div class="b">' +
    '<form id="fRate" novalidate><div class="f"><div class="two">';
  RATE_TO.forEach(function(c){
    h += '<label class="f" style="margin:0"><span>' +
      tr('rp.field', { anchor: esc(RATE_ANCHOR), cur: esc(c) }) + '</span>' +

  });

/** Карточка таблицы. Узел с id — тот, что переписывает live(). */
function ratePairTableCardHTML(){
