/** копирование без сети и без разрешений: clipboard, иначе execCommand */
function copyText(text){
  var done = function(){ toast(tr('msg.phoneCopied'), 'ok'); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ copyFallback(text, done); });
      return;
    }
  } catch(e){}
  copyFallback(text, done);
}
function copyFallback(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly','readonly');
  ta.style.position = 'fixed'; ta.style.top = '-1000px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch(e){ toast(tr('msg.phoneCopyFail', {v: text}), 'warn'); }
  document.body.removeChild(ta);
}

function startProductEdit(id){
  var p = productById(id), st = productStats()[id];
  if (!p) return;
  /* себестоимость и цена лежат в БАЗОВОЙ валюте — форма открывается в ней же,
     чтобы сохранение без правок вернуло ровно те же целые числа */
  var b = state.settings.baseCurrency;
  /* ++++++ ATTACHMENTS ++++++ this replaces ui.form.product wholesale, so
     anything staged in the form being abandoned has to be released first. */
  stagedFreeAll();
  ui.form.product = { mode:'man', cur:b, vatOn:!!state.settings.vatOn,
    date: (p.batches[p.batches.length - 1] || {}).date || todayISO(), editId:p.id,

      qty: String(p.qty), cost: (st.avgCostCents / 100).toFixed(2),
      sell: (p.unitPriceCents / 100).toFixed(2), sellCur:b,
      /* ++++++ ATTACHMENTS ++++++ the text is prefilled; the picture is not
         staged at all — the form shows the one the product already has and
         only touches it if the owner asks. */
      desc: p.description || '', photo:null }] };

  /* ++++++ PRODUCT EDIT ++++++ R2. То же число, что легло в поле, — но
     в базовых копейках: сравнивать придётся с тем, что вернёт разбор
     формы, а не с текстом, который владелец мог перевыразить в другой
     валюте, ничего не вводя. */

function deleteTx(id){

     без выдачи — ссылка в никуда, validate() такой документ не примет.
     Когда возвраты есть, подтверждение называет их ДО выбора; без них
     диалог дословно прежний (область 44: предупреждение без повода). */
  var retN = 0, retQ = 0;

    trashMark(state, 'transactions', id, nowISO(), touch);

function eraseAll(){
  /* ++++++ RESCUE ++++++ см. выше */
  /* ++++++ DIALOGS SAY ++++++ R25. defaultState() возвращает к исходным
     базовую валюту, курсы, НДС и валюту «Сводки»; язык — единственное,
     что сохраняется намеренно. Перечисление в диалоге об этом молчало. */
  var resetBody = tr('dlg.resetBody') +
    '<p>' + tr('dlg.resetAlso') + '</p>' +
    (rescBlocked() ? '<p>' + tr('resc.eraseWarn') + '</p>' : '');
  confirmBox(tr('dlg.resetTitle'), resetBody, tr('dlg.resetOk'), true).then(function(okd){
    if (!okd) return;
    rescAllow();
    /* ++++++ ACCOUNT BIND ++++++ данных этой учётной записи на
       устройстве больше нет — значит и привязки быть не должно. */
    if (modeIsProduct()){
      var syncO = syncRead();
      if (syncO){ syncWrite(bindResetSync(bindClear(syncO))); }
    }
    /* ++++++ ERASE KEEPS ++++++ R25. Настройки снимаются ДО того, как
       документ заменён: после `defaultState()` прежних значений нет нигде. */
    var keptSettings = state.settings;
    state = defaultState();
    state.settings = eraseSettings(keptSettings, state.settings);
    state.settings.lang = getLang();
    ui.attErr = '';
    ui.detail = null; ui.report = { productId:'', from:'', to:'' }; ui.reportPreset = 'all';
    ui.txQuery = ui.payQuery = ui.peopleQuery = ui.sumPeopleQuery = ui.sumStockQuery = '';
    ui.peopleStatus = ui.sumStatus = '';
    resetForms();
    toast(tr('msg.erased'), 'ok');
    /* ++++++ ATTACHMENTS ++++++ "erase all data" means the files too — but in
       the same order as every other deletion: the empty document reaches the
       disk first, and only a successful save may destroy the bytes it stopped
       naming. If the save fails, localStorage still holds the old document and
       its files are still there to go with it. */
    var wiped = save();
    render();
    if (wiped) attClear(function(err){
      if (err){ ui.attErr = tr('att.errSave', {err:String(err)}); render(); }
    });

  });
}

/* ================================================== ОБРАБОТКА КЛИКОВ == */
function closeAc(){

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  /* ++++++ DISPLAY CURRENCY ++++++ щелчок мимо — с анимацией: здесь, в
     отличие от нажатия на другое действие, больше ничего не происходит, и
     уход ряда это единственное, что видно. Фокус при этом НЕ возвращается на
     плитку: щёлкнули куда-то ещё — там он и нужен. Убирает ряд dcPaint(),
     поэтому щелчок в поле поиска или в поле даты не пересобирает #app и не
     теряет курсор (хрупкое место 12). */
  if (!el){ closeAc(); dcClose(false); return; }
  var act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg') || '';
  if (act !== 'ac-pick') closeAc();
  handleAct(act, arg, e, el);
});
function handleAct(act, arg, e, srcEl){
  /* ++++++ ATTACHMENTS ++++++ the message about a file that could not be
     attached stays until the owner does something else. */
  if (act.indexOf('att-') !== 0 && act !== 'dismiss') ui.attErr = '';
  /* ++++++ DISPLAY CURRENCY ++++++ */
  if (ui.dcOpen && act !== 'dc' && act !== 'dc-open'){ ui.dcOpen = false; dcPaint(); }
  if (act === 'dismiss'){
    var a = srcEl.closest('[data-banner]');
    if (a) a.remove();
    return;
  }
  if (act === 'tab'){ showTab(arg); return; }
  if (act === 'seg'){
    var p = arg.split(':');
    ui.tab = p[0]; ui.seg[p[0]] = p[1]; ui.detail = null; ui.err = '';
    render(); window.scrollTo(0,0); return;
  }
  if (act === 'setf'){ var q = arg.split('='); setF(q[0], q[1]); render(); return; }
  if (act === 'back'){ ui.detail = null; ui.err = ''; render(); window.scrollTo(0,0); return; }
  if (act === 'theme'){ ui.theme = ui.theme === 'dark' ? 'light' : 'dark'; render(); return; }
  if (act === 'theme-set'){ ui.theme = arg; render(); return; }
  if (act === 'period'){
    ui.reportPreset = arg;
    if (arg === 'all'){ ui.report.from = ''; ui.report.to = ''; }
    else if (arg === 'month'){ var b = monthBounds(0); ui.report.from = b.from; ui.report.to = b.to; }
    else if (arg === 'prev'){ var b2 = monthBounds(1); ui.report.from = b2.from; ui.report.to = b2.to; }
    render(); return;                     /* фильтры только читают: ни commit(), ни save() */
  }
  /* ++++++ DISPLAY CURRENCY ++++++ плитка валюты в углу «героя».
     Только открыть: пока ряд раскрыт, кнопки с этим действием на экране нет
     вовсе — плитка И ЕСТЬ ряд, — а «героя» с плиткой на экране всегда один.
     Ветка «закрыть» здесь была бы кодом, до которого невозможно доехать;
     закрывают ряд нажатие на выбранную валюту, Escape и щелчок мимо. */
  if (act === 'dc-open'){ dcOpen(); return; }
  /* Выбор валюты в ряду. Меняется ОДНО поле настроек — ни одна продажа,
     оплата, партия и ни один товар не трогаются. save() без commit():
     сохранить надо предпочтение, а не результат правки записи. ui.seg,
     ui.reportPreset, ui.report и строки поиска остаются как были — их
     render() не сбрасывает.

     Порядок здесь важен: цифры пересчитываются в ЭТОМ же render(), сразу,
     а ряд в нём же получает класс .out и уезжает сам. Ждать конца анимации,
     чтобы показать новые суммы, значило бы подвесить ответ на полторы
     десятых секунды ради красоты.

     Нажатие на УЖЕ выбранную валюту — это «повторное нажатие на квадратик»:
     условие ниже не выполняется, ничего не сохраняется и не пересчитывается,
     ряд просто закрывается. Отдельная ветка для этого была бы обработчиком
     без своего действия. */
  if (act === 'dc'){
    /* Случайный двойной тап по плитке приходит на крайнюю правую ячейку, а в
       ней стоит уже выбранная валюта: условие ниже не выполнится, ничего не
       сохранится, ряд просто закроется. Отдельная защита по времени поэтому
       не нужна — и её здесь больше нет. */
    if (arg && arg !== dcCur()){

  if (act === 'qclear'){

    if (inp){ inp.value = ''; liveSearch(qp[0]); inp.focus(); } else render();

  }
  if (act === 'fltopen'){ statusFilterSheet(arg); return; }
  /* ++++++ REMAINDER REPORT ++++++ окно только читает: ни commit(), ни save(). */
  if (act === 'rem-open'){ remOpen(); return; }
  /* ++++++ REMINDER LIST ++++++ копирование тоже только читает.
     stopPropagation() здесь — объявление намерения, а не защита: кнопка

  if (act === 'rmd-copy'){ if (e && e.stopPropagation) e.stopPropagation(); rmdCopy(arg); return; }
  if (act === 'fltset'){
    var fp = arg.split(':');

    /* Лист закрываем сами: render() перерисовывает #rail, #bar и #app, но не

    var fback = document.querySelector('.modal-back');
    if (fback) fback.remove();
    /* render(), а не liveSearch(): меняется ещё и подпись на кнопке фильтра.

    render();

  }

  if (act === 'open-product'){ ui.tab = 'products'; ui.detail = {type:'product', id:arg}; ui.err=''; render(); window.scrollTo(0,0); return; }
  if (act === 'contact'){ var per = personById(arg); if (per) contactSheet(per); return; }
  if (act === 'go-pay'){
    resetPayForm(arg);

  if (act === 'pay-fill'){

    /* ++++++ PAY LIVE ++++++ ПРИБАВЛЯЕТ, а не заменяет: в поле остаётся то,

  if (act === 'att-pick'){

     handler with no emitter, which is the drift this project calls R18. */
  if (act === 'att-drop'){ photoDrop(arg); return; }

  /* ++++++ BACKUP REMINDER ++++++ «Напомнить позже».
     Кнопки «Скачать копию» здесь нет намеренно: она несёт data-act="export"
     и попадает в ту же ветку, что и строка во вкладке «Ещё → Данные». Путь
     экспорта в приложении один, и второй тут не заводится. */
  if (act === 'bak-later'){
    var bl = bakRead() || { at:null, sig:'', n:{prod:0,ppl:0,tx:0,pay:0}, snooze:0 };
    bl.snooze = new Date().getTime() + BAK_SNOOZE_DAYS * BAK_DAY_MS;
    bakWrite(bl);
    ui.bakHidden = true;      /* и на эту сессию — даже если запись не прошла */
    bakBarPaint();
    toast(tr('bk.snoozed', {n: nq(BAK_SNOOZE_DAYS, 'day')}), 'info');
    return;
  }
  /* ++++++ RATELOG FOLD ++++++ ничего не сохраняет и ничего не считает */
  if (act === 'ratelog'){ rateLogToggle(); return; }
  if (act === 'cur-edit'){ rateSheet(arg); return; }
  if (act === 'export'){ exportBackup(); return; }
  if (act === 'import-click'){ $('importInput').click(); return; }
  if (act === 'reset'){ eraseAll(); return; }
  /* ++++++ TWO WINDOWS ++++++ выход из устаревшего окна — перечитать документ.
     Ничего не сохраняет: перезагрузка и есть отказ от своей копии. */
  if (act === 'xtab-reload'){ location.reload(); return; }
  /* ++++++ SELF UPDATE ++++++ */
  if (act === 'upd-goto'){ removeBanner('upd'); ui.tab = 'more'; ui.seg.more = 'data';
    ui.detail = null; render(); window.scrollTo(0,0); return; }
  if (act === 'upd-check'){ updCheckNow(); return; }
  if (act === 'upd-install'){ updInstallNow(); return; }
  if (act === 'upd-rollback'){ updRollbackNow(); return; }
  /* ++++++ PRODUCT UPDATE ++++++ */
  if (act === 'upd-open'){ pubOpenNow(); return; }
  /* ++++++ SYNC ++++++ */
  /* ++++++ GDRIVE ++++++ четыре действия продуктового режима. Обмен и
     разрешение расхождения общие: sync-now и sync-conf работают в
     обоих режимах. */
  if (act === 'gd-signin'){ gdSignIn(); return; }
  if (act === 'gd-signout'){ gdSignOut(); return; }
  if (act === 'gd-fixremote'){ gdFixRemote(); return; }
  if (act === 'sync-connect'){ syncConnect(); return; }
  if (act === 'sync-forget'){ syncForgetAll(); return; }
  if (act === 'sync-now'){ syncRun(true); return; }
  if (act === 'sync-conf'){ syncConflictSheet(); return; }
  /* ++++++ BASE UNDO ++++++ R9. Возврат двигает деньги, поэтому спрашивает —
     как и всякое разрушительное действие в этом файле (жёсткое условие 8). */
  if (act === 'base-undo'){
    if (!baseUndoCan()) return;
    confirmBox(tr('dlg.baseUndoTitle'),
               tr('dlg.baseUndoBody', { cur: esc(state.settings.baseUndo.from) }),
               tr('dlg.baseUndoOk'), true).then(function(okd){
      if (okd) baseUndoApply();
    });
    return;
  }
  /* ++++++ RESCUE ++++++ все три только читают документ и не трогают
     ни одной записи: скачать, освободить запас, разрешить запись. */
  if (act === 'resc-get'){ rescGet(); return; }
  if (act === 'resc-forget'){ rescForget(); return; }
  if (act === 'resc-over'){ rescOverwrite(); return; }
  /* ++++++ COST HISTORY ++++++ только читает: отдаёт текст, который
     ЕЩЁ лежит в хранилище. */
  if (act === 'load-get'){ loadRawGet(); return; }
}

/* На телефоне системной полосы нет (её прячет CSS). Эта плашка живёт
   только во время прокрутки и гаснет через четверть секунды после неё. */
var sbar = null, sbarTimer = null;
function scrollbar(){
  if (!sbar){
    sbar = document.createElement('i');
    sbar.className = 'sbar';
    document.body.appendChild(sbar);
  }
  if (sbar.offsetWidth === 0) return;          /* на компьютере скрыта */
  var doc = document.documentElement;
  var full = Math.max(doc.scrollHeight, document.body.scrollHeight);
  var vh = window.innerHeight;
  if (full <= vh + 4){ sbar.className = 'sbar'; return; }
  var pad = 6, track = vh - pad * 2;
  var th = Math.max(28, Math.round(track * vh / full));
  var top = pad + Math.round((track - th) * (doc.scrollTop || document.body.scrollTop) / (full - vh));
  sbar.style.height = th + 'px';
  sbar.style.transform = 'translateY(' + top + 'px)';
  sbar.className = 'sbar on';
  if (sbarTimer) clearTimeout(sbarTimer);
  sbarTimer = setTimeout(function(){ sbar.className = 'sbar'; }, 260);
}
window.addEventListener('scroll', scrollbar, false);
window.addEventListener('resize', function(){ if (sbar) sbar.className = 'sbar'; }, false);

 *                    ОБНОВЛЕНИЕ: ПОКАЗ И ДЕЙСТВИЯ
 *
 * Решения принимает update.js; здесь — карточка, три действия и связь с

var updState = updStateNew();

function updBridge(){

  }
  h += '<div class="rb">' +

       esc(updState.checking ? tr('up.checking') : tr('up.check')) + '</button>' +
       (updState.found ? ' <button type="button" class="go" data-act="upd-install">' +
                         esc(updState.busy ? tr('up.installing') : tr('up.install')) + '</button>' : '') +
       (updState.canRollback ? ' <button type="button" data-act="upd-rollback">' +
                               esc(tr('up.rollback')) + '</button>' : '') +

  } else if (updState.at){
    h += '<div class="note">' + esc(tr('up.latest')) + '</div>';
  }
  /* ++++++ PRODUCT UPDATE ++++++ в личном режиме возвращает '' */
  h += pubNoteHTML();

     ещё не выкладывали» и «слишком часто» личному словарю неизвестны, и
     он назвал бы их чужой бедой. */
  if (updState.err) h += '<div class="note err">' +
      esc(tr(modeIsProduct() ? pubErrKey(updState.err) : updErrKey(updState.err))) + '</div>';

function updCheckNow(){
  /* ++++++ PRODUCT UPDATE ++++++ публичный репозиторий и никакого
     токена. Дорога личной сборки ниже не меняется ни на байт: у неё
     свой приватный репозиторий и свой ключ. */
  if (modeIsProduct()){ pubCheckNow(); return; }
  var cfg = syncCfgFull();
  if (!cfg){ updState.err = 'off'; render(); return; }
  updState.checking = true; updState.err = ''; render();
  updCheck(cfg, function(err, info){
    updState.checking = false;
    updState.at = nowISO();
    if (err){ updState.err = err; updState.found = null; render(); return; }
    updState.found = info;
    render();
  });
}

function updInstallNow(){
  /* ++++++ PRODUCT UPDATE ++++++ */
  if (modeIsProduct()){ pubInstallNow(); return; }
  var cfg = syncCfgFull(), br = updBridge();
  if (!cfg || !br || !updState.found) return;
  if (updState.busy) return;
  updState.busy = true; updState.err = ''; render();
  updApply(cfg, updState.found, br, function(err, r){
    updState.busy = false;
    if (err){ updState.err = err; render(); return; }
    toast(tr('up.done'), 'ok');
    /* Перезагрузка — дело оболочки: она знает, откуда теперь брать ядро. */
    if (br.restart) br.restart();
    else if (r && r.restart) location.reload();
  });
}

function updRollbackNow(){
  var br = updBridge();
  if (!br || !br.coreRollback) return;
  confirmBox(tr('up.rbTitle'), tr('up.rbBody'), tr('up.rollback'), true).then(function(okd){
    if (!okd) return;
    br.coreRollback().then(function(r){
      if (!r || !r.ok){ updState.err = 'install'; render(); return; }
      toast(tr('up.rolledBack'), 'ok');
      if (br.restart) br.restart();
    })['catch'](function(){ updState.err = 'install'; render(); });
  });
}

/* Откуда открыто ядро и есть ли куда откатываться — спрашиваем оболочку
   один раз при старте. */
function updBoot(){
  var br = updBridge();
  if (!br || !br.coreInfo) return;
  var p = br.coreInfo();
  if (!p || !p.then) return;
  p.then(function(i){
    updState.canRollback = !!(i && i.canRollback);
    updState.source = (i && i.source) || 'packaged';
    /* ++++++ PRODUCT UPDATE ++++++ версия ОБОЛОЧКИ и способ установки.
       Старый мост их не сообщает — тогда версия остаётся пустой, и
       решение выходит осторожным: «поставьте новый пакет». */
    updState.shell = (i && i.shell) ? String(i.shell) : '';
    updState.installer = (i && i.installer) ? String(i.installer) : '';
    updSilent();
  })['catch'](function(){ updSilent(); });
}

/* ПРОВЕРКА ПРИ ЗАПУСКЕ. Владелец просил, чтобы не приходилось делать
   всё руками: искать обновление сам он не должен. Проверка тихая — ни
   диалога, ни установки: она только СТАВИТ ПОЛОСУ, а нажатие остаётся
   за владельцем. Починка, приехавшая посреди работы, хуже починки,
   приехавшей минутой позже.
   Отказ здесь не говорит ничего: при старте сети может не быть, и
   баннер об этом — шум, о котором никто не просил. Нажатие «Проверить»
   тот же отказ покажет, и вот тогда о нём спросили. */
function updSilent(){
  var cfg = (typeof syncCfgFull === 'function') ? syncCfgFull() : null;
  if (!cfg || !updBridge()) return;
  updCheck(cfg, function(err, info){
    if (err || !info) return;
    updState.found = info;
    updState.at = nowISO();
    updBarPaint();
  });
}

/* ================================================== ++++++ SYNC ++++++ ==
 *                     ОБВЯЗКА ОБМЕНА В ПРИЛОЖЕНИИ
 *
 * Ниже — ПОКАЗ и СВЯЗЬ С ПЛАТФОРМОЙ. Решения принимают mergeDocs() и
 * syncCycle(); здесь только то, чего они не умеют: спросить мост о
 * токене, нарисовать состояние и позвать владельца, когда две версии
 * записи разошлись.
 * ====================================================================== */

var syncStatus = syncStatusNew();
var syncTokenCache = '';       /* только в памяти сеанса; в документ не идёт */

/* Мост есть — приложение установлено, и токену есть где лежать. Обычный
   браузер моста не имеет, и раздел честно это объясняет. */
function syncBridge(){
  return (typeof window !== 'undefined' && window.GTBridge) ? window.GTBridge : null;
}

function syncCfgFull(){
  /* ++++++ GDRIVE ++++++ продуктовая сборка возит через Диск владельца:
     ни репозитория, ни токена GitHub у неё нет и быть не может. */
  if (modeIsProduct()){
    if (!gdTokens) return null;
    var g = syncRead() || {};
    return { kind: 'drive', auth: gdAuthLive, fileId: g.fileId || '' };
  }
  var o = syncRead();
  if (!o || !o.on || !o.owner || !o.repo) return null;
  if (!syncTokenCache) return null;
  return { token: syncTokenCache, owner: String(o.owner), repo: String(o.repo),
           path: String(o.path || 'data.json'), branch: String(o.branch || 'main'),
           sha: o.sha || '', dev: String(o.dev || '') };
}

/* Приватность репозитория — ПО ФАКТУ, а не по обещанию: в данных имена,
   телефоны и долги живых людей. Публичный отвергается прежде, чем в него
   уедет первая запись. */
function syncCheckPrivate(cfg, cb){
  var url = 'https://api.github.com/repos/' + encodeURIComponent(cfg.owner) +
            '/' + encodeURIComponent(cfg.repo);
  ghReq(cfg, 'GET', url, null, function(err, j){
    if (err){ cb(err); return; }
    if (!j || typeof j['private'] !== 'boolean'){ cb('server'); return; }
    cb(j['private'] ? null : 'public');
  });
}

function syncErrText(key){
  if (modeIsProduct()) return tr(gdErrKey(key));
  var M = { net:'sy.eNet', auth:'sy.eAuth', notfound:'sy.eNotFound',
            'public':'sy.ePublic', newer:'sy.eNewer', busy:'sy.eBusy',
            nofetch:'sy.eNoBridge', off:'sy.eNoBridge', fill:'sy.eFill' };
  return tr(M[key] || 'sy.eServer');
}

/* Сколько изменений не отправлено — из отпечатков последнего удачного
   обмена, тем же способом, каким слияние понимает «менялось». */
function syncPending(){
  var o = syncRead();
  if (!o || !o.base) return 0;
  return pendingCount(state, o.base, state.syncTombs || {});
}

function syncCardHTML(){
  /* ++++++ GDRIVE ++++++ развилка по режиму, и ни одна ветка не знает о
     другой: личная печатает то же, что печатала вчера, до байта. */
  if (modeIsProduct()) return gdCardHTML();

  h += '<div class="note">' + tr('sy.what') + '</div>';

  h += field({ label: tr('sy.repo'), control: '<input id="syRepo" value="' + esc(o.repo || '') + '" autocomplete="off">' });
  h += field({ label: tr('sy.path'), control: '<input id="syPath" value="' + esc(o.path || 'data.json') + '" autocomplete="off">' });
  h += field({ label: tr('sy.dev'), control: '<input id="syDev" value="' + esc(o.dev || '') + '" autocomplete="off">',
               hint: tr('sy.devHint') });
  h += field({ label: tr('sy.token'), control: '<input id="syToken" type="password" value="" autocomplete="off">',
               hint: tr('sy.tokenKept') });
  h += '<div class="rb">' +
       '<button type="button" class="go" data-act="sync-connect">' + esc(tr('sy.connect')) + '</button> ' +
       (o.on ? '<button type="button" data-act="sync-now">' + esc(tr('sy.now')) + '</button> ' +

  var line;

  else if (syncStatus.busy) line = tr('sy.busy');

  h += '</div></section>';

/* Окно разрешения: обе версии на виду, решение — владельца. */
function syncConflictSheet(){
  var c = syncStatus.conflicts[0];
  if (!c) return;
  var name = function(r){
    if (!r) return '—';
    return esc(String(r.name || r.note || r.id || '—'));
  };
  dialog({
    title: tr('sy.cTitle'),
    html: '<div class="note">' + esc(tr('sy.cBody', {n: syncStatus.conflicts.length})) + '</div>' +
          '<div class="row"><div class="k"><b>' + name(c.local) + '</b>' +
          '<small>' + esc(c.localAt || '') + '</small></div></div>' +
          '<div class="row"><div class="k"><b>' + name(c.remote) + '</b>' +
          '<small>' + esc(c.remoteAt || '') + '</small></div></div>',
    buttons: [{ key:'mine', label: tr('sy.cMine') },
              { key:'theirs', label: tr('sy.cTheirs'), variant:'primary' }]
  }).then(function(k){
    if (!k) return;
    if (k === 'theirs' && c.remote){
      var col = c.collection, list = state[col] || [], i;
      for (i = 0; i < list.length; i++) if (list[i].id === c.id){ list[i] = c.remote; break; }
      touch(c.id);
    }
    syncStatus.conflicts.shift();
    syncBarPaint();
    commit();
  });
}

/* Окружение для syncCycle(): всё, чего он не умеет сам. */
function syncEnv(){
  /* ++++++ TRANSPORT ++++++ ОДИН транспорт на весь оборот, и это не
     стиль. Транспорт Drive ХРАНИТ номер найденного файла; у GitHub
     такого состояния нет — sha приезжает из настроек. Транспорт,
     созданный заново на запись, номера не знает, ищет файл сам,
     находит СВОЙ и читает его как чужой: «второе устройство писало
     одновременно с нами» на единственном устройстве. Повтор оборота
     берёт его же и упирается в то же самое. */
  var syncTport = transportFor(syncCfgFull());
  return {
    cfg: syncCfgFull,
    localDoc: function(){ return state; },
    baseHashes: function(){ var o = syncRead(); return (o && o.base) || {}; },
    tombs: function(){ return state.syncTombs || {}; },
    meta: function(){
      var o = syncRead() || {};
      return { updatedBy: o.dev || '', settingsAt: o.settingsAt || '', map: state.syncMeta || {} };
    },
    /* Резервная копия ПЕРЕД применением. На диск она не пишется: файл
       спросил бы владельца, куда его класть, посреди обмена. Копия
       ложится в своё место хранилища и переживает применение. */
    backup: function(text, done){
      try{ window.localStorage.setItem('goods-tracker/pre-sync-v1', text); }catch(e){}
      done();
    },
    apply: function(doc, done){
      /* Пришедшее — ВХОДЯЩИЕ ДАННЫЕ, и идёт оно тем же входом, что файл
         резервной копии и localStorage: другого входа в документ нет. */
      var res;
      try{ res = validate(JSON.parse(JSON.stringify(doc))); }
      catch(e){ done('parse'); return; }
      if (!res.ok){ done(res.error); return; }
      state = res.data;
      save();
      render();
      done(null);
    },
    /* ++++++ TRANSPORT ++++++ куда возить — решает РЕЖИМ СБОРКИ, и
       решает один раз. Смешивать две дороги в одном сеансе нельзя: это
       две копии документа, расходящиеся молча. */
    tGet: function(cb){ syncTport.get(cb); },
    tPut: function(text, version, counts, cb){
      syncTport.put(text, version, counts, cb);
    },
    remember: function(o){
      var cur = syncRead() || {};
      cur.version = o.version; cur.base = o.base; cur.at = o.at; cur.settingsAt = nowISO();
      syncWrite(cur);
      state.syncTombs = o.tombs || {};
      state.syncMeta = o.meta || {};
      save();
    }
  };
}

/* Один обмен. Зовётся кнопкой, стартом приложения и отложенной отправкой. */
function syncRun(loud){
  if (!syncCfgFull()){ if (loud){ syncStatus.err = 'off'; render(); } return; }
  if (syncStatus.busy) return;
  syncStatus.busy = true;
  syncStatus.err = '';
  if (loud) render();
  syncCycle(syncEnv(), function(r){
    syncStatus.busy = false;
    if (r && r.ok){
      syncStatus.err = '';
      syncStatus.conflicts = r.conflicts || [];
      syncBarPaint();
      /* ++++++ GDRIVE ++++++ дорога у режимов разная, и сообщение об
         успехе обязано её называть: в продуктовой сборке нет ни
         репозитория, ни учётной записи GitHub, и слово «GitHub» на
         экране владельца — про чужой механизм. */
      if (loud) toast(tr(modeIsProduct() ? 'gd.okNow' : 'sy.okNow'), 'ok');
    } else {
      syncStatus.err = (r && r.err) || 'server';
      if (r && r.conflicts && r.conflicts.length){
        syncStatus.conflicts = r.conflicts;
        syncBarPaint();
      }
    }
    render();
  });
}

/* Подключение: сохранить настройки, спрятать токен в хранилище платформы
   и убедиться, что репозиторий приватный. */
function syncConnect(){
  var br = syncBridge();
  if (!br){ syncStatus.err = 'nofetch'; render(); return; }
  var pick = function(id){
    var el = $(id);
    return (el && el.value ? String(el.value) : '').replace(/^\s+|\s+$/g, '');
  };
  var owner = pick('syOwner'), repo = pick('syRepo');
  var pth = pick('syPath') || 'data.json', dev = pick('syDev'), tok = pick('syToken');
  if (!owner || !repo || (!tok && !syncTokenCache)){ syncStatus.err = 'fill'; render(); return; }

  var use = tok || syncTokenCache;
  syncCheckPrivate({ token: use, owner: owner, repo: repo }, function(err){
    if (err){ syncStatus.err = err; render(); return; }
    var o = syncRead() || {};
    o.on = true; o.owner = owner; o.repo = repo; o.path = pth; o.dev = dev;
    o.branch = o.branch || 'main';
    syncWrite(o);
    syncTokenCache = use;
    if (tok && br.tokenSet) br.tokenSet(tok);
    syncStatus.err = '';
    toast(tr('sy.connected'), 'ok');
    render();
    syncRun(false);
  });
}

/* Отключение на ЭТОМ устройстве: уходят токен и настройки, записи
   остаются. Надгробия и метки тоже остаются — они часть документа. */
function syncForgetAll(){
  var br = syncBridge();
  syncCancelPending();
  syncForget();
  syncTokenCache = '';
  if (br && br.tokenClear) br.tokenClear();
  syncStatus = syncStatusNew();
  removeBanner('sync-conf');
  toast(tr('sy.gone'), 'ok');
  render();
}

/* Токен со старта: он в хранилище платформы, а не в документе. */
function syncBoot(){
  if (modeIsProduct()){ gdBoot(); return; }
  var br = syncBridge();
  if (!br || !br.tokenGet) return;
  var p = br.tokenGet();
  if (!p || !p.then) return;
  p.then(function(r){
    syncTokenCache = (r && r.token) || '';
    if (!syncTokenCache) return;
    syncRun(false);
  })['catch'](function(){});
}


/* ==================================================================
 * ++++++ GDRIVE APP ++++++      ОБВЯЗКА ВХОДА И ОБМЕНА В ПРИЛОЖЕНИИ
 *
 * ES5. Ниже — ПОКАЗ и СВЯЗЬ С ПЛАТФОРМОЙ, ровно как в блоке
 * «ОБВЯЗКА ОБМЕНА В ПРИЛОЖЕНИИ» у обмена через GitHub.
 *
 * Решения принимают gdrive.js (разговор с Google), bind.js (чьи это
 * данные), mergeDocs() и syncCycle(). Здесь только то, чего они не
 * умеют: спросить мост об окне входа и о ключе, нарисовать состояние и
 * позвать владельца, когда вошла другая учётная запись.
 * ================================================================== */

/* Ключи ЭТОГО сеанса. Долгоживущий лежит в хранилище системы и сюда
   поднимается при старте; короткий живёт час и в хранилище не попадает
   вовсе — он пережил бы закрытие программы, не давая взамен ничего. */
var gdTokens = null;
var GD_SLOT = 'google-refresh';

function gdBridge(){
  return (typeof window !== 'undefined' && window.GTBridge) ? window.GTBridge : null;
}

/* Умеет ли эта оболочка то, что нужно продуктовому режиму. Старая
   оболочка (та, что знает только токен GitHub) честно отвечает «нет», и
   раздел говорит об этом словами, а не молчит и не притворяется, что
   нет сети. */
function gdBridgeReady(){
  var br = gdBridge();
  return !!(br && br.secretGet && br.secretSet && br.secretClear && br.oauthOpen);
}

/* ------------------------------------------------------------------ */
/* ++++++ SECRET IN SHELL ++++++ секрет клиента живёт в ОБОЛОЧКЕ      */
/* ------------------------------------------------------------------ */
/* ПОЧЕМУ НЕ В ЯДРЕ. Ядро уезжает в ПУБЛИЧНЫЙ репозиторий релизов —
   самообновление берёт его оттуда. Секрет, положенный в ядро, лежал бы
   там текстом, который открывается в браузере и находится поиском, и
   git помнил бы его навсегда: убрать можно только пересозданием
   репозитория и сменой секрета в Google Cloud. Внутри установщика на
   78 МБ он тоже есть, но это другое дело — там его надо доставать.

   ПРАВИЛО: секрет — свойство УСТРОЙСТВА, а не программы. Оболочка
   стоит на конкретной машине и уже хранит там ключ пользователя;
   секрету место рядом с ключом.

   СТАРЫЙ ШТАМП ПОБЕЖДАЕТ. Нынешние установленные пакеты собраны с
   секретом внутри ядра, и такое устройство обязано продолжать
   работать: если штамп непустой, берётся он и никто ни о чём не
   спрашивается.

   ПУСТОЙ СЕКРЕТ — НЕ МОЛЧАНИЕ. Google отвечает на такой обмен внятно,
   и ответ уже разобран: gdErrOf() возвращает 'needsecret', а словарь
   печатает, что делать. */
var gdSecretCache = null;

function gdSecret(cb){
  if (GOOGLE_CLIENT_SECRET){ cb(GOOGLE_CLIENT_SECRET); return; }
  if (gdSecretCache !== null){ cb(gdSecretCache); return; }
  var br = gdBridge();
  if (!br || !br.clientSecret){ cb(''); return; }
  var p;
  try { p = br.clientSecret(); } catch(e){ cb(''); return; }
  if (!p || !p.then){ cb(''); return; }
  p.then(function(r){
    gdSecretCache = (r && r.value) ? String(r.value) : '';
    cb(gdSecretCache);
  })['catch'](function(){ cb(''); });
}

/* ------------------------------------------------------------------ */
/* Живой короткий ключ — ЕДИНСТВЕННОЕ место обновления                */
/* ------------------------------------------------------------------ */
/* Требование «centralized token refresh»: два места, которые обновляют
   ключ, дадут две гонки за один ключ и один отзыв на двоих. */
function gdAuthLive(cb){
  if (!gdTokens || !gdTokens.refresh){ cb('off'); return; }
  if (!gdNeedsRefresh(gdTokens, new Date().getTime())){ cb(null, gdTokens.access); return; }
  /* ++++++ SECRET IN SHELL ++++++ */
  gdSecret(function(secret){
  gdRefresh(GOOGLE_CLIENT_ID, secret, gdTokens.refresh, function(err, t){
    if (err){
      /* Отозванный доступ — не сетевая беда: чинится только новым
         входом, и сказать об этом надо словами. */
      if (err === 'auth') gdForgetTokens();
      cb(err); return;
    }
    gdTokens.access = t.access;
    gdTokens.until = t.until;
    if (t.refresh){
      gdTokens.refresh = t.refresh;
      gdSaveRefresh(t.refresh);
    }
    cb(null, gdTokens.access);
  });
  });
}

function gdSaveRefresh(v){
  var br = gdBridge();
  if (br && br.secretSet) br.secretSet(GD_SLOT, String(v));
}
function gdForgetTokens(){
  gdTokens = null;
  var br = gdBridge();
  if (br && br.secretClear) br.secretClear(GD_SLOT);
}

/* ------------------------------------------------------------------ */
/* Вход                                                               */
/* ------------------------------------------------------------------ */
/* Окно открывает ОБОЛОЧКА, и открывает в СИСТЕМНОМ браузере: на
   Windows — внешний, с возвратом на 127.0.0.1, на Android — Custom Tabs
   с возвратом по своей схеме. Встроенное окно запрещено, и Google его
   отвергает — там владелец не видит адресной строки и не может
   убедиться, что вводит пароль на настоящей странице.
 *
 * Адрес входа строится ЗДЕСЬ: оболочка не должна знать ни об областях
 * доступа, ни о PKCE. Она открывает окно и приносит ответ. */

function gdRandom(n){
  var a = new Uint8Array(n), out = [], i;
  window.crypto.getRandomValues(a);
  for (i = 0; i < n; i++) out.push(a[i]);
  return out;
}

function gdSignIn(){
  if (!gdBridgeReady()){ syncStatus.err = 'nobridge'; render(); return; }
  if (!modeConfigured()){ syncStatus.err = 'noclient'; render(); return; }

  var verifier = gdVerifier(gdRandom);
  var state1 = gdVerifier(gdRandom).slice(0, 24);

  gdChallenge(verifier, function(cErr, challenge){
    if (cErr){ syncStatus.err = cErr; render(); return; }
    var url = gdAuthUrl(GOOGLE_CLIENT_ID, GOOGLE_REDIRECT, challenge, state1);
    if (!url){ syncStatus.err = 'noclient'; render(); return; }

    syncStatus.busy = true; syncStatus.err = ''; render();

    gdBridge().oauthOpen(url).then(function(r){
      syncStatus.busy = false;
      if (!r || !r.ok || !r.url){
        /* Каждая беда своим именем. Прежде здесь стояло одно 'auth' на
           все случаи, и «браузер не открылся» читалось как «Google
           больше не принимает вход» — совет вёл не туда. */
        syncStatus.err = (r && r.err) ? r.err : 'auth';
        render(); return;
      }
      /* Разбор ответа и сверка `state` — здесь, настоящие. Без сверки
         чужая ссылка, открытая владельцем, могла бы подсунуть
         программе чужой код авторизации, и данные уехали бы в чужую
         учётную запись. */
      var back = gdParseBack(r.url, state1);
      if (!back.ok){ syncStatus.err = back.err; render(); return; }

      /* Обмен идёт на ТОТ ЖЕ адрес возврата, который был у окна входа.
         Оболочка выбирает свободный порт при каждом входе и сообщает
         его здесь; в настройках сборки записан порт 0 — «любой», и
         отправить его Google нельзя: он требует совпадения до буквы и
         отвечает 400. Это и было причиной, по которой вход не проходил
         вовсе. */
      var usedRedirect = r.redirect || GOOGLE_REDIRECT;
      /* ++++++ SECRET IN SHELL ++++++ */
      gdSecret(function(secret){
      gdExchange(GOOGLE_CLIENT_ID, secret, usedRedirect, back.code, verifier, function(eErr, tok){
        if (eErr){ syncStatus.err = eErr; render(); return; }
        gdWhoAmI(tok.access, function(wErr, who){
          if (wErr){ syncStatus.err = wErr; render(); return; }
          gdAfterSignIn(tok, who);
        });
      });
      });
    })['catch'](function(){
      syncStatus.busy = false; syncStatus.err = 'auth'; render();
    });
  });
}

/* ------------------------------------------------------------------ */
/* Кто вошёл — и та ли это учётная запись                             */
/* ------------------------------------------------------------------ */
function gdAfterSignIn(tok, who){
  var o = syncRead() || {};
  var verdict = bindDecide(bindOf(o), who);

  if (verdict === 'bad'){ syncStatus.err = 'server'; render(); return; }

  if (verdict === 'other'){
    /* Ключи НЕ сохраняются, пока владелец не ответил: до ответа входа
       как бы не было. */
    gdSwitchSheet(bindOf(o), who, function(choice){
      var plan = bindPlan(choice);
      if (!plan || !plan.bind){ syncStatus.err = ''; render(); return; }
      gdApplySwitch(plan, tok, who);
    });
    return;
  }

  if (verdict === 'first'){
    o = bindSet(o, who);
    syncWrite(o);
  }
  gdTokens = tok;
  gdSaveRefresh(tok.refresh);
  syncStatus.err = '';
  render();
  syncRun(false);
}

/* Исполнение выбора. Порядок — тот, что объявлен планом, и копия идёт
   ПЕРВОЙ: после замены данных снимать её поздно. */
function gdApplySwitch(plan, tok, who){
  if (plan.backup){
    try{ window.localStorage.setItem('goods-tracker/pre-sync-v1', JSON.stringify(state)); }
    catch(e){}
  }
  if (plan.dropLocal){
    var keptSettings = state.settings;
    state = defaultState();
    state.settings = eraseSettings(keptSettings, state.settings);
    state.settings.lang = getLang();
    ui.detail = null;
    resetForms();
  }
  var o = syncRead() || {};
  if (plan.bind) o = bindSet(o, who);
  if (plan.resetSync) o = bindResetSync(o);
  syncWrite(o);
  gdTokens = tok;
  gdSaveRefresh(tok.refresh);
  syncStatus.err = '';
  save();
  render();
  if (plan.sync) syncRun(false);
}

/* Окно с тремя ответами. «Отменить» стоит первым: пока обе стороны
   целы, ошибиться нельзя — то же правило, по которому в полосе
   расхождения обмена первым выходом стоит «сохранить мою копию». */
function gdSwitchSheet(bound, who, done){
  dialog({
    title: tr('gd.swTitle'),
    html: '<div class="note warn">' +
          esc(tr('gd.swBody', { old: (bound && bound.name) || '—', now: who.name })) +
          '</div><div class="note">' + esc(tr('gd.swBackup')) + '</div>',
    buttons: [
      { key: 'cancel',  label: tr('gd.swCancel') },
      { key: 'adopt',   label: tr('gd.swAdopt', { now: who.name }) },
      { key: 'replace', label: tr('gd.swReplace', { now: who.name }), variant: 'danger' }
    ]
  }).then(function(k){ done(k || 'cancel'); });
}

/* ------------------------------------------------------------------ */
/* Выход                                                              */
/* ------------------------------------------------------------------ */
/* Ключи уходят, ЗАПИСИ и ПРИВЯЗКА остаются. Привязка — потому что
   иначе защита обходится в два нажатия: вход другой записью после
   выхода читался бы как первый, и данные уехали бы на чужой Диск
   молча. */
function gdSignOut(){
  syncCancelPending();
  gdForgetTokens();
  var o = syncRead() || {};
  syncWrite(signOutKeep(o));
  syncStatus = syncStatusNew();
  removeBanner('sync-conf');
  toast(tr('gd.signedOut'), 'ok');
  render();
}

/* ------------------------------------------------------------------ */
/* Старт                                                              */
/* ------------------------------------------------------------------ */
/* Ключ лежит в хранилище системы, а не в документе. Отказ при старте
   МОЛЧИТ: сети может не быть, и пугать этим при открытии программы
   незачем — нажатие «Синхронизировать сейчас» тот же отказ покажет. */
function gdBoot(){
  if (!gdBridgeReady()) return;
  var br = gdBridge();
  var p = br.secretGet(GD_SLOT);
  if (!p || !p.then) return;
  p.then(function(r){
    var refresh = (r && r.value) || '';
    if (!refresh) return;
    gdTokens = { access: '', refresh: refresh, until: 0 };
    syncRun(false);
  })['catch'](function(){});
}

/* ------------------------------------------------------------------ */
/* Испорченный файл на Диске — путь наружу                            */
/* ------------------------------------------------------------------ */
/* Единственный способ перезаписать файл, который программа прочитать
   не может. За подтверждением, и с копией ПЕРЕД записью: прежний файл
   после этого не вернуть. */
function gdFixRemote(){
  confirmBox(tr('gd.fixTitle'), tr('gd.fixBody'), tr('gd.fixOk'), true).then(function(okd){
    if (!okd) return;
    try{ window.localStorage.setItem('goods-tracker/pre-sync-v1', JSON.stringify(state)); }
    catch(e){}
    var o = syncRead() || {};
    o.base = {}; o.version = '';
    syncWrite(o);
    syncStatus.err = '';
    syncRun(true);
  });
}

/* ------------------------------------------------------------------ */
/* Карточка                                                           */
/* ------------------------------------------------------------------ */
function gdCardHTML(){
  var o = syncRead() || {}, b = bindOf(o);
  var h = '<section class="card"><div class="t">' + tr('gd.title') + '</div><div class="b">';
  h += '<div class="note">' + tr('gd.what') + '</div>';

  if (!gdBridgeReady()){
    h += '<div class="note warn">' + tr('gd.browser') + '</div></div></section>';
    return h;
  }
  if (!modeConfigured()){
    h += '<div class="note err">' + tr('gd.noClient') + '</div></div></section>';
    return h;
  }

  if (!gdTokens){
    h += '<div class="rb"><button type="button" class="go" data-act="gd-signin">' +
         esc(tr('gd.signIn')) + '</button></div>';
    h += '<div class="note">' + tr('gd.worksWithout') + '</div>';
  } else {
    h += row({ k: esc(b ? b.name : '—'), sub: esc(tr('gd.account')) });
    var line;
    if (syncStatus.busy) line = tr('gd.busy');
    else line = o.at ? tr('gd.lastAt', { when: bakStamp(o.at) }) : tr('gd.never');
    var pend = syncPending();
    h += row({ k: esc(line), sub: esc(tr('gd.state')),
               v: pend ? esc(tr('gd.pending', { n: pend })) : esc(tr('gd.allSent')) });
    h += '<div class="rb">' +
         '<button type="button" class="go" data-act="sync-now">' + esc(tr('gd.now')) + '</button> ' +
         '<button type="button" data-act="gd-signout">' + esc(tr('gd.signOut')) + '</button>' +
         '</div>';
    h += '<div class="note">' + tr('gd.noFiles') + '</div>';
  }

  if (syncStatus.err){
    h += '<div class="note err">' + esc(tr(gdErrKey(syncStatus.err))) + '</div>';
    if (syncStatus.err === 'badremote'){
      h += '<div class="rb"><button type="button" data-act="gd-fixremote">' +
           esc(tr('gd.fixOpen')) + '</button></div>';
    }
  }
  h += '</div></section>';
  return h;
}

/* Кнопка «Назад» на Android спрашивает страницу: занялась ли она сама.
   Открытое окно закрывается первым, и приложение никогда не закрывается
   из-под него. */
window.GTBack = function(){
  var back = document.querySelector('.modal-back');
  if (back){ back.remove(); return 'modal'; }
  if (ui.detail){ ui.detail = null; render(); return 'back'; }
  if (ui.tab !== 'summary'){ ui.tab = 'summary'; render(); return 'back'; }
  return 'none';
};

function boot(){
  if (!storageUsable) banner('nostorage','warn', tr('boot.noStorage'));
  var loaded = loadFromStorage();
  setLang(isLang(state.settings.lang) ? state.settings.lang : detectLang());
  state.settings.lang = getLang();
  resetForms();
  render();
  /* ++++++ COST HISTORY ++++++ после первой отрисовки: banner() кладёт
     узел в #alerts, а render() его не переписывает. */
  loadNotePaint();
  /* ++++++ TWO WINDOWS ++++++ подписка ПОСЛЕ первой отрисовки, по той же
     причине, что и загрузочная полоса выше: banner() кладёт узел в #alerts. */
  xtabWatch();
  /* ++++++ SYNC ++++++ по той же причине, что и две строки выше: сначала
     показать документ, потом идти в сеть. */
  syncBoot();
  /* ++++++ SELF UPDATE ++++++ откуда открыто ядро и есть ли откат */
  updBoot();
  /* ++++++ ATTACHMENTS ++++++ the picture store opens AFTER the first paint.
     The app must never wait for it: bookkeeping works with no files at all.
     When it cannot open, the whole consequence is one banner and dead file
     buttons — never a silent failure, and never a broken screen (A6). */
  attOpen(function(err){
    if (err){ banner('noatt','warn', tr('att.off')); render(); return; }
    attLoadMeta(function(e2){
      if (e2){ attState = 'off'; banner('noatt','warn', tr('att.off')); render(); return; }
      /* The sweep runs ONLY when the document was positively loaded. Every
         other case — nothing stored yet, localStorage unusable, a getItem that
         threw, a refused document — leaves state as the empty default, and
         sweeping against that would delete every file the owner has while
         their document is still sitting on the disk, recoverable. */
      /* ++++++ TRASH ++++++ уборка по сроку идёт ЗДЕСЬ, а не раньше: она
         снимает записи тем же путём, что и «удалить навсегда», а тот
         удаляет ещё и файлы — до открытия хранилища это было бы
         невозможно. Экран её не ждёт: первая отрисовка уже прошла.
         Надгробия уедут ближайшим обычным обменом. */
      trashPurgeBoot(loaded);
      attSweep(loaded, function(){ render(); });
    });
  });
}
