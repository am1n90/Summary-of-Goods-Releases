<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goods Sales &amp; Debt Tracker</title>
<style>
  /* ==================================================================
   * «Сегменты» — один язык оформления на все шесть вкладок.
   *
   *   1. Токены (светлая / тёмная)
   *   2. Оболочка: панель слева на компьютере, снизу на телефоне
   *   3. Примитивы: карточка, сегменты, строка, герой, полоса, поле, лист
   *   4. Наследие: полосы-уведомления, модальное окно, .conv
   *   5. Телефон
   *
   * Таблиц с колонками в этом оформлении нет вообще: список чего угодно —
   * это строки .row внутри .card.
   * ================================================================== */

  /* ------------------------------------------------------- 1. ТОКЕНЫ -- */
  :root{
    --bg:#f4f5f7; --surface:#fff; --surface-2:#fafbfc; --surface-3:#f2f4f7;
    --line:#e6e8ec; --line-2:#eef0f3;
    --ink:#0e1620; --ink-2:#48546a; --muted:#8a94a6;
    --accent:#2f5de0; --accent-ink:#fff; --accent-soft:#eaf0ff;
    /* Статусы. Два оттенка на смысл: --got/--owed для графики (нужно 3:1),
       --got-ink/--owed-ink для текста (нужно 4,5:1). Пара «бирюза/оранжевый»
       различима при дальтонизме (ΔE 58 протанопия, 77 дейтеранопия), и цветом
       мы никогда не кодируем статус в одиночку — рядом всегда подпись. */
    --got:#0d9488;  --got-ink:#0f766e;  --got-soft:#ddf4f1;
    --owed:#ea580c; --owed-ink:#c2410c; --owed-soft:#fdf0e8;
    --neutral:#7c8598; --neutral-soft:#eceef2;
    --good:#0f766e; --bad:#c2410c;
    --warn:#b45309; --warn-soft:#fef3e2;
    --r:16px; --pad:16px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 6px rgba(16,24,40,.04);
    --shadow-lg:0 12px 40px rgba(12,20,38,.18);
  }
  [data-theme="dark"]{
    --bg:#0b0f15; --surface:#141a22; --surface-2:#19212a; --surface-3:#1e2731;
    --line:#232c37; --line-2:#1c242e;
    --ink:#e9eef5; --ink-2:#a9b5c5; --muted:#7b8698;
    --accent:#6d94ff; --accent-ink:#0b0f15; --accent-soft:#1a2440;
    --got:#14b8a6;  --got-ink:#14b8a6;  --got-soft:#10302d;
    --owed:#f97316; --owed-ink:#f97316; --owed-soft:#3a2413;
    --neutral:#8b95a6; --neutral-soft:#222b35;
    --good:#14b8a6; --bad:#f97316;
    --warn:#fbbf24; --warn-soft:#332610;
    --shadow:none; --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
    overscroll-behavior-y:none;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

  /* ----------------------------------------------------- 2. ОБОЛОЧКА -- */
  .shell{display:flex;min-height:100%}
  .rail{
    width:232px;flex:0 0 232px;padding:22px 14px;position:sticky;top:0;height:100vh;
    border-right:1px solid var(--line);background:var(--surface);
    display:flex;flex-direction:column;gap:4px;
  }
  .rail .brand{padding:0 10px 18px;font-weight:700;font-size:16px;letter-spacing:-.01em}
  .rail .brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
  .rail button{
    display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;
    padding:10px 11px;border-radius:11px;cursor:pointer;color:var(--ink-2);
    font-weight:600;font-size:14.5px;text-align:left;min-height:44px;
  }
  .rail button:hover{background:var(--surface-3);color:var(--ink)}
  .rail button.on{background:var(--accent-soft);color:var(--accent)}
  .rail button svg{width:20px;height:20px;flex:0 0 auto}
  .rail .foot{margin-top:auto;display:flex;gap:6px;padding-top:12px}
  .rail .foot button{justify-content:center;font-size:13px;padding:8px;min-height:40px;
    border:1px solid var(--line);color:var(--muted)}

  .main{flex:1 1 auto;min-width:0;display:flex;justify-content:center}
  .col{width:100%;max-width:680px;padding:24px 20px 40px}

  .pagehead{display:flex;align-items:center;gap:12px;margin-bottom:14px;min-height:36px}
  .pagehead h1{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:700}
  .pagehead .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .back{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;
    cursor:pointer;padding:8px 10px 8px 0;min-height:44px;display:inline-flex;align-items:center;gap:6px}
  .bottombar{display:none}

  /* ---------------------------------------------------- 3. ПРИМИТИВЫ -- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .card > .t{padding:14px var(--pad) 10px;font-weight:600;font-size:13px;color:var(--muted);
    letter-spacing:.02em}
  .card > .b{padding:var(--pad)}

  .seg{display:flex;background:var(--surface-3);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
  .seg button{flex:1;background:none;border:none;padding:9px 6px;border-radius:9px;cursor:pointer;
    font-weight:600;font-size:13.5px;color:var(--muted);min-height:42px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  [data-theme="dark"] .seg button.on{background:var(--surface-2);color:var(--ink)}

  .row{display:flex;align-items:center;gap:13px;padding:13px var(--pad);
    border-bottom:1px solid var(--line-2);background:none;border-left:0;border-right:0;border-top:0;
    width:100%;text-align:left;cursor:default;min-height:56px;color:inherit}
  .row:last-child{border-bottom:none}
  button.row{cursor:pointer}
  button.row:hover{background:var(--surface-2)}
  .row .k{min-width:0;flex:1 1 auto}
  .row .k b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  /* ++++++ EXPENSE LOT ++++++ строка блока «Распределение расхода»: там
     название товара обязано читаться целиком, а не обрываться на
     многоточии, — это единственное место, где владелец сверяет доли по
     именам. Все прочие строки файла остаются с многоточием: в списке из
     сорока позиций перенос сломал бы ровный шаг строк. */
  .row.wrap .k b{white-space:normal;overflow:visible}
  .row .k small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .v{flex:0 0 auto;text-align:right;font-weight:600;font-size:15px;white-space:nowrap}
  .row .v small,.row .v .conv{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  .row .chev{flex:0 0 auto;color:var(--muted);opacity:.6}
  .row .v.pos{color:var(--good)} .row .v.neg{color:var(--bad)}
  /* ++++++ RATELOG FOLD ++++++ складной блок. Высота едет переходом, а не
     скриптом: переключение меняет ОДИН класс, и ни один узел не
     пересоздаётся — курсор в полях ввода курсов на том же экране остаётся
     на месте. Потолок высоты взят с запасом: список показывает не больше
     RATE_LOG_SHOWN строк, и они в него помещаются целиком. */
  .fold .foldbody{max-height:0;overflow:hidden;transition:max-height .22s ease}
  .fold.on .foldbody{max-height:140em}
  .fold .row .chev{transition:transform .22s ease}
  .fold.on .row .chev{transform:rotate(90deg)}
  @media (prefers-reduced-motion:reduce){
    .fold .foldbody,.fold .row .chev{transition:none}
  }

  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:20px var(--pad);margin-bottom:14px}
  .hero .k{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .hero .v{font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:9px 0 5px}
  .hero .v .cur{font-size:.4em;color:var(--muted);margin-left:5px;letter-spacing:0}
  .hero .s{font-size:13.5px;color:var(--ink-2)}
  .hero.good .v{color:var(--good)} .hero.bad .v{color:var(--bad)}
  .hero.accent{background:var(--accent);border-color:var(--accent)}
  .hero.accent .k,.hero.accent .s{color:rgba(255,255,255,.78)}
  .hero.accent .v,.hero.accent .v .cur{color:#fff}
  /* в тёмной теме акцент светлый — текст на нём тёмный, иначе контраст 2,5:1 */
  [data-theme="dark"] .hero.accent .k,[data-theme="dark"] .hero.accent .s{color:rgba(11,15,21,.7)}
  [data-theme="dark"] .hero.accent .v,[data-theme="dark"] .hero.accent .v .cur{color:var(--accent-ink)}
  @media(max-width:400px){.hero .v{font-size:30px}}

  .bar{height:10px;border-radius:999px;background:var(--neutral-soft);display:flex;gap:2px;overflow:hidden}
  .bar i{display:block;height:100%}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .legend b{color:var(--ink)}

  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:11.5px;
    white-space:nowrap}
  .pill.paid{background:var(--got-soft);color:var(--got-ink)}
  .pill.partial{background:var(--owed-soft);color:var(--owed-ink)}
  .pill.unpaid{background:var(--owed-soft);color:var(--owed-ink);box-shadow:inset 0 0 0 1px currentColor}
  .pill.credit{background:var(--accent-soft);color:var(--accent)}
  .pill.none{background:var(--neutral-soft);color:var(--muted)}
  /* ++++++ STATUS ITEMS ++++++ R21. Ключ статуса — это и имя класса
     (область 3), поэтому новых ключей ровно два и правил ровно два.
     Цвета взяты у соседей по смыслу: «взял, долга нет» — нейтральный, как
     `none`; «переплата» — акцентный, как `credit`. Ни одного нового
     токена: и контраст, и тёмная тема уже проверены на этих двух. */
  .pill.free{background:var(--neutral-soft);color:var(--muted)}
  .pill.over{background:var(--accent-soft);color:var(--accent)}

  .av{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto}
  .av.sq{border-radius:11px;background:var(--neutral-soft);color:var(--ink-2)}

  .f{display:block;margin-bottom:13px}
  .f > span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .f input,.f select,.f textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;font-size:16px;min-height:48px;   /* 16px — иначе Safari зумит */
    -webkit-appearance:none;appearance:none;
  }
  .f select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238a94a6' stroke-width='2' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
  .f input:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .f .pair{display:flex;gap:8px}
  .f .pair input{flex:1 1 auto;min-width:0}
  .f .pair select{flex:0 0 96px;width:96px}
  .f .two{display:flex;gap:10px}
  .f .two > *{flex:1 1 0;min-width:0}
  .f small.hint{display:block;font-size:12.5px;color:var(--muted);margin-top:6px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:13px;
    padding:14px 18px;font-weight:600;font-size:15.5px;cursor:pointer;min-height:50px}
  .btn:hover{filter:brightness(.95)}
  .btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
  .btn.danger{background:var(--owed-soft);color:var(--bad);border:1px solid transparent}
  .btns{display:flex;gap:9px}
  .btns .btn{flex:1 1 0}
  a.btn{text-decoration:none}
  .btn .ic{width:19px;height:19px;flex:0 0 auto}

  .note{border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.5;margin-bottom:13px}
  .note.info{background:var(--accent-soft);color:var(--accent)}
  .note.warn{background:var(--warn-soft);color:var(--warn)}
  .note.calc{background:var(--surface-3);color:var(--ink-2)}
  .note.calc b{color:var(--ink)}
  .note.err{background:var(--owed-soft);color:var(--bad);font-weight:600}
  .note b{font-weight:600}

  .empty{padding:26px var(--pad);text-align:center;color:var(--muted);font-size:14px}
  .muted{color:var(--muted)} .small{font-size:13px}

  /* автоподсказка по названию: в потоке, а не поверх формы — на телефоне
     перекрывать нечем, и одна строка на товар с многоточием */
  .acwrap{display:block}
  .ac{margin-top:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .ac button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
    border-bottom:1px solid var(--line-2);padding:11px 13px;cursor:pointer;text-align:left;min-height:48px}
  .ac button:last-child{border-bottom:none}
  .ac button:hover{background:var(--accent-soft)}
  .ac .n{flex:1 1 auto;min-width:0;font-weight:600;font-size:14px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ac .m{flex:0 0 auto;font-size:12.5px;color:var(--muted);white-space:nowrap}

  .filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .chipf{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;min-height:40px}
  .chipf.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  /* ++++++ PAY LIVE ++++++ нечего добавлять — кнопка и выглядит неактивной.
     Одно правило: неактивность обязана быть видна, а не только не работать. */
  .chipf[disabled]{opacity:.45;cursor:default}


  /* ++++++ DISPLAY CURRENCY ++++++ выбор валюты «Сводки»: плитка в правом
     верхнем углу «героя», раскрывающаяся в ряд валют.

     Полоса .dcpick растянута на всю ширину карточки и прижимает содержимое
     вправо. Это и есть защита от выхода за край: шире полосы ряду не стать
     ни при какой ширине экрана и ни при каком числе валют. Кликов сама
     полоса не ловит — иначе она накрыла бы заголовок под собой.

     И плитка, и ряд взяты на var(--surface) — на любой карточке, включая
     синюю. Первая мысль была залить плитку прозрачным белым по акценту, и
     она не выдержала измерения: белый текст на 18-процентном белом поверх
     акцента даёт 3,97:1 у плитки и 3,96:1 / 2,76:1 у выбранной и остальных
     валют ряда — ниже нужных 4,5:1 для текста 12,5 px. На var(--surface) те
     же роли дают 5,6:1 и 7,6:1 в светлой теме, 6,4:1 и 8,5:1 в тёмной.
     Второй довод у ряда свой: он ложится поверх заголовка «ПРИБЫЛЬ ЗА …», и
     сквозь прозрачную заливку буквы заголовка просвечивали бы между кодами.

     Одна заливка на оба состояния даёт ещё и то, ради чего всё затевалось:
     раскрытие выглядит как та же плитка, ставшая шире, а не как чужое окно
     поверх карточки. И тема больше не требует отдельных правил для синей
     карточки — а значит, и не может их случайно перебить: прежняя пара
     `[data-theme="dark"] .hero.accent .dcbtn` и `.hero.accent .dcbtn.bad`
     имела одинаковую специфичность, и в тёмной теме красная «нет курса»
     плитка молча становилась обычной. */
  .hero.pick{position:relative}
  /* заголовок и сама сумма не должны подлезать под ЗАКРЫТУЮ плитку ни на
     какой ширине — поэтому место под неё занято, а не «обычно хватает».
     Раскрытый ряд заголовок закрывает, и это нормально: он непрозрачный и
     живёт ровно столько, сколько на него смотрят. */
  .hero.pick .k,.hero.pick .v{padding-right:62px}
  /* min-height 36 + выравнивание по центру: плитка (30) и ряд (36) стоят на
     одной оси, поэтому ряд выезжает из плитки, а не из-под неё */
  .dcpick{position:absolute;top:12px;left:var(--pad);right:var(--pad);
    display:flex;align-items:center;justify-content:flex-end;
    min-height:36px;pointer-events:none}
  .dcpick > *{pointer-events:auto;max-width:100%}

  .dcbtn{min-width:46px;height:30px;padding:0 10px;border-radius:9px;cursor:pointer;
    font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.02em;
    background:var(--surface);color:var(--accent);border:1px solid var(--line);
    box-shadow:var(--shadow)}
  .dcbtn:hover{background:var(--accent-soft)}
  /* ++++++ SYNC ++++++ пальцу нужно 44px по высоте, а у плитки валюты их
     30 и у кнопки «Скопировать напоминание» 34 — обе меряны на 360px.
     Правка живёт в медиазапросе телефона: мышь попадает и в 30, и трогать
     настольный вид незачем. */
  @media (max-width:520px){
    .dcbtn{height:auto;min-height:44px;padding-top:7px;padding-bottom:7px}
    .rmdact .lnk{min-height:44px;display:inline-flex;align-items:center}
  }
  .dcbtn.bad{color:var(--bad);border-color:var(--bad)}

  /* Размер задаёт текст: по 13 px по бокам кода и ничего больше. 36 px в
     высоту — меньше принятых в этом файле 44 (.rail/.sfield) и 42 (.seg), и
     это сознательная уступка требованию «компактный ряд, без крупных
     отступов»; записана она в README, а не умолчана.
     Если валют столько, что ряд шире карточки, он ПРОКРУЧИВАЕТСЯ, а не
     обрезается. Раньше здесь стояло justify-content:flex-end — тогда лишнее
     уезжало за НАЧАЛЬНЫЙ край, а туда прокрутка не доходит (scrollLeft не
     бывает отрицательным): валюта, до которой нельзя добраться ни пальцем,
     ни колесом, при том что ряд — единственное место, где эту настройку
     вообще меняют. Теперь лишнее уходит вправо, куда прокрутка ходит, а
     dcOpen() подкручивает выбранную в видимую часть. Полоски прокрутки нет —
     так же, как у .filters. */
  .dcrow{display:flex;align-items:stretch;
    height:36px;border-radius:9px;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    animation:dcRowIn .17s ease-out}
  .dcrow::-webkit-scrollbar{display:none}
  .dcrow.out{animation:dcRowOut .15s ease-in forwards;pointer-events:none}
  /* старт привязан к пикселям, а не к процентам: 48 px — это ширина плитки,
     поэтому раскрытие начинается ровно с неё при любом числе валют */
  @keyframes dcRowIn {from{clip-path:inset(0 0 0 calc(100% - 48px));opacity:0}
                      to  {clip-path:inset(0 0 0 0);opacity:1}}
  @keyframes dcRowOut{from{clip-path:inset(0 0 0 0);opacity:1}
                      to  {clip-path:inset(0 0 0 calc(100% - 48px));opacity:0}}
  .dcrow button{flex:0 0 auto;background:none;border:none;border-left:1px solid var(--line);
    padding:0 13px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700;
    letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}
  .dcrow button:first-child{border-left:none}
  .dcrow button:hover{color:var(--ink);background:var(--accent-soft)}
  /* выбранная — только цветом текста: ни заливки, ни жирности, ни галочки */
  .dcrow button.on{color:var(--accent)}
  .dcrow button.on.bad{color:var(--bad)}
  /* рамка фокуса рисуется ВНУТРЬ: ряд обрезает всё, что вылезает за его
     границу, и обычные 2 px наружу от неё просто не было бы видно */
  .dcrow button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
  @media (prefers-reduced-motion:reduce){
    .dcrow{animation:none}
    .dcrow.out{animation:none;opacity:0}
  }

  /* поиск по списку + фильтр по статусу.
     .filters/.chipf выше НЕ трогаем: на них живут фильтр периода, переключатель
     НДС и «Внести весь остаток». Ушла только лента чипов с именами людей. */
  .sbox{margin-bottom:14px}
  .srow{display:flex;gap:8px;align-items:stretch}
  .srow .sfield{flex:1 1 auto;min-width:0}
  .sfield{display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;min-height:44px;
    box-shadow:var(--shadow)}
  .sfield:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .sfield .sic{flex:0 0 auto;display:flex;color:var(--muted)}
  .sfield .sic svg{width:18px;height:18px}
  /* 16px — ниже этого размера iOS увеличивает страницу при фокусе */
  /* ++++++ APPEARANCE ++++++ стандартное свойство рядом с префиксным — ровно
     так же, как у `.f input` двумя сотнями строк выше. Префиксное остаётся:
     Safari 15.3 и старше знает только его. */
  .sfield input{flex:1 1 auto;min-width:0;border:0;background:none;outline:none;font:inherit;
    font-size:16px;color:var(--ink);padding:11px 0;
    -webkit-appearance:none;appearance:none;border-radius:0}
  .sfield input::placeholder{color:var(--muted)}
  /* кнопка очистки рисуется всегда, показывается классом .has на обёртке:
     liveSearch() меняет className родителя и не трогает сам input — курсор цел */
  .sclr{flex:0 0 auto;display:none;width:32px;height:32px;border:0;border-radius:50%;
    background:var(--surface-3);color:var(--ink-2);cursor:pointer;font-size:15px;line-height:1;
    align-items:center;justify-content:center}
  .sfield.has .sclr{display:flex}
  .sclr:hover{background:var(--line);color:var(--ink)}
  .sflt{flex:0 0 auto;max-width:46%;display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:0 14px;min-height:44px;font:inherit;font-size:13.5px;font-weight:600;
    color:var(--ink-2);cursor:pointer;box-shadow:var(--shadow)}
  .sflt svg{width:16px;height:16px;flex:0 0 auto}
  .sflt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sflt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .snote{font-size:12.5px;color:var(--muted);margin:7px 2px 0;min-height:16px}
  .sempty{padding:24px var(--pad);text-align:center;color:var(--muted);font-size:14px}
  .sempty b{color:var(--ink-2);font-weight:600}
  .sagain{display:inline-block;margin-top:12px;background:none;border:0;color:var(--accent);
    font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:6px 4px}
  .sagain:hover{text-decoration:underline}

  .ev{display:flex;gap:12px;padding:12px var(--pad);border-bottom:1px solid var(--line-2)}
  .ev:last-child{border-bottom:none}
  .ev .l{min-width:0;flex:1 1 auto}
  .ev .tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;margin-bottom:4px}
  .ev .tag.take{background:var(--owed-soft);color:var(--owed-ink)}
  .ev .tag.pay{background:var(--got-soft);color:var(--got-ink)}
  .ev .tag.ret{background:var(--got-soft);color:var(--got-ink)}
  .ev .evb{margin-top:6px}
  .retwrap{padding:4px var(--pad) 14px;border-bottom:1px solid var(--line-2)}
  .ev .l .txt{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .l .d{font-size:12px;color:var(--muted);margin-top:2px}
  .ev .r{margin-left:auto;text-align:right;white-space:nowrap}
  .ev .r b{font-size:14.5px}
  .ev .r small,.ev .r .conv{display:block;font-size:12px;color:var(--muted);margin-top:2px}

  /* -------------------------------------------- 4. НАСЛЕДИЕ (не UI-мусор) --
     Эти классы печатает код, который переносится без изменений:
     banner()/toast() -> .alert, dialog() -> .modal-back/.modal,
     secSub()/convLines()/entryHint() -> .conv                              */
  #alerts{margin-bottom:14px}
  .alert{display:flex;align-items:flex-start;gap:10px;border-radius:12px;padding:11px 13px;
    font-size:13.5px;line-height:1.5;margin-bottom:9px;background:var(--surface-3);color:var(--ink-2)}
  .alert.ok{background:var(--got-soft);color:var(--got-ink)}
  .alert.warn{background:var(--warn-soft);color:var(--warn)}
  .alert.err{background:var(--owed-soft);color:var(--bad)}
  /* Нейтральная полоса — «импорт отменён», «напомним через 2 дня». Серый
     здесь выбран нарочно: подтверждение не должно кричать. Раньше он
     получался сам собой, потому что правила .alert.info не было вовсе и
     класс проваливался в базовый стиль. Ровно на этом провале и держалась
     R33: восемь полос просили красный, правила .alert.bad не существовало,
     и они молча получали тот же серый. Значения те же, что в базовом
     .alert, — важно, что они здесь НАПИСАНЫ. */
  .alert.info{background:var(--surface-3);color:var(--ink-2)}
  .alert .x{margin-left:auto;background:none;border:none;color:inherit;opacity:.65;
    font-size:19px;line-height:1;cursor:pointer;padding:0 2px;min-height:24px}
  .alert .x:hover{opacity:1}
  .conv{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}

  /* ------------------------ 8. ПОЛОСА «СДЕЛАЙТЕ КОПИЮ» (v10.1) --------
     Своего места в разметке у полосы нет: это тот же .alert, что у всех
     уведомлений, в том же #alerts — то есть В ПОТОКЕ, над #app. Она
     раздвигает страницу, а не ложится поверх содержимого; position тут
     не появляется намеренно (требование 7). Правило @media print выше
     прячет #alerts целиком, поэтому на печать полоса не попадает.

     Крестика у неё нет: закрывают её только два действия на ней самой. */
  .alert.bakbar{align-items:center;gap:10px;flex-wrap:nowrap}
  .bakbar .bt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bakbar .bt b{font-weight:700}
  .bakbar .bb{flex:0 0 auto;display:flex;gap:7px;margin-left:auto}
  .bakbar .bb button{
    border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;line-height:1.2;
    white-space:nowrap;cursor:pointer;min-height:34px;
    background:none;border:1px solid currentColor;color:inherit;
  }
  /* Главная кнопка — заливка цветом предупреждения. Текст на ней берёт
     --surface, а не отдельный токен: в светлой теме это белое на #b45309
     (5.0:1), в тёмной — почти чёрное на #fbbf24 (10.9:1). Обе стороны
     переворачиваются вместе с темой сами, потому что оба токена уже
     объявлены в обеих. */
  .bakbar .bb button.go{background:var(--warn);border-color:var(--warn);color:var(--surface)}
  .bakbar .bb button:hover{filter:brightness(.94)}

  /* Ниже 520 px две кнопки и фраза в одну строку помещаются только
     многоточием посреди слова, поэтому текст занимает первую строку, а
     кнопки — вторую. Полоса остаётся одной полосой и остаётся в потоке;
     проверено на 320, 375, 393 и 412 px, боковой прокрутки нет нигде. */
  @media (max-width:520px){
    .alert.bakbar{flex-wrap:wrap}
    .bakbar .bt{flex:1 1 100%;white-space:normal;overflow:visible;text-overflow:clip}
    .bakbar .bb{width:100%;margin-left:0}
    .bakbar .bb button{flex:1 1 0}
  }



  /* ------------------------ 8b. КНОПКИ НА ПОЛОСЕ «ДОКУМЕНТ НЕ ЧИТАЕТСЯ» ---
     R6. Своей полосы у спасения нет: оно дописывает хвост в ту же полосу
     load-fail, что была и раньше — иначе на экране оказались бы две полосы
     об одном и том же. Кнопки поэтому живут внутри .alert.err и берут его
     цвет через currentColor, как это делают кнопки полосы «сделайте копию».

     Отдельный класс, а не общий с .bakbar: та полоса кладёт кнопки В СТРОКУ
     справа (margin-left:auto), а этой нужен перенос на свою строку — текст
     тут длиннее и на телефоне занимает две-три строки сам по себе. */
  .alert .rb{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .alert .rb button{
    border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;line-height:1.2;
    cursor:pointer;min-height:34px;
    background:none;border:1px solid currentColor;color:inherit;
  }
  /* Главная кнопка — заливка цветом полосы; текст на ней --surface, оба
     токена объявлены в обеих темах и переворачиваются вместе с ней.
     Светлая: белое на #c2410c (5.2:1). Тёмная: #141a22 на #f97316 (6.3:1). */
  .alert .rb button.go{background:var(--bad);border-color:var(--bad);color:var(--surface)}
  .alert .rb button:hover{filter:brightness(.94)}
  /* Ниже 520 px кнопки растягиваются на всю ширину — три подписи в ряд
     («Скачать нечитаемый файл» самая длинная) иначе рвутся посреди слова. */
  @media (max-width:520px){
    .alert .rb button{flex:1 1 100%}
  }

  .modal-back{position:fixed;inset:0;background:rgba(10,16,26,.45);z-index:90;
    display:flex;align-items:flex-end;justify-content:center;padding:0}
  .modal{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;
    padding:20px var(--pad) calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);
    animation:sheetUp .18s ease-out;max-height:92vh;overflow-y:auto}
  @keyframes sheetUp{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
  .modal h3{margin:0 0 8px;font-size:17px}
  .modal .body{font-size:14px;color:var(--ink-2);line-height:1.55}
  .modal .body b{color:var(--ink)}
  .modal .btns{margin-top:18px;flex-wrap:wrap}
  .modal .btns button,.modal .btns a{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1 1 0;min-width:120px;
    background:var(--surface);color:var(--accent);border:1px solid var(--line);border-radius:13px;
    padding:13px 16px;font-weight:600;font-size:15px;cursor:pointer;min-height:50px;text-decoration:none}
  .modal .btns button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .modal .btns button.danger{background:var(--owed-soft);color:var(--bad);border-color:transparent}
  .modal .stack{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .modal .stack .btn{width:100%}
  .modal .rows{margin:14px -16px 0}
  @media(min-width:700px){
    .modal-back{align-items:center;padding:20px}
    .modal{border-radius:20px;padding-bottom:20px}
  }

  /* ------------------------------------------------------- 5. ТЕЛЕФОН -- */
  /* своя полоса прокрутки: видна во время прокрутки и гаснет сама */
  .sbar{display:none}

  @media (max-width:699px){
    html{scrollbar-width:none;-ms-overflow-style:none}
    html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}
    .sbar{display:block;position:fixed;right:3px;top:0;width:3px;border-radius:3px;
      background:var(--ink-2);opacity:0;pointer-events:none;z-index:70;
      transition:opacity .35s ease .25s}
    .sbar.on{opacity:.38;transition:opacity .08s ease}

    .rail{display:none}
    .col{padding:14px 14px calc(80px + env(safe-area-inset-bottom))}
    .pagehead h1{font-size:20px}

    .bottombar{
      display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;
      background:var(--surface);border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 16px rgba(16,24,40,.07);
    }
    .bottombar button{
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      background:none;border:none;padding:8px 2px 7px;min-height:56px;cursor:pointer;
      color:var(--muted);font-size:10.5px;font-weight:600;line-height:1.1;
    }
    .bottombar button svg{width:21px;height:21px}
    .bottombar button.on{color:var(--accent)}
  }
  @media (max-width:359px){
    .bottombar button{font-size:9.5px}
    .seg button{font-size:12.5px;padding:9px 3px}
  }

  @media print{
    .rail,.bottombar,.seg,.filters,.sbox,.btn,.btns,.sbar,.dcpick,#alerts{display:none !important}
    .card{break-inside:avoid}
  }

  /* ------------------------------ 6. ФОТО, НАКЛАДНЫЕ, КАРТОЧКА ТОВАРА --
     ++++++ ATTACHMENTS ++++++
     Ни одного нового токена: всё построено на тех же --surface / --line /
     --muted / --accent / --r / --pad, поэтому тёмная тема работает сама.
     Ни одной внешней картинки: заглушка — это inline-SVG из кода.        */

  /* маленький квадрат в строке списка — на месте прежнего .av.sq */
  .thumb{width:38px;height:38px;border-radius:11px;flex:0 0 auto;overflow:hidden;
    background:var(--surface-3);display:grid;place-items:center;color:var(--muted)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb svg{width:19px;height:19px}
  .thumb.file{background:var(--accent-soft);color:var(--accent)}

  /* фото в шапке страницы товара: название слева, снимок справа.
     .ht получает min-width:0, чтобы длинное название ужималось, а не
     выдавливало миниатюру за край. Без aside у .ht нет конкурента,
     и правило ничего не меняет ни на одном другом экране. */
  .pagehead .ht{min-width:0;flex:1 1 auto}
  .hshot{flex:0 0 auto;width:84px;height:84px;padding:0;border:1px solid var(--line);
    border-radius:14px;overflow:hidden;background:var(--surface);cursor:zoom-in;display:block;
    box-shadow:var(--shadow)}
  .hshot img{width:100%;height:100%;object-fit:cover;display:block}
  .hshot.empty{display:grid;place-items:center;color:var(--muted);border-style:dashed;
    background:var(--surface-2);cursor:pointer}
  .hshot.empty:hover{border-color:var(--accent);color:var(--accent)}
  .hshot.empty svg{width:26px;height:26px}

  /* фото в форме товара */
  .photopick{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:var(--surface);border:1px dashed var(--line);border-radius:12px;
    padding:16px;min-height:64px;color:var(--muted);font:inherit;font-size:14px;
    font-weight:600;cursor:pointer}
  .photopick:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-2)}
  .photopick svg{width:22px;height:22px;flex:0 0 auto}
  .photobox{display:flex;gap:12px;align-items:center;background:var(--surface-2);
    border:1px solid var(--line);border-radius:12px;padding:10px}
  .photobox .ph{flex:0 0 auto;width:64px;height:64px;padding:0;border:1px solid var(--line);
    border-radius:10px;overflow:hidden;background:var(--surface-3);display:grid;place-items:center;
    color:var(--muted);cursor:zoom-in}
  .photobox .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .photobox .ph svg{width:22px;height:22px}
  .photobox .ph.wait{cursor:default;animation:attPulse 1.1s ease-in-out infinite}
  @keyframes attPulse{0%,100%{opacity:.45}50%{opacity:1}}
  .photobox .meta{min-width:0;flex:1 1 auto}
  .photobox .meta b{display:block;font-size:14px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .photobox .meta small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .lnk{background:none;border:0;padding:6px 0 0;font:inherit;font-size:13px;font-weight:600;
    color:var(--accent);cursor:pointer}
  .lnk:hover{text-decoration:underline}
  .lnk.danger{color:var(--bad)}
  .two-lnk{display:flex;gap:16px}

  /* описание товара — единственное место, где текст владельца печатается
     как абзац, поэтому перенос по словам, а не многоточие */
  .card > .b.desc{font-size:14.5px;line-height:1.6;color:var(--ink-2);
    overflow-wrap:break-word;white-space:pre-wrap}
  .card > .b.desc .muted{color:var(--muted)}
  .f textarea{min-height:88px;resize:vertical;line-height:1.5}

  /* просмотр вложения внутри листа: картинка рисуется страницей,
     PDF — встроенным просмотрщиком браузера по blob:-адресу */
  .attview{margin:14px 0 0;border:1px solid var(--line);border-radius:13px;overflow:hidden;
    background:var(--surface-3)}
  .attview iframe{display:block;width:100%;height:62vh;border:0;background:#fff}
  .attview.img{display:grid;place-items:center;max-height:62vh}
  .attview.img img{max-width:100%;max-height:62vh;object-fit:contain;display:block}

  @media (max-width:699px){
    .hshot{width:72px;height:72px;border-radius:12px}
    .attview iframe{height:56vh}
  }
  @media (max-width:359px){
    .hshot{width:62px;height:62px}
  }
  @media print{
    .photopick,.photobox .lnk{display:none !important}
  }

  /* ------------------------------------- 7. ОТЧЁТ ПО ОСТАТКАМ (v9.1) --
     Собственного оверлея у отчёта нет: это тот же .modal-back/.modal, что у
     всех листов, плюс класс .remback — он делает лист шире на компьютере.
     Всё остальное здесь — только внутренности окна. */
  .remback .modal{max-width:820px}
  .rem .f{margin-bottom:10px}
  .remcap{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .remopen{margin-bottom:14px}

  /* три итога наверху. На телефоне остаются в три колонки: цифры короткие,
     а в столбик они съели бы пол-окна и таблицу пришлось бы искать. */
  .rem3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .rem3 > div{background:var(--surface-3);border-radius:12px;padding:11px 12px;min-width:0}
  .rem3 .k{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;
    text-transform:uppercase;line-height:1.3}
  .rem3 .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rem3 .v .cur{font-size:.58em;color:var(--muted);margin-left:3px;letter-spacing:0}
  .rem3 .v.pos{color:var(--good)} .rem3 .v.neg{color:var(--bad)}
  .rem3 .s{font-size:11.5px;color:var(--muted);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Единственная таблица с колонками в файле — и она такая по делу: шесть
     величин на товар, которые сравнивают глазами по столбцу. Прокручивается
     она внутри себя, поэтому шапка и три итога наверху всегда на виду. */
  .remwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;
    max-height:46vh;-webkit-overflow-scrolling:touch;background:var(--surface)}
  .remt{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;
    font-variant-numeric:tabular-nums}
  .remt th,.remt td{padding:8px 10px;text-align:right;white-space:nowrap;
    border-bottom:1px solid var(--line-2)}
  /* заголовки в две строки и без КАПСА: кириллица в верхнем регистре шире, и
     шесть таких подписей не помещались в лист даже на компьютере */
  .remt th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--muted);
    font-weight:600;font-size:11px;line-height:1.25;white-space:normal;vertical-align:bottom}
  /* название держим слева и на месте: на телефоне таблица едет вбок, и без
     этого не видно, к какому товару относится столбец */
  .remt th:first-child,.remt td:first-child{text-align:left;position:sticky;left:0;
    max-width:170px;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}
  .remt td:first-child{z-index:1}
  .remt th:first-child{z-index:3;background:var(--surface-2)}
  .remt tbody td{font-weight:600}
  .remt td small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:1px}
  .remt td small.src.list{color:var(--warn)}
  .remt .dash{color:var(--muted);font-weight:400}
  .remt td.pos{color:var(--good)} .remt td.neg{color:var(--bad)}
  .remt tfoot td{position:sticky;bottom:0;z-index:2;background:var(--surface-3);
    font-weight:700;border-top:1px solid var(--line);border-bottom:none}
  .remt tfoot td:first-child{z-index:3;background:var(--surface-3)}
  .remhint{margin:12px 0 0}

  @media(max-width:520px){
    .rem3{gap:6px}
    .rem3 > div{padding:9px 10px}
    .rem3 .k{font-size:9.5px}
    .rem3 .v{font-size:15px;margin-top:4px}
    .rem3 .s{font-size:10.5px}
    .remwrap{max-height:40vh}
    .remt th,.remt td{padding:7px 8px}
    .remt th:first-child,.remt td:first-child{max-width:118px}
  }

     влезает. Обрезанное многоточием число — худшее, что может показать отчёт,
     поэтому здесь ничего не обрезается: код валюты снимаем (он назван строкой
     «в AED» прямо над карточками), а подписи переносим по словам. */
  @media(max-width:420px){
    .rem3 .v .cur{display:none}
    .rem3 .v{font-size:15px;white-space:normal;overflow:visible;text-overflow:clip}
    .rem3 .s{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}
  }

  /* --------------------------------- 8. КОМУ НАПОМНИТЬ (v10.2) --
     Своего списка у напоминаний нет: возраст долга, пометка просрочки и
     кнопка копирования живут строками в «Кто сколько должен». Своих цветов
     блок не заводит — берёт те же токены, которыми во всём файле нарисован
     долг (--owed / --bad), поэтому тёмная тема переворачивается вместе со
     всем остальным.

     .row (она же кнопка «открыть карточку») и .rmdact с кнопкой
     копирования. Вложить вторую в первую нельзя — <button> внутри
     <button> браузер разбирает по-своему, — и именно поэтому нажатие на
     «Скопировать напоминание» не может открыть карточку. */
  .rmdrow{border-bottom:1px solid var(--line-2)}
  .rmdrow:last-child{border-bottom:none}
  .rmdrow .row{width:100%;border-bottom:none;padding-bottom:5px}
  /* отступ слева ровно под текстом строки: 16 (падинг) + 38 (.av) + 13 (зазор) */
  .rmdact{padding:0 var(--pad) 11px calc(var(--pad) + 51px)}
  .rmdact .lnk{padding:0;min-height:34px;display:inline-flex;align-items:center}

  /* вторая строка подписи — возраст долга. Своим цветом, чтобы не слиться
     с «взял … оплатил …»: это про время, а не про деньги.
     ПЕРЕНОСИТСЯ, а не обрезается: строка короткая, и на телефоне 320 px
     многоточие съедало бы у неё половину — «45 дней без о…». Первая
     подпись при этом обрезается как обрезалась: там сумма, начало которой
     и есть главное. */
  .row .k small.age{color:var(--ink-2);font-weight:600;
    white-space:normal;overflow:visible;text-overflow:clip}

  /* пометка просрочки: цвет И слово. Обводка внутренней тенью — та же,
     что у .pill.unpaid, чтобы метка читалась и там, где фон почти сливается.
     Стоит ПЕРЕД суммой и своей строкой: .v не сжимается ни на какой ширине,
     а в одну строку с суммой метка забрала бы у имени половину экрана. */
  .odue{display:block;width:-moz-fit-content;width:fit-content;margin:0 0 3px auto;
    padding:1px 7px;border-radius:999px;
    font-size:11px;font-weight:700;line-height:1.5;letter-spacing:.01em;
    background:var(--owed-soft);color:var(--owed-ink);
    box-shadow:inset 0 0 0 1px currentColor}

  /* запасное окно: текст, который уже выделен и который надо скопировать
     руками. Только чтение, поэтому тянуть его за угол незачем. */
  .rmdta{display:block;width:100%;margin:0;border:1px solid var(--line);border-radius:13px;
    background:var(--surface-3);color:var(--ink);padding:12px 13px;
    font:inherit;font-size:13.5px;line-height:1.55;resize:none;white-space:pre-wrap}

  @media (max-width:359px){
    .rmdact{padding-left:calc(var(--pad) + 6px)}
  }
</style>
</head>

function plIndex(n){
  n = Math.abs(Math.floor(n));
  if (lang === 'ru'){
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 0;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 1;
    return 2;
  }
  return n === 1 ? 0 : 1;
}
/** the noun alone, agreeing with n */
function plur(n, key){
  var f = NOUN[key];
  if (!f) return key;
  var forms = f[lang] || f[DEFAULT_LANG];
  return forms[Math.min(plIndex(n), forms.length - 1)];
}
/** "3 units" / "3 единицы" — number and noun together */
function nq(n, key){ return n + ' ' + plur(n, key); }

/* ---- lookup ------------------------------------------------------
 * tr('key', {a:1}) replaces every {a} in the string. Substitution is
 * PLAIN — exactly like the string concatenation it replaces — so the
 * escaping rules at each call site are unchanged: whatever passed
 * through esc() before still does, and nothing new reaches innerHTML
 * unescaped. Dictionary text is authored here, never typed by a user,
 * so the <b>/<span> markup inside it is safe.                       */
function tr(key, vars){
  var row = STR[key];
  var s = row ? (row[lang] !== undefined ? row[lang] : row[DEFAULT_LANG]) : key;
  if (s === undefined || s === null) s = key;
  if (!vars) return s;
  return String(s).replace(/\{(\w+)\}/g, function(m, name){
    return (vars[name] === undefined || vars[name] === null) ? m : String(vars[name]);
  });
}

/* ++++++ REMINDER LIST ++++++ «Кому напомнить».
   Приставка `rmd.`, не `rem.` и не `rep.`: `rem.*` занял отчёт по
   остаткам, `rep.*` — отчёт за период, а STR — один объектный литерал, и
   второе определение ключа молча побеждает первое (хрупкое место 17).

   Ключи `rmd.t.*` — это САМО СООБЩЕНИЕ, а не подпись на экране. Его читает
   должник, а не владелец, поэтому собирается оно на языке RMD_LANG, а не
   на языке интерфейса. Английская колонка здесь не «на всякий случай»:
   RMD_LANG = 'en' переводит сообщение целиком и больше ничего не меняет.

   Заголовка и пустого состояния здесь нет: у напоминаний нет своего
   списка — они живут строками в «Кто сколько должен». */

/* ++++++ COST HISTORY ++++++ R5: партии не сошлись, история закупок ушла.
   Приставка `cost.` — своя: `v.*` говорит, почему документ ОТВЕРГНУТ, а эти
   строки — о документе, который принят, но принят не целиком. */
/* Считаемое существительное стоит в ИМЕНИТЕЛЬНОМ падеже — plur() другого не
   умеет и уметь не должен. Поэтому фраза построена так, что падеж ему не
   меняется: «— 1 товар: …», «— 3 товара: …». «У {n}» потребовало бы
   родительного и читалось бы как «У 1 товар». */
'cost.lost':      { en:'The shipment log did not add up to the quantity for {n}: {names}. Their purchase costs were reset to zero, so profit there now equals revenue.',
                   ru:'Партии не сошлись с количеством — {n}: {names}. Закупочные цены обнулены, и прибыль там теперь равна выручке.' },
/* ++++++ COST RESCUE ++++++ R5, вторая половина. Приставка `cost.` — та же,
   что у соседней фразы о настоящей потере. */
'cost.fixed':     { en:'The shipment log did not add up to the quantity for {n}: {names}. The recorded shipments and their prices were kept; the units they do not account for were added as one shipment with no price.',
                   ru:'Партии не сошлись с количеством — {n}: {names}. Записанные закупки и их цены сохранены, а единицы, которых в них не хватало, добавлены одной партией без цены.' },
'cost.cut':       { en:'The shipment log listed more units than the product has for {n}: {names}. The surplus was taken off the most recent shipments; everything before them was left untouched.',
                   ru:'В партиях единиц оказалось больше, чем у товара — {n}: {names}. Лишнее списано с последних закупок, всё, что было до них, не тронуто.' },
/* ++++++ VALIDATE READS ++++++ B1. Третий исход, которого прежде не было:
   журнал СХОДИТСЯ и без непрочитанной записи. Ни «добавили партию», ни

/* money: everything is stored as an integer number of minor units (cents) */
/* ++++++ R22 ++++++ Последнее целое, которое JavaScript хранит без
   потерь, — 2^53 − 1. В минорных единицах это 90 071 миллиард с
   копейками: заведомо за пределами всего, что бывает в этой программе,
   и ровно та черта, за которой parseInt(...) * 100 перестаёт быть тем
   числом, которое написали. */
var MONEY_MAX_CENTS  = 9007199254740991;
var MONEY_MAX_DIGITS = 15;
function parseMoneyToCents(raw){
  if (raw === null || raw === undefined) return null;
  var s = String(raw).trim().replace(/\s/g,'');
  if (s === '') return null;
  if (s.indexOf(',') > -1 && s.indexOf('.') > -1) s = s.replace(/,/g,'');      // 1,234.56
  else if (s.indexOf(',') > -1) s = s.replace(/,/g,'.');                        // 1234,56
  if (!/^\d+(\.\d+)?$/.test(s)) return null;                                    // no sign, no junk
  var parts = s.split('.');
  var whole = parts[0];
  var frac  = (parts[1] || '') + '000';
  var cents = parseInt(whole,10) * 100 + parseInt(frac.slice(0,2),10);
  if (parseInt(frac.charAt(2),10) >= 5) cents += 1;                             // round half up
  /* ++++++ R22 ++++++ Дальше этой границы арифметика перестаёт быть точной:
     parseInt('1234567890123456', 10) * 100 уже не то число, которое написали,
     а isInt() такой результат принимает — и он доживал до хранилища и до
     резервной копии. Отказ здесь честнее молчаливой неточности: сумма не
     сохранится, и владелец увидит обычное сообщение об ошибке формы.
     Границей взято 2^53 − 1 — последнее целое, которое JavaScript хранит
     без потерь; в базовой валюте это 90 071 миллиард с копейками, то есть
     заведомо за пределами всего, что бывает в этой программе. */
  if (whole.length > MONEY_MAX_DIGITS) return null;
  if (!isFinite(cents) || cents > MONEY_MAX_CENTS) return null;
  return cents;

}
function parseRate(raw){
  if (raw === null || raw === undefined) return null;
  var s = String(raw).trim().replace(/\s/g,'').replace(/,/g,'.');
  if (s === '' || !/^\d*\.?\d+$/.test(s)) return null;
  var n = parseFloat(s);
  if (!isFinite(n) || n <= 0) return null;
  return n;
}
function parseIntStrict(raw){
  var s = String(raw==null?'':raw).trim();
  if (s === '' || !/^\d+$/.test(s)) return null;
  var n = parseInt(s,10);
  return isFinite(n) ? n : null;
}

function centsToBase(c){ return c/100; }
/** THE one rates store: rateOf(code) = how many BASE units one unit of `code` is worth.
 *  1 <code> = rateOf(code) <base>.  Base itself is always 1. null = no usable rate. */
function rateOf(code){
  if (code === state.settings.baseCurrency) return 1;
  var r = state.settings.rates[code];
  return (typeof r === 'number' && isFinite(r) && r > 0) ? r : null;
}
/** stored base minor units -> a value in `code`; rounding happens at display time only */
function convertFor(cents, code){
  var r = rateOf(code);
  if (r === null) return null;
  return centsToBase(cents) / r;
}
/** minor units typed in `code` -> base minor units. One single rounding, here. */
function toBaseCents(minorInCurrency, code){
  var r = rateOf(code);
  if (r === null) return null;
  return Math.round(minorInCurrency * r);
}
function money(cents, code){
  code = code || state.settings.baseCurrency;
  var v = convertFor(cents, code);
  if (v === null) return '—';
  return NF.format(v);
}

/* ============================================ ++++++ RATE PAIR ++++++ ==
 * Раздел «Курсы»: два поля от доллара, шесть направлений.
 *
 * ИСТОЧНИК ИСТИНЫ — ДВА ПОЛЯ. Остальные четыре направления выводятся из
 * них: обратный курс есть единица, делённая на прямой, а перекрёстный —
 * отношение двух прямых. Ни одного нового способа ХРАНИТЬ курс здесь нет:
 * документ по-прежнему держит «1 <код> = r <база>», и читает его rateOf().
 */
/** Валюты, о которых говорит раздел. Доллар — якорь, остальные две — то,
 *  к чему он приводится. Порядок задан ЗДЕСЬ и только здесь. */
var RATE_ANCHOR = 'USD';
var RATE_TO = ['AED', 'TJS'];
function ratePairAll(){ return [RATE_ANCHOR].concat(RATE_TO); }
/** Правится ли эта валюта полями раздела. Прочие валюты правятся как и
 *  раньше — своей строкой и своим листом. */
function ratePairOwns(c){ return ratePairAll().indexOf(c) > -1; }

/** Сколько ДОЛЛАРОВ стоит одна единица валюты — по двум набранным числам.
 *  Доллар стоит доллар; остальное — единица, делённая на свой курс. */
function ratePairUsd(vals, c){
  if (c === RATE_ANCHOR) return 1;
  var v = vals[c];
  return (typeof v === 'number' && isFinite(v) && v > 0) ? (1 / v) : null;

/** ЕДИНСТВЕННОЕ место, где считается взаимный курс: «1 from = ? to».
 *  Обе стороны приводятся к доллару, и доллар сокращается — отсюда сразу
 *  все шесть направлений требования 4. Считает по НАБРАННОМУ, а не по
 *  хранимому: таблица обязана пересчитываться до сохранения. */
function ratePairOf(vals, from, to){
  var a = ratePairUsd(vals, from), b = ratePairUsd(vals, to);

 *  столько знаков, сколько осталось после округления к восьмому: «3.67»,

 *  и сохранение, ничего не набравшего, вернуло бы 0.33600000011710823

 *  добавления валюты: второй разбор числа был бы ошибкой того же рода,
 *  что второе округление. */
function ratePairVals(){

    if (f && f[c] !== null && f[c] !== undefined){ out[c] = parseRate(f[c]); continue; }

 *  историю как правку значило бы соврать, а переписать хранимое число —
 *  потерять точность, которая в нём была. Порог 1e-12 на семь порядков

 *    база — одна из двух -> якорь равен её же набранному курсу;

  else anchor = rateOf(RATE_ANCHOR);
  if (anchor === null || !isFinite(anchor) || !(anchor > 0)) return null;
  want[RATE_ANCHOR] = anchor;
  for (i = 0; i < RATE_TO.length; i++){
    c = RATE_TO[i];
    if (!(vals[c] > 0)) return null;
    want[c] = anchor / vals[c];
    if (!isFinite(want[c]) || !(want[c] > 0)) return null;
  }
  return want;
}

function units(n){ return NF0.format(n); }

/** THE section map. Which currencies each part of the UI shows money in,
 *  most important first.
 *
 *  This is the ONLY place a section's display currency is decided, and it is
 *  deliberately independent of settings.baseCurrency: nothing about storage
 *  changes, only what the reader sees. `null` means "keep the old behaviour"
 *  (base currency first, then whatever the header display select asks for) —
 *  People & Debts is on that path on purpose, it is out of scope.
 *
 *  To change what a tab reads in, edit ONE array here. */
var SECTION_CUR = {
  /* ++++++ DISPLAY CURRENCY ++++++ «Сводка» больше не приколочена к одной
     валюте: её выбирает владелец кнопкой в углу «героя», а выбор лежит в
     settings.sumCur. Это по-прежнему ЕДИНСТВЕННОЕ место, где решается, чем
     печатает вкладка, — просто теперь оно спрашивает документ, а не себя. */
  summary:      function(){ return [dcCur()]; },
  products:     ['AED'],          /* purchase side: cost/unit, shipment totals, stock value      */
  transactions: ['USD','TJS'],    /* first = main figure, rest = secondary lines                 */
  payments:     ['USD','TJS'],
  /* ++++++ EXPENSES ++++++ расходы читаются в валюте «Сводки»: строка

     валютах их читать нельзя. Запись здесь нужна ради полосы «нет курса»
     (warnNote); сами суммы идут через dcCents()/dcFmt(), как на «Сводке». */
  expenses:     function(){ return [dcCur()]; },
  people:       null              /* out of scope — old bothMoney() path                         */
};

/** what a section asks for, whether or not a rate exists (entry selects, warnings) */
function secWanted(sec){
  var w = SECTION_CUR[sec];
  if (typeof w === 'function') w = w();          /* ++++++ DISPLAY CURRENCY ++++++ */
  return (w && w.length) ? w : [];
}
/** what a section can actually show: the wanted codes that have a usable rate */
function secCodes(sec){
  return secWanted(sec).filter(function(c){ return rateOf(c) !== null; });
}
/** the wanted codes that cannot be shown right now, in order */
function secMissing(sec){
  return secWanted(sec).filter(function(c){ return rateOf(c) === null; });
}
/** ["7,161.37 AED", "26,300.00 TJS"] — formatted, in section order */
function secParts(sec, cents){
  return secCodes(sec).map(function(c){ return money(cents, c) + ' ' + esc(c); });
}
/** the main figure of a section: "7,161.37 AED", or "—" when no rate is usable */
function secMain(sec, cents){
  var p = secParts(sec, cents);
  return p.length ? p[0] : '—';
}
/** the secondary lines under the main figure */
function secSub(sec, cents, cls){
  return secParts(sec, cents).slice(1).map(function(s){
    return '<div class="' + (cls || 'conv') + '">' + s + '</div>';
  }).join('');
}
/** main + secondary — the normal table-cell formatter (replaces bothMoney) */
function secMoney(sec, cents, cls){ return secMain(sec, cents) + secSub(sec, cents, cls); }
/** one line, currencies separated by a dot — for dialogs and inline hints */
function secInline(sec, cents){
  var p = secParts(sec, cents);
  return p.length ? p.join(' · ') : '—';
}
/** bare number in the section's first currency, for columns that never printed a code */
function secBare(sec, cents){
  var c = secCodes(sec)[0];
  return c ? money(cents, c) : '—';
}
/** "<b>AED</b> (1 AED = 0.27229408 USD)" — for a section's explanatory header line */
function secNote(sec){
  var b = state.settings.baseCurrency;
  return secCodes(sec).map(function(c){
    return '<b>' + esc(c) + '</b>' + (c === b
      ? ' <span class="muted">' + tr('sec.storedCur') + '</span>'
      : ' <span class="muted">(' + esc(rateText(c)) + ')</span>');
  }).join(tr('w.and'));
}
/** '' or the section-level missing-rate warning (A4: never NaN, never a silent 1:1) */
function secWarnHTML(sec){
  var miss = secMissing(sec);
  if (!miss.length) return '';
  var shown = secCodes(sec);
  return tr('sec.warnNoRate', {codes: miss.map(esc).join(tr('w.and'))}) +
    (shown.length
      ? tr('sec.warnShowing', {codes: shown.map(esc).join(tr('w.and'))})
      : tr('sec.warnNone')) +
    tr('sec.warnOpen', {cur: esc(miss[0]), base: esc(state.settings.baseCurrency)});

/* ---- entry currencies (A3: the Payments form offers USD and TJS only) ---- */
/** the currencies the payment form accepts, rate or no rate (no rate is blocked at save) */
function payEntryCodes(){
  var w = secWanted('payments');
  return w.length ? w : [state.settings.baseCurrency];
}
function payAllows(code){ return payEntryCodes().indexOf(code) > -1; }
/** the currency this person normally settles in, limited to what the form accepts */
function payDefaultCur(personId){
  var best = null;
  actPay().forEach(function(p){
    if (p.personId !== personId || !p.entryCur) return;
    if (!payAllows(p.entryCur) || rateOf(p.entryCur) === null) return;
    if (!best || (p.createdAt || '') > (best.createdAt || '')) best = p;
  });
  if (best) return best.entryCur;
  var last = state.settings.lastPayCur;
  if (last && payAllows(last)) return last;                 /* remembered choice (default TJS) */
  var codes = payEntryCodes();
  for (var i=0;i<codes.length;i++) if (rateOf(codes[i]) !== null) return codes[i];
  return codes[codes.length-1];
}
/** the currency the purchase side is entered in (A2: Products = AED) */
function purchaseEntryCur(){
  var c = secWanted('products')[0];
  return (c && rateOf(c) !== null) ? c : state.settings.baseCurrency;
}
