/* ================================================================== *
 * ++++++ BACKUP REMINDER ++++++  когда копию делали в последний раз
 * ------------------------------------------------------------------
 * ЧТО ЭТА ЧАСТЬ ДЕЛАЕТ.
 * Запоминает, когда экспорт в последний раз ДЕЙСТВИТЕЛЬНО состоялся,
 * сколько записей в него попало и какими они были; показывает наверху
 * одну полосу, когда с того дня прошло семь суток или копии не было
 * вовсе; во вкладке «Ещё → Данные» печатает дату, время, состав копии
 * и предупреждение, если данные с тех пор менялись.
 *
 * ЧЕГО ОНА НЕ ДЕЛАЕТ. Она не выгружает файл. Второго пути экспорта
 * здесь нет вовсе: кнопка на полосе несёт то же data-act="export", что
 * и строка во вкладке «Ещё → Данные», а отметка о копии ставится ВНУТРИ
 * exportWrite(), после того как ссылка нажалась без исключения. Поэтому
 * ни одна ветка, которая до записи файла не дошла — владелец отменил
 * подтверждение большой копии, attExportList() вернул ошибку, Blob не
 * собрался — дату не двигает. Формат файла не меняется ни на байт.
 *
 * ГДЕ ЖИВУТ ЭТИ СВЕДЕНИЯ. В ОТДЕЛЬНОМ ключе localStorage, рядом с
 * документом, а не внутри него:
 *
 *     goods-tracker/v1          сам документ  — не тронут
 *     goods-tracker/backup-v1   эта отметка   — новый ключ
 *
 * Так решено намеренно, по трём причинам:
 *   1. settings попадают в резервную копию — exportWrite() пишет каждый
 *      ключ state. Отметка внутри settings означала бы, что файл несёт
 *      дату СВОЕЙ ЖЕ предыдущей копии: сведение, которое на другой
 *      машине заведомо ложно, а после импорта ложно всегда;
 *   2. схема документа не меняется вообще. SCHEMA_VERSION остаётся 10,
 *      validate() не трогается — а это самая связанная со схемой
 *      функция в файле (fragile area 4). Копия, сделанная этой сборкой,
 *      открывается предыдущей сборкой как ни в чём не бывало;
 *   3. «когда я делал копию» — свойство ЭТОГО компьютера, а не данных.
 *      Оно не должно путешествовать вместе с ними.
 *
 * Ни одна запись, ни одна сумма, ни один остаток здесь не изменяется
 * никогда. Всё, что этот блок пишет, — четыре поля в своём ключе.
 * ================================================================== */
var BAK_KEY         = 'goods-tracker/backup-v1';
var BAK_EVERY_DAYS  = 7;      /* через столько суток поднимаем полосу */
var BAK_SNOOZE_DAYS = 2;      /* «Напомнить позже» — ровно на столько */
var BAK_DAY_MS      = 86400000;

/* ---- чтение и запись отметки -------------------------------------
   Ни одна из трёх не бросает исключение никогда: приватный режим,
   запрещённое хранилище и переполненная квота — обычные состояния, а
   не поломка. Что угодно кроме объекта нужной формы читается как
   «копии не было», а не как ошибка: испорченное содержимое ключа
   должно приводить к лишнему напоминанию, а не к пустому экрану. */
function bakRead(){
  if (!storageUsable) return null;
  var raw;
  try { raw = window.localStorage.getItem(BAK_KEY); } catch(e){ return null; }
  if (!raw) return null;
  var o;
  try { o = JSON.parse(raw); } catch(e){ return null; }
  if (!o || typeof o !== 'object' || Object.prototype.toString.call(o) === '[object Array]') return null;
  var n = (o.n && typeof o.n === 'object') ? o.n : {};
  function cnt(v){ return (isInt(v) && v >= 0) ? v : 0; }
  return {
    at:     (typeof o.at === 'string' && !isNaN(Date.parse(o.at))) ? o.at : null,
    sig:    typeof o.sig === 'string' ? o.sig : '',
    n:      { prod: cnt(n.prod), ppl: cnt(n.ppl), tx: cnt(n.tx), pay: cnt(n.pay) },
    snooze: (typeof o.snooze === 'number' && isFinite(o.snooze) && o.snooze > 0) ? o.snooze : 0
  };
}
function bakWrite(o){
  if (!storageUsable) return false;
  try { window.localStorage.setItem(BAK_KEY, JSON.stringify(o)); return true; }
  catch(e){ return false; }
}
function bakForget(){
  if (!storageUsable) return;
  try { window.localStorage.removeItem(BAK_KEY); } catch(e){}
}

/* ---- «изменилось ли что-нибудь с последней копии» -----------------
 * Подпись ЧЕТЫРЁХ списков записей — товаров, людей, выдач и оплат.
 * Ровно тех, чьи .length печатает диалог импорта и строка о составе
 * копии ниже: один источник правды и на счётчики, и на подпись.
 *
 * Ключи объектов СОРТИРУЮТСЯ, поэтому подпись не зависит от порядка
 * полей. Это не мелочь: после перезагрузки документ пересобирает
 * validate() в своём порядке ключей, и подпись, зависящая от порядка,
 * назавтра объявила бы «есть изменения» на нетронутых данных.
 *
 * Две независимые 32-битные свёртки плюс общая длина. Обе считаются
 * только сдвигами и сложением: привычное h = h * 16777619 в JS ушло бы
 * за 2^53 и потеряло младшие биты на первом же символе.
 *
 * СТОИМОСТЬ. Считается ЛЕНИВО: в момент экспорта и при отрисовке
 * «Ещё → Данные». В save() её нет вовсе — ни набор текста, ни
 * сохранение записи не становятся ни на такт медленнее.
 *
 * ЧЕГО ПОДПИСЬ НАМЕРЕННО НЕ ПОКРЫВАЕТ: settings. Смена языка, темы и
 * валюты «Сводки» — это про то, КАК смотрят, а не про то, ЧТО хранится;
 * поднимать из-за них предупреждение значит приучить владельца его не
 * читать. Обратная сторона названа честно в README: правка курса или
 * ставки НДС сама по себе предупреждения не поднимет.
 */
function bakSig(){
  var h1 = 0x811c9dc5, h2 = 0x1505, len = 0;
  function feed(s){
    var i, c;
    for (i = 0; i < s.length; i++){
      c = s.charCodeAt(i);
      /* FNV-1a, множитель разложен в сдвиги: всё остаётся 32-битным */
      h1 = (h1 ^ c) >>> 0;
      h1 = (h1 + ((h1 << 1) + (h1 << 4) + (h1 << 7) + (h1 << 8) + (h1 << 24))) >>> 0;
      /* djb2-xor — другая свёртка, чтобы совпадение пришлось быть двойным */
      h2 = ((((h2 << 5) + h2) >>> 0) ^ c) >>> 0;
    }
    len += s.length;
  }
  function walk(v){
    var t, i, k, keys;
    if (v === null || v === undefined){ feed('~'); return; }
    t = typeof v;
    if (t === 'number' || t === 'boolean'){ feed(String(v)); feed(';'); return; }
    if (t === 'string'){ feed('"'); feed(v); feed('";'); return; }
    if (Object.prototype.toString.call(v) === '[object Array]'){
      feed('[');
      for (i = 0; i < v.length; i++) walk(v[i]);
      feed(']');
      return;
    }
    keys = [];
    for (k in v) if (Object.prototype.hasOwnProperty.call(v, k)) keys.push(k);   /* R20 */
    keys.sort();
    feed('{');
    for (i = 0; i < keys.length; i++){ feed(keys[i]); feed('='); walk(v[keys[i]]); }
    feed('}');
  }
  walk(state.products); walk(state.people); walk(state.transactions); walk(state.payments);
  /* ++++++ GOODS RETURN ++++++ возвраты — записи, и их изменение обязано
     менять подпись. Пустой список НЕ скармливается нарочно: подпись
     документа без возвратов остаётся байт в байт прежней, и запись о
     копии, сделанная до этой версии, не начинает врать «записи менялись». */
  if (state.returns.length) walk(state.returns);
  /* ++++++ EXPENSES ++++++ расходы — записи, и их изменение обязано менять
     подпись: иначе «Вернуть суммы» продолжало бы предлагаться после того,
     как расход добавили, а откат переписал бы уже не те записи. Пустой
     список НЕ скармливается — по той же причине, что и пустой список
     возвратов: подпись документа, этой возможностью не пользующегося,
     обязана остаться байт в байт прежней, и запись о копии, сделанная до
     этой версии, не должна начать врать «записи менялись». */
  if (state.expenses.length) walk(state.expenses);
  return h1.toString(36) + '-' + h2.toString(36) + '-' + len.toString(36);
}

/** сколько записей сейчас — те же четыре .length, что печатает диалог импорта */
function bakCounts(){
  return { prod: actProducts().length, ppl: actPeople().length,
           tx: actTx().length, pay: actPay().length };
}
/** целых суток прошло с момента iso, или null, если метка нечитаема.
 *  Никогда не отрицательное: часы, переведённые назад, и метка «из
 *  будущего» читаются как 0 суток — отрицательных «дней назад» на
 *  экране быть не должно (краевой случай 8). */
function bakDays(iso){
  var t = Date.parse(iso);
  if (isNaN(t)) return null;
  var d = Math.floor((new Date().getTime() - t) / BAK_DAY_MS);
  return d < 0 ? 0 : d;
}
/** дата и время последней копии — порядок частей задаёт словарь */
function bakStamp(iso){
  var t = Date.parse(iso);
  if (isNaN(t)) return '—';
  var d = new Date(t);
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return tr('bk.stamp', { d: p(d.getDate()), m: p(d.getMonth() + 1), y: d.getFullYear(),
                          h: p(d.getHours()), i: p(d.getMinutes()) });
}

/** ЕДИНСТВЕННОЕ место, где дата последней копии двигается вперёд.
 *  Зовётся из exportWrite() и только оттуда — после того как ссылка
 *  нажалась без исключения. Снимает и отсрочку: копия только что
 *  сделана, отсчёт идёт от неё (краевой случай 5). */
function bakMark(){
  var okw = bakWrite({ at: new Date().toISOString(), sig: bakSig(),
                       n: bakCounts(), snooze: 0 });
  ui.bakHidden = false;
  bakBarPaint();
  return okw;
}

/** можно ли вообще отложить. Если браузер ничего не сохраняет, отсрочке
 *  негде лежать — и кнопки, которая обещает то, чего не будет, на полосе
 *  просто нет (требование 11 и краевой случай 7). */
function bakCanSnooze(){ return storageUsable; }

function bakShouldRemind(){
  /* Хранилище недоступно: напоминание постоянное. Семидневное правило и
     «Напомнить позже» здесь не действуют — ни то, ни другое негде
     запомнить, и единственная защита данных этой сессии — файл. */
  if (!storageUsable) return true;
  if (ui.bakHidden) return false;                 /* уже нажали в этой сессии */
  var b = bakRead(), now = new Date().getTime();
  /* Действующая отсрочка. Метка из будущего дальше, чем на её
     собственный срок, — это переведённые часы, а не отсрочка. */
  if (b && b.snooze > now && (b.snooze - now) <= BAK_SNOOZE_DAYS * BAK_DAY_MS) return false;
  if (!b || !b.at) return true;                   /* копии не было ни разу */
  return bakDays(b.at) >= BAK_EVERY_DAYS;         /* ровно семь — уже да */
}

function bakBarText(){
  if (!storageUsable) return tr('bk.barNoStore');
  var b = bakRead();
  if (!b || !b.at) return tr('bk.barNever');
  return tr('bk.barDays', { n: nq(bakDays(b.at), 'day') });
}

/** Полоса-напоминание.
 *  Живёт в #alerts — в общем потоке, НАД #app: она раздвигает страницу,
 *  а не ложится поверх содержимого (требование 7). render() #alerts не
 *  переписывает, поэтому полосу ставит и снимает эта функция, ровно один
 *  узел, — так же как это делают dcPaint() и remPaint() для своих.
 *  Кнопка «Скачать копию» несёт то же data-act="export", что и строка во
 *  вкладке «Ещё → Данные»: путь экспорта в приложении один. */
function bakBarPaint(){
  var box = $('alerts');
  if (!box) return;
  var old = box.querySelector('[data-banner="bak-remind"]');
  if (old) old.remove();
  if (!bakShouldRemind()) return;
  var d = document.createElement('div');
  d.className = 'alert warn bakbar';
  d.setAttribute('data-banner', 'bak-remind');
  d.setAttribute('role', 'status');
  d.innerHTML =
    '<span class="bt">' + bakBarText() + '</span>' +
    '<span class="bb">' +
      '<button type="button" class="go" data-act="export">' + tr('bk.now') + '</button>' +
      (bakCanSnooze()
        ? '<button type="button" data-act="bak-later">' + tr('bk.later') + '</button>'
        : '') +
    '</span>';
  box.insertBefore(d, box.firstChild);
}

/** «Ещё → Данные»: строка о последней копии. Ничего не считает про
 *  деньги — только читает отметку. */
function bakStatusHTML(){
  var b = bakRead();
  if (!b || !b.at){
    return row({ k: tr('bk.last'), sub: tr('bk.neverSub'), v: tr('bk.never') });
  }
  return row({ k: tr('bk.last'), v: bakStamp(b.at),
    sub: tr('bk.held', { prod: nq(b.n.prod, 'product'), ppl: nq(b.n.ppl, 'person'),
                         tx: nq(b.n.tx, 'transaction'), pay: nq(b.n.pay, 'payment') }) });
}
/** менялись ли записи после последней копии */
function bakDirty(){
  var b = bakRead();
  if (!b || !b.at) return false;      /* копии не было — расходиться не с чем */
  return b.sig !== bakSig();
}

/* ================================================================== *
 * ++++++ ATTACHMENTS ++++++  the binary store (photos & invoices)
 * ------------------------------------------------------------------
 * Why a second store at all. state is JSON.stringify-ed into
 * localStorage on every commit(), and localStorage holds about 5 MB for
 * the whole origin. A single phone photo is bigger than that. So the
 * binaries live in IndexedDB — which works from file:// in Chrome and
 * Edge, measured, see README — and state keeps nothing but references:
 *
 *     product.description   the owner's own text (plain string)
 *     product.photoId       id of one 'photo' attachment, or null
 *     product.invoiceIds[]  ids of 'invoice' attachments
 *
 * Two object stores, on purpose:
 *     att    {id, kind, productId, name, mime, size, addedAt, thumb}
 *     blobs  {id, blob}
 * Metadata is small, so ALL of it is read once at boot into attMeta,
 * and every render reads that map synchronously. A blob is fetched only
 * when a picture is actually opened. Decoding 50 full-size blobs on every
 * render is exactly what the performance requirement forbids.
 *
 * Nothing here computes money, stock or status. It stores files.
 * ================================================================== */

var ATT_DB      = 'goods-tracker-att';       /* the app's own store, beside goods-tracker/v1 */
var ATT_DB_VER  = 1;
var ATT_MAX     = 15 * 1024 * 1024;          /* one file, 15 MB */
var ATT_WARN    = 40 * 1024 * 1024;          /* a backup bigger than this asks first */
var PHOTO_SIDE  = 1200;                      /* longest side after downscaling */
var PHOTO_Q     = 0.82;
var THUMB_SIDE  = 96;                        /* list thumbnail, kept in metadata */
var THUMB_Q     = 0.62;
var MIME_IMG    = ['image/jpeg','image/png','image/webp'];
var MIME_INV    = ['image/jpeg','image/png','image/webp','application/pdf'];

var attDb    = null;
var attMeta  = {};        /* id -> metadata (no blob). The only thing render() reads. */
var attState = 'load';    /* 'load' | 'ok' | 'off' — 'off' is the A6 fallback */
/* Saving a product became asynchronous the moment it could carry a picture:
   the product is pushed, then the bytes are written, then the form is cleared.
   For those few milliseconds the Save button is still on screen with the same
   values behind it, and a second click would run the whole submit again — which
   findProductByName() would turn into a second shipment on the same product.
   One flag closes that window. It is set only around the asynchronous part, so
   none of saveProduct's many early returns can leave it stuck. */
var attSaving = false;

/* Two pictures can be in flight at once — a big one still encoding while a
   small one finishes. Without a token the slower encode would win and would
   delete the file the owner actually chose last. Every pick takes a number. */
var attSeq = 0;
var attPhotoSeq = {};     /* productId -> the number of its newest pick */

var DESC_MAX  = 2000;     /* the description is the only new field in localStorage */

/* Every map below is keyed by an id that can come out of an imported file, so
   it is read with hasOwnProperty and never with a bare []. A backup carrying
   an attachment called "constructor" would otherwise read as present and hand
   a renderer Object.prototype.constructor. That is R20, and it is not going to
   be reproduced in new code. */
function own(o, k){ return !!o && Object.prototype.hasOwnProperty.call(o, k); }

function attOn(){ return attState === 'ok'; }
function attById(id){ return (id && own(attMeta, id)) ? attMeta[id] : null; }
/* what More -> Data prints; both read the metadata map, never the blobs */
function attCount(){ return Object.keys(attMeta).length; }
function attBytes(){
  var n = 0;
  Object.keys(attMeta).forEach(function(k){ n += attMeta[k].size || 0; });
  return n;
}

/* ---- opening ------------------------------------------------------ */
/* Every failure path ends in attState='off': a blocked profile, private
   mode, a corrupt database. The app keeps working; only the file inputs
   go dead, and boot() raises one banner that says so. Never silent. */
function attOpen(cb){
  var req;
  try {
    if (!window.indexedDB){ attState = 'off'; cb('no-indexeddb'); return; }
    req = window.indexedDB.open(ATT_DB, ATT_DB_VER);
  } catch(e){ attState = 'off'; cb(e && e.name ? e.name : 'error'); return; }
  if (!req){ attState = 'off'; cb('no-request'); return; }
  req.onupgradeneeded = function(){
    var db = req.result;
    if (!db.objectStoreNames.contains('att'))   db.createObjectStore('att',   {keyPath:'id'});
    if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs', {keyPath:'id'});
  };
  req.onerror   = function(){ attState = 'off'; cb((req.error && req.error.name) || 'open-error'); };
  req.onblocked = function(){ attState = 'off'; cb('blocked'); };
  req.onsuccess = function(){
    attDb = req.result;
    attDb.onversionchange = function(){ try{ attDb.close(); }catch(e){} attDb = null; attState = 'off'; };
    attState = 'ok';
    cb(null);
  };
}

    tx.objectStore('blobs')['delete'](id);

   whole safety of the import:

   is swapped after this returns, and save() can still fail — quota, private
   mode. localStorage would then keep the OLD document while the store held only
   the NEW files, and every photoId in it would dangle for good. The reverse
   order — write, swap, save, and only then sweep what nothing references any
   more — degrades every failure to a few unreferenced blobs, which the sweep
   collects at the next boot.

  var tx = attTx(['att','blobs'], 'readwrite', function(err){ cb(err); });
  if (!tx) return;
  try {
    list.forEach(function(a){
      tx.objectStore('att').put(a.meta);
      tx.objectStore('blobs').put({id: a.meta.id, blob: a.blob});
    });
  } catch(e){ cb(e && e.name ? e.name : 'write-error'); return; }
  tx.oncomplete = function(){
    list.forEach(function(a){ attMeta[a.meta.id] = a.meta; });
    cb(null);
  };
  tx.onerror = function(){ cb((tx.error && tx.error.name) || 'write-error'); };
  tx.onabort = function(){ cb((tx.error && tx.error.name) || 'write-abort'); };

  var tx = attTx(['att','blobs'], 'readwrite', function(err){ cb(err); });
  if (!tx) return;

  tx.objectStore('blobs').clear();
  tx.oncomplete = function(){ attMeta = {}; cb(null); };
  tx.onerror    = function(){ cb('clear-error'); };
  tx.onabort    = function(){ cb('clear-abort'); };

   the file has to stay; the boot sweep collects it later instead. This is the
   only place that decides that order, and every delete path goes through it. */
function commitThenDrop(ids){
  var saved = save();

     ставило надгробие и НЕ отправляло его — на телефоне запись осталась
     в корзине даже после синхронизации, потому что отправлять было
     нечего. Причина в том, что эта функция всегда делала save() + render()

     шло одно удаление товара, и его надгробие уезжало «когда-нибудь» — при

  if (syncCfgFull()) syncSoon(function(){ syncRun(false); });
  if (saved && ids && ids.length) attDel(ids, function(){ render(); });

 * окном, чья ссылка ещё не долетела до localStorage этого окна. xtabWatch

 * R28.

 * подряд. Первый раз — лишь «под подозрением»; между загрузками соседнее
 * окно успевает дописать ссылку, и подозрение снимается. Ничего не теряется;

function planSweep(liveIds, metaIds, pending){
  var live = {}, pend = {}, i;
  for (i = 0; i < (liveIds  || []).length; i++) live[liveIds[i]]  = true;
  for (i = 0; i < (pending  || []).length; i++) pend[pending[i]]  = true;

function attSweep(loaded, cb){
  if (!attOn() || !loaded){ cb(null, 0); return; }
  var live = {};
  state.products.forEach(function(p){
    if (p.photoId) live[p.photoId] = true;
    (p.invoiceIds || []).forEach(function(id){ live[id] = true; });
  });

     metaIds он не попадает и удалению не подлежит. */

    attPendingWrite(plan.nextPending, function(){

/* ---- file checks (A3) --------------------------------------------- */
/* The type is read from file.type first and from the extension when the
   system gave us nothing, which happens for .webp and .pdf on some. */
function mimeOf(file){
  var t = String(file.type || '').toLowerCase();
  if (t) return t === 'image/jpg' ? 'image/jpeg' : t;
  var n = String(file.name || '').toLowerCase();
  if (/\.jpe?g$/.test(n)) return 'image/jpeg';
  if (/\.png$/.test(n))   return 'image/png';
  if (/\.webp$/.test(n))  return 'image/webp';
  if (/\.pdf$/.test(n))   return 'application/pdf';
  return '';
}
function fmtBytes(n){
  /* through tr() like every other visible string — "KB" is not "КБ" */
  if (n < 1024) return n + ' ' + tr('att.unitB');
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' ' + tr('att.unitKB');
  return (n / 1024 / 1024).toFixed(1) + ' ' + tr('att.unitMB');
}
/** null when the file may be stored, otherwise the message to show */
function attCheck(file, kind){
  var allowed = kind === 'photo' ? MIME_IMG : MIME_INV, m = mimeOf(file);
  if (!file.size) return tr('att.errEmpty');
  if (allowed.indexOf(m) === -1){
    return tr(kind === 'photo' ? 'att.errPhotoType' : 'att.errInvType',
      {name: String(file.name || '—')});
  }
  if (file.size > ATT_MAX){
    return tr('att.errBig', {name: String(file.name || '—'),
      size: fmtBytes(file.size), max: fmtBytes(ATT_MAX)});
  }
  return null;
}

/* ---- images: downscale on a canvas (A2) --------------------------- */
/* The original is never stored. The picked file is decoded, drawn once
   into a canvas whose longest side is PHOTO_SIDE, and re-encoded as JPEG.
   A second, tiny canvas produces the list thumbnail, which is the only
   image data kept in metadata — so a list of fifty products paints from
   fifty ~2 KB strings instead of fifty megabyte blobs. */
function readDataUrl(file, cb){
  var fr = new FileReader();
  fr.onload  = function(){ cb(null, String(fr.result)); };
  fr.onerror = function(){ cb('read-error', null); };

}
function loadImage(dataUrl, cb){
  var img = new Image();
  img.onload  = function(){ cb(null, img); };
  img.onerror = function(){ cb('decode-error', null); };

}
function drawScaled(img, maxSide){
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  var k = Math.min(1, maxSide / Math.max(w, h));
  var c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(w * k));
  c.height = Math.max(1, Math.round(h * k));
  var g = c.getContext('2d');
  /* PNG and WebP may be transparent; JPEG cannot be. White, not black. */
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);

}
function canvasBlob(canvas, quality, cb){
  if (canvas.toBlob){
    canvas.toBlob(function(b){
      if (b) cb(null, b); else cb('encode-error', null);
    }, 'image/jpeg', quality);
    return;
  }
  /* very old engine: toDataURL always exists */
  try { cb(null, dataUrlToBlob(canvas.toDataURL('image/jpeg', quality))); }
  catch(e){ cb('encode-error', null); }

function dataUrlToBlob(u){
  var parts = String(u).split(','), mime = /:(.*?);/.exec(parts[0])[1];
  var bin = atob(parts[1]), n = bin.length, arr = new Uint8Array(n), i;

  readDataUrl(file, function(e1, url){
    if (e1){ cb(tr('att.errRead'), null); return; }
    loadImage(url, function(e2, img){
      if (e2){ cb(tr('att.errDecode'), null); return; }
      var big = drawScaled(img, PHOTO_SIDE);
      canvasBlob(big, PHOTO_Q, function(e3, blob){
        if (e3){ cb(tr('att.errDecode'), null); return; }
        var thumb = '';
        try { thumb = drawScaled(img, THUMB_SIDE).toDataURL('image/jpeg', THUMB_Q); }
        catch(e){ thumb = ''; }
        cb(null, {blob: blob, thumb: thumb, w: big.width, h: big.height});

/** an image invoice is stored unmodified (A2) but still gets a thumbnail */
function invoiceThumb(file, cb){
  if (mimeOf(file) === 'application/pdf'){ cb(''); return; }
  readDataUrl(file, function(e1, url){
    if (e1){ cb(''); return; }
    loadImage(url, function(e2, img){
      if (e2){ cb(''); return; }
      var t = '';
      try { t = drawScaled(img, THUMB_SIDE).toDataURL('image/jpeg', THUMB_Q); } catch(e){ t = ''; }
      cb(t);
    });
  });

/* ---- base64, for the backup only ---------------------------------- */
function blobToB64(blob, cb){
  var fr = new FileReader();
  fr.onload  = function(){
    var s = String(fr.result), i = s.indexOf(',');
    cb(null, i === -1 ? '' : s.slice(i + 1));

  var bin = atob(String(b64)), n = bin.length, arr = new Uint8Array(n), i;

         номер, которого в принятом документе нет, отбрасывается; но сам
         расход из-за неё НЕ ВЫБЫВАЕТ — это запись о потраченных деньгах,
         и терять её из-за исчезнувшего товара было бы худшим обменом. Она
         просто читается как «без партии», ровно так же, как расход,
         сделанный до v15. Повтор в списке — тоже не запись, а описка
         чужой сборки: доля от него удвоилась бы.

         `lotId` — прежний вид привязки, «ко всей партии». Ключ пишется
         ТОЛЬКО когда он есть (правило v14, хрупкое место 64), и читается
         в одном месте — expItemsIn(), где означает «все позиции этой
         партии». Разворачивать его здесь, в список, было бы записью
         выбора, которого владелец не делал. */
      var xitems = [], xseen = {};
      if (Array.isArray(x.items)) x.items.forEach(function(k){
        if (typeof k === 'string' && own(batIds, k) && !own(xseen, k)){ xseen[k] = true; xitems.push(k); }
      });
      var xlot = (typeof x.lotId === 'string' && own(lotIds, x.lotId)) ? x.lotId : '';
      var xrec = { id:takeId(x.id, tr('v.eExpense')), cat:expCatOf(x.cat),
        note: typeof x.note==='string'?x.note:'', amountCents:x.amountCents,
        date:dateOf(x.date), entryCur:xe.cur, entryMinor:xe.minor, items:xitems,
        rateSnap:snapOf(x), createdAt: typeof x.createdAt==='string'?x.createdAt:'' };
      if (xlot) xrec.lotId = xlot;
      out.expenses.push(trashPut(xrec, x));
    } catch(e){ dropRec(e); } });
  }catch(e){ return bad(e.message); }

  /* stock sanity: a backup must not contain more taken than exists */
  var taken = {};
  /* ++++++ VALIDATE READS ++++++ B2. Здесь стоял голый индекс — на всю
     функцию единственный. При productId «constructor» первое чтение
     отзывалось функцией из прототипа, `функция || 0` давало функцию,
     `функция + число` — строку, а `строка > число` — false: проверка,
     обязанная остаться смертельной, молча пропускала документ с
     невозможным складом (измерено: 99 выдано из 2 купленных, остаток −97).
     own() — идиома R20, та же, что у ids, prodIds, personIds, attIds и
     alive. */
  /* ++++++ TRASH ++++++ считаются только АКТИВНЫЕ выдачи и возвраты, и это
     не косметика. Отказ здесь — уровня ДОКУМЕНТА: «выдал 10, удалил выдачу
     (в корзину), выдал те же 10 снова» дал бы 20 выданных при qty=10, и
     документ перестал бы открываться вовсе — на всех устройствах разом. */
  trashActive(out.transactions).forEach(function(t){
    taken[t.productId] = (own(taken, t.productId) ? taken[t.productId] : 0) + t.qty;
  });
  /* ++++++ GOODS RETURN ++++++ выданное считается ЗА ВЫЧЕТОМ возвращённого:
     после возврата те же единицы можно выдать снова, и Σ выдач может
     честно превышать закупку. Документ без возвратов проверяется ровно
     как раньше. */
  var txProd = {};
  out.transactions.forEach(function(t){ txProd[t.id] = t.productId; });
  trashActive(out.returns).forEach(function(r){
    if (!own(txProd, r.txId)) return;
    var pid = txProd[r.txId];
    taken[pid] = (own(taken, pid) ? taken[pid] : 0) - r.qty;
  });
  for (var i=0;i<out.products.length;i++){
    var p = out.products[i];
    if ((own(taken, p.id) ? taken[p.id] : 0) > p.qty) return bad(tr('v.stock', {name:p.name}));
  }
  /* ++++++ ATTACHMENTS ++++++ the files that came with a backup.
     They are returned BESIDE the document, never inside it: `state` is
     JSON.stringify-ed into localStorage on every commit(), and base64 photos
     there would blow the quota and take the whole app down with them.

     Leniency here is deliberate and differs from the rest of the validator.
     A malformed record rejects the document (that is the existing rule, and
     R23); a malformed FILE is dropped and counted, because one unreadable
     picture must not make a year of bookkeeping unimportable.

     `attachments` absent — a pre-v9 backup, or the localStorage document —
     means "this payload says nothing about files". References are then left
     exactly as they are: on load they point at blobs in IndexedDB that this
     function cannot see. Only when the payload DOES carry the array is a
     reference with no file in it dropped, because such a reference is dead. */
  /* ++++++ COST HISTORY ++++++ имена товаров, у которых пришлось
     выбросить историю закупок. РЯДОМ с документом, как attDropped и
     refDropped, — внутрь него не попадает ничего. */
  var hasAtt = Array.isArray(obj.attachments), atts = null, attDropped = 0, refDropped = 0;
  if (hasAtt){
    atts = [];
    var attIds = {};
    obj.attachments.forEach(function(a){
      if (!a || typeof a !== 'object'){ attDropped++; return; }
      var kind = (a.kind === 'photo' || a.kind === 'invoice') ? a.kind : null;
      if (typeof a.id !== 'string' || !a.id || !kind ||
          typeof a.data !== 'string' || !a.data ||
          a.id === '__proto__' ||   /* ++++++ VALIDATE READS ++++++ B3 */
          own(attIds, a.id)){ attDropped++; return; }
      attIds[a.id] = true;
      atts.push({
        id: a.id, kind: kind,
        productId: typeof a.productId === 'string' ? a.productId : '',
        name: typeof a.name === 'string' ? a.name : '',
        mime: typeof a.mime === 'string' ? a.mime : 'application/octet-stream',
        size: (isInt(a.size) && a.size >= 0) ? a.size : 0,
        addedAt: typeof a.addedAt === 'string' ? a.addedAt : '',
        /* a thumbnail is printed straight into an <img src>. It is escaped
           there as well, but a backup is a file from outside: anything that is
           not a small inline picture is simply not a thumbnail. */
        thumb: (typeof a.thumb === 'string' &&
                /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]*$/.test(a.thumb) &&
                a.thumb.length <= 60000) ? a.thumb : '',
        data: a.data
      });
    });
    /* a file whose product did not survive the import owns nothing: drop it */
    var alive = {};
    out.products.forEach(function(p){ alive[p.id] = true; });
    atts = atts.filter(function(a){
      if (a.productId && !own(alive, a.productId)){ attDropped++; delete attIds[a.id]; return false; }
      return true;
    });
    /* and a reference with no file behind it is dead — drop it, count it */
    out.products.forEach(function(p){
      if (p.photoId && !own(attIds, p.photoId)){ p.photoId = null; refDropped++; }
      var keep = p.invoiceIds.filter(function(id){ return own(attIds, id); });
      refDropped += p.invoiceIds.length - keep.length;
      p.invoiceIds = keep;
    });
  }
  /* ++++++ PARTIAL IMPORT ++++++ `dropped` едет РЯДОМ, как и всё прочее в
     этой строке: внутрь документа не попадает ни одно из них. */
  return { ok:true, data: out, attachments: atts, attDropped: attDropped, refDropped: refDropped, costGone: costGone, dateGuessed: dateGuessed, costFilled: costFilled, costCut: costCut, costDropped: costDropped, dropped: dropped };

}

/* ------------------------------------------------------------------ */
/* Derived values — always recomputed, never stored                    */
/* ------------------------------------------------------------------ */
/* =========================================== ++++++ MOVING AVG ++++++ ==
 * R12, вторая половина: себестоимость выдачи считается по средней НА ДЕНЬ
 * ВЫДАЧИ, а не за всё время.
 *
 * ЧТО БЫЛО. `avgCost` берётся по ВСЕМ партиям, какие есть в документе, —
 * поэтому поступление, пришедшее сегодня, меняло себестоимость и прибыль,
 * показанные за период, который закрылся месяцы назад. С 2026-08-23 Сводка
 * об этом честно предупреждала; закрыть это можно было только сменой модели
 * учёта, а это решение владельца. Решение принято 2026-08-24.
 *
 * ПРАВИЛО:
 *
 *   ВЫДАЧА СТОИТ СТОЛЬКО, СКОЛЬКО СТОИЛО ТО, ЧТО ЛЕЖАЛО НА СКЛАДЕ В ТОТ ДЕНЬ.
 *
 * Это классическая скользящая средняя по БЕГУЩЕМУ БАЛАНСУ: события идут по
 * датам, поступление добавляет (штуки, стоимость), выдача снимает штуки по
 * средней того, что на складе, и уносит соответствующую долю стоимости.
 *
 * ПОЧЕМУ ИМЕННО БЕГУЩИЙ БАЛАНС, А НЕ «СРЕДНЯЯ ПО ПАРТИЯМ ДО ЭТОЙ ДАТЫ».
 * Второе — наивная скользящая средняя, и она возвращает дефект, который R7
 * закрыл: товар, выданный целиком, получает остаток по себестоимости НЕ
 * НОЛЬ. Измерено: две партии по 10 единиц, вторая дешевле, всё продано —
 * склад по себестоимости −75.00 при пустой полке. Бегущий баланс не может
 * снять со склада больше стоимости, чем в нём лежит, поэтому все три
 * тождества целы:
 *
 *   закупка = склад по себестоимости + себестоимость выданного
 *   склад по себестоимости никогда не отрицателен
 *   выдано всё  =>  склад по себестоимости ровно ноль
 *
 * ВЫДАЧА, ОПЕРЕДИВШАЯ ПОСТУПЛЕНИЕ. Если на складе не хватает штук, баланс
 * ПОДТЯГИВАЕТ следующее поступление: товар откуда-то взялся, и ближайшая
 * известная ему цена — цена того поступления. Это решение владельца
 * («по цене первой закупки», 2026-08-24) — и оно же частный случай общего
 * правила: полка пуста, подтянулось первое поступление, средняя равна его
 * цене. Так себестоимость не может превысить закупку ни в каком документе.
 *
 * ОКРУГЛЕНИЕ ПО-ПРЕЖНЕМУ ОДНО НА ТОВАР (R7, область 47): накопленная
 * стоимость держится точной, а доля выдачи — разность двух округлений
 * накопленного. Доли телескопируются, у каждой выдачи есть своя целая доля
 * — её берут отчёт и `dcStats()`.
 *
 * НА ТОВАРЕ С ОДНОЙ ПАРТИЕЙ НЕ ДВИГАЕТСЯ НИЧЕГО. Там средняя на любой день
 * равна средней за всё время, и накопленное равно `taken * avgCost` — то
 * есть ровно прежняя формула, копейка в копейку. Деньги двигаются только
 * там, где поступление пришло МЕЖДУ выдачами, — то есть ровно там, где R12
 * и жила.
 * ================================================================== */

/** Порядок партий: по дате, потом по месту в списке. Тотальный. */
function cmpBatchAsc(a, b){
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  return a.i - b.i;
}
/** Порядок выдач: по дате, потом createdAt, потом id. Тотальный —
 *  область 34: сравнение, возвращающее «раньше» в обе стороны, отдаёт
 *  порядок на волю движка, а по этому порядку идёт распределение денег. */
function cmpTxAsc(a, b){
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  var ca = a.createdAt || '', cb = b.createdAt || '';
  if (ca !== cb) return ca < cb ? -1 : 1;
  if (a.id === b.id) return 0;
  return a.id < b.id ? -1 : 1;
}

/** Разложить себестоимость товара по его выдачам бегущим балансом.
 *
 *  Выдачи приходят списком: карта статистики их не держит, чтобы форма
 *  ответа не разрослась. Пишет `s.cogsOf`, `s.cogsCents` и `s.earlyUnits` —
 *  сколько единиц было выдано раньше покрывшего их поступления. */
function cogsAllocate(s, txs, rets){
  var bs = (Array.isArray(s.product.batches) ? s.product.batches : []).map(function(b, i){
    return { qty: b.qty || 0, cost: b.totalCostCents || 0, date: b.date || '', i: i };
  }).sort(cmpBatchAsc);
  /* ++++++ GOODS RETURN ++++++ возвраты входят в тот же проход по датам:
     возврат кладёт на полку свои штуки и ровно ту долю ТОЧНОЙ стоимости,
     которую его выдача с полки унесла (пропорционально её количеству), —
     поэтому «закупка = склад + себестоимость» и «остаток по себестоимости
     не отрицателен» верны по построению, а себестоимость периода
     уменьшается в периоде ДАТЫ ВОЗВРАТА (A2). В проходе возврат действует
     не раньше дня своей выдачи — дата показа при этом остаётся введённой.
     Округление по-прежнему ОДНО на товар (R7, область 47): доля возврата —
     разность двух округлений накопленного, и доли телескопируются.
     Документ без возвратов идёт прежним путём шаг в шаг. */
  var evs = txs.map(function(t){
    return { r: 0, date: t.date, createdAt: t.createdAt || '', id: t.id, t: t };
  });
  (rets || []).forEach(function(x){
    evs.push({ r: 1, date: x.r.date < x.t.date ? x.t.date : x.r.date,
               createdAt: x.r.createdAt || '', id: x.r.id, t: x.t, ret: x.r });
  });
  /* Порядок тотальный: дата, род (выдача раньше возврата — родитель всегда
     раньше своего возврата), createdAt, id. Для списка из одних выдач это
     в точности прежний cmpTxAsc — порядок денег не двигается. */
  evs.sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    if (a.r !== b.r) return a.r - b.r;
    if (a.createdAt !== b.createdAt) return a.createdAt < b.createdAt ? -1 : 1;
    if (a.id === b.id) return 0;
    return a.id < b.id ? -1 : 1;
  });
  var units = 0, value = 0, next = 0, cum = 0, prev = 0, early = 0;
  var exact = {}, done = {};
  /* Применить возврат: штуки и ровно ту долю ТОЧНОЙ стоимости, которую его
     выдача с полки унесла. Зовётся из двух мест — со своего места в проходе
     и когда его подтягивает вперёд выдача, которой не хватило полки. */
  function putBack(e){
    var ex = own(exact, e.t.id) ? exact[e.t.id] : null;
    var back = (ex && ex.q > 0) ? ex.c * (e.ret.qty / ex.q) : 0;
    units += e.ret.qty;
    value += back;
    cum -= back;
    var sh = Math.round(cum) - prev;
    prev = Math.round(cum);
    s.retCogsOf[e.ret.id] = -sh;
    s.cogsCents += sh;
    done[e.ret.id] = true;
  }
  for (var j = 0; j < evs.length; j++){
    var e = evs[j], t = e.t, share;
    if (e.r){
      /* выдача обработана раньше по построению порядка; own() — идиома R20 */
      if (!own(done, e.ret.id)) putBack(e);
      continue;
    }
    /* всё, что успело прийти к этому дню */
    while (next < bs.length && bs[next].date <= t.date){
      units += bs[next].qty; value += bs[next].cost; next++;
    }
    /* не хватило — подтягиваем следующие поступления: товар откуда-то взялся */
    var pulled = 0;
    while (units < t.qty && next < bs.length){
      units += bs[next].qty; value += bs[next].cost; next++; pulled++;
    }
    if (pulled) early += t.qty;
    /* ++++++ GOODS RETURN ++++++ и возвраты: вернувшиеся штуки — такое же
       поступление, и когда полки не хватает, баланс подтягивает их так же,
       как подтягивает партии. Без этого выдача, датированная МЕЖДУ выдачей
       и её возвратом, уносила бы ноль стоимости, а «продано всё» давало бы
       склад по себестоимости больше нуля — ровно тот дефект, который
       закрывали R7 и R12. Возврат, чей родитель ещё не обработан, не
       трогается: оценить его нечем, и он дождётся своего места (родитель
       всегда раньше — так построен порядок). */
    for (var k = j + 1; units < t.qty && k < evs.length; k++){
      if (evs[k].r && !own(done, evs[k].ret.id) && own(exact, evs[k].t.id)) putBack(evs[k]);
    }
    var take = t.qty < units ? t.qty : units;
    var cost = units > 0 ? value * (take / units) : 0;
    cum += cost;
    share = Math.round(cum) - prev;
    prev = Math.round(cum);
    s.cogsOf[t.id] = share;
    s.cogsCents += share;
    exact[t.id] = { c: cost, q: t.qty };
    units -= take;
    value -= cost;
  }
  s.earlyUnits = early;
}
/** Сколько единиц во всём документе было выдано раньше своего поступления.
 *  Ровно то, о чём стоит предупредить: модель опирается на даты партий, а
 *  `dateOf()` умеет их выдумывать (R10). Молчит, когда повода нет. */
function earlyUnits(ps){
  var n = 0;
  Object.keys(ps).forEach(function(k){ if (own(ps, k)) n += ps[k].earlyUnits || 0; });
  return n;
}
/* ================================================ ++++++ GOODS RETURN ++++++
 * «Возврат»: человек принёс часть товара назад. Отдельная запись со
 * ссылкой на выдачу — сама выдача не трогается НИКОГДА (правка истории —
 * это дефекты породы R2/R3, ровно то, чего здесь не должно быть). Запись
 * не хранит НИ ОДНОЙ суммы: цена и снимок курсов читаются у родительской
 * выдачи, поэтому возврат гасит ровно ту стоимость, которую выдача
 * начислила, — в любой валюте показа и при любой позднейшей правке цены.
 * ================================================================== */
function retById(id){ var l = actRet(), i; for (i=0;i<l.length;i++) if (l[i].id===id) return l[i]; return null; }
/** Σ возвращённого по одной выдаче. */
function retQtyOf(txId){
  var n = 0;
  actRet().forEach(function(r){ if (r.txId === txId) n += r.qty; });
  return n;
}
/** Сколько по выдаче ещё можно вернуть. */
function retLeftOf(t){ return t.qty - retQtyOf(t.id); }
/* ================================================ ++++++ EXPENSES ++++++ ==
 * ПРОЧИЕ РАСХОДЫ: доставка, растаможка, комиссия, перевод денег, другое.
 *
 * ПРАВИЛО, ИЗ КОТОРОГО СЛЕДУЕТ ВСЁ:
 *
 *   РАСХОД — САМОСТОЯТЕЛЬНАЯ ЗАПИСЬ, НЕ СВЯЗАННАЯ НИ С ТОВАРОМ, НИ С
 *   ЧЕЛОВЕКОМ. ОН НЕ ВХОДИТ НИ В СЕБЕСТОИМОСТЬ, НИ В СКЛАД, НИ В ДОЛГ.
 *
 * Из него:
 *   · «Прибыль» остаётся ровно тем, чем была, — выручка минус
 *     себестоимость выданного. Ни одна прежняя цифра «Сводки» не двигается
 *     ни на копейку, и это проверяется побайтовым сравнением экранов;
 *   · «Чистая прибыль» — НОВАЯ производная: прибыль периода минус расходы
 *     периода. Производная, а не хранимое поле (правило «производные не
 *     хранятся»);
 *   · фильтр товара расходы не сужает — товара у них нет. Период сужает, по
 *     СВОЕЙ дате записи, тем же inRange(), которым сужается всё остальное;
 *   · «Полный отчёт» расходов не знает вовсе: он про остаток на складе.
 *
 * ДЕНЬГИ. Канон — базовые минорные единицы, как у выдачи и оплаты. Введённые
 * сумма и валюта остаются рядом как провенанс (entryCur/entryMinor,
 * контракт v5), курсы дня записи — в rateSnap (контракт v10). Правка курса
 * в настройках не двигает ни одного расхода: на экране он читается своим
 * снимком, а хранимое число не пересчитывается вообще никогда.
 * ================================================================== */

/** Категории. Порядок задан ЗДЕСЬ и только здесь; ключ — стабильный
 *  идентификатор, подпись берётся из словаря (`exp.cat.<ключ>`) — идиома
 *  статусов: сравнивать по ключу, никогда по подписи. */
var EXP_CATS = ['delivery', 'customs', 'fee', 'transfer', 'other'];
/** Ключ категории из входящего документа. Незнакомый — «другое»: подпись,
 *  а не число, и терять из-за неё запись о деньгах нечестно (см. validate). */
function expCatOf(v){
  return (typeof v === 'string' && EXP_CATS.indexOf(v) > -1) ? v : 'other';
}
function expById(id){
  var l = actExp(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
  return null;
}

/* ---- ОДНА точка отбора и две суммы над ней ----------------------------
 *
 * Разойтись «итог секции» и строка «Прочие расходы» не могут, потому что
 * отбор у них ОДИН — expPick(). Сумм две, и это не второй счёт, а та же
 * пара, что уже есть у всего остального в этом файле: computeReport()
 * считает в базовых копейках, dcStats() — в валюте показа, покурсово, и в
 * базовой валюте они обязаны совпадать до копейки (хрупкое место 19).
 */

/** ЕДИНСТВЕННЫЙ отбор расходов периода. Пустые границы — всё время. */
function expPick(from, to){
  return actExp().filter(function(x){ return inRange(x.date, from, to); });
}
/** Сумма отобранных в БАЗОВЫХ минорных единицах. */
function expSum(list){
  var s = 0;
  list.forEach(function(x){ s += x.amountCents; });
  return s;
}
/** Сумма отобранных в валюте показа: КАЖДАЯ запись своим снимком курсов.
 *  Одно «нечем пересчитать» делает неизвестной всю сумму — dcAdd().
 *
 *  НАЧАЛЬНОЕ ЗНАЧЕНИЕ — НЕ НОЛЬ, А dcCents(0, null), и это не педантизм:
 *  ноль печатается как «0.00 TJS», то есть как СУММА. Когда у валюты показа
 *  курса нет, вкладка обязана быть в прочерках целиком — иначе получается
 *  состояние, которое невозможно объяснить: полоса наверху обещает
 *  прочерки, а одна строка показывает число. Пустой список в такой валюте
 *  даёт «—», как и всё остальное; в базовой валюте — 0, как и положено.
 *  Найдено не чтением, а набором test-currency.mjs (его AC9). */
function expSumD(list){
  var s = dcCents(0, null);
  list.forEach(function(x){ s = dcAdd(s, dcCents(x.amountCents, x.rateSnap)); });
  return s;
}
/** Список для экрана: новые сверху, порядок тотальный (дата, createdAt, id) —
 *  тот же cmpDateDesc, что у выдач и оплат. */
function expHits(){
  return actExp().slice().sort(cmpDateDesc);
}

/* ---- ввод -------------------------------------------------------------- */

/** Валюты, которые предлагает форма: база и всё, чему задан курс. Ни один
 *  код валюты здесь не записан — тот же список, что у поля курса в форме
 *  товара (currencyCodes()). На умолчаниях это ровно AED, TJS, USD. */
function expEntryCodes(){ return currencyCodes(); }
/** Валюта по умолчанию — та, в которой записали прошлый расход, если у неё
 *  ещё есть курс; иначе базовая. Ничего нового в настройках: спрашивается
 *  сама запись, как payDefaultCur() спрашивает прошлую оплату человека. */
function expDefaultCur(){
  var list = expHits(), i, c;
  for (i = 0; i < list.length; i++){
    c = list[i].entryCur;
    if (c && rateOf(c) !== null) return c;
  }
  return state.settings.baseCurrency;
}
/** ПЕРЕВОД СУММЫ РАСХОДА В БАЗОВЫЕ МИНОРНЫЕ ЕДИНИЦЫ.
 *
 *  Формула и округление те же, что у toBaseCents(), и округление по-прежнему
 *  ОДНО на сохранение: перевод здесь ровно один, двойного не появляется
 *  нигде. Различие ровно одно — КАКОЙ курс берётся.
 *
 *  Создание снимка ещё не имеет и зовёт toBaseCents() буквально: сегодняшний
 *  курс, единственная точка входа, ничего нового.
 *
 *  Правка берёт курс СВОЕЙ записи — тот, что записан в её снимке и которым
 *  эта сумма читается на всех экранах. Иначе правка описания или даты тихо
 *  переоценила бы расход полугодовой давности по сегодняшнему курсу — ровно
 *  то, ради чего снимок и заводится. Курс достаётся тем же dcRateOf(),
 *  которым его достаёт показ: второго разрешения курса в файле нет.
 *
 *  null — курса нет вовсе; сохранение отказывает и называет, где его задать. */
function expToBase(minor, code, snap){
  if (!snap) return toBaseCents(minor, code);
  var r = dcRateOf(snap, code);
  if (r === null) return null;
  return Math.round(minor * r);
}

/* ---- «каким курсом посчитано» ------------------------------------------ */

/** Курс, которым посчитана ЭТА запись, — или null, когда называть нечего
 *  (сумма введена в базовой валюте: «1 AED = 1 AED» не сведение). */
function expRateOf(x){
  var c = x && x.entryCur;
  if (!c || c === state.settings.baseCurrency) return null;
  return dcRateOf(x.rateSnap, c);
}
/** «курс: 1 USD = 3.67 AED». Пусто, когда курса нет или он ничего не
 *  добавляет. Формат тот же, что у ratesLine(): «1 <код> = <курс> <база>». */
function expRateText(x){
  var r = expRateOf(x);
  if (r === null) return '';
  return tr('exp.rateAt', { rate: '1 ' + esc(x.entryCur) + ' = ' + esc(trimNum(r)) +
                                    ' ' + esc(state.settings.baseCurrency) });
}
/* ============================================ ++++++ EXPENSE LOT ++++++ ==
 * РАСХОД НА ВЫБРАННЫЕ ТОВАРЫ И ДЕЛЕНИЕ ЕГО МЕЖДУ НИМИ.
 *
 * ПРАВИЛО, ИЗ КОТОРОГО СЛЕДУЕТ ВСЁ:
 *
 *   ДОЛЯ РАСХОДА — ПРОИЗВОДНАЯ ВЕЛИЧИНА И НИГДЕ НЕ ХРАНИТСЯ. Хранится
 *   ровно один список: какие ПОЗИЦИИ выбраны у расхода. Всё остальное
 *   считается на каждой отрисовке.
 *
 * Из него:
 *   · себестоимость, прибыль, склад, долги, статусы и «Полный отчёт»
 *     считаются РОВНО как раньше — доли к ним не прибавляются нигде;
 *   · «Чистая прибыль» вычитает расход ОДИН раз, целиком, а не по долям:
 *     деление отвечает на вопрос «во сколько обошёлся каждый товар», а не
 *     меняет то, сколько потрачено;
 *   · при изменении закупочной стоимости позиции, суммы расхода или
 *     самого выбора доли пересчитываются сами — пересчитывать нечего, они
 *     не сохранены;
 *   · курс расхода зафиксирован при сохранении, и доли наследуют его
 *     вместе с суммой.
 *
 * ЕДИНИЦА ВЫБОРА — ПОЗИЦИЯ, А НЕ ПАРТИЯ. Владелец платит за доставку
 * прихода, но выбрать он хочет ровно те товары, за которые заплатил: два
 * из трёх в одной партии, или по одному из двух разных. Поэтому расход
 * несёт СПИСОК позиций (`expense.items`), а партия осталась тем, чем
 * была, — способом сгруппировать позиции на экране и выбрать их разом
 * одним флажком.
 *
 * ЧТО ТАКОЕ ПАРТИЯ. До v15 такого понятия в документе не было вовсе:
 * инвойс из трёх товаров давал три партии — по одной на товар — и ничто
 * не говорило, что они пришли вместе. Теперь одна отправка формы товара
 * выдаёт всем своим позициям ОДИН номер (`batch.lotId`). Партия прежней
 * сборки номера не несёт и читается как приход из одной позиции; сшить
 * такие в один приход можно вручную — решение владельца от 2026-08-26.
 * ================================================================== */

/** Сколько позиций назвать в кратком составе; остальные — «и ещё N».
 *  Три — столько же, сколько у тёзок (TWIN_SHOWN): список в строке
 *  обязан оставаться одной строкой. */
var LOT_SHOWN = 3;

/* ---- ПОЗИЦИЯ: то, что выбирают ---------------------------------------
 *
 * У партии товара своего идентификатора никогда не было — на неё
 * ссылались индексом в массиве. Ссылаться так НЕЛЬЗЯ: batchTrim()
 * укорачивает список с конца при уменьшении количества, и индекс
 * молча начинает означать другую позицию. Поэтому у позиции появился
 * `batch.id` — ЛЕНИВЫЙ, ровно как `batch.lotId`: он выдаётся в тот
 * момент, когда на позицию впервые ссылаются, и у записи прежней сборки
 * ОТСУТСТВУЕТ (а не равен null — bakSig() хеширует имена собственных
 * ключей записи, хрупкое место 64).
 *
 * До выдачи номера позицию называет ключ вида «товар#индекс». Он живёт
 * только в интерфейсе и в документ не попадает никогда — та же пара
 * «ключ / настоящий номер», что уже есть у партии (lot.key / lot.id).
 */
function batKeyOf(p, b, i){ return b && b.id ? b.id : (p.id + '#' + i); }
/** ВСЕ позиции документа, в порядке товаров. Один обход — из него живут
 *  и выбор, и деление, и обе карточки. */
function batAll(){
  var out = [];
  actProducts().forEach(function(p){
    (Array.isArray(p.batches) ? p.batches : []).forEach(function(b, i){
      out.push({ product: p, batch: b, index: i, key: batKeyOf(p, b, i) });
    });
  });
  return out;
}
/** Позиция по ключу, или null. */
function batByKey(key){
  var all = batAll(), i;
  for (i = 0; i < all.length; i++) if (all[i].key === key) return all[i];
  return null;
}
/** Выдать позиции НАСТОЯЩИЙ номер, если его ещё нет, и вернуть его.
 *  ПИШЕТ в документ — зовётся только оттуда, где документ и так
 *  сохраняется: из сохранения расхода. */
function batEnsureId(it){
  if (it.batch.id) return it.batch.id;
  var id = uid('bat');
  it.batch.id = id; it.key = id;
  return id;
}

/* ---- ПАРТИЯ: способ сгруппировать позиции ---------------------------- */

/** Порядок партий: новые сверху, и он ТОТАЛЬНЫЙ — ключ уникален, поэтому
 *  от отрисовки к отрисовке список не переставляется (область 34). */
function cmpLotDesc(a, b){
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  if (a.key === b.key) return 0;
  return a.key < b.key ? 1 : -1;
}
/** ВСЕ партии документа. Партия — это либо набор позиций с одним номером,
 *  либо одна позиция без номера (приход из одного товара).
 *
 *  `key` — чем партию называет интерфейс: номер, если он есть, иначе
 *  «товар#индекс». Второй вид временный: как только к такой партии
 *  присоединяют соседнюю, она получает настоящий номер (lotEnsureId). */
function lotList(){
  var byId = {}, order = [], out = [];
  batAll().forEach(function(it){
    var b = it.batch;
    if (b.lotId){
      if (!own(byId, b.lotId)){
        byId[b.lotId] = { key: b.lotId, id: b.lotId, date: b.date, items: [] };
        order.push(b.lotId);
      }
      var g = byId[b.lotId];
      g.items.push(it);
      if (b.date < g.date) g.date = b.date;   /* дата партии — самая ранняя из позиций */
    } else {
      out.push({ key: it.product.id + '#' + it.index, id: '', date: b.date, items: [it] });
    }
  });
  order.forEach(function(k){ out.push(byId[k]); });
  out.sort(cmpLotDesc);
  return out;
}
/** Партия по ключу, или null. */
function lotByKey(key){
  var list = lotList(), i;
  for (i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
  return null;
}
/** Партия, в которую входит эта позиция. */
function lotOfBatch(p, i){
  var b = p.batches[i];
  return b && b.lotId ? lotByKey(b.lotId) : lotByKey(p.id + '#' + i);
}
/** Закупочная стоимость позиций — веса деления. Берётся totalCostCents:
 *  это то, что за позицию действительно заплачено, и именно он
 *  авторитетен для spentCents (доменное правило 10). Считать
 *  «количество × цена за штуку» значило бы завести вторую закупочную
 *  стоимость, расходящуюся с первой на копейку при инвойсной арифметике. */
function itemWeights(items){
  return items.map(function(it){ return it.batch.totalCostCents || 0; });
}
function lotWeights(lot){ return itemWeights(lot.items); }
/** Закупка партии целиком, в базовых минорных единицах. */
function lotTotalCents(lot){
  var s = 0;
  lotWeights(lot).forEach(function(w){ s += w; });
  return s;
}
/** Закупка выбранного набора позиций. Печатается в подвале окна выбора. */
function itemsTotalCents(items){
  var s = 0;
  itemWeights(items).forEach(function(w){ s += w; });
  return s;
}

/* ---- ЧТО ВЫБРАНО У РАСХОДА -------------------------------------------
 *
 * ЕДИНСТВЕННЫЙ ответ на этот вопрос, и он же — вся совместимость со
 * сборкой, в которой расход привязывался к партии ЦЕЛИКОМ. Такая запись
 * несёт `lotId` и не несёт `items`, и читается как выбор всех позиций
 * той партии — ровно то, чем она и была. Совместимость живёт ЗДЕСЬ, в
 * одном месте, а не в validate(): разворачивать её при чтении значило бы
 * записать в документ выбор, которого владелец не делал.
 */
function expItemsIn(x, all){
  var out = [], i, j;
  if (x.items && x.items.length){
    for (i = 0; i < x.items.length; i++){
      for (j = 0; j < all.length; j++) if (all[j].key === x.items[i]){ out.push(all[j]); break; }
    }
    return out;
  }
  if (x.lotId){
    for (j = 0; j < all.length; j++) if (all[j].batch.lotId === x.lotId) out.push(all[j]);
  }
  return out;
}
/** То же самое, когда обход позиций делать некому. */
function expItemsOf(x){ return expItemsIn(x, batAll()); }
/** Ключи выбранных позиций — тем же путём, поэтому форма правки
 *  открывается ровно с тем, что напечатано в списке. */
function expItemKeys(x){
  return expItemsOf(x).map(function(it){ return it.key; });
}

/* ---- ДЕЛЕНИЕ -------------------------------------------------------- */

/** ЕДИНСТВЕННОЕ место, где сумма делится между позициями.
 *
 *  Пропорционально весам; остаток от округления прибавляется к САМОЙ
 *  БОЛЬШОЙ доле, поэтому Σ долей равна `amount` ТОЧНО — при любых весах и
 *  в любой валюте, потому что функция ничего не знает о валюте: на входе
 *  целое, на выходе целые.
 *
 *  Это и позволяет напечатать деление и в валюте ввода расхода (там оно
 *  даёт ровно те числа, которые владелец ждёт: 970 TJS -> 538.89 и
 *  431.11), и в базовых копейках (там его читает себестоимость с
 *  расходами). Два вызова одной функции, а не два разных счёта.
 *
 *  Нулевая сумма весов — набор, где всё досталось даром: делить
 *  пропорционально нечему, и остаток целиком уходит первой позиции. Так
 *  Σ долей остаётся равной сумме расхода и здесь. */
function allocShares(amount, weights){
  var out = [], total = 0, sum = 0, i, v;
  for (i = 0; i < weights.length; i++) total += weights[i];
  if (!weights.length) return out;
  if (!(total > 0)){
    for (i = 0; i < weights.length; i++) out.push(0);
    out[0] = amount;
    return out;
  }
  for (i = 0; i < weights.length; i++){
    v = Math.round(amount * weights[i] / total);
    out.push(v); sum += v;
  }
  var rest = amount - sum;
  if (rest !== 0){
    var big = 0;
    for (i = 1; i < out.length; i++) if (out[i] > out[big]) big = i;
    out[big] += rest;
  }
  return out;
}
/** Как поделился ОДИН расход — в любой валюте, какую дадут. */
function expShares(x, amount){
  return allocShares(amount, itemWeights(expItemsOf(x)));
}
/** Доли ВСЕХ расходов по позициям: ключ позиции -> базовые минорные
 *  единицы. Один обход по расходам, каждый делится сам, доли по позиции
 *  складываются (несколько расходов на один приход — обычное дело:
 *  доставка, растаможка, комиссия). */
function expShareAll(){
  var all = batAll(), out = {};
  actExp().forEach(function(x){
    var items = expItemsIn(x, all);
    if (!items.length) return;
    var sh = allocShares(x.amountCents, itemWeights(items));
    items.forEach(function(it, i){
      out[it.key] = (own(out, it.key) ? out[it.key] : 0) + sh[i];
    });
  });
  return out;
}
/** Сколько расходов пришлось на ОДНУ позицию. */
function batShareCents(key){
  var m = expShareAll();
  return own(m, key) ? m[key] : 0;
}
/** Доли по позициям партии. Расход, выбранный частично или задевший
 *  соседнюю партию, попадает сюда ровно той частью, которая пришлась на
 *  ЭТИ позиции: карта одна на весь документ, и делить дважды нечем. */
function lotShareCents(lot){
  var m = expShareAll();
  return lot.items.map(function(it){ return own(m, it.key) ? m[it.key] : 0; });
}
/** Сумма долей, пришедшихся на партию. */
function lotExpCents(lot){
  var s = 0;
  lotShareCents(lot).forEach(function(v){ s += v; });
  return s;
}
/** Расходы, задевшие хоть одну позицию этой партии. Не «расходы партии»:
 *  расход может делиться между товарами из разных приходов, и на каждой
 *  из этих карточек он обязан быть виден. */
function lotExpenses(lot){
  var all = batAll(), keys = {}, out = [];
  lot.items.forEach(function(it){ keys[it.key] = true; });
  actExp().forEach(function(x){
    var items = expItemsIn(x, all), i;
    for (i = 0; i < items.length; i++){
      if (own(keys, items[i].key)){ out.push(x); return; }
    }
  });
  return out.sort(cmpDateDesc);
}
/** Себестоимость единицы позиции С УЧЁТОМ расходов: закупка на штуку плюс
 *  доля расхода на штуку. Справочная величина — в productStats() её нет и
 *  быть не должно. */
function lotUnitCents(lot, i){
  var it = lot.items[i], q = it.batch.qty;
  if (!(q > 0)) return null;
  return (it.batch.totalCostCents + lotShareCents(lot)[i]) / q;
}
/** Сколько расходов пришлось на ЭТОТ товар — по всем его позициям сразу. */
function prodShareCents(p){
  var m = expShareAll(), sum = 0;
  (Array.isArray(p.batches) ? p.batches : []).forEach(function(b, i){
    var k = batKeyOf(p, b, i);
    if (own(m, k)) sum += m[k];
  });
  return sum;
}
/** Доля позиции в ЗАКУПКЕ партии — печатается там, где расходов на неё
 *  ещё нет и говорить о долях нечего. */
function lotPct(lot, i){
  var w = lotWeights(lot), total = 0, k;
  for (k = 0; k < w.length; k++) total += w[k];
  return total > 0 ? (w[i] / total * 100) : 0;
}
/** Доля числа в сумме списка. Проценты долей считаются ИМЕННО так, а не
 *  по весам: при частичном выборе вес позиции и доставшаяся ей доля —
 *  разные вещи, и печатать процент от весов значило бы объяснять число
 *  тем, из чего оно не получилось. При выборе партии целиком обе
 *  величины совпадают, и на экране ничего не меняется. */
function pctOfSum(list, i){
  var total = 0, k;
  for (k = 0; k < list.length; k++) total += list[k];
  return total > 0 ? (list[i] / total * 100) : 0;
}

/* ---- как партия и позиция называются на экране ------------------------ */

/** Краткий состав: «Духи 48 шт · Крем 48 шт», с хвостом «и ещё N». */
function lotWhat(lot){ return itemsWhat(lot.items); }
/** То же самое для произвольного набора позиций — им подписан выбор. */
function itemsWhat(items){
  var parts = [], i;
  for (i = 0; i < items.length && i < LOT_SHOWN; i++){
    parts.push(esc(shortName(items[i].product.name)) + ' ' + units(items[i].batch.qty));
  }
  var s = parts.join(' · ');
  if (items.length > LOT_SHOWN) s += ' ' + tr('w.andMore', {n: items.length - LOT_SHOWN});
  return s;
}

/* ---- сшивание вручную ------------------------------------------------ */

/** Выдать партии настоящий номер, если его ещё нет, и вернуть его.
 *  ПИШЕТ в документ — зовётся только из присоединения позиции, которое и
 *  так сохраняет. */
function lotEnsureId(lot){
  if (lot.id) return lot.id;
  var id = uid('lot');
  lot.items.forEach(function(it){ it.batch.lotId = id; });
  lot.id = id; lot.key = id;
  return id;
}
function productStats(){
  var m = {};
  actProducts().forEach(function(p){
    var spent = (Array.isArray(p.batches) ? p.batches : []).reduce(function(a,b){ return a + (b.totalCostCents||0); }, 0);
    m[p.id] = { product:p, initial:p.qty, taken:0, remaining:p.qty,
      valueCents:0,                                 // expected revenue from units handed out
      spentCents:spent,                             // purchase cost of every shipment
      avgCost: p.qty > 0 ? spent / p.qty : 0,       // exact, unrounded — rounded only where used
      /* ++++++ COGS ROUND ++++++ R7. Доля себестоимости, приходящаяся на
         каждую выдачу этого товара: id выдачи -> целые копейки. Сумма
         долей равна round(taken * avgCost) — ОДНО округление на товар.
         Читают её отчёт (при фильтре по периоду) и dcStats (переводя
         каждую своим курсом); считает — только этот проход. */
      cogsOf:{},
      /* ++++++ MOVING AVG ++++++ сколько единиц этого товара было выдано
         РАНЬШЕ поступления, которое их покрыло. Единственное новое поле:
         выдачи в карту не кладутся — они собираются местной картой
         второго прохода, чтобы форма ответа не разрослась. */
      earlyUnits:0,
      /* ++++++ GOODS RETURN ++++++ доля себестоимости, которую вернул
         каждый возврат этого товара: id возврата -> целые копейки
         (положительные). Читают её отчёт и dcStats — как cogsOf. */
      retUnits:0, retCogsOf:{},
      avgCostCents:0, cogsCents:0, profitCents:0, stockCostCents:0 };
  });
  /* ++++++ MOVING AVG ++++++ R12. Здесь стояло распределение себестоимости
     по ПОЖИЗНЕННОЙ средней — из-за него поступление, пришедшее сегодня,
     меняло прибыль за период, закрывшийся месяцы назад.

     Теперь себестоимость раскладывает бегущий баланс: выдача стоит
     столько, сколько стоило то, что лежало на складе в тот день. Сам
     проход ушёл в cogsAllocate(), потому что порядок там ПО ДАТАМ, а этот
     forEach идёт в порядке ввода записей.

     ++++++ COGS ROUND ++++++ R7 цела: округление по-прежнему ОДНО на
     товар, доли — разности округлений накопленного, и они
     телескопируются. На товаре с одной партией числа те же до копейки. */
  var byProd = {};
  actTx().forEach(function(t){
    var s = m[t.productId]; if (!s) return;
    s.taken += t.qty;
    s.valueCents += t.qty * t.unitPriceCents;
    if (!own(byProd, t.productId)) byProd[t.productId] = [];
    byProd[t.productId].push(t);
  });
  /* ++++++ GOODS RETURN ++++++ возврат гасит штуки и стоимость ПО ЦЕНЕ
     СВОЕЙ ВЫДАЧИ — суммы у него нет, есть только ссылка. taken и
     valueCents становятся чистыми (за вычетом возвратов): остаток,
     выручка и прибыль читают их как раньше и получают ответ уже с
     учётом возвратов — из одного места. */
  var byProdRet = {};
  actRet().forEach(function(r){
    var t = txById(r.txId); if (!t) return;
    var s = m[t.productId]; if (!s) return;
    s.taken -= r.qty;
    s.retUnits += r.qty;
    s.valueCents -= r.qty * t.unitPriceCents;
    if (!own(byProdRet, t.productId)) byProdRet[t.productId] = [];
    byProdRet[t.productId].push({ r: r, t: t });
  });
  Object.keys(m).forEach(function(k){
    if (own(m, k)) cogsAllocate(m[k], own(byProd, k) ? byProd[k] : [],
                                own(byProdRet, k) ? byProdRet[k] : []);
  });
  Object.keys(m).forEach(function(k){
    var s = m[k];
    s.remaining = s.initial - s.taken;
    s.avgCostCents = Math.round(s.avgCost);
    s.profitCents = s.valueCents - s.cogsCents;
    s.stockCostCents = s.spentCents - s.cogsCents;  // value of unsold stock, at cost
  });
  return m;
}
/* ++++++ R18 ++++++ txCostCents() стояла здесь и не звалась ниоткуда.
   Удалена, и это важнее обычной чистки: она пересчитывала productStats()
   ЦЕЛИКОМ ради одной продажи и была единственным местом в файле, где
   «себестоимость одной выдачи» выглядела как готовая к употреблению
   функция. Третья точка входа сюда не нужна и была ловушкой.

   ++++++ DEAD WEIGHT ++++++ B10. Здесь стояло «себестоимость считается в
   двух местах, и оба округляют её ПО ТРАНЗАКЦИИ внутри своего прохода».
   После R7 и R12 это неправда, и неправда в том самом месте, куда
   заглядывают за правилом округления: округление ОДНО НА ТОВАР
   (cogsAllocate(), доля — разность двух округлений накопленного), а
   computeReport() не округляет вовсе — читает готовую долю s.cogsOf[t.id]. */
function remainingFor(productId, ignoreTxId){
  var p = productById(productId);
  if (!p) return 0;
  var taken = 0;
  actTx().forEach(function(t){
    if (t.productId !== productId) return;
    if (ignoreTxId && t.id === ignoreTxId) return;
    taken += t.qty;
  });
  /* ++++++ GOODS RETURN ++++++ возвращённое снова лежит на полке. Возвраты
     ИСКЛЮЧЁННОЙ выдачи считаются тоже: при правке её количества они
     остаются в документе (правка ниже возвращённого запрещена в saveTx),
     и алгебра «новое количество ≤ этому остатку» сходится именно так. */
  actRet().forEach(function(r){
    var t = txById(r.txId);
    if (!t || t.productId !== productId) return;
    taken -= r.qty;
  });
  return p.qty - taken;
}
/* ================================================ ++++++ STATUS ITEMS ++++++
 * R21: ярлык не утверждает того, чего программа не проверяла.
 *
 * Здесь ветвление шло ТОЛЬКО по деньгам, а два ярлыка из пяти говорили о
 * ТОВАРЕ: «Товар не брали» и «Переплата (товар не брали)». Человек, взявший
 * три штуки по нулевой цене, получал `none` — то есть экран сообщал, что он
 * ничего не брал. Самая частая причина такого нуля — владелец ещё не задал
 * цену, и тогда ярлык не просто неточен: он говорит, что выдачи нет, и
 * владелец идёт вводить её второй раз.
 *
 * ПРАВИЛО:
 *
 *   ЯРЛЫК ГОВОРИТ О ТОВАРЕ ТОЛЬКО ТОГДА, КОГДА ПРО ТОВАР СПРОСИЛИ.
 *
 * Поэтому у `statusOf()` появился третий аргумент — сколько единиц человек
 * взял, — и два новых ключа на случай «взял, а долга нет»: `free` (не платил
 * и не должен) и `over` (заплатил при нулевом долге). Прежние `none` и
 * `credit` остались дословно теми же и достаются ровно тем, о ком они и
 * говорили: у кого выдач нет.
 *
 * ТРЕТИЙ АРГУМЕНТ НЕОБЯЗАТЕЛЕН НАРОЧНО. `!(units > 0)` при отсутствующем
 * аргументе истинно, то есть вызов из двух аргументов ведёт себя ТОЧНО как
 * прежде. Зовёт эту функцию одно место, и оно передаёт третий; но статус —
 * единственный производитель на весь файл (правило 1 предметной области), и
 * будущий вызов без units обязан не менять смысл, а не тихо переехать в
 * новую ветку.
 * ================================================================== */
function statusOf(dueCents, paidCents, units){
  /* ++++++ STATUS ITEMS ++++++ про товар — только когда про него спросили */
  if (dueCents <= 0 && !(units > 0)) return paidCents > 0 ? 'credit' : 'none';
  if (dueCents <= 0) return paidCents > 0 ? 'over' : 'free';
  if (paidCents <= 0) return 'unpaid';
  if (paidCents < dueCents) return 'partial';
  return 'paid';
}
function personStats(){
  var m = {};
  actPeople().forEach(function(p){
    m[p.id] = { person:p, dueCents:0, paidCents:0, outstandingCents:0, creditCents:0,
                units:0, retUnits:0, txCount:0, retCount:0, payCount:0, status:'none' };
  });
  actTx().forEach(function(t){
    var s = m[t.personId]; if (!s) return;
    s.dueCents += t.qty * t.unitPriceCents;
    s.units += t.qty; s.txCount++;
  });
  /* ++++++ GOODS RETURN ++++++ возврат уменьшает начисленное по цене своей
     выдачи. Ниже нуля dueCents не уходит по построению: валидатор держит
     Σ возвратов выдачи ≤ её количества. units остаются ВАЛОВЫМИ — статус
     человека, который брал товар и всё вернул, обязан говорить «Взял,
     долга нет», а не «Товар не брали» (R21: ярлык не врёт про товар). */
  actRet().forEach(function(r){
    var t = txById(r.txId); if (!t) return;
    var s = m[t.personId]; if (!s) return;
    s.dueCents -= r.qty * t.unitPriceCents;
    s.retUnits += r.qty; s.retCount++;
  });
  actPay().forEach(function(p){
    var s = m[p.personId]; if (!s) return;
    s.paidCents += p.amountCents; s.payCount++;
  });
  Object.keys(m).forEach(function(k){
    var s = m[k];
    s.outstandingCents = Math.max(0, s.dueCents - s.paidCents);
    s.creditCents = Math.max(0, s.paidCents - s.dueCents);
    /* ++++++ STATUS ITEMS ++++++ R21: третьим аргументом — взятые единицы */
    s.status = statusOf(s.dueCents, s.paidCents, s.units);
  });
  return m;
}
/* ---- report: the same computation paths, narrowed by product and/or date range ---- */
function inRange(date, from, to){
  if (from && date < from) return false;      // ISO yyyy-mm-dd compares correctly as a string
  if (to && date > to) return false;
  return true;
}
function computeReport(){
  var f = ui.report;
  var swapped = !!(f.from && f.to && f.from > f.to);   // "From later than To" -> ignore the range
  var from = swapped ? '' : f.from, to = swapped ? '' : f.to;
  var ps = productStats();
  var r = { swapped:swapped, filtered: !!(f.productId || from || to),
            units:0, revenueCents:0, costCents:0, profitCents:0, receivedCents:0, spentCents:0,
            initial:0, taken:0, remaining:0 };
  actTx().forEach(function(t){
    if (f.productId && t.productId !== f.productId) return;
    if (!inRange(t.date, from, to)) return;
    var s = own(ps, t.productId) ? ps[t.productId] : null;
    /* ++++++ COGS ROUND ++++++ R7. Готовая доля этой выдачи, а не
       собственное округление: части периодов складываются в целое
       точно. own() — потому что id вроде "constructor" в обычном
       объекте отозвался бы функцией из прототипа (R20). */
    var cost = (s && own(s.cogsOf, t.id)) ? s.cogsOf[t.id] : 0;
    r.units += t.qty;
    r.revenueCents += t.qty * t.unitPriceCents;
    r.costCents += cost;
  });
  /* ++++++ GOODS RETURN ++++++ возврат уменьшает штуки, выручку и
     себестоимость В ПЕРИОДЕ СВОЕЙ ДАТЫ (A2): цифры периода выдачи не
     трогаются. Доля себестоимости — готовая, из retCogsOf: части
     периодов складываются в целое точно, как у cogsOf. */
  actRet().forEach(function(x){
    var t = txById(x.txId); if (!t) return;
    if (f.productId && t.productId !== f.productId) return;
    if (!inRange(x.date, from, to)) return;
    var s = own(ps, t.productId) ? ps[t.productId] : null;
    r.units -= x.qty;
    r.revenueCents -= x.qty * t.unitPriceCents;
    r.costCents -= (s && own(s.retCogsOf, x.id)) ? s.retCogsOf[x.id] : 0;
  });
  /* Здесь же собирались byPerson и byProduct — их не читал НИКТО:
     остатки отчётных таблиц, удалённых редизайном. */
  r.profitCents = r.revenueCents - r.costCents;
  actPay().forEach(function(p){                  // payments are person-level (never per product)
    if (!inRange(p.date, from, to)) return;
    r.receivedCents += p.amountCents;
  });
  actProducts().forEach(function(p){
    if (f.productId && p.id !== f.productId) return;
    r.initial += p.qty;
    (Array.isArray(p.batches) ? p.batches : []).forEach(function(bt){
      if (inRange(bt.date, from, to)) r.spentCents += bt.totalCostCents;
    });
    var s = ps[p.id];
    if (s){ r.taken += s.taken; r.remaining += s.remaining; }
  });
  /* ++++++ EXPENSES ++++++ расходы периода, В БАЗОВЫХ минорных единицах.
     Отбор — expPick(), тот же самый, из которого их берут и экран
     «Расходы», и dcStats(): разойтись они не могут по построению.

     ФИЛЬТР ТОВАРА СЮДА НЕ ПРИМЕНЯЕТСЯ, и это не упущение: товара у расхода
     нет. С выбранным товаром «Чистая прибыль» окажется прибылью по этому
     товару минус ВСЕ расходы периода — прямое следствие правил, и оно
     названо в подписи строки.

     Прибыль выше не тронута ни на копейку: netProfitCents — новая
     производная, а не поправка к profitCents. */
  r.expenseCents = expSum(expPick(from, to));
  r.netProfitCents = r.profitCents - r.expenseCents;
  return r;
}
function grandTotals(){
  var ps = productStats(), pe = personStats();
  var t = { initialUnits:0, takenUnits:0, remainingUnits:0,
            expectedCents:0, receivedCents:0, outstandingCents:0, creditCents:0,
            spentCents:0, cogsCents:0, profitCents:0, stockCostCents:0 };
  Object.keys(ps).forEach(function(k){
    t.initialUnits += ps[k].initial; t.takenUnits += ps[k].taken; t.remainingUnits += ps[k].remaining;
    t.expectedCents += ps[k].valueCents;
    t.spentCents += ps[k].spentCents; t.cogsCents += ps[k].cogsCents;
    t.profitCents += ps[k].profitCents; t.stockCostCents += ps[k].stockCostCents;
  });
  Object.keys(pe).forEach(function(k){
    t.receivedCents += pe[k].paidCents;
    t.outstandingCents += pe[k].outstandingCents;
    t.creditCents += pe[k].creditCents;
  });
  return t;
}
/* ++++++ TRASH ++++++ шесть поисков по id читают АКТИВНЫЕ записи: их смысл
   — «запись, с которой работает программа». Корзину читает trashFind(), и
   только экран корзины. Иначе корзинная выдача просочилась бы в
   productStats() через txById(). */
function productById(id){ var l = actProducts(), i; for (i=0;i<l.length;i++) if (l[i].id===id) return l[i]; return null; }
function personById(id){ var l = actPeople(), i; for (i=0;i<l.length;i++) if (l[i].id===id) return l[i]; return null; }
function txById(id){ var l = actTx(), i; for (i=0;i<l.length;i++) if (l[i].id===id) return l[i]; return null; }
function payById(id){ var l = actPay(), i; for (i=0;i<l.length;i++) if (l[i].id===id) return l[i]; return null; }

/* =============================================== ++++++ TRASH ++++++ ==
 * ШЕСТЬ АКСЕССОРОВ — ЕДИНСТВЕННОЕ МЕСТО, ГДЕ КОРЗИНА ОТСЕКАЕТСЯ.
 *
 * Через них читают все: склад, долги, статусы, «Сводка», «Полный отчёт»,
 * расходы, напоминания, поиск, оба `<select>`, счётчики в разделе копии.
 * Прямое чтение state.<коллекция> остаётся ровно там, где запись обязана
 * быть видна ЦЕЛИКОМ, и таких мест шесть родов:
 *
 *   · snapEach() — снимок курсов корзинной записи обязан переехать при
 *     смене базы, иначе восстановленная запись вернётся из покинутой
 *     базы (R32, хрупкое место 63);
 *   · applyBaseChange() и откат baseUndo* — суммы пересчитываются у всех
 *     записей документа, включая корзину;
 *   · bakSig() — попадание записи в корзину ЕСТЬ изменение документа, и
 *     копия после него устарела;
 *   · attSweep() — корзинный товар остаётся в коллекции, поэтому его
 *     фотография не сирота. Перевести уборку на аксессор значит удалить
 *     файлы, которые обещано сохранить;
 *   · validate() и экспорт — документ целиком;
 *   · слияние и pendingCount — корзина едет как обычные данные.
 *
 * Ни одна из этих потерь не даёт ошибки нигде — поэтому список записан.
 * ================================================================== */
function actProducts(){ return trashActive(state.products); }
function actPeople(){ return trashActive(state.people); }
function actTx(){ return trashActive(state.transactions); }
function actPay(){ return trashActive(state.payments); }
function actRet(){ return trashActive(state.returns); }
function actExp(){ return trashActive(state.expenses); }
