/* Четвёртый ключ приложения из пяти (пятый — 'goods-tracker/pre-sync-v1',
   копия документа перед применением чужих записей). Тут только то, что
   нужно ЭТОМУ устройству, чтобы разговаривать с GitHub. Ни одной записи. */
var SYNC_KEY = 'goods-tracker/sync-v1';

/* Что лежит по ключу:
   { on, owner, repo, path, branch, sha, hash, at, dev }
   ТОКЕНА ЗДЕСЬ НЕТ и быть не может: он живёт в хранилище системы
   (safeStorage у Windows, Keystore у Android), а в памяти страницы — в
   syncTokenCache на время сеанса. Раньше эта строка перечисляла его
   вместе с остальным, и читатель имел все основания поверить.
   `sha`  — версия, которую это устройство в последний раз ЗНАЛО;
   `hash` — отпечаток документа на тот же момент: он отвечает на вопрос
            «менялось ли у нас что-то с тех пор», и без него нельзя
            отличить «мы отстали» от «мы разошлись». */

var SYNC_MAX = 40 * 1024 * 1024;   /* GitHub Contents API: выше не примет */
var SYNC_BIG = 1024 * 1024;        /* выше этого чтение идёт через blobs  */

/* ---- хранилище: НИ ОДНА из трёх не бросает ---------------------- */

function syncRead(){
  try{
    var raw = window.localStorage.getItem(SYNC_KEY);
    if (!raw) return null;
    var o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return null;
    if (Object.prototype.toString.call(o) === '[object Array]') return null;
    return o;
  }catch(e){ return null; }
}
function syncWrite(o){
  try{ window.localStorage.setItem(SYNC_KEY, JSON.stringify(o)); return true; }
  catch(e){ return false; }
}
function syncForget(){
  try{ window.localStorage.removeItem(SYNC_KEY); return true; }
  catch(e){ return false; }
}

/* Настроена ли синхронизация: есть всё, без чего нельзя сделать запрос. */
function syncCfg(){
  var o = syncRead();
  if (!o || !o.on) return null;
  if (!o.token || !o.owner || !o.repo) return null;
  return {
    token:  String(o.token),
    owner:  String(o.owner),
    repo:   String(o.repo),
    path:   String(o.path || 'state.json'),
    branch: String(o.branch || 'main'),
    sha:    o.sha ? String(o.sha) : '',
    hash:   o.hash ? String(o.hash) : '',
    at:     o.at ? String(o.at) : '',
    dev:    String(o.dev || '')
  };
}

/* ---- base64 в обе стороны --------------------------------------- */
/* btoa() принимает только байты, а документ — UTF-8 с кириллицей.
   Измерено на документе 414 КБ: кодирование 4.6 мс, обратно 2.7 мс,
   текст возвращается посимвольно тем же. */

function b64enc(s){
  try{ return window.btoa(unescape(encodeURIComponent(s))); }
  catch(e){ return null; }
}
function b64dec(b){
  try{ return decodeURIComponent(escape(window.atob(String(b).replace(/\s+/g, '')))); }
  catch(e){ return null; }
}

/* ---- отпечаток документа ---------------------------------------- */
/* Отвечает ровно на один вопрос: «это тот же текст, что был?». Не
   криптография — сравнение, как у bakSig(). Длина в хвосте потому, что
   она бесплатна и отсекает целый класс совпадений. */

function syncHash(text){
  var h1 = 0x811c9dc5, h2 = 0x01000193, i, c;
  for (i = 0; i < text.length; i++){
    c  = text.charCodeAt(i);
    h1 = (h1 ^ c) >>> 0;
    h1 = (h1 * 16777619) >>> 0;
    h2 = (h2 + c * (i % 31 + 1)) >>> 0;
  }
  return h1.toString(16) + '-' + h2.toString(16) + '-' + text.length;
}

/* ---- один запрос к GitHub --------------------------------------- */
/* cb(err, data, status). `err` — короткий КЛЮЧ, а не текст: текст живёт
   в словаре и переводится, как всё видимое в этом файле.
     'nofetch'  — браузер не умеет fetch (очень старый)
     'net'      — запрос не дошёл: нет сети, самолётный режим, обрыв
     'auth'     — 401/403: токен не тот, истёк или отозван
     'notfound' — 404: нет такого репозитория, файла или доступа
     'conflict' — 409/422: на сервере другая версия
     'big'      — больше, чем принимает Contents API
     'server'   — всё прочее                                        */

function ghReq(cfg, method, url, body, cb){
  if (typeof window.fetch !== 'function'){ cb('nofetch'); return; }
  var opt = {
    method: method,
    headers: {
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }
  };
  /* ++++++ PRODUCT UPDATE ++++++ токен ставится, ТОЛЬКО если он есть.
     У пользователя продуктовой сборки его нет и не будет, а публичный
     репозиторий релизов его не требует — там лежат только установщики
     и манифест. С «Bearer undefined» GitHub отвечает 401, то есть
     «обновлений нет» ровно там, где они есть. Все прежние вызовы
     передают токен и работают как работали. */
  if (cfg && cfg.token) opt.headers['Authorization'] = 'Bearer ' + cfg.token;
  if (body){
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  var status = 0;
  window.fetch(url, opt).then(function(r){
    status = r.status;
    return r.text();
  }).then(function(t){
    var j = null;
    try{ j = t ? JSON.parse(t) : null; }catch(e){ j = null; }
    if (status >= 200 && status < 300){ cb(null, j, status); return; }
    if (status === 401 || status === 403){ cb('auth', j, status); return; }
    if (status === 404){ cb('notfound', j, status); return; }
    if (status === 409 || status === 422){ cb('conflict', j, status); return; }
    cb('server', j, status);
  })['catch'](function(){ cb('net', null, status); });
}

function ghUrl(cfg){
  var parts = cfg.path.split('/'), i, out = [];
  for (i = 0; i < parts.length; i++) out.push(encodeURIComponent(parts[i]));
  return 'https://api.github.com/repos/' +
         encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) +
         '/contents/' + out.join('/');
}

/* ==================================================================
 * ++++++ BIG CORE ++++++     ЧТЕНИЕ ФАЙЛА ИЗ РЕПОЗИТОРИЯ — ОДНО НА ВСЕХ
 *
 * ES5. Одна функция, и она отвечает на один вопрос: «дай мне ТЕКСТ
 * файла, ответ на который уже пришёл из Contents API».
 *
 * ПОЧЕМУ ЭТО НЕ ОДИН ЗАПРОС. Contents API отдаёт содержимое только до
 * 1 МБ — и меряет он БАЙТЫ UTF-8, а не символы. Ядро в 844 тысячи
 * символов весит 1 063 тысячи байт, потому что почти весь его текст
 * русский: предел уже перейдён. Тогда GitHub отвечает 200, но с пустым
 * `content`, `encoding: "none"` и одним лишь `sha` — по нему текст
 * берётся из git/blobs, где предел 100 МБ. Тот же хост, тот же ключ,
 * никакого нового адреса.
 *
 * ПОЧЕМУ ФУНКЦИЯ ОДНА. У обмена документом эта вторая ветка была с
 * самого начала; у обновления ядра её не было — и продуктовое ядро не
 * могло приехать ВООБЩЕ, ни на одном устройстве. Два ответа на один
 * вопрос разошлись молча, и заметить это можно было только выложив
 * настоящий файл: поддельный GitHub в наборах отдавал `content`
 * всегда, потому и был зелёным.
 *
 * ЧЕГО ЗДЕСЬ НЕТ: решений о том, годится ли этот текст. Размер,
 * отпечаток, «это вообще ядро?» — забота вызывающего, и у обмена с
 * обновлением они разные.
 * ================================================================== */

/* cb(err, text). `j` — уже разобранный ответ Contents API. */
function ghFileText(cfg, j, cb){
  if (!j || typeof j !== 'object'){ cb('server'); return; }
  if (j.content){
    var text = b64dec(j.content);
    if (text === null){ cb('server'); return; }
    cb(null, text);
    return;
  }
  /* Пустой `content` без `sha` — ответ, из которого текст не достать
     ничем: это не «файл пуст», это «ответ не тот». */
  if (!j.sha){ cb('server'); return; }
  var burl = 'https://api.github.com/repos/' +
             encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) +
             '/git/blobs/' + encodeURIComponent(j.sha);
  ghReq(cfg, 'GET', burl, null, function(e2, b){
    if (e2){ cb(e2); return; }
    if (!b || !b.content){ cb('server'); return; }
    var t2 = b64dec(b.content);
    if (t2 === null){ cb('server'); return; }
    cb(null, t2);
  });
}

/* ---- забрать документ ------------------------------------------- */
/* cb(err, res). res = { text, sha } либо { empty:true } — файла ещё нет,
   и это НЕ ошибка: так выглядит первый запуск на чистом репозитории. */

function ghGetDoc(cfg, cb){
  var url = ghUrl(cfg) + '?ref=' + encodeURIComponent(cfg.branch) +
            '&t=' + String(new Date().getTime());   /* мимо кеша посредников */
  ghReq(cfg, 'GET', url, null, function(err, j){
    if (err === 'notfound'){ cb(null, { empty: true }); return; }
    if (err){ cb(err); return; }
    if (!j || typeof j !== 'object'){ cb('server'); return; }
    if (j.size && j.size > SYNC_MAX){ cb('big'); return; }
    /* Читает ghFileText() — та же дверь, которой пользуется обновление
       ядра. Второй такой ветки в файле быть не должно: пока их было
       две, у одной она была, а у другой нет, и это не давало ошибки
       нигде. */
    if (!j.sha && !j.content){ cb('server'); return; }
    var docSha = String(j.sha);
    ghFileText(cfg, j, function(e2, text){
      if (e2){ cb(e2); return; }
      cb(null, { text: text, sha: docSha });
    });
  });
}

/* ---- отправить документ ----------------------------------------- */
/* `sha` — версия, ПОВЕРХ которой мы пишем. Пустой = «файла не было».
   Не совпал с серверным — GitHub отвечает отказом, и это единственная
   защита, на которую здесь вообще можно положиться: она на сервере, а
   не в нашем коде, и переживает любую нашу ошибку. */

function ghPutDoc(cfg, text, sha, message, cb){
  var content = b64enc(text);
  if (content === null){ cb('server'); return; }
  if (content.length > SYNC_MAX){ cb('big'); return; }
  var body = { message: message, content: content, branch: cfg.branch };
  if (sha) body.sha = sha;
  ghReq(cfg, 'PUT', ghUrl(cfg), body, function(err, j){
    if (err){ cb(err); return; }
    if (!j || !j.content || !j.content.sha){ cb('server'); return; }
    cb(null, { sha: String(j.content.sha) });
  });
}


/* ==================================================================
 * ++++++ TRANSPORT ++++++       ОДИН ДВИЖОК, ДВЕ ДОРОГИ
 *
 * ES5. Шов между циклом обмена и тем, КУДА он возит документ.
 *
 * ПРАВИЛО, ИЗ КОТОРОГО СЛЕДУЕТ ВСЁ:
 *
 *     ЦИКЛ НЕ ЗНАЕТ, ЧТО СТОИТ ЗА МЕТКОЙ ВЕРСИИ.
 *
 * У GitHub это `sha` содержимого, у Drive — числовой счётчик, который
 * растёт при каждом изменении файла. Общее у них ровно одно: метка
 * говорит «это та же версия, которую я скачал». Больше циклу знать
 * нечего, и syncDecide() продолжает работать без единой правки.
 *
 * ЧЕГО ЗДЕСЬ НЕТ. Ни слияния, ни резервной копии, ни validate() — всё
 * это выше по течению и одинаково для обеих дорог. Транспорт умеет
 * два действия: принести текст с меткой и положить текст поверх метки.
 * ================================================================== */

/* ------------------------------------------------------------------ */
/* Договор                                                            */
/* ------------------------------------------------------------------ */
/* Транспорт — это объект с двумя функциями:
 *
 *   get(cb)
 *     cb(err, { text: '…', version: '…' })   файл есть
 *     cb(err, { empty: true })               файла ещё нет — НЕ ошибка
 *
 *   put(text, version, counts, cb)
 *     cb(err, { version: '…' })
 *     version === ''  означает «файла не было, создаю»
 *     err === 'conflict' означает «на той стороне уже другая версия»,
 *     и это ОБЫЧНОЕ течение дел: цикл повторит оборот целиком.
 *
 * `counts` нужен только тому транспорту, у которого запись имеет
 * подпись (GitHub — сообщение коммита). Drive его не смотрит.
 *
 * Коды ошибок общие на обе дороги, потому что общий у них ЭКРАН:
 *   'nofetch'  браузер не умеет fetch
 *   'net'      запрос не дошёл: нет сети, обрыв
 *   'auth'     доступ не принят: ключ истёк, отозван, не тот
 *   'notfound' нет такого места или доступа к нему
 *   'conflict' на той стороне другая версия
 *   'big'      больше, чем принимает та сторона
 *   'rate'     слишком часто; подождать и повторить
 *   'quota'    место кончилось
 *   'server'   всё прочее
 */

/* ------------------------------------------------------------------ */
/* Дорога первая: GitHub                                              */
/* ------------------------------------------------------------------ */
/* Обёртка, и ничего больше. `ghGetDoc` и `ghPutDoc` не меняются ни на
   байт — они проверены обменом, который работает с августа. Здесь
   только перевод `sha` в `version` и сборка сообщения коммита, которое
   циклу знать незачем. */

function ghTransport(cfg){
  return {
    kind: 'github',
    get: function(cb){
      ghGetDoc(cfg, function(err, res){
        if (err){ cb(err); return; }
        if (res && res.empty){ cb(null, { empty: true }); return; }
        cb(null, { text: res.text, version: String(res.sha || '') });
      });
    },
    put: function(text, version, counts, cb){
      ghPutDoc(cfg, text, version, syncMsg(cfg, counts), function(err, res){
        if (err){ cb(err); return; }
        cb(null, { version: String(res.sha || '') });
      });
    }
  };
}

/* ------------------------------------------------------------------ */
/* Выбор дороги                                                       */
/* ------------------------------------------------------------------ */
/* Решает РЕЖИМ СБОРКИ, и решает один раз. Смешивать две дороги в одном
   сеансе нельзя: это две копии документа, расходящиеся молча, и
   владельцу нечем будет понять, какая из них настоящая. */

function transportFor(cfg){
  if (modeSyncKind() === 'drive') return gdTransport(cfg);
  return ghTransport(cfg);
}


/* ==================================================================
 * ++++++ GDRIVE ++++++     УЧЁТНАЯ ЗАПИСЬ ВЛАДЕЛЬЦА — ЕГО СЕРВЕР
 *
 * ES5. Ни одной стрелки, ни одного `let`, ни одного шаблонного
 * литерала — файл написан так, чтобы лечь в goods-tracker.html как
 * есть. Примеры OAuth у Google все на async/await; здесь всё
 * переписано на колбэки, как ghReq().
 *
 * ПРАВИЛО, ИЗ КОТОРОГО СЛЕДУЕТ ВСЁ:
 *
 *     ПРОГРАММА ВИДИТ ТОЛЬКО СВОЮ СКРЫТУЮ ПАПКУ, И БОЛЬШЕ НИЧЕГО.
 *
 * Отсюда область доступа `drive.appdata` и никакая другая. Google
 * говорит о ней дословно: «only the application that created the data
 * in the appDataFolder can access it», и папка не видна ни владельцу в
 * обычном списке Drive, ни другим программам. Даже если ключ утечёт,
 * взять им можно ровно один файл — data.json этой программы. Не почту,
 * не фотографии, не документы.
 *
 * ЧЕГО ЗДЕСЬ НЕТ. Ни одного секрета в коде. `client_id` секретом не
 * является — Google называет его публичным для приложений этого типа;
 * `client_secret` для установленных приложений не применяется вовсе,
 * вместо него PKCE: одноразовая пара «проверочное слово / его
 * отпечаток», которая живёт секунды и никуда не сохраняется.
 * ================================================================== */

/* Область доступа. Ровно одна на данные, плюс личность — чтобы узнать
   устойчивый номер учётной записи и имя для показа. Почта НЕ
   запрашивается: её владелец может сменить, а номер — нет. */
var GD_SCOPE = 'https://www.googleapis.com/auth/drive.appdata openid profile';

/* Имя файла в скрытой папке. Совпадает с именем файла обмена через
   GitHub не случайно: конверт внутри тот же, и это проверяется. */
var GD_FILE = 'data.json';

/* Три адреса Google, и больше ни одного. Обязаны совпадать с
   NET_HOSTS_PRODUCT в mode.js — сборка это сверяет. */
var GD_AUTH   = 'https://accounts.google.com/o/oauth2/v2/auth';
var GD_TOKEN  = 'https://oauth2.googleapis.com/token';
var GD_API    = 'https://www.googleapis.com/drive/v3';
var GD_UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
var GD_INFO   = 'https://www.googleapis.com/oauth2/v3/userinfo';

/* Больше этого Drive принять не откажется, но документ такого размера
   означает, что что-то пошло не так: 1550 записей весят 414 КБ. */
var GD_MAX = 40 * 1024 * 1024;

/* ==================================================================
 * ЧАСТЬ 1. ОДНА ТОЧКА ЗАПРОСА
 * ================================================================== */
/* Вторая в файле после ghReq(), и это осознанно: у GitHub зашиты свои
   заголовки и свой разбор кодов, подсунуть туда Drive значило бы
   сломать обе дороги сразу. Но точка всё равно ОДНА НА ДОРОГУ —
   третьей быть не должно.
 *
 * cb(err, data, status). `err` — короткий КЛЮЧ, а не текст: текст
 * живёт в словаре и переводится, как всё видимое в этом файле.        */

function gdReq(o, cb){
  if (typeof window === 'undefined' || typeof window.fetch !== 'function'){
    cb('nofetch'); return;
  }
  var opt = { method: o.method || 'GET', headers: {} };
  if (o.token) opt.headers['Authorization'] = 'Bearer ' + o.token;
  if (o.contentType) opt.headers['Content-Type'] = o.contentType;
  if (o.body !== undefined && o.body !== null) opt.body = o.body;

  var status = 0;
  window.fetch(o.url, opt).then(function(r){
    status = r.status;
    return r.text();
  }).then(function(t){
    if (status >= 200 && status < 300){
      if (o.raw){ cb(null, t, status); return; }
      var j = null;
      try{ j = t ? JSON.parse(t) : null; }catch(e){ j = null; }
      cb(null, j, status);
      return;
    }
    cb(gdErrOf(status, t), null, status);
  })['catch'](function(){ cb('net', null, status); });
}

/* Какая именно беда. Google отвечает 403 на четыре разных случая, и
   владельцу они означают совершенно разное: «место кончилось» он может
   исправить, «слишком часто» пройдёт само, «доступ отозван» требует
   нового входа. Свалить их в одно слово значит посоветовать не то. */
function gdErrOf(status, text){
  /* 400 от точки выдачи ключей — НЕ «Google ответил ошибкой». Это
     всегда что-то конкретное, и владельцу нужно знать что именно:
     ключ создан не того типа, адрес возврата не тот, код просрочен.
     Пока эти три сваливались в одно слово, чинить было нечего. */
  if (status === 400){
    var e = '';
    try{ e = String((JSON.parse(text) || {}).error || ''); }catch(err){ e = ''; }
    var d = '';
    try{ d = String((JSON.parse(text) || {}).error_description || ''); }catch(err){ d = ''; }
    if (d.indexOf('client_secret') >= 0) return 'needsecret';
    if (e === 'invalid_grant') return 'expired';
    if (e === 'redirect_uri_mismatch' || d.indexOf('redirect_uri') >= 0) return 'badredirect';
    if (e === 'invalid_client') return 'badclient';
    return 'badrequest';
  }
  if (status === 401) return 'auth';
  if (status === 404) return 'notfound';
  if (status === 429) return 'rate';
  if (status === 403){
    var reason = '';
    try{
      var j = JSON.parse(text);
      if (j && j.error && j.error.errors && j.error.errors.length)
        reason = String(j.error.errors[0].reason || '');
    }catch(e){ reason = ''; }
    if (reason.indexOf('storageQuota') === 0) return 'quota';
    if (reason.indexOf('rateLimit') === 0 || reason.indexOf('userRateLimit') === 0)
      return 'rate';
    return 'auth';
  }
  if (status >= 500) return 'server';
  return 'server';
}

/* ==================================================================
 * ЧАСТЬ 2. ВХОД
 * ================================================================== */

/* Проверочное слово PKCE. Случайное, одноразовое, нигде не хранится:
   живёт от нажатия «Войти» до возврата из браузера. Длина 64 —
   середина допустимого Google диапазона 43…128. */
function gdVerifier(rnd){
  var ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  var out = '', i, bytes = rnd(64);
  for (i = 0; i < 64; i++) out += ABC.charAt(bytes[i] % ABC.length);
  return out;
}

/* base64url — НЕ тот же base64. Плюс и слэш в адресе значат другое, а
   знак равенства Google в этом поле не принимает вовсе. Ошибка здесь
   не видна глазом и даёт отказ `invalid_grant`, который уводит куда
   угодно, только не к причине. */
function gdB64Url(bytes){
  var bin = '', i;
  for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  var b64;
  try{ b64 = window.btoa(bin); }catch(e){ return null; }
  return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/* Отпечаток проверочного слова. S256, как требует Google для
   установленных приложений; `plain` не поддерживаем вовсе — он
   бесполезен, а поддержать его значит дать себе право им
   воспользоваться в неудачный день. */
function gdChallenge(verifier, cb){
  var subtle = (typeof window !== 'undefined' && window.crypto && window.crypto.subtle)
             ? window.crypto.subtle : null;
  if (!subtle){ cb('nocrypto'); return; }
  var bytes = [], i;
  for (i = 0; i < verifier.length; i++) bytes.push(verifier.charCodeAt(i) & 0xff);
  var buf = new Uint8Array(bytes);
  subtle.digest('SHA-256', buf).then(function(hash){
    cb(null, gdB64Url(new Uint8Array(hash)));
  })['catch'](function(){ cb('nocrypto'); });
}

/* Адрес окна входа. Собирается ЗДЕСЬ, а не в оболочке: оболочка не
   должна знать ни об областях доступа, ни о PKCE — она открывает окно
   в СИСТЕМНОМ браузере и приносит ответ. Встроенное окно (WebView)
   запрещено прямо: Google его отвергает, и правильно делает — там
   владелец не видит адресной строки и не может убедиться, что вводит
   пароль на настоящей странице Google. */
function gdAuthUrl(clientId, redirect, challenge, state){
  if (!clientId || !redirect) return null;
  var q = [
    'client_id=' + encodeURIComponent(clientId),
    'redirect_uri=' + encodeURIComponent(redirect),
    'response_type=code',
    'scope=' + encodeURIComponent(GD_SCOPE),
    'code_challenge=' + encodeURIComponent(challenge),
    'code_challenge_method=S256',
    'state=' + encodeURIComponent(state),
    /* без этого Google не выдаст долгоживущий ключ, и вход пришлось бы
       повторять каждый час — то есть «войти один раз» не выполнится */
    'access_type=offline',
    'prompt=consent'
  ];
  return GD_AUTH + '?' + q.join('&');
}

/* Разбор того, что вернулось из браузера. `state` сверяется
   ОБЯЗАТЕЛЬНО: без этой сверки чужая ссылка, открытая владельцем,
   могла бы подсунуть программе чужой код авторизации — и данные
   владельца уехали бы в чужую учётную запись. */
function gdParseBack(url, expectState){
  var qs = String(url).split('?')[1] || '';
  qs = qs.split('#')[0];
  var parts = qs.split('&'), got = {}, i, kv;
  for (i = 0; i < parts.length; i++){
    kv = parts[i].split('=');
    if (kv[0]) got[decodeURIComponent(kv[0])] =
      decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
  }
  if (got.error) return { ok: false, err: got.error === 'access_denied' ? 'denied' : 'auth' };
  if (!expectState || got.state !== expectState) return { ok: false, err: 'state' };
  if (!got.code) return { ok: false, err: 'auth' };
  return { ok: true, code: got.code };
}

/* Тело запроса к точке выдачи ключей. application/x-www-form-urlencoded,
   как требует спецификация: JSON там не принимают. */
function gdForm(o){
  var out = [], k;
  for (k in o) if (Object.prototype.hasOwnProperty.call(o, k)){
    out.push(encodeURIComponent(k) + '=' + encodeURIComponent(String(o[k])));
  }
  return out.join('&');
}

/* Код авторизации → пара ключей. Долгоживущий ключ выдаётся ОДИН раз,
   при первом согласии; если Google его не прислал, вход считается
   неудавшимся — иначе «подключено» означало бы «до конца часа». */
function gdExchange(clientId, secret, redirect, code, verifier, cb){
  /* Секрет добавляется, ТОЛЬКО если он есть. У Android его нет, и
     отправить пустой — значит получить отказ на ровном месте. */
  var form = { client_id: clientId, redirect_uri: redirect,
               code: code, code_verifier: verifier,
               grant_type: 'authorization_code' };
  if (secret) form.client_secret = secret;
  gdReq({
    method: 'POST', url: GD_TOKEN,
    contentType: 'application/x-www-form-urlencoded',
    body: gdForm(form)
  }, function(err, j){
    if (err){ cb(err); return; }
    if (!j || !j.access_token){ cb('auth'); return; }
    if (!j.refresh_token){ cb('norefresh'); return; }
    cb(null, {
      access: String(j.access_token),
      refresh: String(j.refresh_token),
      until: gdUntil(j.expires_in)
    });
  });
}

/* Обновление короткого ключа. ЕДИНСТВЕННОЕ место — требование
   «centralized token refresh»: два места, где обновляют ключ, дадут
   две гонки за один ключ и один отзыв на двоих. */
function gdRefresh(clientId, secret, refresh, cb){
  var form = { client_id: clientId, refresh_token: refresh,
               grant_type: 'refresh_token' };
  if (secret) form.client_secret = secret;
  gdReq({
    method: 'POST', url: GD_TOKEN,
    contentType: 'application/x-www-form-urlencoded',
    body: gdForm(form)
  }, function(err, j){
    if (err){ cb(err); return; }
    if (!j || !j.access_token){ cb('auth'); return; }
    /* Google возвращает новый долгоживущий ключ редко, и это нормально:
       старый продолжает действовать. Но если прислал — берём новый. */
    cb(null, { access: String(j.access_token),
               refresh: j.refresh_token ? String(j.refresh_token) : '',
               until: gdUntil(j.expires_in) });
  });
}

function gdUntil(expiresIn){
  var sec = (typeof expiresIn === 'number' && expiresIn > 0) ? expiresIn : 3600;
  return new Date().getTime() + sec * 1000;
}

/* Пора ли обновлять. Запас в минуту — чтобы запрос, начатый на 59-й
   минуте, не упёрся в отказ на середине отправки документа. */
function gdNeedsRefresh(tok, nowMs){
  if (!tok || !tok.access) return true;
  return !tok.until || (tok.until - 60000) <= nowMs;
}

/* ==================================================================
 * ЧАСТЬ 3. КТО ВОШЁЛ
 * ================================================================== */

/* Устойчивый номер учётной записи и имя для показа. Номер (`sub`) —
   то, к чему привязываются данные устройства: почта меняется, номер
   нет. */
function gdWhoAmI(access, cb){
  gdReq({ url: GD_INFO, token: access }, function(err, j){
    if (err){ cb(err); return; }
    if (!j || !gdSubOk(j.sub)){ cb('server'); return; }
    cb(null, { sub: String(j.sub), name: gdNameOf(j) });
  });
}

/* Пришло извне — значит недоверенный ввод (хрупкое место 35). Тот же
   приём, что у `thumb` в validate(): проверка ФОРМЫ, а не только
   экранирование. */
function gdSubOk(v){
  return typeof v === 'string' && /^[0-9]{1,32}$/.test(v);
}
function gdNameOf(j){
  var n = (j && typeof j.name === 'string') ? j.name : '';
  if (!n && j && typeof j.given_name === 'string') n = j.given_name;
  return n.slice(0, 100);
}

/* ==================================================================
 * ЧАСТЬ 4. ФАЙЛ В СКРЫТОЙ ПАПКЕ
 * ================================================================== */

/* Найти data.json. `spaces=appDataFolder` — единственная область, куда
   программа вообще может заглянуть; без него тот же запрос искал бы по
   всему диску владельца, и это была бы ровно та ошибка, ради
   невозможности которой выбрана эта область доступа. */
function gdFind(access, cb){
  var url = GD_API + '/files?spaces=appDataFolder' +
            '&q=' + encodeURIComponent("name='" + GD_FILE + "' and trashed=false") +
            '&fields=' + encodeURIComponent('files(id,version,size)') +
            '&pageSize=10';
  gdReq({ url: url, token: access }, function(err, j){
    if (err){ cb(err); return; }
    if (!j || !j.files || !j.files.length){ cb(null, null); return; }
    /* Несколько файлов с одним именем в скрытой папке означают, что
       что-то однажды пошло не так. Берём первый и говорим об этом
       вслух, а не выбираем молча. */
    cb(null, { id: String(j.files[0].id),
               version: String(j.files[0].version || ''),
               extra: j.files.length - 1 });
  });
}

/* Только версия, без содержимого. Нужен перед записью — см. решение 4
   в DECISIONS.md: у Drive нет условной записи, и это лучшее, что
   можно сделать вместо неё. */
function gdVersion(access, id, cb){
  gdReq({ url: GD_API + '/files/' + encodeURIComponent(id) + '?fields=version',
          token: access }, function(err, j){
    if (err){ cb(err); return; }
    if (!j || j.version === undefined){ cb('server'); return; }
    cb(null, String(j.version));
  });
}

/* Содержимое. `alt=media` отдаёт байты файла, а не описание — ответ
   читается как ТЕКСТ и через JSON.parse не идёт: разбирать его будет
   openEnvelope(), единственные ворота входящего файла. */
function gdDownload(access, id, cb){
  gdReq({ url: GD_API + '/files/' + encodeURIComponent(id) + '?alt=media',
          token: access, raw: true }, cb);
}

/* Создание. multipart/related: первая часть — описание файла, вторая —
   его содержимое. Родитель `appDataFolder` — то самое слово, которое
   кладёт файл в скрытую папку; без него он лёг бы в корень диска
   владельца, на виду. */
function gdCreate(access, text, cb){
  if (text.length > GD_MAX){ cb('big'); return; }
  var b = 'gtb' + String(new Date().getTime()) + 'x';
  var meta = JSON.stringify({ name: GD_FILE, parents: ['appDataFolder'] });
  var body = '--' + b + '\r\n' +
             'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
             meta + '\r\n' +
             '--' + b + '\r\n' +
             'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
             text + '\r\n' +
             '--' + b + '--';
  gdReq({ method: 'POST',
          url: GD_UPLOAD + '?uploadType=multipart&fields=' + encodeURIComponent('id,version'),
          token: access,
          contentType: 'multipart/related; boundary=' + b,
          body: body }, function(err, j){
    if (err){ cb(err); return; }
    if (!j || !j.id){ cb('server'); return; }
    cb(null, { id: String(j.id), version: String(j.version || '') });
  });
}

/* Замена содержимого. Описание файла не трогаем вовсе — меняются
   только байты. */
function gdUpdate(access, id, text, cb){
  if (text.length > GD_MAX){ cb('big'); return; }
  gdReq({ method: 'PATCH',
          url: GD_UPLOAD + '/' + encodeURIComponent(id) +
               '?uploadType=media&fields=' + encodeURIComponent('id,version'),
          token: access,
          contentType: 'application/json; charset=UTF-8',
          body: text }, function(err, j){
    if (err){ cb(err); return; }
    if (!j || !j.id){ cb('server'); return; }
    cb(null, { id: String(j.id), version: String(j.version || '') });
  });
}

/* ==================================================================
 * ЧАСТЬ 5. ТРАНСПОРТ
 * ================================================================== */
/* Лицо в лицо с ghTransport(): те же две функции, те же коды ошибок,
 * та же метка версии. Цикл обмена не различает их вовсе.
 *
 * `auth(cb)` приносит живой короткий ключ, обновляя его при нужде.
 * Здесь он ОДИН на оба действия — обновление централизовано, и
 * транспорт про него ничего не знает.
 *
 * `st` — место, где помнится id найденного файла. Не настройка и не
 * запись: если бы его не было, каждый оборот начинался бы с поиска.
 */

function gdTransport(cfg){
  var st = { id: (cfg && cfg.fileId) ? String(cfg.fileId) : '' };

  function withFile(access, cb){
    if (st.id){ cb(null, st.id); return; }
    gdFind(access, function(err, f){
      if (err){ cb(err); return; }
      if (!f){ cb(null, ''); return; }
      st.id = f.id;
      cb(null, f.id);
    });
  }

  return {
    kind: 'drive',
    fileId: function(){ return st.id; },

    get: function(cb){
      cfg.auth(function(aErr, access){
        if (aErr){ cb(aErr); return; }
        withFile(access, function(fErr, id){
          if (fErr){ cb(fErr); return; }
          if (!id){ cb(null, { empty: true }); return; }
          gdDownload(access, id, function(dErr, text){
            if (dErr){ cb(dErr); return; }
            gdVersion(access, id, function(vErr, version){
              if (vErr){ cb(vErr); return; }
              cb(null, { text: text, version: version });
            });
          });
        });
      });
    },

    /* ЗАПИСЬ, И ЕЁ ЧЕСТНАЯ ГРАНИЦА.
     *
     * У GitHub отказ по `sha` стоит НА СЕРВЕРЕ и переживает любую нашу
     * ошибку. У Drive такого отказа НЕ СУЩЕСТВУЕТ: files.update не
     * принимает ни If-Match, ни ETag, ни precondition по версии —
     * проверено по списку параметров метода.
     *
     * Поэтому здесь read-verify-write: перед записью спрашиваем версию
     * ещё раз, и если она уже не та, которую нам дали, — это тот же
     * 'conflict', и цикл повторит оборот целиком.
     *
     * Остаётся окно между проверкой и записью, порядка сетевой
     * задержки. Закрыть его средствами Drive нельзя, и цена этого
     * названа в DECISIONS.md: слияние союзное, проигравшая гонку
     * правка остаётся неотправленной и уедет следующим оборотом, а
     * копия перед применением снимается всегда. Хуже, чем у GitHub, —
     * и сказано об этом прямо, а не спрятано за словом «надёжно».
     */
    put: function(text, version, counts, cb){
      cfg.auth(function(aErr, access){
        if (aErr){ cb(aErr); return; }
        if (!st.id || !version){
          /* Файла не было. Но между нашим «нет» и этой секундой его
             мог создать сосед — ищем ещё раз, иначе получилось бы два
             data.json в одной папке. */
          gdFind(access, function(fErr, f){
            if (fErr){ cb(fErr); return; }
            if (f){ st.id = f.id; cb('conflict'); return; }
            gdCreate(access, text, function(cErr, res){
              if (cErr){ cb(cErr); return; }
              st.id = res.id;
              cb(null, { version: res.version });
            });
          });
          return;
        }
        gdVersion(access, st.id, function(vErr, now){
          if (vErr){ cb(vErr); return; }
          if (now !== version){ cb('conflict'); return; }
          gdUpdate(access, st.id, text, function(uErr, res){
            if (uErr){ cb(uErr); return; }
            cb(null, { version: res.version });
          });
        });
      });
    }
  };
}

/* ==================================================================
 * ЧАСТЬ 6. СЛОВА ДЛЯ ВЛАДЕЛЬЦА
 * ================================================================== */
/* Каждой беде — свой ключ словаря. «Нет сети» пройдёт само, «доступ
   отозван» требует нового входа, «место кончилось» владелец исправит
   сам, а «слишком часто» вообще не беда — надо подождать. Свалить их
   в одно слово значит посоветовать не то. */
function gdErrKey(err){
  var M = {
    off:        'gd.eOff',
    needsecret: 'gd.eNeedSecret',
    badredirect:'gd.eBadRedirect',
    badclient:  'gd.eBadClient',
    badrequest: 'gd.eBadRequest',
    expired:    'gd.eExpired',
    noclient:   'gd.eNoClient2',
    browser:    'gd.eBrowser2',
    listen:     'gd.eListen',
    timeout:    'gd.eTimeout',
    nobridge: 'gd.eBrowser',
    nofetch:  'gd.eBrowser',
    net:      'gd.eNet',
    auth:     'gd.eAuth',
    denied:   'gd.eDenied',
    state:    'gd.eState',
    norefresh:'gd.eNoRefresh',
    nocrypto: 'gd.eNoCrypto',
    notfound: 'gd.eGone',
    quota:    'gd.eQuota',
    rate:     'gd.eRate',
    big:      'gd.eBig',
    newer:    'gd.eNewer',
    badremote:'gd.eBadRemote',
    conflict: 'gd.eBusy',
    busy:     'gd.eBusy'
  };
  return M[err] || 'gd.eServer';
}

/* Беда, которая пройдёт сама, — не повод дёргать владельца. Отсюда
   решается, повторять ли обмен позже молча. */
function gdRetryable(err){
  return err === 'net' || err === 'rate' || err === 'server' || err === 'busy';
}


/* ==================================================================
 * ++++++ ACCOUNT BIND ++++++    ЧЬИ ЭТО ДАННЫЕ НА ЭТОМ УСТРОЙСТВЕ
 *
 * ES5.
 *
 * ПРАВИЛО, ИЗ КОТОРОГО СЛЕДУЕТ ВСЁ:
 *
 *     ДАННЫЕ ДВУХ УЧЁТНЫХ ЗАПИСЕЙ НЕ СМЕШИВАЮТСЯ НИКОГДА И НИГДЕ.
 *
 * Не «стараемся не смешивать», а не смешиваются: смешение необратимо.
 * Разделить потом два набора товаров и долгов, попавших в один
 * документ, нельзя ничем — id у них разные, и слияние честно сочтёт
 * их все настоящими.
 *
 * Поэтому устройство ЗАПОМИНАЕТ, чьи данные на нём лежат, и вход
 * другой учётной записью останавливается вопросом. Три ответа, и
 * каждый разрушительный — только после резервной копии.
 * ================================================================== */

/* ------------------------------------------------------------------ */
/* Где живёт привязка                                                 */
/* ------------------------------------------------------------------ */
/* В СУЩЕСТВУЮЩЕМ ключе `goods-tracker/sync-v1`, рядом с остальными
 * настройками этого устройства. Шестой ключ не заводится.
 *
 * И НЕ В ДОКУМЕНТЕ, что важнее. `settings` уезжают в резервную копию
 * и в обмен; номер чужой учётной записи в копии другого человека не
 * значит ничего, а `bakSig()` он бы сдвинул — напоминание о копии
 * заявило бы «записи изменились» на нетронутых данных.
 *
 *   bind = { sub: '1078…', name: 'Амин', at: '2026-08-27T…' }
 */

function bindOf(o){
  if (!o || !o.bind || typeof o.bind !== 'object') return null;
  var b = o.bind;
  if (!gdSubOk(b.sub)) return null;
  return { sub: String(b.sub),
           name: (typeof b.name === 'string') ? b.name.slice(0, 100) : '',
           at: (typeof b.at === 'string') ? b.at : '' };
}

function bindSet(o, who){
  o = o || {};
  o.bind = { sub: String(who.sub), name: String(who.name || '').slice(0, 100),
             at: nowISO() };
  return o;
}

function bindClear(o){
  if (o && o.bind) delete o.bind;
  return o;
}

/* ------------------------------------------------------------------ */
/* Решение                                                            */
/* ------------------------------------------------------------------ */
/* ЕДИНСТВЕННОЕ место, где сравниваются учётные записи. Возвращает
 * КЛЮЧ решения, а не выполняет его: выполнять будет приложение, у
 * которого есть чем спросить владельца.
 *
 *   'first' — устройство ещё ни к кому не привязано: обычный первый
 *             вход, вопросов нет;
 *   'same'  — та же учётная запись: обычный обмен, вопросов нет;
 *   'other' — ДРУГАЯ. Останов и вопрос.
 *
 * Сравниваются НОМЕРА, а не имена и не почта: двух Google-аккаунтов с
 * одним номером не бывает, а имя владелец меняет когда захочет.
 */
function bindDecide(bound, incoming){
  if (!incoming || !gdSubOk(incoming.sub)) return 'bad';
  if (!bound || !bound.sub) return 'first';
  return (String(bound.sub) === String(incoming.sub)) ? 'same' : 'other';
}

/* Что можно ответить. Порядок ЗНАЧИМ: «отменить» стоит первым, потому
 * что пока обе стороны целы, ошибиться нельзя — то же правило, по
 * которому в полосе расхождения обмена первым выходом стоит «сохранить
 * мою копию файлом».
 *
 *   'cancel' — ничего не происходит, вход отменён;
 *   'adopt'  — местные данные привязываются к НОВОЙ учётной записи и
 *              уедут на её Drive;
 *   'replace'— местные данные ЗАМЕНЯЮТСЯ тем, что лежит у новой
 *              учётной записи.
 *
 * `needsBackup` — не украшение и не совет: приложение обязано снять
 * копию ПЕРЕД действием, и набор проверяет именно порядок.
 */
function bindChoices(){
  return [
    { key: 'cancel',  destructive: false, needsBackup: false },
    { key: 'adopt',   destructive: true,  needsBackup: true  },
    { key: 'replace', destructive: true,  needsBackup: true  }
  ];
}

function bindChoiceOf(key){
  var all = bindChoices(), i;
  for (i = 0; i < all.length; i++) if (all[i].key === key) return all[i];
  return null;
}

/* ------------------------------------------------------------------ */
/* Что именно делать                                                  */
/* ------------------------------------------------------------------ */
/* План, а не действие — та же идея, что у syncDecide(): решение
 * принимается ЗДЕСЬ и проверяется набором, а исполняет его приложение,
 * у которого есть validate(), commit() и куда положить копию.
 *
 * Поля плана:
 *   backup     снять резервную копию ПЕРЕД чем бы то ни было
 *   dropLocal  стереть местные записи (только 'replace')
 *   bind       привязать устройство к новой учётной записи
 *   resetSync  забыть базу отпечатков, метку версии и id файла
 *   sync       начать обмен после этого
 *
 * `resetSync` стоит на ОБОИХ разрушительных путях, и это не
 * осторожность: база отпечатков принадлежит ПРЕЖНЕЙ учётной записи и о
 * новой не знает ничего. Оставить её — значит сказать слиянию, что
 * общее прошлое с новым Drive уже есть; тогда записи, которых там нет,
 * будут прочитаны как удалённые на той стороне, и владелец увидит, что
 * «половина товаров пропала после смены аккаунта».
 */
function bindPlan(choice){
  if (choice === 'cancel'){
    return { backup: false, dropLocal: false, bind: false, resetSync: false, sync: false };
  }
  if (choice === 'adopt'){
    return { backup: true, dropLocal: false, bind: true, resetSync: true, sync: true };
  }
  if (choice === 'replace'){
    return { backup: true, dropLocal: true, bind: true, resetSync: true, sync: true };
  }
  return null;                       /* незнакомый ответ — не делаем НИЧЕГО */
}

/* ------------------------------------------------------------------ */
/* Что делать с базой отпечатков при смене                            */
/* ------------------------------------------------------------------ */
/* База (`base`), метка версии файла и его id принадлежат ПРЕЖНЕЙ
 * учётной записи и о новой не знают ничего. Оставить их — значит
 * сказать слиянию, что общее прошлое с новым Drive уже есть; тогда
 * записи, которых там нет, будут прочитаны как удалённые на той
 * стороне.
 *
 * Поэтому при смене они сбрасываются ВСЕГДА, на обоих разрушительных
 * путях. Это одна строка, и она чинит случай, который иначе выглядел
 * бы как «половина товаров пропала после смены аккаунта».
 */
function bindResetSync(o){
  o = o || {};
  o.base = {};
  o.version = '';
  o.fileId = '';
  o.at = '';
  return o;
}

/* ------------------------------------------------------------------ */
/* Выход                                                              */
/* ------------------------------------------------------------------ */
/* Что остаётся на устройстве после «Выйти»: ЗАПИСИ и ПРИВЯЗКА.
 *
 * Записи — потому что это данные владельца, и выход из учётной записи
 * не повод их трогать.
 *
 * А привязка — потому что иначе защита обходится в два нажатия.
 * Найдено стендом, а не чтением: выход сбрасывал настройки целиком,
 * вход другой учётной записью после этого читался как ПЕРВЫЙ, вопроса
 * не было, и данные Азиза уезжали на Диск Бахтиёра молча. Ровно то,
 * что здесь запрещено.
 *
 * Правило простое: пока на устройстве лежат данные учётной записи, оно
 * к ней и привязано — вошли в неё сейчас или нет. Снимается привязка
 * только вместе с данными: при «взять данные другой записи» и при
 * «стереть все данные».
 *
 * Уходит же всё, что описывает РАЗГОВОР с той стороной: база
 * отпечатков, метка версии, id файла, время последней удачи. Возврат в
 * ту же учётную запись догонит обычным слиянием — терять там нечего.
 */
function signOutKeep(o){
  var bound = bindOf(o);
  var out = bindResetSync({});
  if (bound) out.bind = { sub: bound.sub, name: bound.name, at: bound.at };
  return out;
}

/* ------------------------------------------------------------------ */
/* Повтор после сетевой беды                                          */
/* ------------------------------------------------------------------ */
/* Требование: офлайн-очередь догоняет сама, когда сеть вернулась, и
 * при этом не устраивает шторм запросов.
 *
 * Очереди как отдельной структуры НЕТ и быть не должно: что не
 * отправлено, уже знает pendingCount() — сравнением отпечатков с
 * последней удачей. Вторая структура стала бы вторым ответом на тот же
 * вопрос и разошлась бы с первым при первом же сбое.
 *
 * Добавляется только пауза перед следующей попыткой: растущая, с
 * потолком, чтобы устройство без сети не стучалось вечно каждые восемь
 * секунд.
 */
var RETRY_BASE_MS = 15000;
var RETRY_MAX_MS  = 10 * 60 * 1000;

function retryDelay(attempt){
  var n = (typeof attempt === 'number' && attempt > 0) ? attempt : 1;
  var ms = RETRY_BASE_MS * Math.pow(2, n - 1);
  return ms > RETRY_MAX_MS ? RETRY_MAX_MS : ms;
}


/* ---- ЧТО ДЕЛАТЬ С ТЕМ, ЧТО ПРИШЛО -------------------------------- */
/* ЕДИНСТВЕННОЕ место, где решается судьба расхождения. Возвращает КЛЮЧ
   решения, а не выполняет его: выполнять будет приложение, у которого
   есть чем спросить владельца.
 *
 *   'first'    — на сервере пусто: отправляем своё
 *   'same'     — тексты совпадают: делать нечего
 *   'take'     — сервер ушёл вперёд, а у нас с прошлого раза ничего не
 *                менялось: берём серверное, терять нечего
 *   'send'     — у нас есть изменения, а сервер там же, где мы его
 *                оставили: отправляем
 *   'diverged' — И у нас менялось, И сервер ушёл вперёд. Тот самый
 *                случай, ради которого написан весь файл.
 *
 * Почему нужны ОБА признака. Без `hash` «сервер новее» неотличимо от
 * «мы разошлись», и приложение либо затирает чужую работу, либо дёргает
 * владельца вопросом на каждом открытии. Без `sha` неотличимо «сервер
 * тот же» от «сервер новее», и отправка затрёт чужое. */

function syncDecide(cfg, server, localText){
  if (!server || server.empty) return 'first';
  if (server.text === localText) return 'same';
  var serverMoved = !cfg.sha  || server.sha !== cfg.sha;
  var weChanged   = !cfg.hash || syncHash(localText) !== cfg.hash;
  if (serverMoved && weChanged)  return 'diverged';
  if (serverMoved)               return 'take';
  return 'send';
}

/* ---- сообщение коммита ------------------------------------------- */
/* Английский, как все сообщения коммитов в этом проекте. Имя устройства
   задаёт владелец, и оно единственное, что здесь от него. */

function syncMsg(cfg, counts){
  var who = cfg.dev ? ' from ' + cfg.dev : '';
  var n = counts ? (' — ' + counts.products + ' products, ' + counts.people +
                    ' people, ' + counts.transactions + ' handouts, ' +
                    counts.payments + ' payments') : '';
  return 'data: save' + who + n;
}

/* ==================================================================
 * ++++++ SYNC CYCLE ++++++            ЦИКЛ ОБМЕНА: КТО ЗА КЕМ И ЗАЧЕМ
 *
 * ES5. Опирается на merge.js (слияние) и sync.js (разговор с GitHub);
 * своей арифметики не имеет и денежных полей не касается.
 *
 * ПОРЯДОК, И ОН ЖЕ ЗАЩИТА:
 *
 *     забрать → слить → СНЯТЬ РЕЗЕРВНУЮ КОПИЮ → применить → отправить
 *
 * Копия снимается ПЕРЕД тем, как чужие записи впервые коснутся
 * документа, и это единственный момент, когда её ещё можно снять с
 * того, что владелец видел на экране. После применения снимать поздно:
 * копия будет уже смешанной. Отсюда же ответ на «что если владелец
 * ошибётся при разрешении конфликта» — обе версии остаются в копии.
 *
 * ОТКАЗ SHA — не ошибка, а обычное течение дел: другое устройство
 * успело записать между нашим «забрать» и «отправить». Тогда цикл
 * повторяется с начала, и повторяется ОГРАНИЧЕННОЕ число раз: бесконечно
 * упорная программа при двух активных устройствах перестанет отвечать.
 * ================================================================== */

var CYCLE_RETRIES = 3;      /* хватает с запасом: гонка длится миллисекунды */

/* Состояние обмена — только для показа. Никакая логика на него не
   опирается, поэтому его можно перерисовывать когда угодно. */
function syncStatusNew(){
  return {
    at: '',            /* когда последний раз всё удалось */
    busy: false,
    err: '',           /* короткий ключ последней беды */
    pending: 0,        /* сколько изменений не отправлено */
    conflicts: []      /* нерешённые расхождения */
  };
}

/* ------------------------------------------------------------------ */
/* Один оборот                                                        */
/* ------------------------------------------------------------------ */
/* Всё вокруг — колбэки, потому что сеть асинхронна, а приложение на ES5
 * и без промисов в своём коде. `env` — то, что цикл не умеет сам:
 *
 *   env.cfg()            текущие настройки обмена
 *   env.localDoc()       документ этого устройства (state)
 *   env.baseHashes()     отпечатки на момент прошлой удачи
 *   env.tombs()          местные надгробия
 *   env.backup(text, cb) снять резервную копию ПЕРЕД применением
 *   env.apply(doc, cb)   провести через validate() и положить в state
 *   env.remember(o)      запомнить метку версии/отпечатки/время
 *   env.meta()           { updatedBy, settingsAt }
 *
 * ++++++ TRANSPORT ++++++ и ШОВ, по которому цикл не знает, КУДА возит:
 *
 *   env.tGet(cb)                        cb(err, {text,version} | {empty:true})
 *   env.tPut(text, version, counts, cb) cb(err, {version})
 *
 * Метка версии у GitHub — `sha` содержимого, у Google Drive — числовой
 * счётчик файла. Общее у них ровно одно: она отвечает «это та же
 * версия, которую я скачал». Больше циклу знать нечего, и syncDecide()
 * работает над обеими без единой правки.
 *
 * Такое разделение не украшательство: оно делает цикл проверяемым без
 * браузера, а приложение — местом, где живут validate() и commit().
 */
function syncCycle(env, cb, attempt){
  attempt = attempt || 1;
  var cfg = env.cfg();
  if (!cfg){ cb({ err: 'off' }); return; }

  env.tGet(function(err, res){
    if (err){ cb({ err: err }); return; }

    var localDoc = env.localDoc();
    var remoteDoc = null, remoteTombs = {}, remoteVer = '', settingsAt = '';

    if (res.empty){
      /* На сервере ещё ничего нет: это первый обмен. Сливать не с чем —
         отправляем своё как есть. */
      remoteDoc = null;
    } else {
      var open = openEnvelope(res.text);
      if (open.err === 'newer'){
        /* Файл записан приложением, которое знает больше нашего. Читать
           его «как получится» — верный способ испортить чужие записи;
           обмен останавливается и говорит об этом. */
        cb({ err: 'newer', found: open.found });
        return;
      }
      if (open.err){ cb({ err: 'badremote' }); return; }
      remoteDoc = open.doc;
      remoteTombs = open.tombstones;
      settingsAt = open.settingsAt;
      remoteVer = res.version;
    }

    var merged = mergeDocs(localDoc,
                           remoteDoc ? mergeInSettingsAt(remoteDoc, settingsAt) : null,
                           env.baseHashes(), env.tombs(), remoteTombs,
                           env.meta ? env.meta() && env.meta().map : null,
                           remoteDoc ? remoteDoc.syncMeta : null);

    /* --- резервная копия ПЕРЕД применением --------------------------- */
    /* Снимается всегда, когда чужой документ вообще был: даже «ничего не
       изменилось» — это вывод программы, а не факт, и ошибиться в нём
       она может. Копия стоит доли секунды и один файл. */
    var needBackup = !!remoteDoc;
    var proceed = function(){
      env.apply(merged.doc, function(applyErr){
        if (applyErr){ cb({ err: 'apply', detail: applyErr }); return; }

        /* --- отправить ------------------------------------------------ */
        var meta = env.meta() || {};
        var env2 = envelopeOf(merged.doc, merged.tombstones, {
          updatedAt: nowISO(), updatedBy: meta.updatedBy || '',
          settingsAt: meta.settingsAt || settingsAt,
          map: merged.meta
        });
        var text = envelopeText(env2);

        env.tPut(text, remoteVer, countsOf(merged.doc), function(pErr, pRes){
          if (pErr === 'conflict'){
            /* Между нашим чтением и записью успело вклиниться другое
               устройство. Ничего не потеряно: повторяем оборот целиком —
               свежий забор, свежее слияние. */
            if (attempt < CYCLE_RETRIES){ syncCycle(env, cb, attempt + 1); return; }
            cb({ err: 'busy', conflicts: merged.conflicts });
            return;
          }
          if (pErr){ cb({ err: pErr, conflicts: merged.conflicts }); return; }

          env.remember({
            version: pRes.version,
            base: baseOf(merged.doc),
            tombs: merged.tombstones,
            meta: merged.meta,
            at: nowISO()
          });
          cb({ ok: true, conflicts: merged.conflicts, stats: merged.stats,
               attempts: attempt });
        });
      });
    };

    if (needBackup) env.backup(JSON.stringify(localDoc), proceed);
    else proceed();
  });
}

/* Метка времени настроек приезжает рядом с конвертом, а слиянию удобнее
   видеть её на документе — одна строка вместо лишнего параметра. */
function mergeInSettingsAt(doc, at){
  doc.settingsAt = at || '';
  return doc;
}

function countsOf(doc){
  return {
    products: (doc.products || []).length,
    people: (doc.people || []).length,
    transactions: (doc.transactions || []).length,
    payments: (doc.payments || []).length
  };
}

/* nowISO() живёт рядом с touch() и dropFrom(): метка обмена и метка
   записи обязаны быть одной функцией, иначе они разойдутся. */

/* ------------------------------------------------------------------ */
/* Отложенная отправка                                                */
/* ------------------------------------------------------------------ */
/* Требование: «push after changes, debounced so typing does not spam the
 * API». Задержка не украшение — без неё каждое нажатие в поле цены
 * порождало бы коммит, и лимиты GitHub кончились бы за минуту.
 *
 * Таймер один на всё приложение, и он всегда СБРАСЫВАЕТСЯ: серия правок
 * уезжает одним обменом после того, как владелец остановился. */

var SYNC_DEBOUNCE_MS = 8000;
var syncTimer = null;

function syncSoon(run){
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){
    syncTimer = null;
    run();
  }, SYNC_DEBOUNCE_MS);
}

function syncCancelPending(){
  if (syncTimer){ clearTimeout(syncTimer); syncTimer = null; }
}

/* ------------------------------------------------------------------ */
/* Сколько изменений не отправлено                                    */
/* ------------------------------------------------------------------ */
/* Считается сравнением с отпечатками последней удачи — тем же способом,
 * которым слияние понимает, что менялось. Второго ответа на этот вопрос
 * в программе быть не должно. */

function pendingCount(doc, base, tombs){
  var n = 0, i, j;
  base = base || {};
  for (i = 0; i < SYNC_COLS.length; i++){
    var col = SYNC_COLS[i], list = doc[col] || [], b = base[col] || {}, seen = {};
    for (j = 0; j < list.length; j++){
      var r = list[j];
      if (!r || typeof r.id !== 'string') continue;
      seen[r.id] = 1;
      if (!ownKey(b, r.id)){ n++; continue; }            /* новая запись */
      if (recHash(r) !== b[r.id]) n++;                   /* изменённая   */
    }
    for (var id in b) if (ownKey(b, id) && !ownKey(seen, id)){
      /* была в прошлый раз, сейчас нет — удаление, если оно наше */
      if (tombs && ownKey(tombs, id)) n++;
    }
  }
  return n;
}


function defaultState(){

      rates: { USD: 3.67, TJS: 3.67 / 9.3 },  // 1 <code> = X base; i.e. 1 USD = 9.3 TJS
      vatPct: 5, vatOn: true,                 // default invoice VAT

    },
    products: [], people: [], transactions: [], payments: [], returns: [], expenses: [],
    /* ++++++ SYNC ++++++ v16. Карты рядом с записями, не внутри них. */
    syncMeta: {}, syncTombs: {}
  };
}
var state = defaultState();
var ui = {

  /* ++++++ TRASH ++++++ какая строка корзины раскрыта. Живёт в ui, а не в

  trashOpen:''
};

var storageUsable = (function(){
  try{
    var k = '__gt_probe__';
    window.localStorage.setItem(k,'1');
    window.localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
})();
var lastSaveOk = storageUsable;

/** ++++++ ERASE KEEPS ++++++ R25: что переживает «Стереть все данные».
 *
 * РЕШЕНИЕ ВЛАДЕЛЬЦА, 2026-08-24: стирание уносит ЗАПИСИ, а не настройки.
 *
 * До сих пор `state = defaultState()` возвращал к исходным базовую валюту,
 * курсы, НДС, валюту «Сводки» и три запомненных валюты ввода. Язык при этом
 * сохранялся намеренно (решение 2026-08-21) — то есть «сброс к заводским» это
 * поведение уже не было, а было полусбросом, о котором до 2026-08-23 ещё и
 * молчали.
 *
 * ПОЧЕМУ ЗАПИСИ И НАСТРОЙКИ — РАЗНОЕ. «Стереть все данные» стоит рядом с
 * экспортом копии и означает «убрать из программы то, что я в неё внёс как
 * учёт». Базовая валюта TJS, курс USD, ставка НДС 5% — это не учёт, это
 * настройка инструмента, и владелец набирал её один раз. Возвращать её к AED
 * посреди работы значит не просто отнять труд: следующая запись уйдёт в
 * ЧУЖОЙ ВАЛЮТЕ, и заметит это владелец не сразу.
 *
 * ПРАВИЛО ПОЛУЧАЕТСЯ ОДНО И ПРОСТОЕ: переживает всё, кроме `baseUndo`.
 * Исключение единственное и по причине: снимок «вернуть суммы» описывает
 * суммы записей, которых больше нет, — вернуть их некуда.
 *
 * ФОРМА БЕРЁТСЯ У `defaultState()`, А ЗНАЧЕНИЯ У ПРЕЖНЕГО ДОКУМЕНТА. Не
 * наоборот: так поле, которого в старом документе не было (его добавит
 * следующая схема), получит свой умолчательный вид, а не `undefined`.
 */
function eraseSettings(prev, fresh){
  var out = {}, k;
  for (k in fresh){
    if (!own(fresh, k)) continue;
    out[k] = own(prev, k) ? prev[k] : fresh[k];
  }
  /* Единственное исключение, и оно про записи, а не про настройки. */
  out.baseUndo = null;
  return out;
}
function setStorageBadge(){
  /* Состояние хранилища видно на вкладке «Ещё → Данные», а отказ записи
     поднимает постоянную полосу в save(). Отдельного значка в шапке больше
     нет, поэтому здесь нечего обновлять — функция оставлена, чтобы save()
     и render() продолжали звать одно и то же место. */
}
function save(){
  if (!storageUsable){ setStorageBadge(); return false; }
  /* ++++++ RESCUE ++++++ R6. Документ в хранилище не читается, и его
     текст НИГДЕ не сохранён — ни в запасе (там лежит чужой), ни на
     диске (положить не вышло). Запись сейчас уничтожила бы его
     насовсем, и именно это здесь происходило раньше. Владелец видит
     полосу с объяснением и двумя выходами; молча не теряется ничего. */
  if (rescBlocked()){ setStorageBadge(); return false; }
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (!lastSaveOk){ lastSaveOk = true; removeBanner('save-fail'); }
    setStorageBadge();
    return true;
  }catch(e){
    lastSaveOk = false;
    setStorageBadge();
    banner('save-fail','err', tr('save.fail', {err: esc(e && e.name ? e.name : 'error')}));
    return false;
  }
}
function loadFromStorage(){
  if (!storageUsable) return false;
  var raw;
  try{ raw = window.localStorage.getItem(STORAGE_KEY); }catch(e){ return false; }
  if (!raw) return false;
  var parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    /* ++++++ RESCUE ++++++ сначала в запас, потом полоса: полоса
       рассказывает, ЧТО с ним стало, и рассказать она может только
       после того, как это решилось. */
    rescKeep(raw);
    banner('load-fail','err', tr('load.badJson') + rescBarHTML());
    return false;
  }
  /* read the language first, so a rejection banner speaks the user's own */
  if (parsed && parsed.settings && isLang(parsed.settings.lang)) setLang(parsed.settings.lang);
  var res = validate(parsed);
  if (!res.ok){
    /* ++++++ RESCUE ++++++ отвергнутый документ — тоже документ */
    rescKeep(raw);
    banner('load-fail','err', tr('load.corrupt', {err: esc(res.error)}) + rescBarHTML());
    return false;
  }
  state = res.data;
  /* ++++++ COST HISTORY ++++++ документ принят — но принят не целиком.
     Настоящий текст ещё лежит в хранилище: его перезапишет первый же
     commit(), поэтому предложить его надо сейчас. */
  var notes = [];
  /* ++++++ PARTIAL IMPORT ++++++ первой: она о том, чего в документе больше
     нет вообще, а не о том, что в нём пересчитано. */
  if (res.dropped && res.dropped.length) notes.push(dropLine(res.dropped));
  if (res.costGone && res.costGone.length) notes.push(costLine(res.costGone));
  /* ++++++ COST RESCUE ++++++ в ту же полосу: документ принят не целиком,
     и полоса у него ОДНА, сколько бы причин ни было. */
  if (res.costFilled && res.costFilled.length) notes.push(costFixLine(res.costFilled, 'fixed'));
  if (res.costCut && res.costCut.length) notes.push(costFixLine(res.costCut, 'cut'));
  /* ++++++ VALIDATE READS ++++++ B1. В ту же полосу, что и остальные три:
     документ, принятый не целиком, поднимает ОДНУ полосу, а не по одной на
     причину. */
  if (res.costDropped && res.costDropped.length) notes.push(costDropLine(res.costDropped));
  /* ++++++ DATES SAID ++++++ вторая фраза в ту же полосу */
  if (res.dateGuessed) notes.push(dateLine(res.dateGuessed));
  if (notes.length){
    loadNotes = notes;
    loadRaw = raw;
  }
  return true;
}

/* ==================================================================
 * ++++++ COST HISTORY ++++++      ИСТОРИЯ ЗАКУПОК НЕ ПРОПАДАЕТ МОЛЧА
 *
 * R5. `validate()` собирает партии товара заново и оставляет собранное
 * только если ВСЁ сошлось: каждая партия читается и сумма их количеств
 * равна `product.qty`. Иначе вся история закупок выбрасывается и на её
 * место встаёт одна выдуманная партия с нулевой ценой:
 *
 *     if (okB && sum === p.qty) batches = tmp;
 *     if (!batches) batches = [{ qty:p.qty, costCents:0, totalCostCents:0, … }];
 *
 * Закупочные цены становятся нулями, `spentCents` — нулём, себестоимость —
 * нулём, и прибыль оказывается равна выручке. Об этом не говорилось НИГДЕ:
 * импорт рапортовал об успехе, а на обычной загрузке диагностика,
 * которую validate() и так возвращает, просто выбрасывалась
 * (`state = res.data; return true;`).
 *
 * И это не только про импорт. `validate()` — общий вход, он работает на
 * КАЖДОЙ загрузке из localStorage. Значит документ, у которого партии
 * однажды разошлись, обнуляется при каждом запуске, а первый же commit()
 * записывает обнулённое поверх настоящего. Ровно то же, что делал R6 с
 * целым документом, только с записями внутри него.
 *
 * Правило то же самое, продолженное на одну ступень внутрь:
 *
 *   ПРИЛОЖЕНИЕ НЕ ВЫБРАСЫВАЕТ ЗАПИСИ ВЛАДЕЛЬЦА МОЛЧА.
 *
 * Из него следует всё, что здесь есть:
 *
 *   · validate() СЧИТАЕТ, что ему пришлось выбросить, и возвращает это
 *     РЯДОМ с документом — как он уже возвращает attDropped и refDropped.
 *     Внутрь документа не попадает ничего: схема не двигается;
 *   · документ, который validate() отдаёт, не меняется НИ НА БАЙТ. Эта
 *     задача про то, что владельцу СКАЗАЛИ, а не про то, что посчитали;
 *   · на загрузке настоящий документ ещё лежит на диске — до первого
 *     commit(). Поэтому полоса не только сообщает, но и предлагает его
 *     забрать, тем же downloadFile(), которым уходит резервная копия;
 *   · на импорте предлагать нечего: файл, который владелец только что
 *     выбрал, лежит у него нетронутым. Там достаточно строки в отчёте,
 *     рядом с теми, что импорт уже печатает.
 *
 * ЧЕГО ЗДЕСЬ НЕТ. Восстановления цен. Партии, которые не сходятся с
 * количеством, противоречат `Σ batches[].qty === product.qty` — правилу,
 * на котором стоит весь подсчёт остатков; чинить это догадками нельзя, и
 * это отдельный разговор (R23, частичное восстановление импорта). Здесь
 * закрыто ровно то, что записано в находке словом «молча».
 * ================================================================== */

/* ==================================================================
 * ++++++ FALSE ALARM ++++++   ПОЛОСА НЕ КРИЧИТ НА ЗДОРОВОМ ДОКУМЕНТЕ
 *
 * Регрессия, внесённая исправлением R5 в тот же день. У товара с нулевым
 * количеством `validate()` пишет партию, которую сама же на следующем
 * чтении отвергает:
 *
 *   · `p.qty >= 0` — количество ноль разрешено (3849);
 *   · сумма количеств партий обязана равняться `p.qty`, то есть нулю;
 *   · но каждая партия обязана иметь `b.qty >= 1`.
 *
 * Эти три правила несовместимы, и выход у validate() один — подставить
 * `[{qty:0, costCents:0, totalCostCents:0}]`. На следующем чтении этот
 * список не проходит проверку `b.qty >= 1`, и до R5 это ничего не значило:
 * подставлялся такой же список, документ не менялся, никто не страдал.
 *
 * После R5 значило: ветка отказа стала звать `costGone.push()`, и полоса
 * «партии не сошлись, закупочные цены обнулены» вставала при КАЖДОМ
 * открытии — на товаре, с которым всё в порядке. Измерено: первое открытие
 * молчит (партий ещё нет), второе и все следующие кричат.
 *
 * ПРАВИЛО:
 *
 *   ПРЕДУПРЕЖДЕНИЕ, КОТОРОЕ СРАБАТЫВАЕТ БЕЗ ПОВОДА, ХУЖЕ ЕГО ОТСУТСТВИЯ.
 *
 * Оно приучает пролистывать полосу не читая — и в тот день, когда история
 * закупок пропадёт по-настоящему, владелец её не заметит.
 *
 * ЧТО ИМЕННО ИСПРАВЛЕНО. Не подстановка и не проверка партий: обе остаются
 * как есть, документ не меняется ни на байт. Исправлено УСЛОВИЕ, при
 * котором об отказе сообщают: сообщают, когда было что терять.
 *
 * ЧЕГО ЗДЕСЬ НЕТ. Устранения самого противоречия — чтобы `validate()` не
 * писала того, что отвергает. Сделать это значило бы либо разрешить пустой
 * список партий (а «список партий непуст после validate()» — записанное
 * правило, на которое опирается чужой код), либо принимать партию на ноль
 * единиц (а это уже про то, что считается партией). И то и другое — решения
 * о поведении. Само противоречие записано в `docs/ARCHITECTURE.md`.
 * ================================================================== */

/** Была ли у этих партий история, о потере которой стоит говорить.
 *
 *  Список из одной партии на ноль единиц и ноль денег — не история: его
 *  пишет сама `validate()` товару с нулевым количеством. Всё остальное —
 *  история: хотя бы одна партия с единицами или с деньгами.
 *
 *  Читается ВХОДЯЩИЙ список, а не пересобранный: пересобранный на момент
 *  вызова уже отброшен, и спрашивать у него нечего. */
function batchesWorth(arr){
  if (!arr || !arr.length) return false;
  for (var i = 0; i < arr.length; i++){
    var b = arr[i];
    if (!b || typeof b !== 'object') continue;
    if (isInt(b.qty) && b.qty >= 1) return true;
    if (isInt(b.costCents) && b.costCents > 0) return true;
    if (isInt(b.totalCostCents) && b.totalCostCents > 0) return true;
  }
  return false;
}

/* ============================================ ++++++ COST RESCUE ++++++ ==
 * R5, вторая половина: история закупок больше не выбрасывается.

 * `validate()` держит пересобранный журнал партий ТОЛЬКО когда всё сошлось:

 * журнал заменялся одной выдуманной партией по нулевой цене — закупка 0,

 *
 * ПРАВИЛО:

/** Довести прочитанные партии до `want` единиц, ничего не выдумывая.
 *
 *  Возвращает список (тот же массив) или null — «чинить нечего, иди
 *  прежним путём». Второе значение — что именно пришлось сделать:
 *  'fill' (добавлена партия без цены) или 'cut' (лишнее списано с конца). */
function batchBalance(list, sum, want, fallbackDate){
  if (!list.length || want < 1) return null;
  if (sum === want) return null;                  /* сюда не попадают, но пусть */
  if (sum < want){
    list.push({ qty: want - sum, costCents:0, totalCostCents:0, date: fallbackDate, inv:null });
    return list;
  }
  batchTrim(list, sum - want);
  return list;
}
/** Что сделал batchBalance с этим товаром: 'fill' | 'cut'. */
function batchBalanceKind(sum, want){ return sum < want ? 'fill' : 'cut'; }
var loadNotes = null;  /* готовые фразы о том, что изменилось на входе */

 *

 * validate() — приложение показывало полосу со словами «данные не тронуты»
 * и открывалось пустым. Слова были правдой ровно до первого изменения:
 * `state` оставался пустым по умолчанию, и первый же commit() записывал
 * этот пустой документ поверх нечитаемого. Данные исчезали НАСОВСЕМ, уже
 * после того, как владельцу пообещали обратное.
 *
 * Правило, которое это чинит, одно и оно короткое:
 *
 *   ПРИЛОЖЕНИЕ НИКОГДА НЕ УНИЧТОЖАЕТ НЕЧИТАЕМЫЙ ДОКУМЕНТ МОЛЧА.

 *     запас занят — save() ОТКАЗЫВАЕТСЯ писать. Иначе следующий commit()
 *     сделает ровно то, ради чего эта задача существует;
 *   · выход виден всегда: скачать нечитаемый файл, удалить старый запас,
 *     или явно перезаписать. Молчаливой потери нет ни в одной ветке.
 *
 * Сырой текст держится и в памяти сеанса: даже когда запас занят и на диск
 * положить нечего, скачать текущий документ можно прямо сейчас.
 * ================================================================== */

var RESC_KEY = 'goods-tracker/rescue-v1';   /* третий ключ приложения из пяти */
var rescPending = null;   /* сырой текст этого сеанса, если он был отвергнут */
var rescMode    = '';     /* '' | 'kept' | 'occupied' | 'failed' */

/** Что лежит в запасе: {at, raw} или null. Не бросает никогда — заблокированное

function rescRead(){
  if (!storageUsable) return null;
  var v;
  try { v = window.localStorage.getItem(RESC_KEY); } catch(e){ return null; }
  if (typeof v !== 'string' || v === '') return null;
  var nl = v.indexOf('\n');
  if (nl < 0) return { at: '', raw: v };
  return { at: v.slice(0, nl), raw: v.slice(nl + 1) };
}
/** Положить в запас. Первая строка — метка времени, дальше сырой текст как
 *  есть: без обёртки в JSON, чтобы не платить экранированием за размер. */
function rescWrite(raw){
  if (!storageUsable) return false;
  try {
    window.localStorage.setItem(RESC_KEY, new Date().toISOString() + '\n' + raw);
    return true;
  } catch(e){ return false; }
}
function rescDrop(){
  if (!storageUsable) return false;
  try { window.localStorage.removeItem(RESC_KEY); return true; } catch(e){ return false; }
}

/** ЕДИНСТВЕННОЕ место, где решается судьба отвергнутого документа.
 *  Зовётся из loadFromStorage() из обеих веток отказа — и только оттуда. */
function rescKeep(raw){
  var r = rescRead();
  rescPending = raw;

     он. Считать это чужим документом значило бы останавливать запись
     навсегда после одной перезагрузки. */
  if (r && r.raw === raw){ rescMode = 'kept'; return; }
  if (r){ rescMode = 'occupied'; return; }            /* занято ДРУГИМ — не трогаем */
  rescMode = rescWrite(raw) ? 'kept' : 'failed';
}

 *  Полоса одна — та же самая, что была; она просто говорит теперь всё. */

  if (rescBlocked()){
    extra += ' ' + tr('resc.blocked');
    btns += '<button type="button" data-act="resc-over">' + tr('resc.over') + '</button>';
  }
  return '<br>' + extra + '<span class="rb">' + btns + '</span>';
}
/** Строка в «Ещё → Данные». Печатается только когда запас не пуст: пустой
 *  запас — это обычное состояние, и говорить о нём нечего. */

  if (!r) return '';
  return row({ k: tr('resc.title'),
    sub: tr('resc.rowKept', { size: rescSizeOf(r.raw), when: bakStamp(r.at) }),
    v: tr('resc.get'), act:'resc-get' }) +

}

/** Отдать нечитаемый документ браузеру. Текущий сеанс важнее запаса: если
 *  документ этого сеанса нигде не сохранён, скачивать надо именно его. */
function rescGet(){
  var r = rescRead();
  var raw = rescBlocked() ? rescPending : (r ? r.raw : rescPending);
  if (raw === null || raw === undefined){ toast(tr('resc.nothing'), 'warn'); return; }
  var res = downloadFile('goods-tracker-unreadable-' + todayISO() + '.json',
                         [raw], 'application/json');
  if (!res.ok){ banner('export','err', tr('bk.failed', {err: esc(res.err)})); return; }
  toast(tr('resc.got'), 'ok');
}
/** Удалить запас. Освободившееся место тут же занимает документ этого
 *  сеанса, если он есть, — иначе освобождение молча стоило бы данных. */

             tr('dlg.rescForgetOk'), true).then(function(okd){

      rescMode = rescWrite(rescPending) ? 'kept' : 'failed';
    } else {
      rescMode = '';
    }
    toast(tr('resc.forgotten'), 'ok');

  });
}
/** Явное решение владельца: писать поверх, хотя нечитаемый документ этого
 *  сеанса нигде не сохранён. Единственный путь, которым он может пропасть, —
 *  и он проходит через подтверждение с прямым текстом. */
function rescOverwrite(){

             tr('dlg.rescOverOk'), true).then(function(okd){

    rescMode = '';
    rescPending = null;
    removeBanner('load-fail');

  });
}
