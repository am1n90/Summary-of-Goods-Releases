/* ================================================================== */
/* ++++++ DISPLAY CURRENCY ++++++  ВАЛЮТА ОТОБРАЖЕНИЯ «СВОДКИ»        */
/*
 * Владелец получает деньги в USD и в TJS, а хранится всё в AED. Здесь он
 * выбирает, в чём СМОТРЕТЬ «Сводку» и открывающийся из неё «Полный отчёт».
 * На диске при этом не меняется ничего: это продолжение того же ряда sec*,
 * а не второй способ печатать деньги.
 *
 * Три правила, на которых всё держится:
 *
 * 1. ОДНА точка пересчёта — dcCents(). Больше нигде в файле нет ни деления
 *    на курс, ни умножения на него ради показа. Разметка не считает.
 * 2. ОДНА точка форматирования — dcFmt(). dcMoney/dcBare/dcHero — три её
 *    обёртки, ровно как secMain/secBare/secInline у secParts.
 * 3. Пересчитывается ВСЕГДА исходная сумма в AED. Цепочки AED → USD → TJS
 *    не существует: dcCents() принимает только базовые копейки.
 *
 * Историчность. У продажи и у оплаты с версии схемы 10 есть rateSnap —
 * курсы на день записи. Такая запись пересчитывается своим снимком, поэтому
 * правка курса в настройках не двигает то, что уже получено. Итог поэтому —
 * сумма пересчитанных записей, а не пересчёт общей суммы; это и есть
 * dcStats().
 */
/* ================================================================== */

/** Округление к ближайшему целому, симметричное относительно нуля.
 *  Math.round(-2.5) = -2, а нужно -3: прибыль и «склад по себестоимости»
 *  бывают отрицательными (R7), и знак важнее привычки. */
function dcRound(x){
  if (x === null || x === undefined || !isFinite(x)) return null;
  return x < 0 ? -Math.round(-x) : Math.round(x);
}
/** Сумма пересчитанных величин. Одно «нечем пересчитать» делает неизвестной
 *  всю сумму: половина итога хуже прочерка. */
function dcAdd(a, b){ return (a === null || b === null) ? null : a + b; }
function dcSub(a, b){ return (a === null || b === null) ? null : a - b; }
function dcMax0(a){ return a === null ? null : Math.max(0, a); }

/** Валюта показа «Сводки». Пустое или испорченное значение читается как
 *  база. Код БЕЗ курса намеренно сохраняется: тогда вкладка честно печатает
 *  прочерки и полосу «нет курса», а не переключается молча на другую валюту
 *  (то же правило, что у SECTION_CUR — хрупкое место 11). */
function dcCur(){
  var c = state.settings.sumCur;
  return (typeof c === 'string' && /^[A-Za-z0-9]{1,6}$/.test(c))
    ? c.toUpperCase() : state.settings.baseCurrency;
}
/** Что предлагает переключатель: база, затем все заданные курсы в том
 *  порядке, в каком их завели, и — если выбранной валюты среди них больше
 *  нет (курс удалили) — сама выбранная, чтобы её было видно и с неё можно
 *  было уйти. Ни одного кода валюты в коде не записано. */
function dcCodes(){
  var out = [state.settings.baseCurrency], r = state.settings.rates, c;
  for (c in r){
    if (!own(r, c)) continue;
    if (out.indexOf(c) === -1) out.push(c);
  }
  c = dcCur();
  if (out.indexOf(c) === -1) out.push(c);
  return out;
}
/** Курс для одной записи. Направление то же, что у settings.rates и у
 *  rateOf(): «1 <код> = r <база>». Нет снимка, нет в снимке этой валюты,
 *  снят в другой базе — текущий курс. null = курса нет вовсе.
 *
 *  Снимок решает, КАКИМ курсом считать, а не МОЖНО ЛИ считать вообще: если
 *  валюты в настройках больше нет, её нет и на экране, снимки при этом не
 *  спасают. Иначе вкладка пришла бы в состояние, которое невозможно
 *  объяснить, — одни суммы есть, другие прочерк, а полоса наверху обещает
 *  прочерки везде. Валюта, курс которой удалили, — это не валюта, в которой
 *  читают.
 *
 *  Снимок из другой базовой валюты не берётся по той же причине: после
 *  смены базы он описывает другие деньги, и честнее упасть на текущий курс. */
function dcRateOf(snap, code){
  var now = rateOf(code);
  if (now === null) return null;
  if (snap && snap.rates && snap.base === state.settings.baseCurrency && own(snap.rates, code)){
    var r = snap.rates[code];
    if (typeof r === 'number' && isFinite(r) && r > 0) return r;
  }
  return now;
}
/** ЕДИНСТВЕННАЯ точка пересчёта.
 *  cents — сумма в минорных единицах БАЗОВОЙ валюты; она может быть дробной,
 *  потому что средняя себестоимость намеренно не округлена. snap — снимок
 *  курсов той записи, из которой сумма взялась, или null для того, что
 *  записью не является. С v14 запись со снимком — это и товар, и партия:
 *  закупка читается снимком СВОЕЙ партии, цена продажи — снимком товара.
 *  Возвращает ЦЕЛОЕ число минорных единиц валюты показа или null. */
/* ++++++ BASE SNAPS ++++++ R32: снимки курсов переезжают вместе с базой.
 *
 * v10 записывает с каждой выдачей и каждым платежом курсы того дня, чтобы
 * «Сводка» показывала прошлое по прошлым курсам, а не по сегодняшним. Снимок
 * помнит, В КАКОЙ БАЗЕ он снят, и `dcRateOf()` доверяет ему только пока эта
 * база совпадает с нынешней. Смена базовой валюты рвала связь у ВСЕХ снимков
 * разом: «Сводка» тихо переоценивала всю историю — то самое свойство, ради
 * которого v10 и заводилась.
 *
 * ПЕРЕВОД — ТЕ ЖЕ ТРИ СТРОКИ, ЧТО У НАСТРОЕЧНОЙ ТАБЛИЦЫ: поделить каждый курс
 * на делитель и добавить прежнюю базу как `1/делитель`.
 *
 * НО ДЕЛИТЕЛЬ У ДВУХ РЕЖИМОВ РАЗНЫЙ, и это не тонкость исполнения, а разница
 * между тем, что режимы делают. Проверяется это цифрой на экране, а не
 * рассуждением: наивная версия — один делитель на оба — давала «Сводке»
 * ровно вдвое меньше, и набор это поймал.
 *
 *   «ПЕРЕСЧИТАТЬ» делит каждую сумму на СЕГОДНЯШНИЙ курс. Исторический ответ
 *   «сколько это стоило тогда в валюте c» обязан остаться прежним, а он есть
 *   `сумма / курс`; раз сумма поделилась на сегодняшний курс, то и курс в
 *   снимке обязан поделиться на него же. Делитель берётся из настроек, один
 *   на все снимки, — поэтому не переехать не может НИ ОДИН.
 *
 *   «ПЕРЕИМЕНОВАТЬ» не трогает ни одного числа — и снимки НЕ ПЕРЕЕЗЖАЮТ.
 *   Это исправление 2026-08-22; R32 переводил их и здесь, курсом того дня из
 *   самого снимка, и это давало на экране посторонние числа. Разница не в
 *   арифметике, а в том, есть ли ещё вопрос. Снимок отвечает «сколько ЭТА
 *   СУММА стоила тогда в валюте c»; «пересчитать» сохраняет величину и лишь
 *   меняет единицу, поэтому вопрос остаётся и ответ переводится.
 *   «Переименовать» объявляет, что сумма всё это время была другой валютой:
 *   прежней величины больше нет, и переводить нечего. Снимок остаётся
 *   нетронутым, его база перестаёт совпадать с нынешней — и dcRateOf(), у
 *   которого это правило записано с самого начала, берёт текущий курс.
 *
 *   ИМЕННО ТАК ЭТО И ВЫГЛЯДЕЛО: у владельца база переехала AED -> USD
 *   переименованием, и «Сводка» в AED показывала закупки по текущему курсу
 *   (у партий снимков нет), а выдачи и оплаты — каждую по своему, потому что
 *   snapRebase() дописывал в снимок несуществовавшую строку про прежнюю базу
 *   (`out.rates[snap.base] = 1/div`) и она перебивала настройки. Валюта,
 *   которой в снимках не было вовсе (TJS), при этом считалась правильно —
 *   ей просто нечего было перебивать.
 *
 * ЧТО ЭТИМ НЕ ЧИНИТСЯ, и это свойство самого пересчёта, а не перевода: после
 * «пересчитать» сумма В БАЗОВОЙ валюте — это сегодняшняя величина, а не
 * тогдашняя, потому что она и ЕСТЬ хранимое число. Показ в базовой валюте —
 * тождество по построению `dcCents()`. Историческим остаётся всё остальное.
 */

/** Снимок, выраженный в новой базе. `div` — делитель, см. выше. */
function snapRebase(snap, target, div){
  if (!snap || !snap.rates) return null;
  if (typeof div !== 'number' || !isFinite(div) || div <= 0) return null;
  var out = { base: target, rates: {} };
  Object.keys(snap.rates).forEach(function(c){
    if (c === target) return;
    out.rates[c] = snap.rates[c] / div;
  });
  out.rates[snap.base] = 1 / div;        /* прежняя база — в новой */
  return out;
}

/* ++++++ PRODUCT SNAPS ++++++ ОДИН обход на всех читателей снимков.
 *
 * Их трое — snapMoveAll(), baseSnapCount() и dcHasSnap() — и они обязаны
 * видеть один и тот же набор записей. Пока список был записан в каждом
 * отдельно, добавление вида означало три правки, из которых достаточно
 * забыть одну: не переедет снимок при смене базы — вернётся R32; не
 * сосчитается — диалог смены базы промолчит о том, что перестанет
 * действовать. Ни один из этих отказов не даёт ошибки нигде. */
function snapEach(fn){
  state.transactions.forEach(fn);
  state.payments.forEach(fn);
  /* ++++++ EXPENSES ++++++ v15: расход тоже несёт снимок курсов, и обход у
     снимков ОДИН на всех читателей (хрупкое место 63). Забыть его здесь
     значило бы получить R32 для расходов — при смене базы их снимки не
     переехали бы, — и заодно заставить диалог смены базы соврать о том,
     сколько записей перестанет читаться своим курсом. Ни то, ни другое
     не даёт ошибки нигде. */
  state.expenses.forEach(fn);
  state.products.forEach(function(p){
    fn(p);
    (p.batches || []).forEach(fn);
  });
}


/** Перевести снимки в новую базу. Зовётся ОДИН раз, из applyBaseChange(),
 *  и ТОЛЬКО в режиме «пересчитать» — см. блок выше.
 *
 *  Переезжает снимок, снятый в ТОЙ базе, которую сейчас покидают. Снимок с
 *  чужой базой не трогается: он уже неприменим, и переводить неприменимое
 *  значит делать его на вид применимым. Так после «переименовать», которое
 *  снимки не двигает, следующая смена базы не усыновляет их задним числом.
 *
 *  Делитель один на всех — сегодняшний курс, тот самый, на который поделены
 *  суммы. Поэтому не переехать не может НИ ОДИН, и «сколько застряло»
 *  спрашивать больше не у кого. */
function snapMoveAll(target, old, div){
  function move(rec){
    var s = rec.rateSnap;
    if (!s || s.base !== old) return;
    var moved = snapRebase(s, target, div);
    if (moved) rec.rateSnap = moved;
  }
  /* ++++++ PRODUCT SNAPS ++++++ товары и партии переезжают тем же move():
     запись без снимка — no-op по построению, snapRebase() возвращает null. */
  snapEach(move);
}
function dcCents(cents, snap){
  if (cents === null || cents === undefined) return null;
  if (dcCur() === state.settings.baseCurrency) return dcRound(cents);  /* пересчёта нет вообще */
  var r = dcRateOf(snap, dcCur());
  if (r === null) return null;
  return dcRound(cents / r);
}
/** Курсы на момент записи — «1 <код> = X <база>», как в settings.rates.
 *  Пишется ОДИН раз, при создании продажи или оплаты. */
function rateSnapshot(){
  var r = {}, src = state.settings.rates, c;
  for (c in src){ if (own(src, c)) r[c] = src[c]; }
  return { base: state.settings.baseCurrency, rates: r };
}
/* ++++++ PRODUCT SNAPS ++++++ v14: у товара и у партии тоже есть свой день.
 *
 * Ни нового формата, ни нового направления: это тот же {base, rates}, что
 * у выдачи с v10, и читает его та же dcRateOf(). Новы только три вопроса
 * «чей снимок относится к этой сумме», и каждый отвечает одной строкой.
 *
 * Партия без своего снимка падает на снимок ТОВАРА, а не сразу на текущий
 * курс: так партия, выдуманная ремонтом журнала (COST RESCUE) или потерявшая
 * снимок при чтении, остаётся в том же дне, что и товар, которому она
 * принадлежит. Товар без снимка — запись старше v14, и она читается текущим
 * курсом, как ей и положено. */
/** Снимок ТОВАРА — им читается его цена продажи. */
function prodSnapOf(p){ return (p && p.rateSnap) || null; }
/** Снимок ПАРТИИ — им читается её закупочная стоимость. */
function batchSnapOf(p, b){ return (b && b.rateSnap) || prodSnapOf(p); }
/** Снимок, которому dcRateOf() ДЕЙСТВИТЕЛЬНО поверит: снятый в нынешней
 *  базе. Условие то же, что внутри dcRateOf(), и повторено оно нарочно —
 *  dcRateOf() не трогается ни на байт (её сравнивают побайтово соседние
 *  задачи). Что повтор не разойдётся с оригиналом, проверяет набор:
 *  dcRateOf(snapLive(s), c) обязана равняться dcRateOf(s, c) на любом s.
 *  Нужна она одному читателю — карточке товара, которая обязана называть
 *  тот курс, которым СЧИТАЕТСЯ, а не тот, который записан. */
function snapLive(snap){
  return (snap && snap.rates && snap.base === state.settings.baseCurrency) ? snap : null;
}

/* ---- показ: одна функция, три обёртки ---- */
/** ЕДИНСТВЕННОЕ место, где сумма «Сводки» становится текстом. На входе —
 *  уже пересчитанные dcCents() минорные единицы валюты показа. Формат берёт
 *  существующий fmtMinor()/NF: разделители и два знака после запятой те же,
 *  что во всём файле. */
function dcFmt(dm, style){
  if (dm === null || dm === undefined || !isFinite(dm)) return '—';
  var n = fmtMinor(dm);
  if (style === 'bare') return n;
  if (style === 'hero') return n + ' <span class="cur">' + esc(dcCur()) + '</span>';
  return n + ' ' + esc(dcCur());
}
function dcMoney(dm){ return dcFmt(dm, 'code'); }   /* «7,161.37 AED» — строки и карточки */
function dcBare(dm){ return dcFmt(dm, 'bare'); }    /* «7,161.37» — ячейки таблицы отчёта */
function dcHero(dm){ return dcFmt(dm, 'hero'); }    /* крупная цифра «героя» */

/** Подпись окна отчёта: в какой валюте он открыт. */
function dcNote(){
  var c = dcCur();
  return '<b>' + esc(c) + '</b>' + (c === state.settings.baseCurrency
    ? ' <span class="muted">' + tr('sec.storedCur') + '</span>' : '');
}
/** Подпись в шапке «Сводки». Она говорит ровно одно и всегда одно и то же:
 *  в чём всё хранится. Что показано сейчас — написано на самой кнопке в углу
 *  карточки, то есть там же, где это и меняют; повторять это ещё и в шапке
 *  значит занимать самое дорогое место экрана строкой, которую читают раз. */
function dcStoreNote(){
  return '<b>' + esc(state.settings.baseCurrency) + '</b> ' +
    '<span class="muted">' + tr('sec.storedCur') + '</span>';
}
/** Есть ли хоть одна запись со снимком курса — чтобы не обещать
 *  историчность документу, в котором её ещё нет. */
function dcHasSnap(){
  /* ++++++ PRODUCT SNAPS ++++++ тот же вопрос, что у baseSnapCount(), и
     теперь буквально он: два счётчика одного и того же разошлись бы, а
     заметить это было бы негде — здесь от него зависит одна фраза. */
  return baseSnapCount() > 0;
}
/** Какой курс сейчас применён. Печатает это одно место — шапка «Полного
 *  отчёта»: в самой «Сводке» курс больше не показывается, там для него нет
 *  строки, и она не нужна — валюта видна на плитке. */
function dcRateLine(){
  var c = dcCur(), b = state.settings.baseCurrency;
  if (c === b) return tr('dc.noConv', {cur: esc(b)});
  var r = rateOf(c);
  if (r === null) return tr('dc.noRate', {cur: esc(c), base: esc(b)});
  return tr('dc.rate', {base: esc(b), v: esc(trimNum(1 / r)), cur: esc(c)}) +
    (dcHasSnap() ? ' · ' + tr('dc.hist') : '');
}

/* ---- переключатель: квадратик в углу «героя», который раскрывается в ряд --
 *
 * Закрыт — плитка с текущей валютой. Открыт — ряд той же формы, выехавший из
 * неё влево: ВЫБРАННАЯ ОСТАЁТСЯ НА МЕСТЕ ПЛИТКИ, крайней справа, остальные
 * раскрываются левее. Выбранную отличает ТОЛЬКО цвет текста — ни галочки, ни
 * подписи под списком: выбор из трёх коротких слов не стоит окна размером с
 * карточку.
 *
 * Ряд прижат к правому краю карточки и растёт влево, поэтому за её край не
 * выходит ни на какой ширине. Раскрывается clip-path'ом от правого края —
 * буквы при этом не растягиваются, в отличие от scaleX, — и первой из-под
 * маски выходит как раз выбранная валюта, ровно там, где только что стояла
 * плитка с тем же кодом.
 *
 * Порядок «выбранная справа» — не украшение, а то, что делает жест обратимым.
 * Пока ряд открыт, кнопки data-act="dc-open" на экране нет: плитка И ЕСТЬ
 * ряд, и пиксели, по которым нажали, принадлежат теперь крайней правой
 * ячейке. Раз в ней стоит уже выбранная валюта, повторное нажатие в ту же
 * точку ничего не сохраняет и просто закрывает ряд — «повторное нажатие на
 * квадратик» работает буквально. Выбор другой валюты переносит её на это же
 * место, поэтому следующее раскрытие ведёт себя так же. Отдельной ветки
 * «закрыть» у 'dc-open' поэтому нет — она была бы обработчиком, до которого
 * невозможно доехать.
 *
 * ОТКРЫТИЕ И ЗАКРЫТИЕ НЕ ЗОВУТ render(). Перерисовывается ровно один узел —
 * сама .dcpick, — тем же приёмом, что liveSearch() и remPaint(). Причина не
 * в скорости: на «Сводке» в этот момент может стоять курсор в поле поиска
 * товара или в поле даты периода, а render() пересобирает #app целиком и
 * курсор бы пропал (хрупкое место 12). Полный render() остаётся ровно в
 * одном месте — когда валюту ДЕЙСТВИТЕЛЬНО выбрали и всю вкладку надо
 * пересчитать. */

/** Три состояния ui.dcOpen: false — закрыт, true — открыт, 'closing' — ещё
 *  нарисован, но уже уезжает. Третье существует только ради анимации ухода. */

/** Вернуть ли фокус на плитку, когда ряд уедет. Ставится, когда закрытие
 *  пришло ИЗ ряда (Escape, выбор, повторное нажатие), и не ставится, когда
 *  щёлкнули мимо: там фокус нужен там, куда щёлкнули. */
var dcRefocus = false;

/** Порядок в раскрытом ряду: выбранная — ПОСЛЕДНЯЯ, остальные слева от неё
 *  в том порядке, в каком их отдаёт dcCodes().
 *
 *  Последняя — значит на месте плитки: ряд раскрывается влево от правого
 *  края карточки, поэтому крайняя правая ячейка занимает ровно те пиксели,
 *  по которым нажали. AED → USD|TJS|AED, USD → AED|TJS|USD,
 *  TJS → AED|USD|TJS. Правило одно и то же при любом числе валют — ни
 *  чётности, ни середины, которой при чётном числе не существует. */
function dcRowCodes(){
  var cur = dcCur();
  return dcCodes().filter(function(c){ return c !== cur; }).concat([cur]);
}
function dcPickHTML(){
  if (ui.dcOpen) return '<div class="dcpick">' + dcRowHTML() + '</div>';
  var cur = dcCur();
  var bad = (cur !== state.settings.baseCurrency && rateOf(cur) === null);
  return '<div class="dcpick">' +
    '<button type="button" class="dcbtn' + (bad ? ' bad' : '') + '" data-act="dc-open"' +
      ' aria-label="' + esc(tr('dc.label')) + ': ' + esc(cur) + '"' +
      ' title="' + esc(tr('dc.label')) + '">' + esc(cur) + '</button></div>';
}
/** Сам ряд.
 *
 *  role="group" и aria-pressed, а не listbox с option: listbox обещает
 *  вспомогательным программам стрелки влево-вправо, а их здесь нет и не
 *  нужно — валют три, и Tab обходит их сам, потому что это обычные кнопки.
 *  Обещание, которого нельзя сдержать, хуже отсутствия обещания.
 *
 *  Валюта без курса ничем в ряду не помечена: пометка — это цвет, а цветом
 *  здесь сказано ровно одно, что выбрано. Про отсутствующий курс говорят
 *  красная плитка, полоса секции и прочерки вместо сумм. */
function dcRowHTML(){
  var cur = dcCur();
  var bad = (cur !== state.settings.baseCurrency && rateOf(cur) === null);
  var h = '<div class="dcrow' + (ui.dcOpen === 'closing' ? ' out' : '') +
    '" role="group" aria-label="' + esc(tr('dc.label')) + '">';
  dcRowCodes().forEach(function(c){
    h += '<button type="button" data-act="dc" data-arg="' + esc(c) + '"' +
      ' aria-pressed="' + (c === cur ? 'true' : 'false') + '"' +
      (c === cur ? ' class="on' + (bad ? ' bad' : '') + '"' : '') + '>' +
      esc(c) + '</button>';
  });
  return h + '</div>';
}
/** Перерисовать ТОЛЬКО плитку. Один узел, как у liveSearch() и remPaint(),
 *  и ни одного лишнего: #app при открытии и закрытии не пересобирается, и
 *  курсор в поле поиска или в дате периода остаётся на месте. Если этого
 *  «героя» сейчас нет на экране (сегмент «Склад», другая вкладка) — делать
 *  нечего. */
function dcPaint(){
  var n = document.querySelector('.dcpick');
  if (!n || !n.parentNode) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = dcPickHTML();
  if (tmp.firstChild) n.parentNode.replaceChild(tmp.firstChild, n);
}
/** Раскрыть ряд и увести в него фокус — тем же движением, что remOpen()
 *  уводит его на список товаров. Выбранную заодно подкручиваем в видимую
 *  часть: если валют больше, чем помещается в карточку, ряд прокручивается,
 *  и начинать надо с той, на которой стоим. */
function dcOpen(){
  ui.dcOpen = true;
  dcPaint();
  var b = document.querySelector('.dcrow button.on');
  if (!b) return;
  if (b.scrollIntoView) b.scrollIntoView({block:'nearest', inline:'center'});
  b.focus();
}
/** Убрать ряд после анимации ухода. Ждём чуть дольше самой анимации: если
 *  снять узел в тот же миг, последний её кадр не успевает показаться.
 *  Флаг проверяется ещё раз — за эти доли секунды владелец мог нажать
 *  что-то ещё. */
function dcCloseSoon(){
  setTimeout(function(){
    if (ui.dcOpen !== 'closing'){ dcRefocus = false; return; }
    ui.dcOpen = false;
    dcPaint();
    /* Фокус возвращается на плитку, ТОЛЬКО если за эти доли секунды его никуда
       не увели. Иначе таймер выдёргивал бы его из поля, в которое владелец
       успел щёлкнуть, — и следующие нажатия клавиш уходили бы в кнопку. */
    if (dcRefocus){
      var a = document.activeElement;
      var loose = !a || a === document.body ||
                  (a.closest && a.closest('.dcpick'));
      if (loose){
        var t = document.querySelector('.dcbtn');
        if (t) t.focus();
      }
    }
    dcRefocus = false;
  }, 175);
}
/** Закрыть с анимацией. refocus — возвращать ли фокус на плитку: по Escape
 *  и после выбора да, по щелчку мимо нет (там фокус нужен там, куда
 *  щёлкнули). */
function dcClose(refocus){
  if (ui.dcOpen !== true) return;
  dcRefocus = !!refocus;
  ui.dcOpen = 'closing';
  dcPaint();
  dcCloseSoon();
}
/** «Сводка» в выбранной валюте.
 *
 *  Те же обходы, что в productStats(), personStats() и computeReport(), но
 *  каждая ПРОДАЖА, каждая ОПЛАТА и — с v14 — каждая ПАРТИЯ закупки
 *  пересчитывается своим курсом, и
 *  складываются уже пересчитанные целые. Отсюда два свойства, ради которых
 *  всё и затевалось: итог всегда равен сумме напечатанных строк, а правка
 *  курса в настройках не двигает давние продажи.
 *
 *  Нового правила подсчёта здесь нет ни одного: закупки, себестоимость,
 *  долги и статусы считают те же функции, что и раньше, — эта карта только
 *  переводит их результат в валюту показа. В базовой валюте dcCents()
 *  возвращает вход без изменений, поэтому карта совпадает с исходными
 *  цифрами до копейки; это проверяется на каждом документе набора тестов.
 *
 *  Пустая сумма — ноль в любой валюте. Сумма, в которую входит запись, для
 *  которой курса нет, — null, то есть прочерк. */
function dcStats(ps){
  /* ps — уже посчитанная карта productStats(), если она у вызывающего есть.
     Списки «Склада» и «Людей» перерисовываются на каждой набранной букве
     (liveSearch), и лишний проход по всем товарам на этом пути ни к чему. */
  ps = ps || productStats();
  var f = ui.report;
  var swapped = !!(f.from && f.to && f.from > f.to);         /* как в computeReport() */
  var from = swapped ? '' : f.from, to = swapped ? '' : f.to;
  /* ++++++ EXPENSES ++++++ два новых поля периода (расходы и чистая
     прибыль) и одно общее (расходы за всё время — итог секции «Расходы»).
     Все прежние остаются на своих местах и со своими значениями. */
  var d = { cur: dcCur(), prod:{}, per:{},
            rep:{ revenueD:0, costD:0, profitD:0, receivedD:0, spentD:0,
                  expenseD:0, netProfitD:0 },
            tot:{ expectedD:0, spentD:0, cogsD:0, profitD:0, stockCostD:0,
                  receivedD:0, outD:0, credD:0, expenseD:0 } };

  actProducts().forEach(function(p){
    var spent = 0, inProd = !f.productId || p.id === f.productId;
    (Array.isArray(p.batches) ? p.batches : []).forEach(function(b){
      /* ++++++ PRODUCT SNAPS ++++++ v14. Здесь стоял null — «закупка не
         продажа, считаем текущим курсом», — и правка курса в настройках
         переоценивала товар, купленный полгода назад. Партия несёт свой
         снимок с того дня, когда пришла, и читается им. */
      var v = dcCents(b.totalCostCents || 0, batchSnapOf(p, b));
      spent = dcAdd(spent, v);
      if (inProd && inRange(b.date, from, to)) d.rep.spentD = dcAdd(d.rep.spentD, v);
    });
    d.prod[p.id] = { valueD:0, cogsD:0, spentD:spent, profitD:0, stockCostD:0 };
  });
  actPeople().forEach(function(p){ d.per[p.id] = { dueD:0, paidD:0, outD:0, credD:0 }; });

  actTx().forEach(function(t){
    var s = ps[t.productId];
    /* Себестоимость выданного пересчитывается курсом ТОЙ ЖЕ продажи: иначе
       прибыль не была бы разностью двух напечатанных чисел. */
    var rev  = dcCents(t.qty * t.unitPriceCents, t.rateSnap);
    /* ++++++ COGS ROUND ++++++ R7. Доля, посчитанная productStats(), а
       не своё округление: иначе в базовой валюте эта сумма разошлась бы
       с productStats().cogsCents на копейки — а на их совпадении стоит
       вся эта функция. Курс остаётся курсом ТОЙ ЖЕ продажи. */
    var cost = dcCents((s && own(s.cogsOf, t.id)) ? s.cogsOf[t.id] : 0, t.rateSnap);
    if (s && own(d.prod, t.productId)){                      /* productStats() пропускает такую же */
      d.prod[t.productId].valueD = dcAdd(d.prod[t.productId].valueD, rev);
      d.prod[t.productId].cogsD  = dcAdd(d.prod[t.productId].cogsD, cost);
    }
    if (own(d.per, t.personId)) d.per[t.personId].dueD = dcAdd(d.per[t.personId].dueD, rev);
    if ((!f.productId || t.productId === f.productId) && inRange(t.date, from, to)){
      d.rep.revenueD = dcAdd(d.rep.revenueD, rev);
      d.rep.costD    = dcAdd(d.rep.costD, cost);
    }
  });
  /* ++++++ GOODS RETURN ++++++ возврат пересчитывается курсом СВОЕЙ выдачи
     (её rateSnap): возвращённая стоимость гасит ровно ту, что была
     начислена, в любой валюте показа. В базовой валюте dcStats() остаётся
     равной productStats()/personStats() до копейки — на этом тождестве
     стоит вся семья dc*. */
  actRet().forEach(function(x){
    var t = txById(x.txId); if (!t) return;
    var s = ps[t.productId];
    var rrev  = dcCents(x.qty * t.unitPriceCents, t.rateSnap);
    var rcost = dcCents((s && own(s.retCogsOf, x.id)) ? s.retCogsOf[x.id] : 0, t.rateSnap);
    if (s && own(d.prod, t.productId)){
      d.prod[t.productId].valueD = dcSub(d.prod[t.productId].valueD, rrev);
      d.prod[t.productId].cogsD  = dcSub(d.prod[t.productId].cogsD, rcost);
    }
    if (own(d.per, t.personId)) d.per[t.personId].dueD = dcSub(d.per[t.personId].dueD, rrev);
    if ((!f.productId || t.productId === f.productId) && inRange(x.date, from, to)){
      d.rep.revenueD = dcSub(d.rep.revenueD, rrev);
      d.rep.costD    = dcSub(d.rep.costD, rcost);
    }
  });
  actPay().forEach(function(y){
    var amt = dcCents(y.amountCents, y.rateSnap);
    if (own(d.per, y.personId)) d.per[y.personId].paidD = dcAdd(d.per[y.personId].paidD, amt);
    if (inRange(y.date, from, to)) d.rep.receivedD = dcAdd(d.rep.receivedD, amt);
  });
  /* ++++++ EXPENSES ++++++ каждый расход — своим снимком курсов, ровно как
     оплата строкой выше. Поэтому итог секции и строка «Прочие расходы»
     равны СУММЕ ПЕРЕСЧИТАННЫХ ЗАПИСЕЙ, а не пересчитанной сумме, — то же
     правило, на котором стоит вся эта функция. Отбор периода — expPick(),
     тот же, что у computeReport(); в базовой валюте обе величины сходятся
     до копейки, потому что dcCents() в базе есть тождество. */
  d.rep.expenseD = expSumD(expPick(from, to));
  d.tot.expenseD = expSumD(actExp());

  Object.keys(d.prod).forEach(function(k){
    var x = d.prod[k];
    x.profitD    = dcSub(x.valueD, x.cogsD);
    x.stockCostD = dcSub(x.spentD, x.cogsD);
    d.tot.expectedD  = dcAdd(d.tot.expectedD, x.valueD);
    d.tot.spentD     = dcAdd(d.tot.spentD, x.spentD);
    d.tot.cogsD      = dcAdd(d.tot.cogsD, x.cogsD);
    d.tot.profitD    = dcAdd(d.tot.profitD, x.profitD);
    d.tot.stockCostD = dcAdd(d.tot.stockCostD, x.stockCostD);
  });
  Object.keys(d.per).forEach(function(k){
    var x = d.per[k];
    x.outD  = dcMax0(dcSub(x.dueD, x.paidD));
    x.credD = dcMax0(dcSub(x.paidD, x.dueD));
    d.tot.receivedD = dcAdd(d.tot.receivedD, x.paidD);
    d.tot.outD      = dcAdd(d.tot.outD, x.outD);
    d.tot.credD     = dcAdd(d.tot.credD, x.credD);
  });
  d.rep.profitD = dcSub(d.rep.revenueD, d.rep.costD);
  /* ++++++ EXPENSES ++++++ «Чистая прибыль» — разность ДВУХ НАПЕЧАТАННЫХ
     чисел, а не отдельно посчитанная величина: строка на экране обязана
     сходиться с теми двумя, что стоят над ней. */
  d.rep.netProfitD = dcSub(d.rep.profitD, d.rep.expenseD);
  return d;
}
/** Склад по себестоимости с учётом фильтра товара — ровно то же, что делает
 *  stockCostFiltered(), только по уже пересчитанной карте. */
function dcStockCostFiltered(d){
  var sum = 0;
  actProducts().forEach(function(p){
    if (ui.report.productId && p.id !== ui.report.productId) return;
    if (own(d.prod, p.id)) sum = dcAdd(sum, d.prod[p.id].stockCostD);
  });
  return sum;
}

/* ==================================================================
 * ++++++ SELF UPDATE ++++++      ПРОГРАММА ОБНОВЛЯЕТ САМА СЕБЯ
 *
 * ES5. Опирается на семейство обмена: тот же токен, тот же
 * `api.github.com`, тот же приватный репозиторий. Своего сетевого
 * механизма не заводит — второй был бы вторым местом, где можно
 * ошибиться с токеном.
 *
 * ПРАВИЛО, ИЗ КОТОРОГО СЛЕДУЕТ ВСЁ:
 *
 *     ОБНОВЛЕНИЕ НЕ ИМЕЕТ ПРАВА ОСТАВИТЬ ВЛАДЕЛЬЦА БЕЗ РАБОТАЮЩЕЙ
 *     ПРОГРАММЫ.
 *
 * Отсюда:
 *   · предыдущее ядро СОХРАНЯЕТСЯ, и вернуться к нему можно одной
 *     кнопкой. Одна неудачная выкладка иначе оставила бы без программы
 *     все устройства разом, и чинить было бы нечем — приложение и есть
 *     то, чем чинят;
 *   · новое ядро применяется ЦЕЛИКОМ или никак: скачали, проверили,
 *     положили, и только потом переключились. Оборванная закачка не
 *     оставляет половины файла;
 *   · данные обновление не трогает вообще. Оно меняет программу, а
 *     записи лежат отдельно — в localStorage и IndexedDB, и переживают
 *     смену ядра, как переживают перезапуск.
 *
 * ЧЕМ СРАВНИВАЮТСЯ ВЕРСИИ — И ПОЧЕМУ НЕ НОМЕРОМ. Номер версии человек
 * забывает поднять, и тогда обновление молча не приезжает: устройство
 * считает, что у него уже это. Поэтому сравнивается МЕТКА СБОРКИ,
 * которую ставит скрипт выкладки, а не рука. Номер остаётся — но
 * только чтобы показать его владельцу.
 * ================================================================== */

/* Заполняется скриптом выкладки. В рабочем дереве стоит 'dev' — это и
   значит «собрано руками, обновлений не ищем». */
var APP_VERSION = '1.2.2';
var APP_BUILD = '2026-08-28T21:13:01.874Z';

/* ==================================================================
 * ++++++ PRODUCT UPDATE ++++++   ОБНОВЛЕНИЕ БЕЗ ТОКЕНА И БЕЗ ВХОДА
 *
 * ES5. Ни одной стрелки, ни одного `let` — файл написан так, чтобы лечь
 * в goods-tracker.html как есть.
 *
 * ПРАВИЛО, ИЗ КОТОРОГО СЛЕДУЕТ ВСЁ:
 *
 *     У ПОЛЬЗОВАТЕЛЯ НЕТ И НЕ БУДЕТ ТОКЕНА.
 *
 * Отсюда всё остальное:
 *   · манифест и установщики лежат в ОТДЕЛЬНОМ ПУБЛИЧНОМ репозитории.
 *     Код и данные остаются в приватном, и ни одна строка отсюда туда
 *     не ходит;
 *   · запрос идёт БЕЗ заголовка авторизации. С ним анонимный доступ к
 *     публичному репозиторию отвечает 401 — то есть «обновлений нет»
 *     там, где они есть;
 *   · программа ничего не устанавливает молча. Проверка при запуске
 *     ставит полосу, установку нажимает владелец. Это правило личной
 *     сборки, и менять его для продуктовой не за чем: починка посреди
 *     работы хуже починки минутой позже.
 *
 * ЧТО ИМЕННО ОБНОВЛЯЕТСЯ — И ПОЧЕМУ НЕ ВСЕГДА ОДНО И ТО ЖЕ. Программа
 * это ОДИН HTML-файл внутри оболочки, и обе оболочки умеют его
 * заменять (coreInstall). Поэтому обычная починка приезжает сама, за
 * секунды и без установщика. Но иногда меняется сама оболочка — окно,
 * мост, список разрешённых адресов, — и тогда нового ядра мало:
 * оболочка читает список адресов из УПАКОВАННОГО ядра и о новом не
 * узнает. Такие случаи манифест называет полем `minShell`, и тогда
 * программа честно говорит «нужна новая версия приложения» и открывает
 * страницу загрузки. Скачивать и запускать установщик за владельца она
 * не берётся: 79 МБ, права администратора и антивирус — это то, что
 * человек должен видеть своими глазами.
 *
 * ANDROID ОБНОВЛЯЕТСЯ ТОЛЬКО ЧЕРЕЗ PLAY, и ядро там не подменяется
 * вовсе — решение владельца 2026-08-28. Пока приложение ещё не в Play,
 * оно ставится файлом, и тогда программа обязана хотя бы СКАЗАТЬ, что
 * вышла новая версия, и дать ссылку.
 * ================================================================== */

/* Файл-манифест в публичном репозитории. Имя то же, что у личной
   сборки: это один и тот же вид документа, и два разных имени пришлось
   бы объяснять. */
var PUB_MANIFEST = 'update.json';

/* ------------------------------------------------------------------ */
/* Сравнение версий                                                   */
/* ------------------------------------------------------------------ */
/* ЧИСЛАМИ, а не строками. Как строки `1.10.0` меньше `1.9.0`, и уборка
   старых релизов в этом проекте уже наступала на это — сносила свежий
   вместо старого, тихо и только начиная с десятой версии.
   Возвращает -1 / 0 / 1. Непонятное читается как 0.0.0: сравнение
   должно отвечать, а не бросать. */
function verCmp(a, b){
  var x = String(a || '').split('.'), y = String(b || '').split('.'), i, n, m;
  for (i = 0; i < 3; i++){
    n = parseInt(x[i], 10); if (!(n >= 0)) n = 0;
    m = parseInt(y[i], 10); if (!(m >= 0)) m = 0;
    if (n > m) return 1;
    if (n < m) return -1;
  }
  return 0;
}

/* ------------------------------------------------------------------ */
/* Разбор манифеста                                                   */
/* ------------------------------------------------------------------ */
/* Кривой манифест — это НЕ «обновлений нет»: разница между «всё в
   порядке» и «я не смог прочитать, что мне прислали» для владельца
   существенна. Поэтому null возвращается только на явную негодность, и
   вызывающий говорит об этом словами. */
function pubParse(text){
  var m;
  try{ m = JSON.parse(text); }catch(e){ return null; }
  if (!m || typeof m !== 'object') return null;
  if (typeof m.build !== 'string' || !m.build) return null;
  return {
    version: String(m.version || ''),
    build: String(m.build),
    minShell: String(m.minShell || '0.0.0'),
    core: String(m.core || ''),
    hash: String(m.hash || ''),
    size: parseInt(m.size, 10) || 0,
    notes: String(m.notes || ''),
    page: String(m.page || ''),      /* страница релиза для человека   */
    apk: String(m.apk || '')         /* прямая ссылка на APK           */
  };
}

/* ------------------------------------------------------------------ */
/* Что делать                                                         */
/* ------------------------------------------------------------------ */
/* ЕДИНСТВЕННОЕ место, где решается, что владельцу предложить. Ответ
   зависит от четырёх вещей, и все четыре приходят снаружи — так его
   можно проверить без браузера, без сети и без телефона:
 *
 *   env.platform   'windows' | 'android' | 'browser'
 *   env.build      метка сборки, которая стоит в этой программе
 *   env.shell      версия ОБОЛОЧКИ (не ядра)
 *   env.store      ставилось ли приложение из Play
 *
 * Возвращает: { do, version, notes, page, apk, why }
 *   'none'    — обновлять нечего
 *   'core'    — заменить ядро самим (Windows)
 *   'shell'   — нужен новый установщик, открыть страницу
 *   'store'   — обновление придёт из Play, открыть страницу приложения
 *   'apk'     — Play недоступен: сказать и дать ссылку на файл
 *   'browser' — открыто в обычном браузере, менять нечего
 */
function updPlanFor(info, env){
  var out = { do: 'none', version: '', notes: '', page: '', apk: '', why: '' };
  if (!info || !env) return out;

  out.version = info.version;
  out.notes = info.notes;
  out.page = info.page;
  out.apk = info.apk;

  /* Сравнивается МЕТКА, а не номер: номер человек забывает поднять, и
     починка тогда молча не приезжает — устройство считает, что у него
     уже это. Правило личной сборки, и здесь оно то же. */
  if (!info.build || info.build === env.build){ out.do = 'none'; return out; }

  if (env.platform === 'browser'){ out.do = 'browser'; out.why = 'nofile'; return out; }

  if (env.platform === 'android'){
    /* Ядро на Android не подменяется вовсе: обновления раздаёт Play.
       А пока приложение не в Play и стоит файлом — программа обязана
       хотя бы сказать, что вышла новая версия. */
    out.do = env.store ? 'store' : 'apk';
    return out;
  }

  /* Windows. Ядро — само; оболочка — руками, и только когда она
     действительно нужна: список разрешённых адресов оболочка читает из
     УПАКОВАННОГО ядра, поэтому новое ядро о новом адресе не узнает. */
  if (verCmp(info.minShell, env.shell) > 0){
    out.do = 'shell';
    out.why = 'oldshell';
    return out;
  }
  if (!info.core){ out.do = 'shell'; out.why = 'nocore'; return out; }
  out.do = 'core';
  return out;
}

/* ------------------------------------------------------------------ */
/* Что показать владельцу                                             */
/* ------------------------------------------------------------------ */
/* Ключи словаря, а не текст: текст переводится, как всё видимое в этом
   файле. Каждой беде своё слово — «нет сети» пройдёт само, «слишком
   часто» пройдёт через час, «манифест не читается» означает, что
   сломана выкладка, и владельцу тут делать нечего. */
function pubErrKey(err){
  var M = {
    net: 'pu.eNet', nofetch: 'pu.eBrowser',
    notfound: 'pu.eNoRepo', badmanifest: 'pu.eManifest',
    rate: 'pu.eRate', auth: 'pu.eRate',
    hash: 'pu.eBroken', size: 'pu.eBroken', shape: 'pu.eBroken',
    nobridge: 'pu.eBrowser', install: 'pu.eInstall'
  };
  return own(M, err) ? M[err] : 'pu.eServer';
}

/* Анонимный доступ к api.github.com — 60 запросов в час на адрес.
   Ответ 403 с этим заголовком означает «слишком часто», а не «нет
   доступа»: сваливать их в одно слово значит советовать войти туда,
   куда входить не нужно и нечем. */
function pubRateOf(status, body){
  if (status !== 403 && status !== 429) return null;
  var t = String(body || '');
  if (t.indexOf('rate limit') >= 0 || t.indexOf('API rate') >= 0) return 'rate';
  return 'rate';
}

/* ------------------------------------------------------------------ */
/* Адрес манифеста                                                    */
/* ------------------------------------------------------------------ */
/* Тот же api.github.com, что у личной сборки, и тот же Contents API:
   он отдаёт содержимое файла прямо в ответе, поэтому второй адрес
   (raw.githubusercontent.com) не нужен — а лишний адрес пришлось бы
   разрешать в оболочке и объяснять в документации. */
function pubUrl(cfg, file){
  return 'https://api.github.com/repos/' +
         encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo) +
         '/contents/' + String(file).split('/').map(encodeURIComponent).join('/') +
         '?ref=' + encodeURIComponent(cfg.branch || 'main') +
         '&t=' + String(new Date().getTime());   /* мимо кеша посредников */
}

/* ==================================================================
 * ++++++ PRODUCT UPDATE ++++++   РАЗГОВОР С ПУБЛИЧНЫМ РЕПОЗИТОРИЕМ
 *
 * ES5. Тонкий слой поверх ghReq() — той же единственной точки разговора
 * с GitHub, которой пользуется обмен личной сборки. Своего fetch здесь
 * нет и быть не должно.
 *
 * ЧТО ЗДЕСЬ ОСОБЕННОГО: ЗАПРОС ИДЁТ БЕЗ ТОКЕНА. У пользователя его нет
 * и не будет, а публичному репозиторию он и не нужен. Больше того — с
 * заголовком `Authorization: Bearer undefined` GitHub отвечает 401, то
 * есть «обновлений нет» там, где они есть. Поэтому `cfg` собирается
 * ЗДЕСЬ и поля `token` в нём нет вовсе: не «пустой токен», а
 * отсутствующий.
 *
 * ЧЕГО ЗДЕСЬ НЕТ: решений. Что делать с найденным — ставить ядро,
 * просить установщик, отправлять в Play — решает pubupd.js. Здесь
 * только «принеси».
 * ================================================================== */

/* Сколько байт ядра мы вообще готовы принять. Ядро весит около 1 МБ;
   40 МБ означают, что по этому адресу лежит не то, и лучше сказать об
   этом словом, чем скачивать неизвестно что. */
var PUB_MAX = 40 * 1024 * 1024;

/* ------------------------------------------------------------------ */
/* Настройка публичного репозитория                                   */
/* ------------------------------------------------------------------ */
/* Он ОТДЕЛЬНЫЙ и публичный: в нём лежат установщики и манифест, и
   больше ничего. Код и записи остаются в приватном, и ни одна строка
   отсюда туда не ходит — у программы пользователя нет ключа, которым
   туда можно было бы постучать. */
function pubCfg(){
  return { owner: PUB_OWNER, repo: PUB_REPO, branch: PUB_BRANCH || 'main' };
}

/* ------------------------------------------------------------------ */
/* Принести манифест                                                  */
/* ------------------------------------------------------------------ */
/* cb(err, info) — info разобран pubParse(), либо null, если обновлений
   нет. «Файла нет» здесь НЕ ошибка: так выглядит репозиторий, в котором
   ещё ничего не выкладывали. */
function pubGetManifest(cfg, cb){
  ghReq(cfg, 'GET', pubUrl(cfg, PUB_MANIFEST), null, function(err, j, status){
    if (err === 'notfound'){ cb(null, null); return; }
    if (err){
      /* 403 у анонимного доступа — это лимит запросов, а не «войдите»:
         входить пользователю нечем, и совет был бы вредным. */
      var rate = pubRateOf(status, j && JSON.stringify(j));
      cb(rate || err); return;
    }
    if (!j || !j.content){ cb('badmanifest'); return; }
    var text = b64dec(j.content);
    if (text === null){ cb('badmanifest'); return; }
    var info = pubParse(text);
    if (!info){ cb('badmanifest'); return; }
    cb(null, info);
  });
}

/* ------------------------------------------------------------------ */
/* Принести ядро                                                      */
/* ------------------------------------------------------------------ */
/* ЯДРО — ЭТО ТЕКСТ, и читается оно текстовым декодером: b64dec() ядра
   здесь на своём месте. (Для фотографий и накладных нужен двоичный —
   это другая функция и другой вид данных; путать их нельзя ни в ту, ни
   в другую сторону.)
 *
 * Четыре отказа ДО установки, и каждый по своей причине:
 *   · размер не сошёлся — закачка оборвалась;
 *   · отпечаток не сошёлся — приехало не то, что объявлено;
 *   · внутри нет заголовка программы — по адресу лежит чужой файл;
 *   · внутри нет отладочного крючка — файл не является ядром целиком.
 * Ни один из них не «на всякий случай»: любой означает, что ставить
 * это нельзя, и лучше остаться на работающем старом. */
function pubGetCore(cfg, info, cb){
  if (!info || !info.core){ cb('shape'); return; }
  ghReq(cfg, 'GET', pubUrl(cfg, info.core), null, function(err, j, status){
    if (err){
      var rate = pubRateOf(status, j && JSON.stringify(j));
      cb(rate || err); return;
    }
    if (!j || typeof j !== 'object'){ cb('shape'); return; }
    /* Размер спрашивается ДО чтения: незачем качать сорок мегабайт,
       чтобы потом отказаться. Он в БАЙТАХ — это ответ сервера, а не
       длина строки. */
    if (j.size && j.size > PUB_MAX){ cb('shape'); return; }
    /* Ядро весит больше мегабайта, а Contents API отдаёт содержимое
       только до него — и меряет БАЙТЫ, которых у русского текста вдвое
       больше, чем символов. Поэтому читает ghFileText(): при пустом
       `content` он доберёт текст из git/blobs. Пока этого здесь не
       было, продуктовое обновление отказывало ВСЕГДА — и наборы этого
       не видели, потому что поддельный GitHub отдавал содержимое
       всегда. */
    ghFileText(cfg, j, function(e2, text){
      if (e2){ cb(e2); return; }
      if (text === null){ cb('shape'); return; }
      if (info.size && text.length !== info.size){ cb('size'); return; }
      if (info.hash && updHash(text) !== info.hash){ cb('hash'); return; }
      if (text.indexOf('GoodsTracker') < 0 || text.indexOf('<html') < 0){ cb('shape'); return; }
      cb(null, text);
    });
  });
}

/* ==================================================================
 * ++++++ PRODUCT UPDATE ++++++   ПОКАЗ И ДЕЙСТВИЯ ПРОДУКТОВОГО РЕЖИМА
 *
 * Карточка одна на оба режима — та же `updCardHTML()`. Здесь только
 * то, чем продуктовая дорога отличается: план, который решил
 * updPlanFor(), и кнопка, открывающая страницу.
 * ================================================================== */

/* Кто мы. Платформа спрашивается у строки браузера, а не у моста:
   старый мост о ней не сообщает, а обновляться должны и такие
   устройства. Версия ОБОЛОЧКИ и способ установки приходят из
   coreInfo() — если их нет, решение выходит осторожным. */
function pubEnv(){
  var br = updBridge();
  var ua = (typeof navigator !== 'undefined' && navigator.userAgent) || '';
  return {
    platform: !br ? 'browser' : (/Android/i.test(ua) ? 'android' : 'windows'),
    build: APP_BUILD,
    version: APP_VERSION,
    shell: updState.shell || '0.0.0',
    store: updState.installer === 'com.android.vending'
  };
}

function pubCheckNow(){
  updState.checking = true; updState.err = ''; updState.plan = null;
  updState.found = null; render();
  pubGetManifest(pubCfg(), function(err, info){
    updState.checking = false;
    updState.at = nowISO();
    if (err){ updState.err = err; render(); return; }
    if (!info){ updState.err = 'notfound'; render(); return; }
    var plan = updPlanFor(info, pubEnv());
    updState.plan = plan;
    updState.info = info;
    /* «Установить» показывается ровно там, где программа действительно
       ставит сама, — то есть только на ядре. */
    updState.found = plan.do === 'core' ? { version: plan.version, notes: plan.notes } : null;
    render();
  });
}

function pubInstallNow(){
  var br = updBridge(), plan = updState.plan;
  if (!br || !plan || plan.do !== 'core' || updState.busy) return;
  updState.busy = true; updState.err = ''; render();
  pubGetCore(pubCfg(), updState.info, function(err, text){
    if (err){ updState.busy = false; updState.err = err; render(); return; }
    if (!br.coreInstall){ updState.busy = false; updState.err = 'nobridge'; render(); return; }
    br.coreInstall(text, updState.info.build).then(function(r){
      updState.busy = false;
      if (!r || !r.ok){ updState.err = 'install'; render(); return; }
      toast(tr('up.done'), 'ok');
      if (br.restart) br.restart();
      else location.reload();
    })['catch'](function(){ updState.busy = false; updState.err = 'install'; render(); });
  });
}

/* Страницу открывает ОБОЛОЧКА: в окне приложения ссылка иначе
   заменила бы саму программу. Старый мост этого не умеет — тогда
   обычный переход, и это лучше, чем ничего. */
function pubOpenNow(){
  var br = updBridge(), plan = updState.plan;
  if (!plan) return;
  var to = plan.do === 'store' ? '' : (plan.do === 'apk' ? plan.apk : plan.page);
  if (plan.do === 'store'){
    if (br && br.openMarket){ br.openMarket(); return; }
  }
  if (!to) return;
  if (br && br.openExternal){ br.openExternal(to); return; }
  try { window.open(to, '_blank'); } catch(e){ location.href = to; }
}

/* Строка под кнопками — только в продуктовом режиме и только когда
   есть что сказать. В личном возвращает пустую строку, поэтому
   карточка там побайтово прежняя. */
function pubNoteHTML(){
  if (!modeIsProduct()) return '';
  var p = updState.plan;
  if (!p || p.do === 'none' || p.do === 'core') return '';
  if (p.do === 'browser') return '<div class="note">' + esc(tr('pu.eBrowser')) + '</div>';

  var out = { products: [], people: [], transactions: [], payments: [], returns: [], expenses: [] };
  var txIds = {}, i, list;
  if (!trashFind(doc, id)) return out;
  out[col].push(id);
  if (col === 'products' || col === 'people'){
    list = doc.transactions || [];
    for (i = 0; i < list.length; i++){
      if (trashIs(list[i])) continue;
      if (col === 'products' ? list[i].productId === id : list[i].personId === id){
        out.transactions.push(list[i].id);
        txIds[list[i].id] = true;
      }
    }
  }
  if (col === 'people'){
    list = doc.payments || [];
    for (i = 0; i < list.length; i++){
      if (trashIs(list[i])) continue;
      if (list[i].personId === id) out.payments.push(list[i].id);
    }
  }
  if (col === 'transactions') txIds[id] = true;
  if (col === 'products' || col === 'people' || col === 'transactions'){
    list = doc.returns || [];
    for (i = 0; i < list.length; i++){
      if (trashIs(list[i])) continue;
      if (trOwn(txIds, list[i].txId)) out.returns.push(list[i].id);
    }
  }
  return out;
}

/** Сколько записей унесёт удаление, кроме самой выбранной — для строки
 *  «и ещё N» в подтверждении и в списке корзины. */
function trashCascadeCount(plan){
  var n = 0, i, k;
  for (i = 0; i < TRASH_COLS.length; i++){ k = TRASH_COLS[i]; n += (plan[k] || []).length; }
  return n > 0 ? n - 1 : 0;
}

/* ------------------------------------------------------------------ */
/* Пометить: удаление                                                  */
/* ------------------------------------------------------------------ */

/** Положить запись и её каскад в корзину.
 *
 *  МУТИРУЕТ документ и зовёт touchFn(id) на каждую помеченную запись —
 *  метка правки ставится единственным местом файла, и обмен от этого
 *  видит обычную правку записи.
 *
 *  `group` — id записи, с которой началось удаление. Отдельного поля
 *  «голова группы» нет и не нужно: голова — та запись, у которой
 *  id === trashGroup. Одно поле вместо двух, и группа не может остаться
 *  без признака головы.
 *
 *  Возвращает { group, ids, n } — n считая саму запись. */
function trashMark(doc, col, id, atISO, touchFn){
  var plan = trashCascade(doc, col, id), n = 0, i, j, k, list;
  for (i = 0; i < TRASH_COLS.length; i++){
    k = TRASH_COLS[i];
    list = doc[k] || [];
    for (j = 0; j < list.length; j++){
      if (plan[k].indexOf(list[j].id) === -1) continue;
      list[j].trashedAt = atISO;
      list[j].trashGroup = id;
      n++;
      if (touchFn) touchFn(list[j].id);
    }
  }
  return { group: id, ids: plan, n: n };
}

/* ------------------------------------------------------------------ */
/* Список для экрана                                                   */
/* ------------------------------------------------------------------ */

/** Корзина, собранная по группам: одна запись списка на одно удаление.
 *
 *  Голова группы — запись, у которой id === trashGroup. Её может уже не
 *  быть: восстановление платежа вытягивает человека (A2), и группа
 *  остаётся без головы. Тогда головой становится первая по порядку
 *  коллекций — товар, человек, выдача, платёж, возврат, расход, — то
 *  есть самая «старшая» из оставшихся. Осиротевшая группа не пропадает
 *  и не разваливается на строки.
 *
 *  Порядок — новее удаление выше; при равной метке по id, чтобы порядок
 *  не менялся от отрисовки к отрисовке (хрупкое место 34). */
function trashGroups(doc){
  var by = {}, keys = [], out = [], i, j, k, list, r, g;
  for (i = 0; i < TRASH_COLS.length; i++){
    k = TRASH_COLS[i];
    list = doc[k] || [];
    for (j = 0; j < list.length; j++){
      r = list[j];
      if (!trashIs(r)) continue;
      g = (typeof r.trashGroup === 'string' && r.trashGroup) ? r.trashGroup : r.id;
      if (!trOwn(by, g)){ by[g] = { group: g, at: r.trashedAt, items: [], head: null }; keys.push(g); }
      by[g].items.push({ col: k, rec: r });
      if (r.id === g) by[g].head = { col: k, rec: r };
      /* метка группы — самая ранняя из её записей: удаление одно, а
         часы внутри одного вызова одни и те же */
      if (r.trashedAt < by[g].at) by[g].at = r.trashedAt;
    }
  }
  for (i = 0; i < keys.length; i++){
    g = by[keys[i]];
    if (!g.head) g.head = g.items[0];
    g.n = g.items.length;
    out.push(g);
  }
  out.sort(function(a, b){
    if (a.at !== b.at) return a.at < b.at ? 1 : -1;
    return a.group < b.group ? -1 : (a.group > b.group ? 1 : 0);
  });
  return out;
}

/** Одна группа по её ключу — читают восстановление и «удалить навсегда». */
function trashGroupOf(doc, group){
  var all = trashGroups(doc), i;
  for (i = 0; i < all.length; i++) if (all[i].group === group) return all[i];
  return null;
}

/* ------------------------------------------------------------------ */
/* Восстановление: план                                                */
/* ------------------------------------------------------------------ */

/* Родители записи — то, без чего её нельзя вернуть: ссылка в никуда
   запрещена валидатором, и документ с ней просто не откроется. */
function trashParents(doc, col, rec){
  var out = [];
  if (col === 'transactions'){
    out.push({ col: 'people', id: rec.personId });
    out.push({ col: 'products', id: rec.productId });
  } else if (col === 'payments'){
    out.push({ col: 'people', id: rec.personId });
  } else if (col === 'returns'){
    out.push({ col: 'transactions', id: rec.txId });
  }
  return out;
}

/** Что нужно вернуть, чтобы вернуть это.
 *
 *  `ids` — набор по коллекциям, включая ЦЕПОЧКУ родителей: возврат тянет
 *  свою выдачу, выдача — своего человека и свой товар. Родитель тянется
 *  ОДИН, а не вся его группа (A2): человек возвращается, его прочие
 *  удалённые выдачи остаются удалёнными, потому что их удаляли отдельно.
 *
 *  `whole` — восстановление группой: тогда набор это вся группа плюс
 *  родители каждой её записи.
 *
 *  Ничего не меняет. */
function trashRestoreIds(doc, id, whole){
  var want = {}, order = [], queue = [], seen = {}, i, f, g, par, p;
  function add(rid){
    if (!rid || trOwn(seen, rid)) return;
    f = trashFind(doc, rid);
    if (!f || !trashIs(f.rec)) return;      /* активных не трогаем */
    seen[rid] = true;
    if (!trOwn(want, f.col)) want[f.col] = [];
    want[f.col].push(rid);
    order.push({ col: f.col, rec: f.rec });
    queue.push({ col: f.col, rec: f.rec });
  }
  if (whole){
    g = trashGroupOf(doc, id);
    if (g) for (i = 0; i < g.items.length; i++) add(g.items[i].rec.id);
  } else {
    add(id);
  }
  while (queue.length){
    f = queue.shift();
    par = trashParents(doc, f.col, f.rec);
    for (i = 0; i < par.length; i++){
      p = par[i];
      if (!p.id) continue;
      add(p.id);                             /* активный родитель отсеется в add */
    }
  }
  return { ids: want, order: order };
}

/** Можно ли вернуть — и если нет, то с цифрами.
 *
 *  Сторож склада спрашивает ОСТАТОК У ПРИЛОЖЕНИЯ: remainingOf(productId)
 *  это remainingFor() — та же деривация, которой считает форма выдачи.
 *  Своего счёта здесь нет намеренно: вторая формула остатка — та же
 *  ошибка, что второе округление.
 *
 *  Возвращает { ok:true } либо { ok:false, reason, ... }:
 *    reason 'stock' — need / have / product
 *    reason 'name'  — товар с таким именем уже есть (A6)
 *    reason 'phone' — номер уже записан за другим человеком (A7)
 */
function trashRestoreCheck(doc, plan, remainingOf){
  var back = {}, i, j, k, list, r, pid, need = {}, avail, prods = {}, keys, nm, ph, ex;
  for (k in plan.ids) if (trOwn(plan.ids, k))
    for (i = 0; i < plan.ids[k].length; i++) back[plan.ids[k][i]] = true;

  /* --- имя товара и телефон человека: чужой активной записи не мешаем */
  list = plan.ids.products || [];
  for (i = 0; i < list.length; i++){
    r = trashFind(doc, list[i]).rec;
    nm = String(r.name || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').replace(/^ | $/g, '');
    ex = doc.products || [];
    for (j = 0; j < ex.length; j++){
      if (trOwn(back, ex[j].id) || trashIs(ex[j])) continue;
      if (String(ex[j].name || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').replace(/^ | $/g, '') === nm)
        return { ok: false, reason: 'name', name: r.name };
    }
  }
  list = plan.ids.people || [];
  for (i = 0; i < list.length; i++){
    r = trashFind(doc, list[i]).rec;
    ph = String(r.phone || '');
    if (!ph) continue;
    ex = doc.people || [];
    for (j = 0; j < ex.length; j++){
      if (trOwn(back, ex[j].id) || trashIs(ex[j])) continue;
      if (String(ex[j].phone || '') === ph)
        return { ok: false, reason: 'phone', name: r.name, phone: ph, other: ex[j].name };
    }
  }

  /* --- склад: сколько единиц потребует возвращаемый набор */
  list = plan.ids.transactions || [];
  for (i = 0; i < list.length; i++){
    r = trashFind(doc, list[i]).rec;
    pid = r.productId;
    need[pid] = (trOwn(need, pid) ? need[pid] : 0) + r.qty;
    prods[pid] = true;
  }
  list = plan.ids.returns || [];
  for (i = 0; i < list.length; i++){
    r = trashFind(doc, list[i]).rec;
    var t = trashFind(doc, r.txId);
    if (!t) continue;
    pid = t.rec.productId;
    need[pid] = (trOwn(need, pid) ? need[pid] : 0) - r.qty;
    prods[pid] = true;
  }
  keys = [];
  for (k in prods) if (trOwn(prods, k)) keys.push(k);
  keys.sort();
  for (i = 0; i < keys.length; i++){
    pid = keys[i];
    if (need[pid] <= 0) continue;            /* возврат товара только прибавляет */
    var pf = trashFind(doc, pid);
    if (!pf) return { ok: false, reason: 'stock', need: need[pid], have: 0, product: '' };
    /* товар, который возвращается вместе с набором, приносит свой склад
       целиком: активных выдач у него нет — они ушли тем же каскадом */
    avail = trOwn(back, pid) ? pf.rec.qty : remainingOf(pid);
    if (need[pid] > avail)
      return { ok: false, reason: 'stock', need: need[pid], have: avail, product: pf.rec.name };
  }
  return { ok: true };
}

/* ------------------------------------------------------------------ */
/* Восстановление: применение                                          */
/* ------------------------------------------------------------------ */

/** Вернуть запись (или всю группу) из корзины.
 *
 *  ЦЕЛИКОМ ИЛИ НИКАК: набор считается, проверяется и только потом
 *  применяется. Частично восстановленного состояния не бывает ни на
 *  секунду.
 *
 *  Возвращает { ok:true, ids, order, parents } либо ответ проверки. */
function trashRestore(doc, id, whole, remainingOf, touchFn){
  var plan = trashRestoreIds(doc, id, whole), chk, i, k, list, j, back = {}, parents = [];
  var self = {};
  if (!plan.order.length) return { ok: false, reason: 'gone' };
  chk = trashRestoreCheck(doc, plan, remainingOf);
  if (!chk.ok) return chk;

  if (whole){
    var g = trashGroupOf(doc, id);
    if (g) for (i = 0; i < g.items.length; i++) self[g.items[i].rec.id] = true;
  } else { self[id] = true; }

  for (k in plan.ids) if (trOwn(plan.ids, k)){
    list = doc[k] || [];
    for (j = 0; j < list.length; j++){
      if (plan.ids[k].indexOf(list[j].id) === -1) continue;
      if (!trOwn(self, list[j].id)) parents.push({ col: k, rec: list[j] });
      delete list[j].trashedAt;
      delete list[j].trashGroup;
      back[list[j].id] = true;
      if (touchFn) touchFn(list[j].id);
    }
  }
  return { ok: true, ids: plan.ids, order: plan.order, parents: parents };
}

/* ------------------------------------------------------------------ */
/* Уборка по сроку                                                     */
/* ------------------------------------------------------------------ */

/** Что пора убрать навсегда: записи, пролежавшие TRASH_DAYS суток и
 *  больше (30 включительно — A3).
 *
 *  Только СЧИТАЕТ. Снимает записи вызывающая сторона — существующим
 *  dropFrom(), то есть с надгробием, иначе уборка на одном устройстве
 *  вернулась бы с другого. */
function trashPurgeIds(doc, nowMs){
  var out = { ids: {}, n: 0 }, i, j, k, list, r;
  for (i = 0; i < TRASH_COLS.length; i++){
    k = TRASH_COLS[i];
    list = doc[k] || [];
    for (j = 0; j < list.length; j++){
      r = list[j];
      if (!trashIs(r)) continue;
      if (trashAge(r.trashedAt, nowMs) < TRASH_DAYS) continue;
      if (!trOwn(out.ids, k)) out.ids[k] = [];
      out.ids[k].push(r.id);
      out.n++;
    }
  }
  return out;
}

/** Все id корзины — для «Очистить корзину». Той же формы ответ, что у
 *  уборки: обе дороги ведут в один dropFrom. */
function trashAllIds(doc){
  var out = { ids: {}, n: 0 }, i, j, k, list;
  for (i = 0; i < TRASH_COLS.length; i++){
    k = TRASH_COLS[i];
    list = trashOnly(doc[k] || []);
    if (!list.length) continue;
    out.ids[k] = [];
    for (j = 0; j < list.length; j++){ out.ids[k].push(list[j].id); out.n++; }
  }
  return out;
}

/** id вложений, которые уйдут вместе с этим набором записей. Считается
 *  ДО снятия записей: после них товара в документе уже нет и спросить
 *  его фотографию будет не у кого. */
function trashAttIds(doc, ids){
  var out = [], list = ids.products || [], i, f, p;
  for (i = 0; i < list.length; i++){
    f = trashFind(doc, list[i]);
    if (!f) continue;
    p = f.rec;
    if (p.photoId) out.push(p.photoId);
    if (p.invoiceIds) for (var j = 0; j < p.invoiceIds.length; j++) out.push(p.invoiceIds[j]);
  }
  return out;
}

/* ==================================================================
 * ++++++ SYNC MERGE ++++++          СЛИЯНИЕ ДОКУМЕНТОВ ДВУХ УСТРОЙСТВ
 *
 * ES5. Ни одной стрелки, ни одного `let` — файл написан так, чтобы лечь
 * в goods-tracker.html как есть.
 *
 * ПРАВИЛО, ИЗ КОТОРОГО СЛЕДУЕТ ВСЁ:
 *
 *     СЛИЯНИЕ НЕ ИМЕЕТ ПРАВА ПОТЕРЯТЬ ЗАПИСЬ И НЕ ИМЕЕТ ПРАВА
 *     РЕШИТЬ ЗА ВЛАДЕЛЬЦА МОЛЧА.
 *
 * Отсюда всё остальное:
 *   · записи объединяются ПО ОДНОЙ, по своему `id`. Целый документ не
 *     побеждает никогда — «кто последний записал, тот и прав» уносит
 *     работу другого устройства целиком, и это прямо запрещено;
 *   · удаление — это НАДГРОБИЕ (tombstone), а не отсутствие записи.
 *     Без него удалённая запись возвращается с другого устройства при
 *     первой же синхронизации, потому что там она ещё есть;
 *   · «новее выигрывает» применяется ТОЛЬКО когда изменилась одна
 *     сторона. Изменились обе — это конфликт, и его показывают;
 *   · денежные поля и замороженные курсы (`rateSnap`) слияние не
 *     трогает НИКОГДА: оно выбирает версию записи целиком, но не
 *     правит её содержимое.
 *
 * ТРИ СТОРОНЫ, А НЕ ДВЕ. Чтобы отличить «здесь не меняли» от «здесь
 * меняли на то же самое», нужна третья точка — состояние на момент
 * последней удачной синхронизации. Целиком его хранить накладно, и
 * не нужно: достаточно ОТПЕЧАТКА каждой записи (`base`). 1550 записей
 * дают около 46 КБ — против 400 КБ за весь документ.
 * ================================================================== */

/* Коллекции, которые синхронизируются. Порядок фиксирован: он же
   определяет порядок ключей в data.json, а тот обязан быть
   детерминированным, иначе разница между двумя версиями файла
   становится нечитаемой. */
var SYNC_COLS = ['products', 'people', 'transactions', 'payments', 'returns', 'expenses'];

/* Поля `settings`, которые ЕДУТ. Всё остальное — предпочтение этого
   устройства и остаётся дома (список и доводы — в README задачи).
   Курсы едут, потому что от них зависят расчёты, а не оформление. */
var SYNC_SETTINGS = ['baseCurrency', 'rates', 'vatPct', 'vatOn', 'rateLog'];

/* ------------------------------------------------------------------ */
/* Отпечаток одной записи                                             */
/* ------------------------------------------------------------------ */
/* Считается по КАНОНИЧЕСКОМУ виду: ключи отсортированы, поэтому запись,
   пересобранная validate() в своём порядке, даёт тот же отпечаток. Без
   этого каждая перезагрузка выглядела бы как правка всего документа. */

function canonJSON(v){
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Object.prototype.toString.call(v) === '[object Array]'){
    var a = [], i;
    for (i = 0; i < v.length; i++) a.push(canonJSON(v[i]));
    return '[' + a.join(',') + ']';
  }
  var keys = [], k;
  for (k in v) if (Object.prototype.hasOwnProperty.call(v, k)) keys.push(k);
  keys.sort();
  var out = [], j;
  for (j = 0; j < keys.length; j++){
    if (v[keys[j]] === undefined) continue;
    out.push(JSON.stringify(keys[j]) + ':' + canonJSON(v[keys[j]]));
  }
  return '{' + out.join(',') + '}';
}

/* Отпечаток записи. Считается по ней целиком: служебного времени внутри
   записи нет — оно живёт в карте рядом, — поэтому исключать нечего, и
   «сохранил, ничего не изменив» отпечатка не двигает. */
function recHash(rec){
  var s = canonJSON(rec), h1 = 0x811c9dc5, h2 = 0x01000193, i, c;
  for (i = 0; i < s.length; i++){
    c  = s.charCodeAt(i);
    h1 = ((h1 ^ c) >>> 0);
    h1 = ((h1 * 16777619) >>> 0);
    h2 = ((h2 + c * (i % 31 + 1)) >>> 0);
  }
  return h1.toString(16) + '-' + h2.toString(16) + '-' + s.length;
}

/* Собственное свойство — R20: id вида `constructor` не должен отвечать
   функцией из прототипа. Тот же приём, что во всём остальном файле. */
function ownKey(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }

/* Время правки записи — из КАРТЫ `id -> время`, а не из самой записи.
 *
 * Это не стиль, а необходимость. `bakSig()` хеширует ИМЕНА собственных
 * ключей каждой записи, поэтому новое поле внутри записи сдвинуло бы
 * подпись документа — и напоминание о копии заявило бы «записи
 * изменились» на данных, которых никто не касался. В самом файле уже
 * есть та же забота: пустые списки возвратов и расходов НЕ скармливаются
 * подписи, чтобы документ, не пользующийся возможностью, сохранил
 * прежнюю подпись байт в байт.
 *
 * Карта решает это разом: записи не меняются вообще, а метка едет
 * рядом — как `attDropped` и прочая диагностика едет рядом с документом.
 *
 * Записи прежней сборки метки не имеют, и это не ошибка: по требованию
 * такая запись считается СТАРШЕЙ стороной. Пустая строка меньше любой
 * строки ISO — обычное сравнение строк это и даёт. */
function modOf(id, meta){
  if (!meta || !id) return '';
  if (!ownKey(meta, id)) return '';
  var v = meta[id];
  return (typeof v === 'string') ? v : '';
}

/* ------------------------------------------------------------------ */
/* Слияние одной коллекции                                            */
/* ------------------------------------------------------------------ */
/* Вход:
 *   locals, remotes — массивы записей
 *   base            — { id: отпечаток } на момент последней синхронизации
 *   tombs           — { id: время удаления } объединённые с обеих сторон
 * Выход:
 *   { out, conflicts, stats }
 *
 * Разбор одного `id` — это таблица из шести случаев, и каждая строка в
 * ней принята сознательно:
 *
 *   есть только слева            → берём (новая запись этого устройства)
 *   есть только справа           → берём (новая запись другого)
 *   есть слева, справа удалена   → см. надгробия ниже
 *   одинаковы                    → берём любую, конфликта нет
 *   изменилась одна сторона      → берём изменённую (НЕ «новее»!)
 *   изменились обе, по-разному   → КОНФЛИКТ
 *
 * «Новее выигрывает» звучит просто и почти всегда неверно: если правку
 * сделали только здесь, а там запись не трогали, то часы другого
 * устройства не должны иметь к этому никакого отношения. Время нужно
 * ровно в одном месте — когда база неизвестна и сравнить не с чем. */

function mergeCollection(locals, remotes, base, tombs, metaL, metaR){
  var byIdL = {}, byIdR = {}, ids = [], seen = {}, i, r;
  for (i = 0; i < locals.length; i++){
    r = locals[i];
    if (!r || typeof r.id !== 'string') continue;
    byIdL[r.id] = r;
    if (!ownKey(seen, r.id)){ seen[r.id] = 1; ids.push(r.id); }
  }
  for (i = 0; i < remotes.length; i++){
    r = remotes[i];
    if (!r || typeof r.id !== 'string') continue;
    byIdR[r.id] = r;
    if (!ownKey(seen, r.id)){ seen[r.id] = 1; ids.push(r.id); }
  }

  var out = [], conflicts = [];
  var stats = { kept: 0, fromRemote: 0, fromLocal: 0, deleted: 0, conflicts: 0 };

  for (i = 0; i < ids.length; i++){
    var id = ids[i];
    var L = ownKey(byIdL, id) ? byIdL[id] : null;
    var R = ownKey(byIdR, id) ? byIdR[id] : null;
    var B = ownKey(base, id) ? base[id] : null;      /* отпечаток «тогда» */
    var T = ownKey(tombs, id) ? tombs[id] : null;    /* время удаления    */

    var hL = L ? recHash(L) : null;
    var hR = R ? recHash(R) : null;

    /* --- надгробие: запись где-то удалили ------------------------- */
    if (T){
      var survivor = L || R;
      var changedAfterDelete = false;
      if (survivor){
        /* Правка ПОСЛЕ удаления — это спор, а не запоздавшая копия.
           Сравниваем время правки с временем удаления; запись без
           времени правки спорить не может — она старше по условию. */
        var m = modOf(id, L === survivor ? metaL : metaR);
        changedAfterDelete = !!m && m > T;
        /* и только если эта сторона действительно ОТЛИЧАЕТСЯ от базы:
           иначе это просто та же запись, ещё не знающая об удалении */
        if (changedAfterDelete && B && recHash(survivor) === B) changedAfterDelete = false;
      }
      if (changedAfterDelete){
        conflicts.push({ id: id, kind: 'edit-vs-delete',
                         local: L, remote: R, deletedAt: T });
        stats.conflicts++;
        /* до решения владельца запись ОСТАЁТСЯ: удалить её сейчас
           значило бы решить спор молча, в пользу удаления */
        out.push(survivor);
        continue;
      }
      stats.deleted++;
      continue;                                   /* тихо и окончательно */
    }

    /* --- есть только с одной стороны ------------------------------- */
    if (L && !R){
      /* Если база ЗНАЛА эту запись, а справа её нет и надгробия нет —
         значит другое устройство просто ещё не видело удаления... но
         удаления и не было. Это наша запись, которую там не знают. */
      out.push(L); stats.fromLocal++; continue;
    }
    if (R && !L){ out.push(R); stats.fromRemote++; continue; }

    /* --- есть с обеих ---------------------------------------------- */
    if (hL === hR){ out.push(L); stats.kept++; continue; }

    var movedL = B === null ? true : hL !== B;
    var movedR = B === null ? true : hR !== B;

    if (movedL && !movedR){ out.push(L); stats.fromLocal++;  continue; }
    if (movedR && !movedL){ out.push(R); stats.fromRemote++; continue; }

    /* Обе изменились. База неизвестна (B === null) — единственный
       случай, где приходится звать время: это первая встреча двух
       документов, общего прошлого у них нет. */
    if (B === null){
      var mL = modOf(id, metaL), mR = modOf(id, metaR);
      /* Пустая метка МЕНЬШЕ любой строки ISO, и это ровно то, что нужно:
         запись прежней сборки, у которой времени правки нет, считается
         старшей стороной и уступает. Требовать метку с ОБЕИХ сторон
         нельзя — тогда встреча старой записи с новой становится
         конфликтом на ровном месте, и владельца спрашивают о том, о чём
         спрашивать нечего. Обе метки пусты — сравнивать нечем, и это
         честный конфликт. */
      if (mL !== mR){
        if (mL > mR){ out.push(L); stats.fromLocal++; }
        else        { out.push(R); stats.fromRemote++; }
        continue;
      }
    }

    conflicts.push({ id: id, kind: 'edit-vs-edit', local: L, remote: R,
                     localAt: modOf(id, metaL), remoteAt: modOf(id, metaR) });
    stats.conflicts++;
    /* до решения — держим СВОЮ версию: она уже на экране у владельца,
       и подменять её молча нельзя */
    out.push(L);
  }
  return { out: out, conflicts: conflicts, stats: stats };
}

/* ------------------------------------------------------------------ */
/* Слияние целых документов                                           */
/* ------------------------------------------------------------------ */
/* local  — `state` этого устройства
 * remote — то, что пришло из data.json (уже развёрнутое в тот же вид)
 * base   — { collection: { id: отпечаток } } на момент прошлой синхронизации
 * Возвращает { doc, tombstones, conflicts, stats } и НЕ трогает входы. */

function mergeDocs(local, remote, base, localTombs, remoteTombs, metaL, metaR){
  base = base || {};
  metaL = metaL || (local && local.syncMeta) || {};
  metaR = metaR || (remote && remote.syncMeta) || {};
  var tombs = mergeTombs(localTombs || {}, remoteTombs || {});
  var meta = {};
  var doc = { schemaVersion: local.schemaVersion, settings: null };
  var conflicts = [], stats = {}, i;

  /* Настройки — не записи: у них нет id, и спорить построчно не о чем.
     Едет НАБОР полей целиком, и берётся тот, что новее по своей метке.
     Всё, чего в списке нет, остаётся местным — так `sumCur`, язык и
     запомненные валюты ввода не уезжают на чужое устройство. */
  doc.settings = mergeSettings(local.settings || {}, (remote && remote.settings) || {},
                               local.settingsAt || '', (remote && remote.settingsAt) || '');

  for (i = 0; i < SYNC_COLS.length; i++){
    var col = SYNC_COLS[i];
    var res = mergeCollection(
      (local[col] || []),
      (remote && remote[col]) || [],
      (base[col] || {}),
      tombs, metaL, metaR
    );
    doc[col] = res.out;
    /* Метка едет за той версией записи, которая победила: иначе следующее
       слияние сравнивало бы содержимое одной стороны со временем другой. */
    var w;
    for (w = 0; w < res.out.length; w++){
      var rid = res.out[w] && res.out[w].id;
      if (typeof rid !== 'string') continue;
      var fromR = ownKey(byIdOf(res.out[w], (remote && remote[col]) || []), 'yes');
      var mm = fromR ? modOf(rid, metaR) : modOf(rid, metaL);
      if (!mm) mm = modOf(rid, metaR) || modOf(rid, metaL);
      if (mm) meta[rid] = mm;
    }
    stats[col] = res.stats;
    var j;
    for (j = 0; j < res.conflicts.length; j++){
      res.conflicts[j].collection = col;
      conflicts.push(res.conflicts[j]);
    }
  }
  doc.syncMeta = meta;
  return { doc: doc, tombstones: tombs, meta: meta, conflicts: conflicts, stats: stats };
}

/* Пришла ли эта версия записи с той стороны. Сравнение по ссылке, а не по
   содержимому: слияние возвращает те же объекты, что получило. */
function byIdOf(rec, list){
  var i;
  for (i = 0; i < list.length; i++) if (list[i] === rec) return { yes: 1 };
  return {};
}

/* Надгробия обеих сторон: объединение, и при совпадении id остаётся
   РАННЕЕ время — удаление произошло тогда, когда произошло, а поздняя
   отметка сделала бы правку до неё «правкой после удаления». */
function mergeTombs(a, b){
  var out = {}, k;
  for (k in a) if (ownKey(a, k)) out[k] = a[k];
  for (k in b) if (ownKey(b, k)){
    if (!ownKey(out, k) || String(b[k]) < String(out[k])) out[k] = b[k];
  }
  return out;
}

/* Настройки: набором, по метке времени. Равные метки или их отсутствие —
   остаются местные: своё привычнее чужого, и это не деньги. */
function mergeSettings(localS, remoteS, localAt, remoteAt){
  var out = {}, k, i;
  for (k in localS) if (ownKey(localS, k)) out[k] = localS[k];
  if (!remoteAt) return out;
  if (localAt && localAt >= remoteAt) return out;
  for (i = 0; i < SYNC_SETTINGS.length; i++){
    var f = SYNC_SETTINGS[i];
    if (ownKey(remoteS, f)) out[f] = remoteS[f];
  }
  return out;
}

/* ------------------------------------------------------------------ */
/* База отпечатков                                                    */
/* ------------------------------------------------------------------ */
/* Снимается ПОСЛЕ удачного обмена: с этого момента обе стороны знают
   одно и то же, и следующее слияние отсчитывает изменения отсюда. */

/* Снимок отпечатков. `syncMeta` в него не входит: это не запись, а
   сопроводительная карта, и её движение не должно читаться как правка. */
function baseOf(doc){
  var out = {}, i, j;
  for (i = 0; i < SYNC_COLS.length; i++){
    var col = SYNC_COLS[i], m = {}, list = doc[col] || [];
    for (j = 0; j < list.length; j++){
      if (list[j] && typeof list[j].id === 'string') m[list[j].id] = recHash(list[j]);
    }
    out[col] = m;
  }
  return out;
}

/* ------------------------------------------------------------------ */
/* Конверт data.json                                                  */
/* ------------------------------------------------------------------ */
/* Версия конверта отдельна от версии схемы приложения: приложение может
   вырасти, не меняя формата обмена, и наоборот. Читатель, встретивший
   НЕЗНАКОМЫЙ номер конверта, обязан остановиться, а не «понять как
   сможет»: испортить чужие записи хуже, чем не синхронизироваться. */

var SYNC_ENVELOPE = 1;

function envelopeOf(doc, tombs, meta){
  var e = {
    syncSchema: SYNC_ENVELOPE,
    appSchema: doc.schemaVersion,
    settings: {},
    settingsAt: (meta && meta.settingsAt) || '',
    collections: {},
    tombstones: tombs || {},
    /* Метки правок едут КАРТОЙ, потому что внутри записей их нет — см.
       довод у modOf(): поле в записи сдвинуло бы подпись документа. */
    meta: (meta && meta.map) || doc.syncMeta || {},
    updatedAt: (meta && meta.updatedAt) || '',
    updatedBy: (meta && meta.updatedBy) || ''
  };
  var i;
  for (i = 0; i < SYNC_SETTINGS.length; i++){
    var f = SYNC_SETTINGS[i];
    if (doc.settings && ownKey(doc.settings, f)) e.settings[f] = doc.settings[f];
  }
  for (i = 0; i < SYNC_COLS.length; i++) e.collections[SYNC_COLS[i]] = doc[SYNC_COLS[i]] || [];
  return e;
}

/* Разворачиваем конверт в тот же вид, в каком живёт `state`, чтобы
   слияние работало с одной формой. Проверка версии — здесь: это
   единственные ворота входящего файла до validate(). */
function openEnvelope(text){
  var e;
  try{ e = JSON.parse(text); }catch(err){ return { err: 'badjson' }; }
  if (!e || typeof e !== 'object' || Object.prototype.toString.call(e) === '[object Array]')
    return { err: 'badjson' };
  if (typeof e.syncSchema !== 'number') return { err: 'badjson' };
  if (e.syncSchema > SYNC_ENVELOPE) return { err: 'newer', found: e.syncSchema };
  var doc = { schemaVersion: e.appSchema, settings: e.settings || {} }, i;
  for (i = 0; i < SYNC_COLS.length; i++){
    var col = SYNC_COLS[i];
    var list = (e.collections && e.collections[col]) || [];
    doc[col] = Object.prototype.toString.call(list) === '[object Array]' ? list : [];
  }
  doc.syncMeta = (e.meta && typeof e.meta === 'object' &&
                  Object.prototype.toString.call(e.meta) !== '[object Array]') ? e.meta : {};
  return { doc: doc, tombstones: e.tombstones || {}, meta: doc.syncMeta,
           settingsAt: e.settingsAt || '',
           updatedAt: e.updatedAt || '', updatedBy: e.updatedBy || '' };
}

/* Детерминированная запись: одинаковый документ — одинаковый текст,
   байт в байт, при любом порядке ключей в памяти. Читаемая разница
   между версиями файла стоит этих двадцати строк. */
function envelopeText(e){
  return canonJSONPretty(e, '');
}
function canonJSONPretty(v, pad){
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  var inner = pad + '  ', i;
  if (Object.prototype.toString.call(v) === '[object Array]'){
    if (!v.length) return '[]';
    var a = [];
    for (i = 0; i < v.length; i++) a.push(inner + canonJSONPretty(v[i], inner));
    return '[\n' + a.join(',\n') + '\n' + pad + ']';
  }
  var keys = [], k;
  for (k in v) if (ownKey(v, k)) keys.push(k);
  keys.sort();
  if (!keys.length) return '{}';
  var out = [];
  for (i = 0; i < keys.length; i++){
    if (v[keys[i]] === undefined) continue;
    out.push(inner + JSON.stringify(keys[i]) + ': ' + canonJSONPretty(v[keys[i]], inner));
  }
  return '{\n' + out.join(',\n') + '\n' + pad + '}';
}

/* ==================================================================
 * ++++++ GITHUB SYNC ++++++        ДОКУМЕНТ ЖИВЁТ НА ДВУХ УСТРОЙСТВАХ
 *
 * ES5. Ни одной стрелки, ни одного `let`, ни одного шаблонного литерала —
 * этот файл написан так, чтобы лечь в goods-tracker.html как есть.
 *
 * ПРАВИЛО, ИЗ КОТОРОГО СЛЕДУЕТ ВСЁ ОСТАЛЬНОЕ:
 *
 *     СИНХРОНИЗАЦИЯ НЕ ИМЕЕТ ПРАВА ПОТЕРЯТЬ ЗАПИСЬ МОЛЧА.
 *
 * Отсюда:
 *   · отправка всегда несёт `sha` той версии, которую это устройство
 *     скачало. Если на сервере уже другая — GitHub отказывает, и мы НЕ
 *     перезаписываем. Это не наша вежливость, это отказ сервера;
 *   · расхождение — это ПОЛОСА С ВЫБОРОМ, а не тихое решение. Первым
 *     выходом всегда стоит «сохранить мою копию файлом»: пока обе версии
 *     целы, ошибиться нельзя;
 *   · документ, пришедший с сервера, — ВХОДЯЩИЕ ДАННЫЕ. Он идёт через
 *     validate(), как файл резервной копии и как localStorage. Другого
 *     входа в документ нет и быть не должно;
 *   · токен не попадает ни в документ, ни в резервную копию: он живёт в
 *     СВОЁМ ключе хранилища, рядом с ключом запаса и ключом напоминания.
 * ================================================================== */
